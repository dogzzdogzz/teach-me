<html lang="zh-Hant">
<head>

<title>分類整理複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 70px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 18px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:24px 0 4px}
  header h1{font-size:clamp(26px,5vw,38px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:6px;font-size:16px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:18px 22px;margin:20px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:16px;margin-top:18px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 12px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .stem table.mini{border-collapse:collapse;margin:10px auto 0;font-size:15px}
  .stem table.mini th,.stem table.mini td{
    border:2px solid var(--line);padding:5px 10px;text-align:center;white-space:nowrap;
  }
  .stem table.mini th{background:var(--blue-soft);color:var(--blue);font-size:13px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px;
    font-size:17px;cursor:pointer;color:var(--ink);min-height:50px;
    display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:20px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:14px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:14px;background:var(--green);color:#fff;font-size:18px;
    font-weight:700;padding:14px 26px;cursor:pointer;margin-top:16px;min-height:52px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>

    12 題<strong>混合題</strong>：分類標準、畫記、讀表、加減與乘法交錯出現，<strong>每一批的數字都是新出的</strong>。<br>

</div>

<script>
(function(){
  "use strict";

  var I18N = {
    zh: {
      langAria:'切換語言',
      htmlLang:'zh-Hant', title:'分類整理複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 分類整理複習挑戰',
      sub:'不看速查卡、自己讀一次表 —— 讀懂的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：分類標準、畫記、讀表、加減與乘法交錯出現，<strong>每一批的數字都是新出的</strong>。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria:'Switch language',
      htmlLang:'en', title:'Sorting & Tables Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Sorting & Tables Review Challenge',
      sub:'No peeking at the cheat sheet — the moment you read it for yourself is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving sorting rules, tally marks, table reading, adding, subtracting and multiplying — <strong>every batch uses fresh numbers</strong>.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn:function(i){ return '第 ' + i + ' 題'; },
      cats:{ rule:'分類標準', tally:'畫記', read:'讀表', calc:'算一算' },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll:function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome:function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪裡：'; },
      groupNames:{
        rule:'🎨 先訂一個分類標準（範例教學 1）',
        tally:'✍️ 一筆一筆畫記（範例教學 2）',
        table:'📋 填成一張統計表（範例教學 3）',
        read:'🔍 讀表回答問題（範例教學 4）',
        sub:'➖ 二、三位數的加減（另一課）',
        mul:'✖️ 九九乘法（另一課）'
      }
    },
    en: {
      qn:function(i){ return 'Question ' + i; },
      cats:{ rule:'Sorting rule', tally:'Tally marks', read:'Reading a table', calc:'Working it out' },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll:function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome:function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      groupNames:{
        rule:'🎨 Pick One Sorting Rule First (Example 1)',
        tally:'✍️ Tally Them One at a Time (Example 2)',
        table:'📋 Fill In the Table (Example 3)',
        read:'🔍 Read the Table to Answer (Example 4)',
        sub:'➖ Adding and subtracting (another lesson)',
        mul:'✖️ Times tables (another lesson)'
      }
    }
  };

  var LINK_HREFS = {
    rule:'index.html#secSort', tally:'index.html#secTally',
    table:'index.html#secTable', read:'index.html#secRead',
    sub:'../add-sub/index.html', mul:'../multiply/index.html'
  };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function sum(a){ return a.reduce(function(x, y){ return x + y; }, 0); }
  /* 這一課的數量上限：總數與任何選項都不可以超過它。 */
  var MAX_TOTAL = 24;

  /* 三個世界＝三種東西，每種四個類別。名稱與單位詞放在這裡（產生器要在 Node 裡跑，
     不能碰 I18N）；檢查設定檔有自己獨立的一份同樣的表（WORLD_TRUTH），
     兩份對不上就會被抓到 —— 不然等於拿產生器自己的字去比產生器自己的字。
     圖案一律挑單一碼位的 emoji，帶變體選擇符的在算字寬時會被當成兩個字。 */
  var WORLDS = [
    { icons:['🟥','🟦','🟨','🟩'],
      zh:{ thing:'積木', unit:'個', cats:['紅色積木','藍色積木','黃色積木','綠色積木'] },
      en:{ thing:'blocks', unit:'block', unitN:'blocks',
           cats:['red blocks','blue blocks','yellow blocks','green blocks'] } },
    { icons:['⭐','🌙','🌸','🌈'],
      zh:{ thing:'貼紙', unit:'張', cats:['星星貼紙','月亮貼紙','花朵貼紙','彩虹貼紙'] },
      en:{ thing:'stickers', unit:'sticker', unitN:'stickers',
           cats:['star stickers','moon stickers','flower stickers','rainbow stickers'] } },
    { icons:['⚽','🏀','⚾','🎾'],
      zh:{ thing:'球', unit:'顆', cats:['足球','籃球','棒球','網球'] },
      en:{ thing:'balls', unit:'ball', unitN:'balls',
           cats:['footballs','basketballs','baseballs','tennis balls'] } }
  ];
  /* 分類標準題用的詞彙：顏色與形狀各一組。 */
  var COLORS = [ { zh:'紅色', en:'red' }, { zh:'藍色', en:'blue' },
                 { zh:'黃色', en:'yellow' }, { zh:'綠色', en:'green' } ];
  var SHAPES = [ { zh:'圓形', en:'circles', enS:'circle' },
                 { zh:'方形', en:'squares', enS:'square' },
                 { zh:'三角形', en:'triangles', enS:'triangle' } ];

  function catName(wi, ci, lang){ return WORLDS[wi][lang].cats[ci]; }
  function thingName(wi, lang){ return WORLDS[wi][lang].thing; }
  /* 問句裡的單位詞：中文是量詞（個／張／顆），英文用複數名詞。 */
  function unitWord(wi, lang){ return lang === 'zh' ? WORLDS[wi].zh.unit : WORLDS[wi].en.unitN; }
  function qtyStr(wi, n, lang){
    if (lang === 'zh') return n + ' ' + WORLDS[wi].zh.unit;
    return n + ' ' + (n === 1 ? WORLDS[wi].en.unit : WORLDS[wi].en.unitN);
  }

  /* 選項一律是物件。去重鍵含「種類」——「5 個」和「紅色積木」是兩種完全不同的答案，
     而「5 個」和「5 個」才是重複的。 */
  function NUM(wi, n){ return { u:'num', wi:wi, n:n }; }
  function CAT(wi, ci){ return { u:'cat', wi:wi, ci:ci }; }
  function RULE(kind, cols, shp){ return { u:'rule', k:kind, cols:cols, shp:shp }; }

  function vkeyOf(v){
    if (!v) return 'nil';
    if (v.u === 'num')  return 'num#' + v.n;
    if (v.u === 'cat')  return 'cat#' + v.ci;
    if (v.u === 'rule') return 'rule#' + v.k;
    return 'raw';
  }
  function valStr(v, lang){
    if (v.u === 'num') return qtyStr(v.wi, v.n, lang);
    if (v.u === 'cat') return catName(v.wi, v.ci, lang);
    if (v.k === 'good'){
      return lang === 'zh'
        ? ('照顏色分：' + v.cols.map(function(i){ return COLORS[i].zh; }).join('、'))
        : ('Sort by colour: ' + v.cols.map(function(i){ return COLORS[i].en; }).join(', '));
    }
    if (v.k === 'gap'){
      return lang === 'zh'
        ? ('照顏色分：' + v.cols.slice(0, 2).map(function(i){ return COLORS[i].zh; }).join('、'))
        : ('Sort by colour: ' + v.cols.slice(0, 2).map(function(i){ return COLORS[i].en; }).join(', '));
    }
    if (v.k === 'switch'){
      return lang === 'zh' ? '先照顏色分，分到一半改照形狀分' : 'Start by colour, then switch to shape halfway';
    }
    return lang === 'zh'
      ? ('分成' + COLORS[v.cols[0]].zh + '和' + SHAPES[v.shp].zh)
      : ('Sort into ' + COLORS[v.cols[0]].en + ' and ' + SHAPES[v.shp].en);
  }

  /* 誘答：先用「真的會犯的錯」當候選，不夠再用保底。
     保底一律是「長得像答案的數」，不是垃圾字串；候選與保底都要通過去重。 */
  function mixOpts(correct, cands, fallback){
    var out = [], seen = {};
    seen[vkeyOf(correct)] = true;
    function ok(v){
      if (!v) return false;
      if (v.u === 'num' && !(v.n >= 1)) return false;
      if (seen[vkeyOf(v)]) return false;
      return true;
    }
    (cands || []).forEach(function(c){
      if (out.length >= 3) return;
      if (ok(c)){ seen[vkeyOf(c)] = true; out.push(c); }
    });
    var i = 0;
    while (out.length < 3 && i < 60){
      var f = fallback(i);
      i++;
      if (ok(f)){ seen[vkeyOf(f)] = true; out.push(f); }
    }
    var opts = shuffle([correct].concat(out));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 保底誘答：從正解往兩邊一步一步走（＋1、－1、＋2、－2…），
     一定生得出三個不同的數，而且長得像答案。
     固定四個候選的保底會塌掉 —— 資料剛好讓那四個都撞在一起時，
     整題就只剩三個選項（missingCell 在 counts 全是 1 時真的發生過）。 */
  function fbNear(wi, base, lo, hi){
    return function(i){
      var step = Math.floor(i / 2) + 1;
      var v = (i % 2 === 0) ? (base + step) : (base - step);
      return (v >= lo && v <= hi) ? NUM(wi, v) : null;
    };
  }

  /* 畫記：一個東西一筆，五筆一組。中文一組是一個「正」字（五畫），
     英文一組是五槓的柵欄。只用 <line> —— 畫記是筆畫，不是字。
     data-count 是「應該有幾筆」，檢查腳本拿它跟真正畫出來的 <line> 數目比。 */
  function strokesZH(k, ox, oy){
    var pts = [
      [ox + 2, oy + 3,  ox + 20, oy + 3],
      [ox + 11, oy + 3, ox + 11, oy + 19],
      [ox + 11, oy + 11, ox + 18, oy + 11],
      [ox + 4, oy + 9,  ox + 4,  oy + 19],
      [ox + 2, oy + 19, ox + 20, oy + 19]
    ];
    return pts.slice(0, k);
  }
  function strokesEN(k, ox, oy){
    var pts = [
      [ox + 3,  oy + 3,  ox + 3,  oy + 19],
      [ox + 8,  oy + 3,  ox + 8,  oy + 19],
      [ox + 13, oy + 3,  ox + 13, oy + 19],
      [ox + 18, oy + 3,  ox + 18, oy + 19],
      [ox + 1,  oy + 18, ox + 20, oy + 4]
    ];
    return pts.slice(0, k);
  }
  function tallySVG(n, form){
    var gw = 24, gap = 10, rowH = 26, pad = 3, perRow = 5;
    var full = Math.floor(n / 5), rest = n % 5;
    var groups = full + (rest > 0 ? 1 : 0);
    var cols = Math.min(Math.max(groups, 1), perRow);
    var rows = Math.ceil(groups / perRow) || 1;
    var w = pad * 2 + cols * gw + (cols - 1) * gap;
    var h = pad * 2 + rows * rowH;
    var s = '<svg data-count="' + n + '" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
            '" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">';
    for (var g = 0; g < groups; g++){
      var k = (g < full) ? 5 : rest;
      var ox = pad + (g % perRow) * (gw + gap);
      var oy = pad + Math.floor(g / perRow) * rowH;
      var pts = (form === 'zh') ? strokesZH(k, ox, oy) : strokesEN(k, ox, oy);
      for (var i = 0; i < pts.length; i++){
        s += '<line x1="' + pts[i][0] + '" y1="' + pts[i][1] + '" x2="' + pts[i][2] + '" y2="' + pts[i][3] +
             '" stroke="#2B2A33" stroke-width="3" stroke-linecap="round"/>';
      }
    }
    s += '</svg>';
    return s;
  }

  /* 題幹裡的統計表。hide 是「被蓋住的那一列」（畫記與數量都要蓋住，
     不然數畫記就直接看到答案了）。 */
  function tableHTML(wi, cats, counts, lang, hide){
    var head = (lang === 'zh') ? ['類別','畫記','數量'] : ['Kind','Tally','Count'];
    var s = '<table class="mini"><tr><th>' + head[0] + '</th><th>' + head[1] + '</th><th>' + head[2] + '</th></tr>';
    for (var i = 0; i < cats.length; i++){
      var hidden = (i === hide);
      s += '<tr><td>' + WORLDS[wi].icons[cats[i]] + ' ' + catName(wi, cats[i], lang) + '</td><td>' +
           (hidden ? '❓' : tallySVG(counts[i], lang)) + '</td><td>' +
           (hidden ? '❓' : counts[i]) + '</td></tr>';
    }
    s += '</table>';
    return s;
  }

  /* 一組資料：k 類、每一類至少 1 個，總數是加出來的（各類加起來 ＝ 總數）。
     上限跟著類別數走，讓總數一定 ≤ 24 —— 二年級的數量範圍。 */
  function makeSet(k, wi){
    var hi = (k === 4) ? 6 : 8;
    var cats = shuffle([0,1,2,3]).slice(0, k);
    var counts = cats.map(function(){ return 1 + rand(hi); });
    return { wi:wi, cats:cats, counts:counts, total:sum(counts) };
  }
  /* 「哪一類最多」只有在最大值唯一時才有唯一答案。抽不到就直接做一組出來。 */
  function uniqueMaxSet(k, wi){
    for (var i = 0; i < 40; i++){
      var d = makeSet(k, wi);
      var m = Math.max.apply(null, d.counts);
      if (d.counts.filter(function(x){ return x === m; }).length === 1) return d;
    }
    var f = makeSet(k, wi);
    var base = [];
    for (var j = 0; j < k; j++) base.push(j + 1);
    base[k - 1] = k + 1;
    f.counts = shuffle(base);
    f.total = sum(f.counts);
    return f;
  }
  /* 「哪一類最少」同理，最小值也要唯一。 */
  function uniqueMinSet(k, wi){
    for (var i = 0; i < 40; i++){
      var d = makeSet(k, wi);
      var m = Math.min.apply(null, d.counts);
      if (d.counts.filter(function(x){ return x === m; }).length === 1) return d;
    }
    var f = makeSet(k, wi);
    var base = [];
    for (var j = 0; j < k; j++) base.push(j + 2);
    base[0] = 1;
    f.counts = shuffle(base);
    f.total = sum(f.counts);
    return f;
  }
  /* 「哪一類剛好有 n 個」要找一個只出現一次的數量，不然答案不唯一。 */
  function uniqueValueSet(k, wi){
    for (var i = 0; i < 40; i++){
      var d = makeSet(k, wi);
      var singles = [];
      d.counts.forEach(function(v, idx){
        if (d.counts.filter(function(x){ return x === v; }).length === 1) singles.push(idx);
      });
      if (singles.length){ d.t = pick(singles); return d; }
    }
    var f = makeSet(k, wi);
    var base = [];
    for (var j = 0; j < k; j++) base.push(j + 1);
    f.counts = shuffle(base);
    f.total = sum(f.counts);
    f.t = rand(k);
    return f;
  }
  /* 相差題要有嚴格的大小差，不然「多幾個」的答案是 0，題目就沒有意義。 */
  function gapSet(k, wi){
    for (var i = 0; i < 40; i++){
      var d = makeSet(k, wi);
      if (Math.max.apply(null, d.counts) > Math.min.apply(null, d.counts)) return d;
    }
    var f = makeSet(k, wi);
    var base = [];
    for (var j = 0; j < k; j++) base.push(j + 1);
    f.counts = shuffle(base);
    f.total = sum(f.counts);
    return f;
  }

  /* ---------- 題目產生器：每次 make() 都用新數字，正解由程式算出來 ---------- */
  var GENS = [
    /* 1. 讀表：哪一類最多（最大值一定唯一） */
    { id:'mostCat', cat:'read', grp:'read',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = uniqueMaxSet(4, wi);
        var mi = d.counts.indexOf(Math.max.apply(null, d.counts));
        var objs = d.cats.map(function(ci){ return CAT(wi, ci); });
        var correct = objs[mi];
        var opts = shuffle(objs);
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total,
                 correct:correct, opts:opts, ans:opts.indexOf(correct) };
      },
      fmt:function(d, lang){
        var mi = d.counts.indexOf(Math.max.apply(null, d.counts));
        return {
          stem:(lang === 'zh'
                 ? ('這是' + thingName(d.wi, 'zh') + '的統計表。<br>哪一類最多？')
                 : ('Here is a tally table of ' + thingName(d.wi, 'en') + '.<br>Which kind has the most?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? (d.counts[mi] + ' 最大，所以' + catName(d.wi, d.cats[mi], 'zh') + '最多。')
            : (d.counts[mi] + ' is the biggest number in the count column, so ' +
               catName(d.wi, d.cats[mi], 'en') + ' have the most.')
        };
      } },
    /* 2. 讀表：哪一類最少（最小值一定唯一） */
    { id:'leastCat', cat:'read', grp:'read',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = uniqueMinSet(4, wi);
        var li = d.counts.indexOf(Math.min.apply(null, d.counts));
        var objs = d.cats.map(function(ci){ return CAT(wi, ci); });
        var correct = objs[li];
        var opts = shuffle(objs);
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total,
                 correct:correct, opts:opts, ans:opts.indexOf(correct) };
      },
      fmt:function(d, lang){
        var li = d.counts.indexOf(Math.min.apply(null, d.counts));
        return {
          stem:(lang === 'zh'
                 ? ('這是' + thingName(d.wi, 'zh') + '的統計表。<br>哪一類最少？')
                 : ('Here is a tally table of ' + thingName(d.wi, 'en') + '.<br>Which kind has the fewest?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? (d.counts[li] + ' 最小，所以' + catName(d.wi, d.cats[li], 'zh') + '最少。')
            : (d.counts[li] + ' is the smallest number in the count column, so ' +
               catName(d.wi, d.cats[li], 'en') + ' have the fewest.')
        };
      } },
    /* 3. 讀表：某一類有幾個（讀一格） */
    { id:'readCell', cat:'read', grp:'read',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = makeSet(3 + rand(2), wi);
        var t = rand(d.cats.length);
        var correct = NUM(wi, d.counts[t]);
        /* 誘答：讀錯一列、把總數抄回來。 */
        var cands = shuffle(d.counts.filter(function(_, i){ return i !== t; })
                     .map(function(n){ return NUM(wi, n); })).concat([NUM(wi, d.total)]);
        var mix = mixOpts(correct, cands, fbNear(wi, d.counts[t], 1, 24));
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total, t:t,
                 correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        var cn = catName(d.wi, d.cats[d.t], lang);
        return {
          stem:(lang === 'zh'
                 ? (cn + '有幾' + unitWord(d.wi, 'zh') + '？')
                 : ('How many ' + cn + ' are there?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('看' + cn + '那一列的數量欄：' + qtyStr(d.wi, d.counts[d.t], 'zh') + '。')
            : ('Read the count column on the row for ' + cn + ': ' + qtyStr(d.wi, d.counts[d.t], 'en') + '.')
        };
      } },
    /* 4. 畫記：一列的畫記是幾個（這一課的核心迷思 —— 一個正字是 5 筆，不是 1） */
    { id:'tallyRead', cat:'tally', grp:'tally',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var ci = rand(4);
        /* 至少一個滿組（≥ 6），而且不是 5 的倍數 —— 不然「只算滿組」的誘答會等於正解。 */
        var n = pick([6,7,8,9,11,12,13,14]);
        var correct = NUM(wi, n);
        /* 誘答：把一個正字算成 1、只算滿的那幾組、漏掉一整組。 */
        var cands = [ NUM(wi, Math.ceil(n / 5)), NUM(wi, 5 * Math.floor(n / 5)), NUM(wi, n - 5) ];
        var mix = mixOpts(correct, cands, fbNear(wi, n, 1, 19));
        return { wi:wi, ci:ci, n:n, correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        var cn = catName(d.wi, d.ci, lang);
        var full = Math.floor(d.n / 5), rest = d.n % 5;
        var parts = [];
        for (var i = 0; i < full; i++) parts.push(5);
        parts.push(rest);
        return {
          stem:(lang === 'zh'
                 ? (cn + '那一列的畫記長這樣。<br>' + cn + '有幾' + unitWord(d.wi, 'zh') + '？')
                 : ('This is the tally row for the ' + cn + '.<br>How many ' + cn + ' are there?')) +
               '<br>' + tallySVG(d.n, lang),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('一個正字是 5 筆：' + parts.join(' ＋ ') + ' ＝ ' + d.n + '。')
            : ('One full gate is 5 strokes: ' + parts.join(' + ') + ' = ' + d.n + '.')
        };
      } },
    /* 5. 各類加起來 ＝ 總數（正著算） */
    { id:'totalSum', cat:'calc', grp:'table',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = makeSet(3 + rand(2), wi);
        var last = d.cats.length - 1;
        var correct = NUM(wi, d.total);
        /* 誘答：漏掉第一類、漏掉最後一類、多加 1。 */
        var cands = [ NUM(wi, d.total - d.counts[0]), NUM(wi, d.total - d.counts[last]),
                      (d.total + 1 <= MAX_TOTAL) ? NUM(wi, d.total + 1) : null ];
        var mix = mixOpts(correct, cands, fbNear(wi, d.total, 1, MAX_TOTAL));
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total,
                 correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        return {
          stem:(lang === 'zh'
                 ? ('把每一類加起來。<br>全部一共有幾' + unitWord(d.wi, 'zh') + '？')
                 : ('Add up all the counts in the table.<br>How many ' + unitWord(d.wi, 'en') + ' are there in total?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? (d.counts.join(' ＋ ') + ' ＝ ' + d.total + '，全部一共 ' + qtyStr(d.wi, d.total, 'zh') + '。')
            : (d.counts.join(' + ') + ' = ' + d.total + ', so there are ' + qtyStr(d.wi, d.total, 'en') + ' in total.')
        };
      } },
    /* 6. 兩類相差幾個（和加減法交錯） */
    { id:'diffTwo', cat:'calc', grp:'sub',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = gapSet(3, wi);
        var order = d.counts.map(function(_, i){ return i; })
                    .sort(function(x, y){ return d.counts[y] - d.counts[x]; });
        var a = order[0], b = order[order.length - 1];
        var diff = d.counts[a] - d.counts[b];
        var correct = NUM(wi, diff);
        /* 誘答：加起來、直接抄大的那一格、直接抄小的那一格。 */
        var cands = [ NUM(wi, d.counts[a] + d.counts[b]), NUM(wi, d.counts[a]), NUM(wi, d.counts[b]) ];
        var mix = mixOpts(correct, cands, fbNear(wi, diff, 1, 24));
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total, a:a, b:b,
                 correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        var ca = catName(d.wi, d.cats[d.a], lang), cb = catName(d.wi, d.cats[d.b], lang);
        var diff = d.counts[d.a] - d.counts[d.b];
        return {
          stem:(lang === 'zh'
                 ? (ca + '比' + cb + '多幾' + unitWord(d.wi, 'zh') + '？')
                 : ('How many more ' + ca + ' are there than ' + cb + '?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('多幾' + unitWord(d.wi, 'zh') + '要用減的：' + d.counts[d.a] + ' － ' + d.counts[d.b] +
               ' ＝ ' + diff + '。')
            : ('To find how many more, subtract: ' + d.counts[d.a] + ' − ' + d.counts[d.b] + ' = ' +
               diff + ', so the difference is ' + qtyStr(d.wi, diff, 'en') + '.')
        };
      } },
    /* 7. 被蓋住的那一格（反過來用「各類加起來 ＝ 總數」） */
    { id:'missingCell', cat:'calc', grp:'table',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = makeSet(3, wi);
        var h = rand(3);
        var shown = d.total - d.counts[h];
        var correct = NUM(wi, d.counts[h]);
        /* 誘答：把看得到的加起來當答案、只減掉一列、把總數抄回來。 */
        var cands = [ NUM(wi, shown), NUM(wi, d.total - d.counts[(h + 1) % 3]), NUM(wi, d.total) ];
        var mix = mixOpts(correct, cands, fbNear(wi, d.counts[h], 1, 24));
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total, h:h,
                 correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        var ch = catName(d.wi, d.cats[d.h], lang);
        var vis = d.counts.filter(function(_, i){ return i !== d.h; });
        return {
          stem:(lang === 'zh'
                 ? ('全部一共 ' + qtyStr(d.wi, d.total, 'zh') + thingName(d.wi, 'zh') + '。<br>' + ch +
                    '那一格被蓋住了，是幾' + unitWord(d.wi, 'zh') + '？')
                 : ('There are ' + qtyStr(d.wi, d.total, 'en') + ' in total.<br>The row for ' + ch +
                    ' is covered up. How many ' + ch + ' are there?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, d.h),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('各類加起來要等於總數：' + d.total + ' － ' + vis.join(' － ') + ' ＝ ' + d.counts[d.h] + '。')
            : ('All the counts must add up to the total: ' + d.total + ' − ' + vis.join(' − ') +
               ' = ' + d.counts[d.h] + '.')
        };
      } },
    /* 8. 分類標準：一次只用一個，而且每一個都要剛好進一類 */
    { id:'sortRule', cat:'rule', grp:'rule',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var cols = shuffle([0,1,2,3]).slice(0, 3);
        var shps = shuffle([0,1,2]).slice(0, 2);
        var correct = RULE('good', cols, shps[0]);
        /* 三個誘答分別違反一條規則：分到一半換特徵／一個東西同時算兩類／有東西沒地方放。 */
        var opts = shuffle([correct, RULE('switch', cols, shps[0]),
                            RULE('overlap', cols, shps[0]), RULE('gap', cols, shps[0])]);
        return { wi:wi, cols:cols, shps:shps, correct:correct, opts:opts, ans:opts.indexOf(correct) };
      },
      fmt:function(d, lang){
        var c = d.cols.map(function(i){ return COLORS[i]; });
        var s = d.shps.map(function(i){ return SHAPES[i]; });
        return {
          stem:lang === 'zh'
            ? ('一盒卡片有' + c[0].zh + '、' + c[1].zh + '、' + c[2].zh + '，每種都至少一張。<br>形狀有' +
               s[0].zh + '和' + s[1].zh + '，其中一張是' + c[0].zh + '的' + s[0].zh +
               '。<br>哪一個分類標準才對？')
            : ('A box has ' + c[0].en + ', ' + c[1].en + ' and ' + c[2].en +
               ' cards, at least one of each.<br>The shapes are ' + s[0].en + ' and ' + s[1].en +
               ', and one card is a ' + c[0].en + ' ' + s[0].enS + '.<br>Which sorting rule works?'),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('這一課一次只看一個特徵，而且每一張都要剛好進一類。分到一半換特徵，前後就不是同一種分法；' +
               c[0].zh + '的' + s[0].zh + '會被算兩次；少寫' + c[2].zh + '，' + c[2].zh + '就沒地方放。')
            : ('In this lesson we look at one feature at a time, and every card must land in exactly one group. Switching feature halfway means the groups no longer match; a ' +
               c[0].en + ' ' + s[0].enS + ' would fall into two groups; and leaving ' + c[2].en +
               ' out gives those cards nowhere to go.')
        };
      } },
    /* 9. 讀表：哪一類剛好有 n 個（反過來查） */
    { id:'whichHasN', cat:'read', grp:'read',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var d = uniqueValueSet(4, wi);
        var objs = d.cats.map(function(ci){ return CAT(wi, ci); });
        var correct = objs[d.t];
        var opts = shuffle(objs);
        return { wi:wi, cats:d.cats, counts:d.counts, total:d.total, t:d.t,
                 correct:correct, opts:opts, ans:opts.indexOf(correct) };
      },
      fmt:function(d, lang){
        var n = d.counts[d.t];
        return {
          stem:(lang === 'zh'
                 ? ('哪一類剛好有 ' + qtyStr(d.wi, n, 'zh') + '？')
                 : ('Which kind has exactly ' + qtyStr(d.wi, n, 'en') + '?')) +
               tableHTML(d.wi, d.cats, d.counts, lang, -1),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('只有' + catName(d.wi, d.cats[d.t], 'zh') + '那一列的數量欄是 ' + n + '。')
            : ('Only the row for ' + catName(d.wi, d.cats[d.t], 'en') + ' shows ' + n + ' in the count column.')
        };
      } },
    /* 10. 每一類都一樣多（和九九乘法交錯） */
    { id:'equalGroups', cat:'calc', grp:'mul',
      make:function(used){
        var wi = pickUnused([0,1,2], used);
        var k = 3 + rand(2);      /* 3 或 4 類 */
        var q = 2 + rand(5);      /* 每類 2~6 個 → 總數最多 24 */
        var correct = NUM(wi, k * q);
        /* 誘答：用加的、少算一類、多算一類。 */
        var cands = [ NUM(wi, k + q), NUM(wi, q * (k - 1)),
                      (q * (k + 1) <= MAX_TOTAL) ? NUM(wi, q * (k + 1)) : null ];
        var mix = mixOpts(correct, cands, fbNear(wi, k * q, 1, MAX_TOTAL));
        return { wi:wi, k:k, q:q, correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){
        return {
          stem:lang === 'zh'
            ? ('統計表有 ' + d.k + ' 類。<br>每一類都有 ' + qtyStr(d.wi, d.q, 'zh') +
               '。<br>全部一共有幾' + unitWord(d.wi, 'zh') + '？')
            : ('A table has ' + d.k + ' categories.<br>Each one has ' + qtyStr(d.wi, d.q, 'en') +
               '.<br>How many ' + unitWord(d.wi, 'en') + ' are there in total?'),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('每類 ' + qtyStr(d.wi, d.q, 'zh') + '、共 ' + d.k + ' 類：' + d.q + ' × ' + d.k +
               ' ＝ ' + (d.k * d.q) + '。')
            : (d.q + ' in each of ' + d.k + ' categories: ' + d.q + ' × ' + d.k + ' = ' + (d.k * d.q) + '.')
        };
      } }
  ];

  /* ---------- 出一批 12 題：10 種題型各一題＋核心題型隨機 2 題 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['readCell','totalSum','mostCat','missingCell','tallyRead'].indexOf(g.id) >= 0;
    });
    shuffle(extraPool).slice(0, 2).forEach(function(g){ slots.push(g); });
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongGroups = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongGroups = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var grp = item.gen.grp;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      /* 題幹裡會塞一張 <table>，所以用 div 而不是 p —— table 不能巢狀在 p 裡面。 */
      var stem = document.createElement('div');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongGroups[grp] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var groups = [];
    for (var g in wrongGroups) if (wrongGroups[g]) groups.push(g);
    if (groups.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      groups.forEach(function(g){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[g]; a.textContent = t.groupNames[g];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
</html>
