<title>立體形體複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 70px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:6px 18px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:24px 0 4px}
  header h1{font-size:clamp(26px,5vw,38px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:6px;font-size:16px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:18px 22px;margin:20px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:16px;margin-top:18px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 12px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 8px;
    font-size:18px;cursor:pointer;color:var(--ink);min-height:50px;
    display:flex;align-items:center;justify-content:center;font-weight:700;text-align:center;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:20px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:14px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:14px;background:var(--green);color:#fff;font-size:18px;
    font-weight:700;padding:14px 26px;cursor:pointer;margin-top:16px;min-height:52px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>

<script>
(function(){
  "use strict";

  var I18N = {
    zh: {
      langAria:'切換語言',
      htmlLang:'zh-Hant', title:'立體形體複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 立體形體複習挑戰',
      sub:'不看速查卡、自己數一次 —— 數出來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：認識、數一數、滾與疊、平面與立體交錯出現，<strong>每一批的題目都是新出的</strong>。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria:'Switch language',
      htmlLang:'en', title:'Solid Shapes Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Solid Shapes Review Challenge',
      sub:'No peeking at the cheat sheet — the moment you count it out is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving naming, counting, rolling and stacking, and flat versus solid shapes — <strong>every batch is freshly built</strong>.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn:function(i){ return '第 ' + i + ' 題'; },
      cats:{ know:'認識', count:'數一數', roll:'滾與疊', plane:'平面與立體' },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll:function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome:function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪裡：'; },
      groupNames:{
        real:'🧊 把它放在桌上（範例教學 1）',
        count:'🔢 點一下就數一個（範例教學 2）',
        roll:'🎳 誰會滾、誰疊得高（範例教學 3）',
        table:'📋 五個一起看（範例教學 4）'
      }
    },
    en: {
      qn:function(i){ return 'Question ' + i; },
      cats:{ know:'Naming', count:'Counting', roll:'Roll & stack', plane:'Flat vs solid' },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll:function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome:function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      groupNames:{
        real:'🧊 Put It Down on the Table (Example 1)',
        count:'🔢 Tap Once, Count One (Example 2)',
        roll:'🎳 Who Rolls, Who Stacks (Example 3)',
        table:'📋 All Five Side by Side (Example 4)'
      }
    }
  };

  var LINK_HREFS = {
    real:'index.html#secReal', count:'index.html#secCount',
    roll:'index.html#secRoll', table:'index.html#secTable'
  };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  /* 五個立體形體。數值與上課頁的 SOLIDS 一字不差，檢查設定檔還有獨立的第三份
     （tools/checks/grade-2-solid.js 的 SOLID_TRUTH），三份對不上就會被抓到。

     【這一課的數面規則】「面」永遠寫成「平平的面」，彎彎的面分開算；
     「邊」永遠寫成「直直的邊」，彎彎的邊不算；「頂點」是直直的邊碰在一起的角，
     圓錐上面那一個尖端就是它唯一的頂點（1 個）。所以這一頁沒有任何一題問
     「有幾個面」或「有幾條邊」—— 那樣問答案不唯一。 */
  var SOLIDS = [
    { id:'cube', icon:'🎲', flat:6, curved:0, edge:12, vert:8, sameFaces:true, rolls:false, stackTop:true, faceShape:'square',
      zh:{ name:'正方體', real:'骰子', cl:'顆', edgeNote:'', stackNote:'' },
      en:{ name:'cube', real:'a die', bare:'die', plural:'dice', edgeNote:'', stackNote:'' } },
    { id:'cuboid', icon:'📦', flat:6, curved:0, edge:12, vert:8, sameFaces:false, rolls:false, stackTop:true, faceShape:'rect',
      zh:{ name:'長方體', real:'牛奶盒', cl:'個', edgeNote:'', stackNote:'' },
      en:{ name:'cuboid', real:'a milk carton', bare:'milk carton', plural:'milk cartons', edgeNote:'', stackNote:'' } },
    { id:'cyl', icon:'🥫', flat:2, curved:1, edge:0, vert:0, sameFaces:false, rolls:true, stackTop:true, faceShape:'circle',
      zh:{ name:'圓柱', real:'罐頭', cl:'個', edgeNote:'上下那兩圈是彎彎的邊，不是直直的邊。', stackNote:'' },
      en:{ name:'cylinder', real:'a tin can', bare:'tin can', plural:'tin cans',
           edgeNote:'The two rims are curved, not straight edges.', stackNote:'' } },
    { id:'ball', icon:'⚽', flat:0, curved:1, edge:0, vert:0, sameFaces:false, rolls:true, stackTop:false, faceShape:null,
      zh:{ name:'球', real:'皮球', cl:'顆', edgeNote:'球上面連一條邊都找不到。', stackNote:'球一個平平的面都沒有，站不穩，輕輕一碰就滾走。' },
      en:{ name:'sphere', real:'a ball', bare:'ball', plural:'balls',
           edgeNote:'There is no edge anywhere on a sphere.',
           stackNote:'A sphere has no flat face at all, so it does not sit stably and rolls easily when nudged.' } },
    { id:'cone', icon:'🎄', flat:1, curved:1, edge:0, vert:1, sameFaces:false, rolls:true, stackTop:false, faceShape:'circle',
      zh:{ name:'圓錐', real:'聖誕樹', cl:'棵', edgeNote:'底下那一圈是彎彎的邊，不是直直的邊。', stackNote:'圓錐上面尖尖的，沒有可以穩穩疊東西的平面。' },
      en:{ name:'cone', real:'a Christmas tree', bare:'Christmas tree', plural:'Christmas trees',
           edgeNote:'The rim at the bottom is curved, not a straight edge.',
           stackNote:'The top of a cone is a sharp point, so it has no flat top for stable stacking.' } }
  ];
  /* 認出形體的理由：光說「6 個平平的面」分不出正方體和長方體，所以每一個形體
     各記一句真正認得出它的話。 */
  var ID_WHY = {
    zh:{ cube:'六個面都是一樣大的正方形', cuboid:'六個平平的面不是都一樣大',
         cyl:'上下兩個圓圓的平平的面，中間一圈彎彎的', ball:'整個都是彎彎的面，一個平平的面都沒有',
         cone:'一個圓圓的平平的面，收成上面一個尖點' },
    en:{ cube:'all six faces are squares of the same size', cuboid:'its six flat faces are not all the same size',
         cyl:'two flat circles with one curved face between them', ball:'curved all over, with no flat face at all',
         cone:'one flat circle rising to a single sharp point' }
  };
  function nameOf(si, lang){ return SOLIDS[si][lang].name; }
  function realOf(si, lang){ return SOLIDS[si][lang].real; }

  /* 平面圖形的名字（和立體形體分開，這一課最大的迷思就是把兩者混在一起）。 */
  var SHAPE_TXT = {
    square:{ zh:'正方形', en:'square' },
    rect:{ zh:'長方形', en:'rectangle' },
    circle:{ zh:'圓形', en:'circle' },
    triangle:{ zh:'三角形', en:'triangle' }
  };
  /* 平面圖形與它最容易被搞混的立體形體。 */
  var PAIRS = [
    { plane:'square', si:0 },
    { plane:'rect',   si:1 },
    { plane:'circle', si:3 },
    { plane:'circle', si:2 }
  ];

  /* 選項一律是物件。去重鍵含「種類」——「6 個平平的面」和「6 個頂點」數字一樣、
     卻是兩個不同的答案，而同一題裡不會同時出現這兩種。 */
  function N(n, kind){ return { u:'n', n:n, kind:kind }; }
  function SO(si){ return { u:'so', si:si }; }
  function SH(id){ return { u:'sh', id:id }; }
  function PV(kind, plane, si){ return { u:'pv', kind:kind, plane:plane, si:si }; }

  function vkeyOf(v){
    if (!v) return 'nil';
    if (v.u === 'n')  return 'n#' + v.kind + '#' + v.n;
    if (v.u === 'so') return 'so#' + v.si;
    if (v.u === 'sh') return 'sh#' + v.id;
    if (v.u === 'pv') return 'pv#' + v.kind;
    return 'raw';
  }

  var UNIT = {
    zh:{ flat:'個', edge:'條', vert:'個' },
    en:{ flat:['face','faces'], edge:['edge','edges'], vert:['corner','corners'] }
  };
  function nStr(v, lang){
    if (lang === 'zh') return v.n + ' ' + UNIT.zh[v.kind];
    return v.n + ' ' + UNIT.en[v.kind][v.n === 1 ? 0 : 1];
  }
  function pvStr(v, lang){
    var p = SHAPE_TXT[v.plane][lang], s = nameOf(v.si, lang);
    if (lang === 'zh'){
      if (v.kind === 'right') return p + '是平面圖形，' + s + '是立體形體';
      if (v.kind === 'bothSolid') return '兩個都是立體形體';
      if (v.kind === 'bothPlane') return '兩個都是平面圖形';
      return p + '是立體形體，' + s + '是平面圖形';
    }
    if (v.kind === 'right') return 'a ' + p + ' is a flat shape and a ' + s + ' is a solid shape';
    if (v.kind === 'bothSolid') return 'both of them are solid shapes';
    if (v.kind === 'bothPlane') return 'both of them are flat shapes';
    return 'a ' + p + ' is a solid shape and a ' + s + ' is a flat shape';
  }
  function valStr(v, lang){
    if (v.u === 'n')  return nStr(v, lang);
    if (v.u === 'so') return SOLIDS[v.si].icon + ' ' + nameOf(v.si, lang);
    if (v.u === 'sh') return SHAPE_TXT[v.id][lang];
    return pvStr(v, lang);
  }

  /* 誘答：先用「真的會犯的錯」當候選，不夠再用保底。
     保底一律是「長得像答案的數」，不是垃圾字串；ban 是題幹裡出現過的數字，
     不可以拿來當誘答（孩子會以為那是把題目抄回來的陷阱）。 */
  function mixOpts(correct, cands, fallback, ban){
    ban = ban || [];
    var out = [], seen = {};
    seen[vkeyOf(correct)] = true;
    function ok(v){
      if (!v) return false;
      if (v.u === 'n'){
        if (!(v.n >= 0) || !Number.isInteger(v.n)) return false;
        if (ban.indexOf(v.n) >= 0) return false;
      }
      if (seen[vkeyOf(v)]) return false;
      return true;
    }
    (cands || []).forEach(function(c){
      if (out.length >= 3) return;
      if (ok(c)){ seen[vkeyOf(c)] = true; out.push(c); }
    });
    var i = 0;
    while (out.length < 3 && i < 60){
      var f = fallback(i);
      i++;
      if (ok(f)){ seen[vkeyOf(f)] = true; out.push(f); }
    }
    var opts = shuffle([correct].concat(out));
    return { opts:opts, ans:opts.indexOf(correct) };
  }

  /* 立體形體站在桌上的樣子。畫法與畫布大小和上課頁一模一樣：
     只用 rect／polygon／line／ellipse／circle 五種基本圖形，沒有 <path>，
     所以每一個元素的右緣都算得出來，檢查腳本才驗得到畫布夠不夠寬。 */
  function solidSVG(id){
    var w = 140, h = 126, tableY = 114;
    var s = '<svg data-solid="' + id + '" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
            '" style="max-width:100%;height:auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">';
    s += '<line x1="6" y1="' + tableY + '" x2="134" y2="' + tableY + '" stroke="#C9C4B8" stroke-width="4"/>';
    var fill = '#FDF0E0', edge = '#E8871E';
    if (id === 'cube' || id === 'cuboid'){
      var W = (id === 'cube') ? 60 : 84, H = (id === 'cube') ? 60 : 44;
      var x0 = (id === 'cube') ? 26 : 14, y0 = tableY - H, dx = 24, dy = 20;
      var A = [x0, y0 + H], B = [x0 + W, y0 + H], C = [x0 + W, y0], D = [x0, y0];
      var B2 = [B[0] + dx, B[1] - dy], C2 = [C[0] + dx, C[1] - dy], D2 = [D[0] + dx, D[1] - dy];
      var pts = function(arr){ return arr.map(function(p){ return p.join(','); }).join(' '); };
      s += '<polygon points="' + pts([A, B, C, D]) + '" fill="' + fill + '" stroke="' + edge + '" stroke-width="3"/>';
      s += '<polygon points="' + pts([D, C, C2, D2]) + '" fill="#FFF6E8" stroke="' + edge + '" stroke-width="3"/>';
      s += '<polygon points="' + pts([B, C, C2, B2]) + '" fill="#F6E4CC" stroke="' + edge + '" stroke-width="3"/>';
    } else if (id === 'cyl'){
      s += '<ellipse cx="70" cy="104" rx="30" ry="10" fill="' + fill + '" stroke="' + edge + '" stroke-width="3"/>';
      s += '<rect x="40" y="48" width="60" height="56" fill="' + fill + '" stroke="none"/>';
      s += '<line x1="40" y1="48" x2="40" y2="104" stroke="' + edge + '" stroke-width="3"/>';
      s += '<line x1="100" y1="48" x2="100" y2="104" stroke="' + edge + '" stroke-width="3"/>';
      s += '<ellipse cx="70" cy="48" rx="30" ry="10" fill="#FFF6E8" stroke="' + edge + '" stroke-width="3"/>';
    } else if (id === 'ball'){
      s += '<circle cx="70" cy="80" r="34" fill="' + fill + '" stroke="' + edge + '" stroke-width="3"/>';
      s += '<ellipse cx="70" cy="80" rx="12" ry="33" fill="none" stroke="#F0C99A" stroke-width="2"/>';
    } else {
      s += '<ellipse cx="70" cy="104" rx="32" ry="10" fill="' + fill + '" stroke="' + edge + '" stroke-width="3"/>';
      s += '<polygon points="38,104 70,34 102,104" fill="' + fill + '" stroke="' + edge + '" stroke-width="3"/>';
    }
    s += '</svg>';
    return s;
  }

  /* 數量詞：英文 1 個要用單數。中文一律「n 個」，數字和中文之間留一個空格。 */
  function faceWord(n, lang){
    return lang === 'zh' ? (n + ' 個平平的面') : (n + ' flat face' + (n === 1 ? '' : 's'));
  }
  /* 中文的量詞跟著東西走：聖誕樹是「棵」不是「個」。量詞和物名一起存在 SOLIDS 裡，
     不然換一個生活實物就會生出「2 個聖誕樹」（codex 第三輪抓到）。 */
  function realN(si, n, lang){
    var s = SOLIDS[si];
    return lang === 'zh' ? (n + ' ' + s.zh.cl + s.zh.real)
                         : (n + ' ' + (n === 1 ? s.en.bare : s.en.plural));
  }
  /* 猜謎線索多講的那一句，和上課頁的遊戲用同一套說法。 */
  var CLUE_EXTRA = {
    cube:'same', cuboid:'notsame', cyl:'rollstack', ball:'roll', cone:'point'
  };
  /* 線索的第三人稱說法，給解釋用（CLUE_TXT 是第一人稱，給題幹用）。 */
  var CLUE_WHY = {
    zh:{
      same:'，六個面都是一樣大的正方形',
      notsame:'，可是它們不是都一樣大',
      rollstack:'，躺下來會滾、站起來可以疊',
      point:'，上面尖尖的、沒有平平的頂面可以穩穩疊東西',
      roll:'，所以站不穩，一推就滾走'
    },
    en:{
      same:', and all six are squares of the same size',
      notsame:', but they are not all the same size',
      rollstack:', it rolls lying down and stacks standing up',
      point:', and its top is a sharp point with no flat top for stable stacking',
      roll:', so it does not sit stably and rolls easily when nudged'
    }
  };
  var CLUE_TXT = {
    zh:{
      same:'，而且每一個面都是一樣大的正方形',
      notsame:'，可是它們不是都一樣大',
      rollstack:'，躺下來會滾，站起來可以疊',
      point:'，上面尖尖的，沒有可以穩穩疊東西的平面',
      roll:'，站不穩，輕輕一碰就滾走了'
    },
    en:{
      same:', and every one of them is a square of the same size',
      notsame:', but they are not all the same size',
      rollstack:', I roll when I lie down, and I stack when I stand up',
      point:', and my top is a sharp point, so there is no flat top to stack on',
      roll:', I do not sit stably, and one gentle nudge sends me rolling away'
    }
  };

  /* ---------- 題目產生器：每次 make() 都用新資料，正解由程式算出來 ---------- */
  /* 每一種數量各有自己的誘答池，上限就是這一課該數量真正的最大值：
     平平的面最多 6（正方體／長方體）、直直的邊最多 12、頂點最多 8。
     共用一個到 12 的池會生出「12 個平平的面」這種超出上限的誘答（codex 第三輪抓到）。 */
  var FLAT_POOL = [0, 1, 2, 3, 4, 5, 6];
  var EDGE_POOL = [0, 1, 2, 3, 4, 6, 8, 12];
  var VERT_POOL = [0, 1, 2, 4, 6, 8];

  var GENS = [
    /* 1. 有幾個平平的面（這一課的核心；一律寫「平平的面」，答案才唯一） */
    { id:'flatFaces', cat:'count', grp:'count',
      make:function(used){
        var si = Number(pickUnused([0,1,2,3,4], used));
        var s = SOLIDS[si];
        var correct = N(s.flat, 'flat');
        /* 誘答：把彎彎的面也加進去（最經典的錯）、把面數想成兩倍、常見的面數。 */
        /* 誘答：把彎彎的面也加進去（最經典的錯），再加一個相近的面數（一律 ≤ 6）。 */
        var cands = [ N(s.flat + s.curved, 'flat'), N(s.flat + 2 <= 6 ? s.flat + 2 : s.flat - 2, 'flat') ];
        var pool = shuffle(FLAT_POOL);
        var mix = mixOpts(correct, cands, function(i){
          return (i < pool.length) ? N(pool[i], 'flat') : null;
        }, []);
        return { si:si, correct:correct, opts:mix.opts, ans:mix.ans, svg:solidSVG(s.id) };
      },
      fmt:function(d, lang){
        var s = SOLIDS[d.si];
        return {
          stem:(lang === 'zh'
                 ? (s.icon + ' ' + s.zh.real + '是' + s.zh.name + '。<br>它有幾個<strong>平平的面</strong>？')
                 : (s.icon + ' ' + cap(s.en.real) + ' is a ' + s.en.name +
                    '.<br>How many <strong>flat faces</strong> does it have?')) + d.svg,
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? (s.flat === 0
                ? (s.zh.name + '整個都是彎彎的面，一個平平的面都沒有。')
                : (s.zh.name + '有 ' + s.flat + ' 個平平的面' + (s.curved > 0 ? '，旁邊彎彎的面不算進去。' : '。')))
            : (s.flat === 0
                ? ('A ' + s.en.name + ' is curved all over, with no flat face anywhere.')
                : ('A ' + s.en.name + ' has ' + faceWord(s.flat, 'en') +
                   (s.curved > 0 ? '; the curved part does not count.' : '.')))
        };
      } },
    /* 2. 有幾條直直的邊（彎彎的邊不算，所以一律寫「直直的邊」） */
    { id:'straightEdges', cat:'count', grp:'count',
      make:function(used){
        var si = Number(pickUnused([0,1,2,3,4], used));
        var s = SOLIDS[si];

        /* 誘答：把頂點數當邊數、把面數當邊數、把彎彎的邊算進去。 */
        var cands = [ N(s.vert, 'edge'), N(s.flat, 'edge'), N(s.curved * 2, 'edge') ];
        var pool = shuffle(EDGE_POOL);
        var mix = mixOpts(correct, cands, function(i){
          return (i < pool.length) ? N(pool[i], 'edge') : null;
        }, []);
        return { si:si, correct:correct, opts:mix.opts, ans:mix.ans, svg:solidSVG(s.id) };
      },
      fmt:function(d, lang){

                    '.<br>How many <strong>straight edges</strong> does it have?')) + d.svg,

          why:lang === 'zh'
            ? (s.edge > 0
                ? (s.zh.name + '上面 4 條、下面 4 條、站著的 4 條，一共 ' + s.edge + ' 條直直的邊。')

                : ('A ' + s.en.name + ' has no straight edges. ' + s.en.edgeNote))
        };
      } },
    /* 3. 有幾個頂點。圓錐不出現在這一題 —— 它的頂點是上面那個尖端（1 個），

    { id:'corners', cat:'count', grp:'count',

        var cands = [ N(s.flat, 'vert') ];

        }, []);
        return { si:si, correct:correct, opts:mix.opts, ans:mix.ans, svg:solidSVG(s.id) };
      },
      fmt:function(d, lang){
        var s = SOLIDS[d.si];
        return {
          stem:(lang === 'zh'
                 ? (s.icon + ' ' + s.zh.real + '是' + s.zh.name + '。<br>它有幾個<strong>頂點</strong>（尖尖的角）？')

            : (s.vert > 0
                ? ('A ' + s.en.name + ' has 4 corners on top and 4 underneath — ' + s.vert + ' corners in all.')
                : ('A ' + s.en.name + ' has no pointy corners at all, so the answer is 0.'))
        };
      } },
    /* 4. 幾個一樣的東西，一共有幾個平平的面（乘法兩步驟） */
    { id:'countTotalFlat', cat:'count', grp:'count',
      make:function(used){
        var si = Number(pickUnused([0,1,2,4], used));   /* 球的 0 個留給下一個產生器 */
        var s = SOLIDS[si];

        var cands = [ N(n + s.flat, 'flat'), N(total + s.flat, 'flat'), N(n * (s.flat + s.curved), 'flat') ];

        }, [n]);

      },
      fmt:function(d, lang){
        var s = SOLIDS[d.si];
        return {
          stem:lang === 'zh'
            ? (s.icon + ' ' + realN(d.si, d.n, 'zh') + '分開放。<br>一共有幾個<strong>平平的面</strong>？')

               ' are placed apart from each other.<br>How many <strong>flat faces</strong> are there altogether?'),
          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          why:lang === 'zh'
            ? ('一' + s.zh.cl + s.zh.real + '有 ' + s.flat + ' 個平平的面：' + s.flat + ' × ' + d.n + ' ＝ ' + d.total + ' 個。')
            : ('One ' + s.en.bare + ' has ' + faceWord(s.flat, 'en') + ': ' + s.flat + ' × ' + d.n + ' = ' + d.total + '.')
        };
      } },
    /* 5. 兩種東西混在一起，一共有幾個平平的面（球的 0 個最容易被漏掉） */
    { id:'mixedTotalFlat', cat:'count', grp:'count',
      make:function(used){
        var a = Number(pickUnused([0,1,2,4], used));
        var pool = [0,1,2,3,4].filter(function(x){ return x !== a; });
        var b = pick(pool);
        var na = 1 + rand(3), nb = 1 + rand(3);         /* 各 1~3 個 */
        if (na === 1 && nb === 1) na = 2;               /* 至少有一邊要用到乘法 */
        var pa = na * SOLIDS[a].flat, pb = nb * SOLIDS[b].flat;
        var total = pa + pb;
        var correct = N(total, 'flat');
        /* 誘答：只算一半、把個數也加進去、多算一份。 */
        var cands = [ N(pa, 'flat'), N(pb, 'flat'), N(total + nb, 'flat') ];
        var mix = mixOpts(correct, cands, function(i){
          var alt = [total + SOLIDS[a].flat, total - nb, total + 2, total + 1, total - 1,
                     total + 3, total - 2, total + 4, total + 5, total + 6];
          return (i < alt.length && alt[i] >= 0 && alt[i] <= 39) ? N(alt[i], 'flat') : null;
        }, [na, nb]);
        return { a:a, b:b, na:na, nb:nb, pa:pa, pb:pb, total:total, correct:correct, opts:mix.opts, ans:mix.ans };
      },
      fmt:function(d, lang){

            : (A.icon + ' ' + realN(d.a, d.na, 'en') + ' and ' + B.icon + ' ' + realN(d.b, d.nb, 'en') +

          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,

    /* 6. 哪一個不會滾（正解一定是沒有彎彎的面的那一個；三個誘答剛好是三個會滾的） */

          opts:d.opts.map(function(v){ return valStr(v, lang); }), ans:d.ans,
          /* 光說「有 6 個平平的面」分不出正方體和長方體 —— 解釋一定要把
             決定答案的那一句線索（CLUE_TXT）再講一次。 */
          why:lang === 'zh'
            ? (s.zh.name + (s.flat === 0 ? '一個平平的面都沒有' : ('有 ' + s.flat + ' 個平平的面')) +
               CLUE_WHY.zh[d.extra] + '，生活裡就像' + s.zh.real + '。')
            : ('A ' + s.en.name + (s.flat === 0 ? ' has no flat faces at all' : (' has ' + faceWord(s.flat, 'en'))) +
               CLUE_WHY.en[d.extra] + ' — just like ' + s.en.real + '.')
        };
      } }
  ];

  /* ---------- 出一批 12 題：11 種題型各一題＋核心題型隨機 1 題 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['flatFaces','straightEdges','countTotalFlat','realToSolid'].indexOf(g.id) >= 0;
    });
    shuffle(extraPool).slice(0, 1).forEach(function(g){ slots.push(g); });
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongGroups = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongGroups = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var grp = item.gen.grp;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongGroups[grp] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var groups = [];
    for (var g in wrongGroups) if (wrongGroups[g]) groups.push(g);
    if (groups.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      groups.forEach(function(g){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[g]; a.textContent = t.groupNames[g];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
