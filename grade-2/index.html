<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>二年級數學 — teach-me</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --blue:#3B7DD8; --blue-soft:#E8F0FB; --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .crumb{font-size:15px;color:var(--muted)}
  .crumb a{color:var(--blue);text-decoration:none}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(28px,6vw,42px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .soonbox{
    background:var(--green-soft);border:2px solid var(--green);border-radius:20px;
    padding:18px 22px;margin:26px 0;font-size:16px;text-align:center;
  }
  .soonbox a{color:var(--green);font-weight:700}
  .strand{margin-top:32px}
  .strand h2{font-size:20px;padding-left:12px}
  .strand p{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;margin-top:8px;font-size:15px;color:var(--muted);
  }
  .lessons{display:grid;gap:14px;margin-top:14px}
  .lesson{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 20px;box-shadow:0 4px 14px rgba(70,60,40,.06);
  }
  .badge{font-size:34px;line-height:1}
  .lesson .info{flex:1;min-width:180px}
  .lesson h3{font-size:18px}
  .lesson h3 a{color:var(--ink);text-decoration:none}
  .lesson h3 a:hover{color:var(--green)}
  .lesson .info p{font-size:14px;color:var(--muted);background:none;border:0;padding:0;margin:2px 0 0}
  .plinks{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
  .plinks a{
    text-decoration:none;font-size:14px;font-weight:700;border-radius:999px;
    padding:5px 14px;border:2px solid var(--line);color:var(--ink);background:var(--bg);
  }
  .plinks a:first-child{background:var(--green);border-color:var(--green);color:#fff}
  .plinks a:hover{border-color:var(--green)}
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <nav class="crumb"><a href="../index.html" data-i18n="crumbHome">🏠 首頁</a> › <span data-i18n="crumbHere">二年級數學</span></nav>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>

  <header>
    <h1 data-i18n="h1">🎒 二年級數學</h1>
    <p data-i18n="sub">已經有 2 堂課了！每堂都有：📖 上課 · 🗂️ 速查卡 · 🔁 複習挑戰 · 👨‍👩‍👧 給家長</p>
  </header>

  <div class="soonbox" data-i18n="soon">🌱 其他單元的互動課程還在準備中。想多玩一點？<a href="../grade-5/">五年級已有 23 堂課</a>！</div>

  <section class="strand">
    <h2 style="border-left:8px solid var(--green)" data-i18n="sh0">數與計算</h2>
    <div class="lessons">
      <div class="lesson"><span class="badge">🧱</span>
        <span class="info"><h3><a href="math/numbers/" data-i18n="n2T"></a></h3><p data-i18n="n2D"></p></span>
        <span class="plinks"><a href="math/numbers/" data-i18n="pL">📖</a><a href="math/numbers/reference.html" data-i18n="pR">🗂️</a><a href="math/numbers/review.html" data-i18n="pV">🔁</a><a href="math/numbers/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
      <div class="lesson"><span class="badge">🍪</span>
        <span class="info"><h3><a href="math/multiply/" data-i18n="n1T"></a></h3><p data-i18n="n1D"></p></span>
        <span class="plinks"><a href="math/multiply/" data-i18n="pL">📖</a><a href="math/multiply/reference.html" data-i18n="pR">🗂️</a><a href="math/multiply/review.html" data-i18n="pV">🔁</a><a href="math/multiply/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
    </div>
    <p data-i18n="sc0">1000 以內的數、二三位數直式加減、九九乘法、分裝與平分</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--orange)" data-i18n="sh1">量與實測</h2>
    <p data-i18n="sc1">公分與公尺、容量重量比較、幾點幾分與日期</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--blue)" data-i18n="sh2">空間與形狀</h2>
    <p data-i18n="sc2">邊、頂點、角，三角形、四邊形、圓</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #9C6ADE" data-i18n="sh3">資料與統計</h2>
    <p data-i18n="sc3">簡單統計表</p>
  </section>

  <footer data-i18n="footer">teach-me · 慢慢學，學得牢</footer>
</div>

<script>
(function(){
  "use strict";
  var I18N = {
    "zh": {
        "htmlLang": "zh-Hant",
        "title": "二年級數學 — teach-me",
        "btn": "EN",
        langAria: '切換語言',
        "crumbHome": "🏠 首頁",
        "crumbHere": "二年級數學",
        "h1": "🎒 二年級數學",
        "sub": "已經有 2 堂課了！每堂都有：📖 上課 · 🗂️ 速查卡 · 🔁 複習挑戰 · 👨‍👩‍👧 給家長",
        "soon": "🌱 其他單元的互動課程還在準備中。想多玩一點？<a href=\"../grade-5/\">五年級已有 23 堂課</a>！",
        "n2T": "三位數積木 — 1000 以內的數",
        "n2D": "百、十、個各站各的位子；滿十就換一個",
        "n1T": "乘法排排隊 — 九九乘法",
        "n1D": "幾個一數就是乘法；一盤幾顆寫前面",
        "pL": "📖 上課", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "footer": "teach-me · 慢慢學，學得牢",
        "sh0": "數與計算",
        "sc0": "1000 以內的數、二三位數直式加減、九九乘法、分裝與平分",
        "sh1": "量與實測",
        "sc1": "公分與公尺、容量重量比較、幾點幾分與日期",
        "sh2": "空間與形狀",
        "sc2": "邊、頂點、角，三角形、四邊形、圓",
        "sh3": "資料與統計",
        "sc3": "簡單統計表"
    },
    "en": {
        "htmlLang": "en",
        "title": "Grade 2 Math — teach-me",
        "btn": "中",
        langAria: 'Switch language',
        "crumbHome": "🏠 Home",
        "crumbHere": "Grade 2 Math",
        "h1": "🎒 Grade 2 Math",
        "sub": "2 lessons are live! Each has 📖 Lesson · 🗂️ Cheat sheet · 🔁 Review · 👨‍👩‍👧 For parents",
        "soon": "🌱 Lessons for the other units are still on the way. Want more to play? <a href=\"../grade-5/\">Grade 5 has 23 lessons</a>!",
        "n2T": "Three-Digit Blocks",
        "n2D": "Hundreds, tens and ones each have a spot — ten makes a swap",
        "n1T": "Times Tables Line-Up",
        "n1D": "Counting equal groups is multiplication — group size goes first",
        "pL": "📖 Lesson", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "footer": "teach-me · learn slowly, remember firmly",
        "sh0": "Numbers & Operations",
        "sc0": "Numbers to 1000, column add/subtract, times tables, sharing & grouping",
        "sh1": "Measurement",
        "sc1": "cm & m, comparing capacity & weight, telling time & dates",
        "sh2": "Space & Shape",
        "sc2": "Sides, vertices & angles; triangles, quadrilaterals, circles",
        "sh3": "Data & Statistics",
        "sc3": "Simple tally tables"
    }
};

  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var btn = document.getElementById('langBtn');

  function applyLang(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    btn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (d[key] !== undefined) nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  btn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>
