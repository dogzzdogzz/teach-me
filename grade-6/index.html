<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六年級數學 — teach-me</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --blue:#3B7DD8; --blue-soft:#E8F0FB; --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .crumb{font-size:15px;color:var(--muted)}
  .crumb a{color:var(--blue);text-decoration:none}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(28px,6vw,42px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .soonbox{
    background:var(--green-soft);border:2px solid var(--green);border-radius:20px;
    padding:18px 22px;margin:26px 0;font-size:16px;text-align:center;
  }
  .soonbox a{color:var(--green);font-weight:700}
  .strand{margin-top:32px}
  .strand h2{font-size:20px;padding-left:12px}
  .strand p{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;margin-top:8px;font-size:15px;color:var(--muted);
  }
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <nav class="crumb"><a href="../index.html" data-i18n="crumbHome">🏠 首頁</a> › <span data-i18n="crumbHere">六年級數學</span></nav>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>

  <header>
    <h1 data-i18n="h1">🎒 六年級數學</h1>
    <p data-i18n="sub">這個年級要學什麼，先看這裡</p>
  </header>

  <div class="soonbox" data-i18n="soon">🌱 六年級的互動課程準備中。想先玩玩看？<a href="../grade-5/">五年級的課還更多</a>！</div>

  <section class="strand">
    <h2 style="border-left:8px solid var(--green)" data-i18n="sh0">數與計算</h2>
    <p data-i18n="sc0">質數與質因數分解、最大公因數最小公倍數、分數小數除法、比與比值、速率</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--orange)" data-i18n="sh1">量與實測</h2>
    <p data-i18n="sc1">圓周率與圓面積、扇形、柱體體積與表面積</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--blue)" data-i18n="sh2">空間與形狀</h2>
    <p data-i18n="sc2">放大縮小與比例尺、柱體與錐體</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #9C6ADE" data-i18n="sh3">關係</h2>
    <p data-i18n="sc3">未知數與列式</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #D64545" data-i18n="sh4">資料與統計</h2>
    <p data-i18n="sc4">圓形圖</p>
  </section>

  <footer data-i18n="footer">teach-me · 慢慢學，學得牢</footer>
</div>

<script src="../lessons.js"></script>
<script>
(function(){
  "use strict";
  var I18N = {
    "zh": {
        "htmlLang": "zh-Hant",
        "title": "六年級數學 — teach-me",
        "btn": "EN",
        langAria: '切換語言',
        "crumbHome": "🏠 首頁",
        "crumbHere": "六年級數學",
        "h1": "🎒 六年級數學",
        "sub": "這個年級要學什麼，先看這裡",
        "soon": "🌱 六年級的互動課程準備中。想先玩玩看？<a href=\"../grade-5/\">五年級已有 {N5} 堂課</a>！",
        "footer": "teach-me · 慢慢學，學得牢",
        "sh0": "數與計算",
        "sc0": "質數與質因數分解、最大公因數最小公倍數、分數小數除法、比與比值、速率",
        "sh1": "量與實測",
        "sc1": "圓周率與圓面積、扇形、柱體體積與表面積",
        "sh2": "空間與形狀",
        "sc2": "放大縮小與比例尺、柱體與錐體",
        "sh3": "關係",
        "sc3": "未知數與列式",
        "sh4": "資料與統計",
        "sc4": "圓形圖"
    },
    "en": {
        "htmlLang": "en",
        "title": "Grade 6 Math — teach-me",
        "btn": "中",
        langAria: 'Switch language',
        "crumbHome": "🏠 Home",
        "crumbHere": "Grade 6 Math",
        "h1": "🎒 Grade 6 Math",
        "sub": "What this grade covers, at a glance",
        "soon": "🌱 Interactive lessons for Grade 6 are on the way. Want to play now? <a href=\"../grade-5/\">Grade 5 has {N5} lessons</a>!",
        "footer": "teach-me · learn slowly, remember firmly",
        "sh0": "Numbers & Operations",
        "sc0": "Primes & factorisation, GCF & LCM, fraction & decimal division, ratios, speed",
        "sh1": "Measurement",
        "sc1": "Pi & circle area, sectors, prism volume & surface area",
        "sh2": "Space & Shape",
        "sc2": "Scaling & scale maps, prisms, pyramids & cones",
        "sh3": "Relations",
        "sc3": "Unknowns & writing equations",
        "sh4": "Data & Statistics",
        "sc4": "Pie charts"
    }
};

  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var btn = document.getElementById('langBtn');


  /* 堂數不寫死：{N} 是這一頁自己的課程卡數量（永遠等於畫面上真的有幾堂），
     {N5} 是五年級的堂數，來自 ../lessons.js。載不到就顯示 ?，不要顯示錯的數字。 */
  function ownCount(){ return document.querySelectorAll('.lesson').length; }
  function grade5Count(){
    try { var L = window.TEACHME_LESSONS; if (L && L[5]) return L[5].length; } catch(e){}
    return null;
  }
  function fillCounts(str){
    var n5 = grade5Count();
    return String(str).replace(/\{N\}/g, ownCount())
                      .replace(/\{N5\}/g, n5 === null ? '?' : n5);
  }
  function applyLang(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    btn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = fillCounts(d[key]);
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  btn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>
