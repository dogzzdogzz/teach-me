<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null：tools/simgen.js 每一批只呼叫 make() 一次、不重試。
     所有抽樣池都事先過濾好，抽到就一定做得出四個選項。 */

  /* --- 這一課的工具（和 index.html 同一套定義：所有的量都用百分之一的整數存）。 --- */
  var A_MIN_H = 10, A_MAX_H = 5000;    /* 複習頁的被除數再收緊一點：0.1 ~ 50 */
  var B_MIN_H = 5,  B_MAX_H = 990;     /* 除數 0.05 ~ 9.9 */
  var Q_MIN_H = 100, Q_MAX_H = 5000;   /* 商 1 ~ 50 */
  /* 選項裡任何一個量的上限（百分之一）。50000 ＝ 500，是**推出來的**：誘答最大的是
     「只放大被除數」＝ 商 × 10，而商的上限是 50。 */
  var VAL_MAX = 50000;

  function dText(h){
    var w = Math.floor(h / 100), f = h % 100;
    if (f === 0) return String(w);
    if (f % 10 === 0) return w + '.' + (f / 10);
    return w + '.' + (f < 10 ? '0' + f : String(f));
  }
  function dpOf(h){
    if (h % 100 === 0) return 0;
    if (h % 10 === 0) return 1;
    return 2;
  }
  function scaleOf(h){ var p = dpOf(h); return p === 0 ? 1 : (p === 1 ? 10 : 100); }

  /* --- 選項的編碼：`百分之一的值|單位代號`。這樣「9」和「9 段」是兩個不同的值，去重才擋得住。 --- */
  function tok(h, u){ return h + '|' + u; }
  function tokVal(t){ return Number(String(t).split('|')[0]); }
  function tokUnit(t){ return String(t).split('|')[1]; }
  function plEn(n, w){
    if (String(n) === '1') return n + ' ' + w;
    return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's');
  }
  var UNIT_WORD = {
    zh:{ n:'', seg:'段', bot:'瓶', bag:'袋', yuan:'元', pl:'位' },
    en:{ n:'', seg:'piece', bot:'bottle', bag:'bag', yuan:'dollar', pl:'place' }
  };
  function tokText(t, lang){
    var v = dText(tokVal(t)), u = tokUnit(t);
    if (u === 'n') return v;
    return lang === 'zh' ? v + ' ' + UNIT_WORD.zh[u] : plEn(v, UNIT_WORD.en[u]);
  }

  /* 從候選裡挑三個**值互不相同**、也和正解不同的誘答；候選不夠就用 fallbacks 補（同樣去重）。
     avoid 是「不可以出現的編碼」（例如抄題幹的數）。擠到不夠時少回傳（simgen 的選項數檢查會響，不會卡死）。 */
  function pickWrongs(correct, cands, fallbacks, avoid){
    var seen = {}, out = [];
    seen[correct] = 1;
    (avoid || []).forEach(function(k){ seen[k] = 1; });
    cands.concat(fallbacks).forEach(function(c){
      if (out.length >= 3 || c === null || c === undefined) return;
      var v = tokVal(c);
      if (!isFinite(v) || v < 1 || v > VAL_MAX || v !== Math.floor(v)) return;
      if (seen[c]) return;
      seen[c] = 1; out.push(c);
    });
    return out;
  }
  function optsOf(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 保底：值長得像答案的鄰居（同一個單位，×10、÷10、± 1、× 2）。全部維持最多一位小數。 */
  function nearFallbacks(h, u){
    var out = [tok(h * 10, u), tok(h + 100, u), tok(2 * h, u)];
    if (h % 10 === 0 && h >= 100) out.push(tok(h / 10, u));
    if (h > 100) out.push(tok(h - 100, u));
    out.push(tok(h + 200, u));
    return out;
  }

  /* --- 抽樣池：所有合法的（被除數、除數、商）組合都事先算好 ---
     商一律是 10 的倍數（最多一位小數），被除數一定除得盡。 */
  /* 三個「只動一邊／改成相乘」的誘答不可以撞到題幹印出來的數，也不可以撞到正解 ——
     撞到的話 pickWrongs 會把它擋掉，那一組刻意的迷思誘答就靜靜不見了。事先把這種組合濾掉。 */
  /* 印出來有幾個數字（小數點不算）。這一課教的是方法，不是硬算 ——
     被除數最多 3 個數字，不然 14.16 ÷ 0.8 這種題目考的變成直式計算。 */
  function digitCount(h){ return dText(h).replace('.', '').length; }
  function distractorsClean(a, b, q){
    var xs = [q / 10, q * 10], m = a * b / 100, i;
    if (m === Math.floor(m)) xs.push(m);
    for (i = 0; i < xs.length; i++) if (xs[i] === a || xs[i] === b || xs[i] === q) return false;
    return true;
  }
  function buildPairs(bPool, keep){
    var out = [], i, q, a;
    for (i = 0; i < bPool.length; i++){
      for (q = Q_MIN_H; q <= Q_MAX_H; q += 10){
        if ((bPool[i] * q) % 100 !== 0) continue;
        a = bPool[i] * q / 100;
        if (a < A_MIN_H || a > A_MAX_H) continue;
        if (a === 100 || bPool[i] === 100) continue;        /* 被除數或除數剛好是 1：誘答會撞到題幹的數 */
        if (keep(a, bPool[i], q)) out.push({ a:a, b:bPool[i], q:q });
      }
    }
    return out;
  }
  var B_TENTH = [20, 40, 50, 60, 80];                 /* 一位小數、比 1 小 */
  var B_HUND  = [5, 15, 25, 35, 45, 75];              /* 兩位小數、比 1 小 */
  var B_BIG   = [120, 150, 160, 180, 250, 450];       /* 比 1 大的小數 */
  var B_ALL   = B_TENTH.concat(B_HUND, B_BIG);

  /* 1 一位小數的除數；被除數本身也是小數 */
  var P_TENTH = buildPairs(B_TENTH, function(a, b, q){ return dpOf(a) >= 1 && digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 2 兩位小數的除數 */
  var P_HUND  = buildPairs(B_HUND, function(a, b, q){ return digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 3 被除數是整數（要補 0） */
  var P_WHOLE = buildPairs(B_TENTH.concat(B_HUND), function(a, b, q){ return dpOf(a) === 0 && digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 4 除數比 1 大 */
  var P_BIG   = buildPairs(B_BIG, function(a, b, q){ return digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 5 商是小數（不是整數） */
  var P_DEC   = buildPairs(B_ALL, function(a, b, q){ return q % 100 !== 0 && digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 6 剪東西的應用題：商是整數，2 ~ 30 份，兩個數都是一位小數 */
  var P_CUT   = buildPairs(B_TENTH, function(a, b, q){ return q % 100 === 0 && q >= 200 && q <= 3000 && dpOf(a) === 1 && digitCount(a) <= 3 && distractorsClean(a, b, q); });
  /* 7 1 個單位是多少：總量 ÷ 數量，答案是錢 */
  var P_UNIT  = buildPairs(B_TENTH.concat(B_HUND, B_BIG), function(a, b, q){ return q % 100 === 0 && q >= 200 && q <= 2000 && digitCount(a) <= 3 && q !== 100 && q / 10 !== 100 && q * 10 !== 100 && distractorsClean(a, b, q); });
  /* 8 商和被除數比大小：除數剛好是 1 的那一組也要出得到，所以另外建 */
  var P_CMP   = buildPairs(B_ALL, function(a){ return digitCount(a) <= 3; }).concat(
                  (function(){ var o = [], q; for (q = Q_MIN_H; q <= Q_MAX_H; q += 10) if (q !== 100 && digitCount(q) <= 3) o.push({ a:q, b:100, q:q }); return o; })());
  /* placesAsk 的四個選項固定是 1 ~ 4 位，所以被除數不可以剛好是 1 ~ 4 —— 那會變成誘答抄題幹。 */
  var P_PLACES = P_DEC.concat(P_TENTH, P_HUND).filter(function(p){ return p.a !== 100 && p.a !== 200 && p.a !== 300 && p.a !== 400; });

  /* --- 應用題的情境。cut 是包含除（答案是個數），unit 是 1 個單位是多少（答案是錢）。 --- */
  var CUT_SCEN = {
    zh:{
      rope:  { what:'繩子', unit:'公尺', per:'段', ask:'剪一段', count:'可以剪成幾段' },
      juice: { what:'果汁', unit:'公升', per:'瓶', ask:'裝一瓶', count:'可以裝幾瓶' },
      rice:  { what:'米',   unit:'公斤', per:'袋', ask:'裝一袋', count:'可以裝幾袋' }
    },
    en:{
      rope:  { what:'rope',  unit:'metre',    per:'piece',  ask:'cut into pieces of' },
      juice: { what:'juice', unit:'litre',    per:'bottle', ask:'poured into bottles of' },
      rice:  { what:'rice',  unit:'kilogram', per:'bag',    ask:'packed into bags of' }
    }
  };
  var CUT_IDS = ['rope', 'juice', 'rice'];
  var CUT_UNITTOK = { rope:'seg', juice:'bot', rice:'bag' };
  var UNIT_SCEN = {
    zh:{
      sugar:  { what:'糖',   unit:'公斤' },
      ribbon: { what:'緞帶', unit:'公尺' },
      oil:    { what:'油',   unit:'公升' }
    },
    en:{
      sugar:  { what:'sugar',  unit:'kilogram' },
      ribbon: { what:'ribbon', unit:'metre' },
      oil:    { what:'oil',    unit:'litre' }
    }
  };
  var UNIT_IDS = ['sugar', 'ribbon', 'oil'];

  /* --- 「商比被除數大還是小」的四句話。真假由除數和 1 比決定（設定檔另有一份獨立的表）。 --- */
  var SIDES = {
    bigger:  { zh:'商比被除數大', en:'The quotient is bigger than the dividend' },
    smaller: { zh:'商比被除數小', en:'The quotient is smaller than the dividend' },
    same:    { zh:'商和被除數一樣大', en:'The quotient equals the dividend' },
    depends: { zh:'不算出來就不知道', en:'There is no way to tell without dividing' }
  };
  var SIDE_KEYS = ['bigger', 'smaller', 'same', 'depends'];
  function sideOf(b){ return b < 100 ? 'bigger' : (b > 100 ? 'smaller' : 'same'); }

  /* --- 交錯題（六年級「比與比值調色盤」）：比值 ＝ 前項 ÷ 後項。前項後項都在 30 以內。 --- */
  var RATIO_PAIRS = (function(){
    var out = [], b, k;
    for (b = 2; b <= 9; b++) for (k = 2; k <= 9; k++) if (b * k <= 30) out.push({ b:b, k:k });
    return out;
  })();
  /* --- 交錯題（五年級「小數商店」）：小數 ÷ 整數。 --- */
  var DECINT_PAIRS = (function(){
    var out = [], n, q, a;
    /* 被除數（百分之一）＝ 除數 × 商，所以一定除得盡。 */
    for (n = 2; n <= 9; n++) for (q = 110; q <= 900; q += 10){
      a = n * q;
      /* 被除數要是小數（整數 ÷ 整數不是五年級那一課的重點），而且誘答不可以撞到題幹印出來的兩個數。 */
      if (a < 100 || a > 5000 || dpOf(a) < 1 || digitCount(a) > 3) continue;
      if (q * 10 === a || q / 10 === a || a * n === a) continue;
      if (q === n * 100 || q * 10 === n * 100 || q / 10 === n * 100 || a * n === n * 100) continue;
      out.push({ n:n, q:q, a:a });
    }
    return out;
  })();

  var GENS = [
    /* 1. 一位小數的除數。誘答：只放大除數（商變成十分之一）、只放大被除數（10 倍）、改成相乘。 */
    { id:'divTenth', cat:'calc',
      make:function(used){
        var p = pickUnused(P_TENTH, used);
        var correct = tok(p.q, 'n');
        var cands = [tok(p.q / 10, 'n'), tok(p.q * 10, 'n'), tok(p.a * p.b / 100, 'n')];
        var wrongs = pickWrongs(correct, cands, nearFallbacks(p.q, 'n'), [tok(p.a, 'n'), tok(p.b, 'n')]);
        var o = optsOf(correct, wrongs);
        return { a:p.a, b:p.b, q:p.q, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var k = scaleOf(d.b);
        return {
          stem: lang === 'zh' ? '<strong>' + dText(d.a) + ' ÷ ' + dText(d.b) + '</strong> ＝ ?'
                              : '<strong>' + dText(d.a) + ' ÷ ' + dText(d.b) + '</strong> ＝ ?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh'
            ? '除數 ' + dText(d.b) + ' 有 ' + dpOf(d.b) + ' 位小數，兩個數都乘以 ' + k + '：' + dText(d.a) + ' ÷ ' + dText(d.b) + ' ＝ ' + dText(d.a * k) + ' ÷ ' + dText(d.b * k) + ' ＝ ' + dText(d.q) + '。只放大除數會得到 ' + dText(d.q / 10) + '，只有答案的十分之一；只放大被除數會得到 ' + dText(d.q * 10) + '，大了 10 倍。'
            : 'The divisor ' + dText(d.b) + ' has ' + plEn(dpOf(d.b), 'decimal place') + ', so both numbers are multiplied by ' + k + ': ' + dText(d.a) + ' ÷ ' + dText(d.b) + ' ＝ ' + dText(d.a * k) + ' ÷ ' + dText(d.b * k) + ' ＝ ' + dText(d.q) + '. Magnifying only the divisor gives ' + dText(d.q / 10) + ', a tenth of that; magnifying only the dividend gives ' + dText(d.q * 10) + ', ten times too much.'
        };
      } },

    /* 2. 兩位小數的除數：要移兩位。誘答同上。 */
    { id:'divHundredth', cat:'calc',
      make:function(used){
        var p = pickUnused(P_HUND, used);
        var correct = tok(p.q, 'n');
        var cands = [tok(p.q / 10, 'n'), tok(p.q * 10, 'n'), tok(p.a * p.b / 100, 'n')];
        var wrongs = pickWrongs(correct, cands, nearFallbacks(p.q, 'n'), [tok(p.a, 'n'), tok(p.b, 'n')]);
        var o = optsOf(correct, wrongs);
        return { a:p.a, b:p.b, q:p.q, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        return {
          stem: '<strong>' + dText(d.a) + ' ÷ ' + dText(d.b) + '</strong> ＝ ?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh'

      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題五年級的小數 ÷ 整數，和一題六年級的比值。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　小數 ÷ 整數回五年級<a href="../../../grade-5/math/decimal/index.html">小數商店</a>　·　比值回<a href="../ratio/index.html">比與比值調色盤</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Decimal Division Magnifier', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Decimal Division Magnifier',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>One of them is the grade-5 decimal ÷ whole number, and one is the grade-6 ratio value.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　decimal ÷ whole number is grade five <a href="../../../grade-5/math/decimal/index.html">The Decimal Shop</a>　·　ratio values are in <a href="../ratio/index.html">The Ratio Palette</a>',
      retryBtn:'🔄 Another round',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another go.'
    }
  };
  function L(){ return I18N[lang]; }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
