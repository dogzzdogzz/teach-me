<body>

    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>
  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題六年級的圓面積與圓周長，和一題五年級的長方體體積。<br>這裡的柱體都是<strong>直柱體</strong>（側面和底面垂直），表面積只算底面是長方形、直角三角形或圓的柱體。</div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function range(a, b){ var out = []; for (var i = a; i <= b; i++) out.push(i); return out; }
  /* ⚠️ make() 一律不可以回 null：tools/simgen.js 每一批只呼叫 make() 一次、不重試。
     所有抽樣池都事先過濾好，抽到就一定做得出四個選項。 */

  /* --- 這一課的工具（和 index.html 同一套定義：所有量都用百分之一的整數存）。 --- */
  var PI_H = 314;           /* 圓周率 3.14 */
  /* 選項裡任何一個量的上限（百分之一）＝ 20000。⚠️ 要容得下「把直徑當半徑」那個 4 倍的誘答（最大 4 × 10 × 10 × 3.14 × 15 ＝ 18840），
     太小的話 pickWrongs 會靜靜把它丟掉（檢查設定抓到）。 */
  var VAL_MAX = 2000000;
  function hText(h){
    var w = Math.floor(h / 100), f = h % 100;
    if (f === 0) return String(w);
    if (f % 10 === 0) return w + '.' + (f / 10);
    return w + '.' + (f < 10 ? '0' + f : String(f));
  }
  /* 底面積、底面周長（百分之一）。形狀描述和 index.html 同一套。 */
  function baseAreaH(b){
    if (b.shape === 'rect') return b.a * b.b * 100;
    if (b.shape === 'tri') return b.w * b.t * 50;
    if (b.shape === 'para') return b.w * b.t * 100;
    if (b.shape === 'trap') return (b.u + b.w) * b.t * 50;
    if (b.shape === 'circ') return b.r * b.r * PI_H;
    return null;
  }
  function basePerimH(b){
    if (b.shape === 'rect') return (b.a + b.b) * 2 * 100;
    if (b.shape === 'circ') return b.r * 2 * PI_H;
    return null;
  }
  function volH(b, h){ return baseAreaH(b) * h; }
  function latH(b, h){ return basePerimH(b) * h; }
  function surfH(b, h){ return baseAreaH(b) * 2 + latH(b, h); }

  /* --- 選項的編碼：`百分之一的值|單位代號`。單位代號 cm 公分、sq 平方公分、cu 立方公分。 --- */
  function tok(h, u){ return h + '|' + u; }
  function tokVal(t){ return Number(String(t).split('|')[0]); }
  function tokUnit(t){ return String(t).split('|')[1]; }
  function plEn(n, w){
    if (String(n) === '1') return n + ' ' + w;
    return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's');
  }
  var UNIT_WORD = { zh:{ cm:'公分', sq:'平方公分', cu:'立方公分' }, en:{ cm:'centimetre', sq:'square centimetre', cu:'cubic centimetre' } };
  function tokText(t, lang){
    var u = tokUnit(t), v = hText(tokVal(t));
    return lang === 'zh' ? v + ' ' + UNIT_WORD.zh[u] : plEn(v, UNIT_WORD.en[u]);
  }
  function cm(n){ return plEn(n, 'centimetre'); }

  /* 從候選裡挑三個**值互不相同**、也和正解不同的誘答；候選不夠就用 fallbacks 補（同樣去重）。
     avoid 是「不可以出現的數」（題幹印出來的數，百分之一）。
     ⚠️ 連**印出來的數字**都要去重：`60 立方公分` 和 `60 平方公分` 排在一起讀起來像在玩文字遊戲。
     擠到不夠時少回傳（simgen 的選項數檢查會響，不會卡死）。 */
  function pickWrongs(correct, cands, fallbacks, avoid){
    var shown = {}, out = [];
    shown[tokVal(correct)] = 1;
    (avoid || []).forEach(function(v){ shown[v] = 1; });
    cands.concat(fallbacks).forEach(function(c){
      if (out.length >= 3 || c === null || c === undefined) return;
      var v = tokVal(c);
      if (!isFinite(v) || v < 1 || v > VAL_MAX || v !== Math.floor(v)) return;
      if (shown[v]) return;
      shown[v] = 1;
      out.push(c);
    });
    return out;
  }
  function optsOf(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 保底：值長得像答案的鄰居（同一個單位）。 */
  function nearFallbacks(h, u){
    var out = [tok(h + 100, u), tok(h - 100, u), tok(2 * h, u), tok(h + 1000, u), tok(h + 200, u)];
    if (h % 2 === 0) out.push(tok(h / 2, u));
    return out;
  }

  /* --- 抽樣池 --- */
  /* ⚠️ 圓柱的半徑從 3 起：半徑 2 讓「底面積」和「底面周長」是同一個數（12.56），「算成側面積」的誘答會撞上正解；
     半徑 1 讓「半徑只乘一次」的誘答撞上正解（1 × 3.14 ＝ 1 × 1 × 3.14）。 */
  var POOL_R = [3, 4, 5, 6, 7, 8, 9, 10];
  var POOL_H = range(2, 15);
  /* 三角形的底與高：2 ~ 12 與 3 ~ 10（底面積最多 60）。⚠️ 高不用 2：高 2 的時候「底 × 柱體的高」那個誘答剛好等於正解。 */
  var POOL_TW = range(2, 12), POOL_TT = range(3, 10);
  /* 梯形：上底比下底短。平行四邊形：底與高。 */
  var POOL_TRAP = [];
  (function(){
    for (var w = 3; w <= 12; w++) for (var u = 1; u < w; u++) for (var t = 2; t <= 8; t++) POOL_TRAP.push({ shape:'trap', u:u, w:w, t:t });
  })();
  /* 求高的題目：底面是 a × b 的長方形，高 2 ~ 15，體積由乘法算出來（一定除得盡）。 */
  var POOL_RECT_A = range(2, 12), POOL_RECT_B = range(2, 10);
  /* 整圓交錯題（六年級「圓周率工作坊」）：半徑 3 ~ 10（半徑 2 的圓周長和面積是同一個數）。 */
  var POOL_R_WHOLE = range(3, 10);

  /* --- 「哪一個情境要算體積」的句庫：一句要體積，三句要面積（表面積或側面積）。 --- */
  var ASKS = {
    vol: {
      fillTank:  { zh:'圓柱形水桶裝滿水（不算桶子的厚度），可以裝多少水', en:'How much water fills a cylinder-shaped bucket (ignoring its thickness)' },
      sandMould: { zh:'三角柱形的模子裝滿沙（不算模子的厚度），要用多少立方公分的沙', en:'How many cubic centimetres of sand fill a triangular-prism mould (ignoring its thickness)' },
      cakeBox:   { zh:'長方體的盒子裡面可以放多少立方公分的東西', en:'How many cubic centimetres fit inside a cuboid box' },
      clayBar:   { zh:'做一條實心的圓柱形黏土棒，要用多少立方公分的黏土', en:'How many cubic centimetres of clay make a solid cylinder-shaped clay stick' }
    },
    area: {
      wrapBox:   { zh:'長方體禮物盒整個包起來，要多大一張包裝紙', en:'How big a sheet of paper wraps a cuboid gift box all over' },
      canLabel:  { zh:'圓柱形罐頭旁邊貼一圈標籤，標籤要多大一張', en:'How big a label goes right round the side of a cylinder-shaped can' },
      paintTin:  { zh:'圓柱形的鐵罐外面全部塗上油漆，要塗多大一片', en:'How large an area of paint covers the whole outside of a cylinder-shaped tin' },
      tentCloth: { zh:'底面是直角三角形的三角柱形帳篷，外面全部蓋上布，要用多少布', en:'How much cloth covers the whole outside of a tent shaped like a triangular prism with a right-angled triangle base' }
    }
  };
  var ASK_VOL_KEYS = Object.keys(ASKS.vol);
  var ASK_AREA_KEYS = Object.keys(ASKS.area);

  /* --- 「哪一句話是對的」的句庫。每一句的真假寫死在這裡（設定檔另有一份獨立的真值表）。 --- */
  var STATEMENTS = {
    volRule:    { truth:true,  zh:'柱體的體積 ＝ 底面積 × 高', en:'Volume of a prism ＝ base area × height' },
    latRule:    { truth:true,  zh:'柱體的側面積 ＝ 底面周長 × 高', en:'Side area of a prism ＝ perimeter of the base × height' },
    surfRule:   { truth:true,  zh:'柱體的表面積 ＝ 底面積 × 2 ＋ 側面積', en:'Surface area of a prism ＝ base area × 2 ＋ side area' },
    triHalf:    { truth:true,  zh:'三角柱的底面積要用 底 × 高 ÷ 2 來算', en:'A triangular prism’s base area is base × height ÷ 2' },
    twoBases:   { truth:true,  zh:'柱體有兩個一模一樣、互相平行的底面', en:'A prism has two identical, parallel bases' },
    unitCu:     { truth:true,  zh:'體積的單位是立方公分', en:'Volume is measured in cubic centimetres' },
    volTwice:   { truth:false, zh:'柱體的體積 ＝ 底面積 × 高 × 2', en:'Volume of a prism ＝ base area × height × 2' },
    diamOk:     { truth:false, zh:'算圓柱的底面積時，可以把直徑當成半徑', en:'For a cylinder’s base area, the diameter can be used as the radius' },
    oneBase:    { truth:false, zh:'柱體的表面積 ＝ 底面積 ＋ 側面積', en:'Surface area of a prism ＝ base area ＋ side area' },
    sameHeight: { truth:false, zh:'三角柱的高一定和底面三角形的高一樣長', en:'A triangular prism’s height is always as long as its base triangle’s height' },
    unitSq:     { truth:false, zh:'體積的單位是平方公分', en:'Volume is measured in square centimetres' },
    hTimes4:    { truth:false, zh:'柱體的高變成 2 倍，體積會變成 4 倍', en:'Doubling a prism’s height makes its volume 4 times as big' }
  };
  var TRUE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return STATEMENTS[k].truth; });
  var FALSE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return !STATEMENTS[k].truth; });

  var GENS = [
    /* 1. 三角柱的體積。誘答：忘了除以 2（2 倍）、只算底面積、底 × 柱體的高（漏掉三角形的高）。 */
    { id:'triPrismVol', cat:'vol',
      make:function(){
        var w = pick(POOL_TW), t = pick(POOL_TT), h = pick(POOL_H), b = { shape:'tri', w:w, t:t };
        var v = volH(b, h), correct = tok(v, 'cu');
        var cands = [tok(2 * v, 'cu'), tok(baseAreaH(b), 'cu'), tok(w * h * 100, 'cu')];
        var wrongs = pickWrongs(correct, cands, nearFallbacks(v, 'cu'), [w * 100, t * 100, h * 100]);
        var o = optsOf(correct, wrongs);
        return { w:w, t:t, h:h, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var b = { shape:'tri', w:d.w, t:d.t }, a = baseAreaH(b), v = volH(b, d.h);
        return {
          stem: lang === 'zh' ? '一個三角柱，底面三角形的<strong>底是 ' + d.w + ' 公分</strong>、<strong>高是 ' + d.t + ' 公分</strong>，柱體的<strong>高是 ' + d.h + ' 公分</strong>。它的體積是多少？'
                              : 'A triangular prism has a base triangle with a <strong>base of ' + cm(d.w) + '</strong> and a <strong>height of ' + cm(d.t) + '</strong>; the prism is <strong>' + cm(d.h) + ' high</strong>. What is its volume?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh'
            ? '先算底面積：' + d.w + ' × ' + d.t + ' ÷ 2 ＝ ' + hText(a) + '（平方公分）。再乘柱體的高：' + hText(a) + ' × ' + d.h + ' ＝ ' + hText(v) + '，單位是立方公分。忘了除以 2 會得到 ' + hText(2 * v) + '，剛好是 2 倍。'
            : 'First the base area: ' + d.w + ' × ' + d.t + ' ÷ 2 ＝ ' + hText(a) + ' square centimetres. Then times the prism’s height: ' + hText(a) + ' × ' + d.h + ' ＝ ' + hText(v) + ', in cubic centimetres. Forgetting the ÷ 2 gives ' + hText(2 * v) + ', exactly twice as much.'
        };
      } },

    /* 2. 四角柱（底面是梯形或平行四邊形）的體積。
          誘答：梯形忘了除以 2／平行四邊形多除了 2、只算底面積、梯形只用下底。 */
    { id:'quadPrismVol', cat:'vol',
      make:function(){
        var b, h = pick(POOL_H);
        if (rand(2) === 0) b = pick(POOL_TRAP);
        else b = { shape:'para', w:pick(POOL_TW), t:pick(POOL_TT) };
        var v = volH(b, h), correct = tok(v, 'cu');
        var cands = b.shape === 'trap'
          ? [tok(2 * v, 'cu'), tok(baseAreaH(b), 'cu'), tok(b.w * b.t * h * 100, 'cu')]
          : [tok(v / 2, 'cu'), tok(baseAreaH(b), 'cu'), tok(b.w * h * 100, 'cu')];
        var avoid = b.shape === 'trap' ? [b.u * 100, b.w * 100, b.t * 100, h * 100] : [b.w * 100, b.t * 100, h * 100];
        var wrongs = pickWrongs(correct, cands, nearFallbacks(v, 'cu'), avoid);
        var o = optsOf(correct, wrongs);
        return { base:b, h:h, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var b = d.base, a = baseAreaH(b), v = volH(b, d.h), zh = lang === 'zh';
        var stem, calc;
        if (b.shape === 'trap'){
          stem = zh ? '一個四角柱的底面是梯形，<strong>上底 ' + b.u + ' 公分、下底 ' + b.w + ' 公分、高 ' + b.t + ' 公分</strong>；柱體的<strong>高是 ' + d.h + ' 公分</strong>。它的體積是多少？'
                    : 'A four-sided prism has a trapezium base: <strong>top ' + cm(b.u) + ', bottom ' + cm(b.w) + ', height ' + cm(b.t) + '</strong>; the prism is <strong>' + cm(d.h) + ' high</strong>. What is its volume?';
          calc = '(' + b.u + ' ＋ ' + b.w + ') × ' + b.t + ' ÷ 2 ＝ ' + hText(a);
        } else {
          stem = zh ? '一個四角柱的底面是平行四邊形，<strong>底 ' + b.w + ' 公分、高 ' + b.t + ' 公分</strong>；柱體的<strong>高是 ' + d.h + ' 公分</strong>。它的體積是多少？'
                    : 'A four-sided prism has a parallelogram base: <strong>base ' + cm(b.w) + ', height ' + cm(b.t) + '</strong>; the prism is <strong>' + cm(d.h) + ' high</strong>. What is its volume?';
          calc = b.w + ' × ' + b.t + ' ＝ ' + hText(a);
        }
        var tailZh = b.shape === 'trap' ? '梯形的面積要除以 2，平行四邊形不用。' : '平行四邊形的面積是 底 × 高，不必除以 2。';
        var tailEn = b.shape === 'trap' ? ' A trapezium’s area is halved; a parallelogram’s is not.' : ' A parallelogram’s area is base × height, with no ÷ 2.';
        return {
          stem: stem,

          stem: lang === 'zh' ? '（五年級）一個長方體長 <strong>' + d.a + ' 公分</strong>、寬 <strong>' + d.b + ' 公分</strong>、高 <strong>' + d.h + ' 公分</strong>，它的體積是多少？'
                              : '(Grade five) A cuboid is <strong>' + cm(d.a) + '</strong> long, <strong>' + cm(d.b) + '</strong> wide and <strong>' + cm(d.h) + '</strong> high. What is its volume?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh' ? '一層有 ' + d.a + ' × ' + d.b + ' ＝ ' + layer + ' 塊，疊 ' + d.h + ' 層：' + layer + ' × ' + d.h + ' ＝ ' + v + '，單位是立方公分。那一層的 ' + layer + ' 就是長方體的底面積。'
                             : 'One layer holds ' + d.a + ' × ' + d.b + ' ＝ ' + layer + ' cubes and there are ' + d.h + ' layers: ' + layer + ' × ' + d.h + ' ＝ ' + v + ', in cubic centimetres. That layer of ' + layer + ' is the cuboid’s base area.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 柱體疊疊樂', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：柱體疊疊樂',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題六年級的圓面積與圓周長，和一題五年級的長方體體積。<br>這裡的柱體都是<strong>直柱體</strong>（側面和底面垂直），表面積只算底面是長方形、直角三角形或圓的柱體。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　圓面積與圓周長回六年級<a href="../circle/index.html">圓周率工作坊</a>　·　長方體的體積回五年級<a href="../../../grade-5/math/volume/index.html">體積積木塔</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Prism Stacking Game', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Prism Stacking Game',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>One of them is the grade-6 area and circumference of a circle, and one is a grade-5 cuboid volume.<br>Every prism and cylinder here is a <strong>right</strong> one (its sides stand straight up from the bases), and surface area is only asked for bases that are rectangles, right-angled triangles or circles.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　circles in <a href="../circle/index.html">the grade-6 pi lesson</a>　·　cuboid volume in <a href="../../../grade-5/math/volume/index.html">the grade-5 volume lesson</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
