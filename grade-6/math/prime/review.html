<style>

    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;

  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{

  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;

  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);word-break:break-word;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}

  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;
  }
  .result{margin-top:22px;background:var(--orange-soft);border-radius:18px;padding:18px;display:none}
  .result.on{display:block}
  .result .line{font-size:18px;font-weight:700}
  .result .links{margin-top:10px;font-size:15px}
  .result .links a{color:var(--blue)}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:15px}

<body>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null：tools/simgen.js 每一批只呼叫 make() 一次、不重試，
     回 null 之後檢查會直接 dereference null 而當掉。十一支產生器的抽樣不會失敗，直接建構；
     只有 productOfPrimes 真的會拒絕重抽（乘積超過 100／同一批重複），它給一組手算過的保底參數。 */
  function retry(fn, fallback){
    for (var i = 0; i < 400; i++){
      var d = fn();
      if (d) return d;
    }
    return fallback ? fallback() : null;
  }

  /* --- 這一課的數論工具（和 index.html 同一套定義）。100 以內。 --- */
  var LIMIT = 100;
  function isPrime(n){
    if (!isFinite(n) || n !== Math.floor(n) || n < 2) return false;
    for (var p = 2; p * p <= n; p++) if (n % p === 0) return false;
    return true;
  }
  function kindOf(n){ return n === 1 ? 'one' : (isPrime(n) ? 'prime' : 'composite'); }
  function factorsOf(n){
    var out = [];
    for (var i = 1; i <= n; i++) if (n % i === 0) out.push(i);
    return out;
  }
  function smallestPrimeFactor(n){
    if (!isFinite(n) || n !== Math.floor(n) || n < 2) return null;
    for (var p = 2; p <= n; p++) if (n % p === 0) return p;
    return null;
  }
  function factorize(n){
    var out = [], v = n;
    while (v > 1){ var p = smallestPrimeFactor(v); if (!p) break; out.push(p); v = v / p; }
    return out;
  }
  function productText(list){ return list.join(' × '); }
  function productOf(list){ return list.reduce(function(a, b){ return a * b; }, 1); }
  function gcd(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
  function pairsOf(n){
    var out = [];
    for (var a = 2; a * a <= n; a++) if (n % a === 0) out.push([a, n / a]);
    return out;
  }
  var PRIMES = rangeList(2, LIMIT).filter(isPrime);                      /* 25 個 */
  var COMPOSITES = rangeList(4, LIMIT).filter(function(n){ return !isPrime(n); });
  /* 「看起來像質數」的奇合數：不是偶數、個位不是 5，一眼看不出來 —— 這一課最值得練的誘答。 */
  var SNEAKY = COMPOSITES.filter(function(n){ return n % 2 === 1 && n % 5 !== 0; });   /* 9、21、27、33、39、49、51、57、63、69、77、81、87、91、93、99 */

  function listText(list, lang){ return list.join(lang === 'zh' ? '、' : ', '); }

  /* --- 整數選項：正解 ＋ 3 個誘答（framework §六之三 第 4 點）。
         avoid ＝ 題幹上印出來的數字，先當成已用過，候選與保底都不會再端出來；
         候選與保底都擋在 [1, max] 以內；擠到不夠時少回傳（simgen 的選項數檢查會響，不會卡死）。 --- */
  var MAX_OPT = 100;
  function makeWrongs(correct, candidates, avoid, max){
    var lim = (typeof max === 'number') ? max : MAX_OPT;
    var seen = {}, out = [];
    seen[String(correct)] = 1;
    (avoid || []).forEach(function(a){ seen[String(a)] = 1; });
    candidates.forEach(function(c){
      if (out.length >= 3) return;
      if (typeof c !== 'number' || !isFinite(c) || c !== Math.round(c)) return;
      if (c < 1 || c > lim || seen[String(c)]) return;
      seen[String(c)] = 1; out.push(c);
    });
    for (var step = 1; out.length < 3 && step <= lim; step++){
      var lo = correct - step, hi = correct + step;
      if (lo >= 1 && !seen[String(lo)] && out.length < 3){ seen[String(lo)] = 1; out.push(lo); }
      if (hi <= lim && !seen[String(hi)] && out.length < 3){ seen[String(hi)] = 1; out.push(hi); }
    }
    return out;
  }
  function numOpts(correct, candidates, avoid, max){
    var wrongs = makeWrongs(correct, candidates, avoid, max);
    var opts = shuffle([correct].concat(wrongs));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 字串選項（算式或整句話）：四個互不相同的字串，不夠就回 null 讓 make() 重抽。 */
  function strOpts(correct, cands){
    var out = [correct];
    cands.forEach(function(s){
      if (out.length >= 4 || !s) return;
      if (out.indexOf(s) >= 0) return;
      out.push(s);
    });
    return out.length === 4 ? shuffle(out) : null;
  }

  /* --- 「哪一句話是對的」的句庫。每一句的真假寫死在這裡（設定檔另有一份獨立的真值表）。 --- */
  var STATEMENTS = {
    twoEvenPrime:   { truth:true,  zh:'2 是唯一的偶數質數', en:'2 is the only even prime number' },
    oneNeither:     { truth:true,  zh:'1 既不是質數也不是合數', en:'1 is neither prime nor composite' },
    primeTwoFactors:{ truth:true,  zh:'質數剛好有 2 個因數', en:'A prime number has exactly 2 factors' },
    compThreePlus:  { truth:true,  zh:'合數至少有 3 個因數', en:'A composite number has at least 3 factors' },
    everyBig:       { truth:true,  zh:'比 1 大的整數，不是質數就是合數', en:'Every whole number bigger than 1 is either prime or composite' },
    allOddPrime:    { truth:false, zh:'所有的質數都是奇數', en:'Every prime number is odd' },
    oneIsPrime:     { truth:false, zh:'1 是最小的質數', en:'1 is the smallest prime number' },
    allOddArePrime: { truth:false, zh:'所有的奇數都是質數', en:'Every odd number is prime' },
    primeTimesPrime:{ truth:false, zh:'兩個質數相乘還是質數', en:'Two primes multiplied together give a prime' },
    nineIsPrime:    { truth:false, zh:'9 是質數', en:'9 is a prime number' },
    compFactorsComp:{ truth:false, zh:'合數的因數都是合數', en:'Every factor of a composite number is composite' }
  };
  var TRUE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return STATEMENTS[k].truth; });
  var FALSE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return !STATEMENTS[k].truth; });

  /* 「只有一個質因數在 2、3、5、7 裡」而且不是質數的數：試除只會被其中一個抓到。 */
  var TRIAL_PRIMES = [2, 3, 5, 7];
  var ONE_SMALL = rangeList(10, LIMIT).filter(function(n){
    return !isPrime(n) && TRIAL_PRIMES.filter(function(p){ return n % p === 0; }).length === 1;
  });
  /* 五年級「好朋友車站」的交錯題：兩個數的最大公因數（用列舉法就算得出來的小數字）。
     ⚠️ 每一組的最大公因數都是**合數**：這樣「第二大的公因數」才不會是 1（和誘答「1」撞在一起），
     而且最小公倍數都在 100 以內、不等於 a 或 b（它是「搞混成最小公倍數」那個誘答）。 */
  var GCF_PAIRS = [[12, 18], [8, 12], [24, 36], [16, 24], [18, 27], [20, 30], [12, 20], [18, 30], [12, 30], [28, 42], [30, 45], [8, 20]];

  var GENS = [
    /* 1. 四個數裡哪一個是質數。誘答全是「看起來像質數」的奇合數。 */
    { id:'whichPrime', cat:'prime',
      /* SNEAKY 有 16 個、PRIMES ≥ 11 有 21 個，抽樣不會失敗，所以直接建構，不包 retry（永遠不會響的
         拒絕條件不是守衛，是裝飾）。 */
      make:function(used){
        var p = pickUnused(PRIMES.filter(function(x){ return x >= 11; }), used);
        var cands = shuffle(SNEAKY.filter(function(x){ return x >= 9; })).slice(0, 3);
        var opts = shuffle([p].concat(cands));
        return { p:p, comps:cands, opts:opts, ans:opts.indexOf(p) };
      },
      fmt:function(d, lang){
        var how = d.comps.map(function(n){ return n + ' ＝ ' + smallestPrimeFactor(n) + ' × ' + (n / smallestPrimeFactor(n)); });
        var howEn = d.comps.map(function(n){ return n + ' = ' + smallestPrimeFactor(n) + ' × ' + (n / smallestPrimeFactor(n)); });
        return {
          stem: lang === 'zh'
            ? '下面四個數裡，<strong>只有一個是質數</strong>。是哪一個？'
            : 'Of these four numbers, <strong>exactly one is prime</strong>. Which?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? d.p + ' 試除 2、3、5、7 都不整除，因數只有 1 和 ' + d.p + '，是質數。其他三個都拆得開：' + how.join('、') + '，是合數。'
            : d.p + ' is not divisible by 2, 3, 5 or 7, so its only factors are 1 and ' + d.p + ' — prime. The other three all split: ' + howEn.join(', ') + ', so they are composite.'
        };
      } },

    /* 2. 四個數裡哪一個是合數（其他三個是質數）。 */
    { id:'whichComposite', cat:'prime',
      make:function(used){
        var c = pickUnused(SNEAKY.filter(function(x){ return x >= 21; }), used);
        var ps = shuffle(PRIMES.filter(function(x){ return x >= 11; })).slice(0, 3);
        var opts = shuffle([c].concat(ps));
        return { c:c, primes:ps, opts:opts, ans:opts.indexOf(c) };
      },
      fmt:function(d, lang){
        var p = smallestPrimeFactor(d.c);
        return {
          stem: lang === 'zh'
            ? '下面四個數裡，<strong>只有一個是合數</strong>。是哪一個？'
            : 'Of these four numbers, <strong>exactly one is composite</strong>. Which?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? d.c + ' ＝ ' + p + ' × ' + (d.c / p) + '，除了 1 和自己還有別的因數，是合數 —— 它是奇數、個位也不是 5，可是 ' + (p === 3 ? '各位數字相加是 3 的倍數' : '能被 ' + p + ' 整除') + '。' + listText(d.primes, 'zh') + ' 試除 2、3、5、7 都不整除，是質數。'
            : d.c + ' = ' + p + ' × ' + (d.c / p) + ', so it has a factor other than 1 and itself — composite. It is odd and does not end in 5, but ' + (p === 3 ? 'its digit sum is a multiple of 3' : 'it is divisible by ' + p) + '. ' + listText(d.primes, 'en') + ' are not divisible by 2, 3, 5 or 7, so they are prime.'
        };
      } },

    /* 3. n 是哪一種數（質數／合數／兩者都不是／兩者都是）。四句互斥的結論，剛好一句對。 */
    { id:'classifyKind', cat:'prime',
      make:function(used){
        var n = pickUnused(rangeList(1, 30), used);
        var kind = kindOf(n) === 'one' ? 'neither' : kindOf(n);
        var opts = shuffle(['prime', 'composite', 'neither', 'both']);
        return { n:n, kind:kind, opts:opts, ans:opts.indexOf(kind) };
      },
      fmt:function(d, lang){
        var T = lang === 'zh'
          ? { prime:'質數', composite:'合數', neither:'既不是質數也不是合數', both:'既是質數也是合數' }
          : { prime:'prime', composite:'composite', neither:'neither prime nor composite', both:'both prime and composite' };
        var fs = factorsOf(d.n);
        var whyZh = d.kind === 'neither' ? '1 的因數只有 1 個（就是 1 自己）：質數要剛好 2 個、合數要 3 個以上，所以它兩種都不是。'
          : d.kind === 'prime' ? d.n + ' 的因數只有 ' + listText(fs, 'zh') + '，剛好 2 個，所以是質數。'
          : d.n + ' 的因數有 ' + listText(fs, 'zh') + '，' + fs.length + ' 個（3 個以上），所以是合數。沒有任何數同時是質數又是合數。';
        var whyEn = d.kind === 'neither' ? '1 has only one factor (1 itself): a prime needs exactly 2 and a composite needs 3 or more, so 1 is neither.'
          : d.kind === 'prime' ? 'The factors of ' + d.n + ' are just ' + listText(fs, 'en') + ', exactly two, so it is prime.'
          : 'The factors of ' + d.n + ' are ' + listText(fs, 'en') + ', ' + fs.length + ' of them (three or more), so it is composite. No number is both prime and composite.';
        return {
          stem: lang === 'zh' ? '<strong>' + d.n + '</strong> 是哪一種數？' : 'What kind of number is <strong>' + d.n + '</strong>?',
          opts: d.opts.map(function(k){ return T[k]; }), ans:d.ans,
          why: lang === 'zh' ? whyZh : whyEn
        };
      } },

    /* 4. n 的質因數分解是哪一個。問的是**寫法**：誘答「還沒拆完」的值和正解一樣，那正是它錯的地方
          （framework §六之二 的合法例外：題幹問「哪一個是質因數分解」，值相等是設計）。 */
    { id:'primeFactorization', cat:'factorize',
      /* 每一個有 3 個以上質因數的 n ≤ 100，候選 (a)(b)(c) 去重、過 100 的上限之後都至少剩 3 個
         （逐一算過：最少的是 8、27、75、81、92、98、99，各剩 3），所以 strOpts 不會回 null，直接建構。 */
      make:function(used){
        {
          var n = pickUnused(COMPOSITES.filter(function(x){ return factorize(x).length >= 3; }), used);
          var atoms = factorize(n);
          var right = productText(atoms);
          var cands = [];
          /* (a) 第一刀就停：a × b，其中至少一個是合數 */
          pairsOf(n).forEach(function(p){ if (!(isPrime(p[0]) && isPrime(p[1]))) cands.push(p[0] + ' × ' + p[1]); });
          /* (b) 只拆了一刀：最小質因數 × 剩下的合數 */
          var rest = n / atoms[0];
          if (!isPrime(rest)) cands.push(atoms[0] + ' × ' + rest);
          /* (c) 全是質數可是值不對：少一個原子／最後一個原子換成下一個質數 */
          cands.push(productText(atoms.slice(0, -1)));
          /* 換掉最後一個原子的誘答：值不可以超過這一課的 100（98 ＝ 2 × 7 × 7 換成 2 × 7 × 11 是 154）。 */
          var nextP = PRIMES.filter(function(p){ return p > atoms[atoms.length - 1]; })[0];
          if (nextP && productOf(atoms.slice(0, -1)) * nextP <= LIMIT) cands.push(productText(atoms.slice(0, -1).concat([nextP])));
          var opts = strOpts(right, shuffle(cands));
          return { n:n, atoms:atoms, opts:opts, ans:opts.indexOf(right) };
        }
      },
      fmt:function(d, lang){
        var wrongs = d.opts.filter(function(o, i){ return i !== d.ans; });
        function explain(o){
          var parts = o.split(' × ').map(Number);
          var comp = parts.filter(function(x){ return !isPrime(x); });
          if (comp.length) return lang === 'zh' ? o + ' 裡的 ' + comp[0] + ' 是合數，還沒拆完' : 'in ' + o + ' the ' + comp[0] + ' is composite, so the splitting is not finished';
          return lang === 'zh' ? o + ' 乘起來是 ' + productOf(parts) + '，不是 ' + d.n : o + ' multiplies to ' + productOf(parts) + ', not ' + d.n;
        }
        return {
          stem: lang === 'zh'
            ? '哪一個是 <strong>' + d.n + '</strong> 的<strong>質因數分解</strong>？'

            : 'Every piece of a prime factorisation must be prime, and the pieces must multiply to exactly ' + d.n + ': ' + d.n + ' = ' + productText(d.atoms) + '. The others: ' + wrongs.map(explain).join('; ') + '.'

      } },

    /* 5. 幾個質數相乘是多少。誘答：相加、少乘一個、多乘一個 2。⚠️ 這一支是唯一真的會拒絕重抽的
          （乘積超過 100／同一批重複），其他十一支直接建構。 */
    { id:'productOfPrimes', cat:'factorize',
      make:function(used){
        return retry(function(){
          var k = pick([2, 3, 3]);
          var atoms = [];
          for (var i = 0; i < k; i++) atoms.push(pick([2, 2, 3, 3, 5, 7, 11]));
          atoms.sort(function(a, b){ return a - b; });
          var n = productOf(atoms);
          if (n > LIMIT || used.indexOf(n) >= 0) return null;
          used.push(n);
          var sum = atoms.reduce(function(a, b){ return a + b; }, 0);
          var o = numOpts(n, [sum, productOf(atoms.slice(0, -1)), n * 2, productOf(atoms.slice(1))], atoms);
          if (o.opts.length !== 4) return null;
          return { atoms:atoms, n:n, opts:o.opts, ans:o.ans };
        }, function(){
          var o = numOpts(30, [10, 6, 60, 15], [2, 3, 5]);
          return { atoms:[2, 3, 5], n:30, opts:o.opts, ans:o.ans };
        });
      },
      fmt:function(d, lang){

        return {
          stem: lang === 'zh'
            ? '<strong>' + productText(d.atoms) + '</strong> 是哪一個數的質因數分解？'
            : '<strong>' + productText(d.atoms) + '</strong> is the prime factorisation of which number?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '把原子乘回去：' + steps.join('，') + '，所以是 ' + d.n + '。質因數分解是相乘，不是相加。'
            : 'Multiply the atoms back: ' + steps.join(', ') + ', so the number is ' + d.n + '. A prime factorisation multiplies, it does not add.'
        };
      } },

    /* 6. n 最小的質因數。誘答**優先**用：最大的質因數（n ＝ 49 這種 p × p 的它等於正解，會被去掉）、
          1（不是質數）、最小的合數因數（49 沒有，會被跳過）、2p；不夠三個時 makeWrongs 補 ± 1 的鄰近值。 */
    { id:'smallestPrimeFactor', cat:'trial',
      make:function(used){
        var n = pickUnused(COMPOSITES.filter(function(x){ return x >= 10; }), used);
        var atoms = factorize(n), p = atoms[0], big = atoms[atoms.length - 1];
        var compF = factorsOf(n).filter(function(f){ return f > 1 && !isPrime(f) && f < n; })[0];
        var o = numOpts(p, [big, 1, compF, p * 2], [n]);
        return { n:n, p:p, atoms:atoms, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var tried = TRIAL_PRIMES.filter(function(q){ return q < d.p; });
        return {
          stem: lang === 'zh'
            ? '<strong>' + d.n + '</strong> 最小的<strong>質因數</strong>是多少？'

          opts: d.opts.map(String), ans:d.ans,

            : (tried.length ? listText(tried, 'en') + (tried.length === 1 ? ' does not divide ' : ' do not divide ') + d.n + '; ' : '') + d.n + ' ÷ ' + d.p + ' = ' + (d.n / d.p) + ' exactly, so the smallest prime factor is ' + d.p + ' (' + d.n + ' = ' + productText(d.atoms) + '). 1 is not prime, so it does not count as a prime factor.'
        };
      } },

    /* 7. 因數樹缺一片：n ＝ 已知的原子 × ?。誘答：± 1、另一個質數、n ÷ 那一片。 */
    { id:'missingAtom', cat:'factorize',
      make:function(used){
        var n = pickUnused(COMPOSITES.filter(function(x){ return factorize(x).length >= 2 && x >= 10; }), used);

    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
</body>
</html>
