<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:16px 20px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);word-break:break-word;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;
  }
  .result{margin-top:22px;background:var(--orange-soft);border-radius:18px;padding:18px;display:none}
  .result.on{display:block}
  .result .line{font-size:18px;font-weight:700}
  .result .links{margin-top:10px;font-size:15px}
  .result .links a{color:var(--blue)}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:15px}
</style>

<body>
<div class="wrap">

  <header>
    <h1 data-i18n="h1">🔁 複習挑戰：扇形披薩工廠</h1>
    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>
  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題六年級的整圓周長與面積，和一題四年級的角度。</div>

  <div id="quiz" class="quiz"></div>

    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* (半徑, 圓心角) 這種**物件**的池子要用 key 去重，不能直接比物件。 */
  function pickUnusedPair(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v.r + '@' + v.n) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v.r + '@' + v.n);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null：tools/simgen.js 每一批只呼叫 make() 一次、不重試。
     所有抽樣池都事先過濾好，抽到就一定做得出四個選項。 */

  /* --- 這一課的工具（和 index.html 同一套定義：所有量都用百分之一的整數存）。 --- */
  var PI_H = 314;          /* 圓周率 3.14 */
  var R_MAX = 12;          /* 半徑的上限（公分） */
  var FULL_DEG = 360;      /* 一圈 360 度 */
  var VAL_MAX = 200000;    /* 選項裡任何一個量的上限（百分之一）＝ 2000 */
  function hText(h){
    var w = Math.floor(h / 100), f = h % 100;
    if (f === 0) return String(w);
    if (f % 10 === 0) return w + '.' + (f / 10);
    return w + '.' + (f < 10 ? '0' + f : String(f));
  }
  function gcdInt(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
  function circH(r){ return 2 * r * PI_H; }
  function areaH(r){ return r * r * PI_H; }
  /* 弧長與扇形面積：除不盡就回 null（抽樣池已經先濾過，這裡是最後一道防線）。 */
  function arcH(r, n){
    var v = circH(r) * n;
    return v % FULL_DEG === 0 ? v / FULL_DEG : null;
  }
  function secAreaH(r, n){
    var v = areaH(r) * n;
    return v % FULL_DEG === 0 ? v / FULL_DEG : null;
  }
  function perimH(r, n){
    var a = arcH(r, n);
    return a === null ? null : a + 2 * r * 100;
  }
  /* 圓心角占整圈的最簡分數 */
  function fracOf(n){
    var g = gcdInt(n, FULL_DEG);
    return { p:n / g, q:FULL_DEG / g };
  }
  function fracKey(n){ var f = fracOf(n); return f.p + '/' + f.q; }

  /* --- 選項的編碼：`百分之一的值|單位代號`。單位代號 cm 公分、sq 平方公分、deg 度；
         分數是 `p/q|fr`（一律先約分，所以同一個值只有一種寫法）。
         這樣「9.42 公分」和「9.42 平方公分」是兩個不同的值，去重才擋得住。 --- */
  function tok(h, u){ return h + '|' + u; }
  function tokF(n){ return fracKey(n) + '|fr'; }
  function tokVal(t){ return Number(String(t).split('|')[0]); }
  function tokUnit(t){ return String(t).split('|')[1]; }
  function plEn(n, w){
    if (String(n) === '1') return n + ' ' + w;
    return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's');
  }
  var UNIT_WORD = { zh:{ cm:'公分', sq:'平方公分', deg:'度' }, en:{ cm:'centimetre', sq:'square centimetre', deg:'degree' } };
  function tokText(t, lang){
    var u = tokUnit(t);
    if (u === 'fr') return String(t).split('|')[0];
    var v = hText(tokVal(t));
    return lang === 'zh' ? v + ' ' + UNIT_WORD.zh[u] : plEn(v, UNIT_WORD.en[u]);
  }

  /* 從候選裡挑三個**值互不相同**、也和正解不同的誘答；候選不夠就用 fallbacks 補（同樣去重）。
     avoid 是「不可以出現的編碼」（例如抄題幹的數）。擠到不夠時少回傳（simgen 的選項數檢查會響，不會卡死）。
     ⚠️ 度數一律是**整數度**：0.5 度那種選項不在這一課的範圍裡。 */
  function pickWrongs(correct, cands, fallbacks, avoid){
    var seen = {}, shown = {}, out = [];
    seen[correct] = 1;
    /* ⚠️ 連**印出來的數字**都要去重，不能只比「數字＋單位」：`3.14 公分` 和 `3.14 平方公分`
       是兩個不同的量沒錯，可是排在一起讀起來像在玩文字遊戲。 */
    if (tokUnit(correct) !== 'fr') shown[hText(tokVal(correct))] = 1;
    (avoid || []).forEach(function(k){ seen[k] = 1; });
    cands.concat(fallbacks).forEach(function(c){
      if (out.length >= 3 || c === null || c === undefined) return;
      if (tokUnit(c) !== 'fr'){
        var v = tokVal(c);
        if (!isFinite(v) || v < 1 || v > VAL_MAX || v !== Math.floor(v)) return;
        if (tokUnit(c) === 'deg' && (v % 100 !== 0 || v > FULL_DEG * 100)) return;
        if (shown[hText(v)]) return;
      }
      if (seen[c]) return;
      seen[c] = 1;
      if (tokUnit(c) !== 'fr') shown[hText(tokVal(c))] = 1;
      out.push(c);
    });
    return out;
  }
  function optsOf(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 保底：值長得像答案的鄰居（同一個單位，± 一個圓周率、加倍、加 1） */
  function nearFallbacks(h, u){
    var out = [tok(h + PI_H, u), tok(h - PI_H, u), tok(2 * h, u), tok(h + 100, u), tok(h + 2 * PI_H, u)];
    if (h % 2 === 0) out.push(tok(h / 2, u));
    return out;
  }
  /* 角度的保底：一律是 1 ~ 359 的整數度 */
  function degFallbacks(n){
    var out = [], cand = [n + 15, n - 15, n + 30, n - 30, n + 45, n - 45], i;
    for (i = 0; i < cand.length; i++) if (cand[i] >= 1 && cand[i] < FULL_DEG) out.push(tok(cand[i] * 100, 'deg'));
    return out;
  }

  /* --- 抽樣池 --- */
  /* 這一課用得到的十個圓心角（和 index.html 同一份）。 */
  var POOL_ANG = [30, 45, 60, 90, 120, 135, 180, 240, 270, 300];
  /* (半徑, 圓心角) 的合法對：弧長與扇形面積都要**除得盡**。
     （「弧長剛好等於兩條半徑」會讓誘答和正解撞在一起，不過這一課的十個角一個都做不到，
       設定檔那邊是**證明它不會發生**，不是在這裡過濾。） */
  /* ⚠️ 半徑 2 要排除：2 × 2 ＝ 2 ＋ 2，所以弧長和扇形面積**永遠**是同一個數字，
     「答成面積」那個誘答就只剩單位不一樣（六年級「圓周率工作坊」為了同一件事也排除半徑 2）。 */
  var PAIRS = [];
  (function(){
    for (var r = 1; r <= R_MAX; r++){
      if (r === 2) continue;
      for (var i = 0; i < POOL_ANG.length; i++){
        var n = POOL_ANG[i], a = arcH(r, n), s = secAreaH(r, n);
        if (a === null || s === null) continue;
        PAIRS.push({ r:r, n:n });
      }
    }
  })();
  /* 交錯題（六年級「圓周率工作坊」）的半徑：整圓的圓周長與面積不可以是同一個數（半徑 2 就是）。 */
  var POOL_R_WHOLE = [];
  (function(){ for (var r = 3; r <= R_MAX; r++) POOL_R_WHOLE.push(r); })();

  /* --- 應用題的情境。arc 只走彎的那一段、area 把裡面填滿。 --- */
  var SCEN = {
    zh: {
      fan:   { what:'扇形的扇子', ask:'只在<strong>彎的那一段邊</strong>縫一條緞帶，緞帶至少要多長？' },
      crust: { what:'扇形的披薩', ask:'<strong>彎的那一段餅皮邊</strong>有多長？' },
      window:{ what:'扇形的窗戶', ask:'只在<strong>彎的那一段邊</strong>貼一條膠條，膠條至少要多長？' },
      lawn:  { what:'扇形的草地', ask:'<strong>整片</strong>都要鋪滿草皮，需要多少草皮？' },
      cheese:{ what:'扇形的披薩', ask:'<strong>整片表面</strong>都要鋪滿起司，要鋪多大一片？' },
      sign:  { what:'扇形的招牌', ask:'<strong>整面</strong>都要塗上油漆，要塗多大一片？' }
    },
    en: {
      fan:   { what:'a fan', ask:'A ribbon is sewn along the <strong>curved edge only</strong>. How long does the ribbon have to be?' },
      crust: { what:'a slice of pizza', ask:'How long is the <strong>curved crust</strong>?' },
      window:{ what:'a window', ask:'A strip of tape is stuck along the <strong>curved edge only</strong>. How long does the tape have to be?' },
      lawn:  { what:'a patch of lawn', ask:'The <strong>whole patch</strong> is to be covered with turf. How much turf is needed?' },
      cheese:{ what:'a slice of pizza', ask:'The <strong>whole top</strong> is to be covered with cheese. How large a patch is that?' },
      sign:  { what:'a sign', ask:'The <strong>whole face</strong> is to be painted. How large a patch is that?' }
    }
  };
  var ARC_IDS = ['fan', 'crust', 'window'];
  var AREA_IDS = ['lawn', 'cheese', 'sign'];

  /* --- 「哪一個問題要算面積」的句庫：三句問長度（弧長或周長），一句問面積。 --- */
  var ASKS = {
    len: {
      fence:  { zh:'扇形花圃要沿著整圈邊緣圍一圈籬笆，籬笆要多長', en:'How long a fence goes right round the edge of a sector flower bed' },
      trim:   { zh:'扇形旗子要沿著整圈邊緣縫一條滾邊，滾邊要多長', en:'How long a trim is sewn right round the edge of a sector flag' },
      crustQ: { zh:'扇形披薩彎的那一段餅皮邊有多長', en:'How long the curved crust of a slice of pizza is' },
      tape:   { zh:'扇形窗戶彎的那一段邊要貼多長的膠條', en:'How long a strip of tape covers the curved edge of a sector window' }
    },
    area: {
      turf:   { zh:'扇形草地整片要鋪多少草皮', en:'How much turf covers the whole of a sector lawn' },
      paint:  { zh:'扇形招牌整面要塗多大一片油漆', en:'How large a patch of paint covers the whole face of a sector sign' },
      cloth:  { zh:'扇形桌巾整片要用多少布', en:'How much cloth a whole sector tablecloth takes' },
      cheeseQ:{ zh:'扇形披薩整片表面要鋪多大一片起司', en:'How large a patch of cheese covers the whole top of a slice of pizza' }
    }
  };
  var ASK_LEN_KEYS = Object.keys(ASKS.len);
  var ASK_AREA_KEYS = Object.keys(ASKS.area);

  /* --- 「哪一句話是對的」的句庫。每一句的真假寫死在這裡（設定檔另有一份獨立的真值表）。 --- */
  var STATEMENTS = {
    arcRule:     { truth:true,  zh:'弧長 ＝ 圓周長 × 圓心角 ÷ 360', en:'Arc length ＝ circumference × angle ÷ 360' },
    areaRule:    { truth:true,  zh:'扇形面積 ＝ 圓面積 × 圓心角 ÷ 360', en:'Sector area ＝ circle area × angle ÷ 360' },
    perimRule:   { truth:true,  zh:'扇形的周長 ＝ 弧長 ＋ 半徑 × 2', en:'Perimeter of a sector ＝ arc length ＋ radius × 2' },
    shareRule:   { truth:true,  zh:'圓心角占 360 度的幾分之幾，扇形就占整個圓的幾分之幾', en:'The share the angle takes of 360 degrees is the share the sector takes of the circle' },
    sameFrac:    { truth:true,  zh:'同一個扇形，算弧長和算面積用的是同一個分數', en:'For one sector, the arc and the area use the same fraction' },
    halfDisc:    { truth:true,  zh:'半圓的周長是那一段弧再加上直徑', en:'A half circle’s perimeter is its arc plus the diameter' },
    perimIsArc:  { truth:false, zh:'扇形的周長 ＝ 弧長', en:'Perimeter of a sector ＝ arc length' },
    flipped:     { truth:false, zh:'扇形占整個圓的幾分之幾，要用 360 除以圓心角', en:'The share a sector takes of the circle is 360 divided by the angle' },
    arcUnitSq:   { truth:false, zh:'弧長的單位是平方公分', en:'An arc length is measured in square centimetres' },
    halfPerim:   { truth:false, zh:'半圓的周長是圓周長的一半', en:'A half circle’s perimeter is half the circumference' },
    diameterIn:  { truth:false, zh:'算扇形面積的時候，可以把直徑當成半徑代進「半徑 × 半徑 × 3.14」', en:'For a sector’s area, the diameter can be used as the radius in “radius × radius × 3.14”' },
    angleTimes:  { truth:false, zh:'圓心角變成 2 倍，扇形面積會變成 4 倍', en:'Doubling the angle makes the sector’s area 4 times as big' }
  };
  var TRUE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return STATEMENTS[k].truth; });
  var FALSE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return !STATEMENTS[k].truth; });

  var GENS = [
    /* 1. 圓心角占整個圓的幾分之幾。誘答：別的圓心角的分數（十個分數兩兩不同）。 */
    { id:'fracOfCircle', cat:'frac',
      make:function(used){
        var n = pickUnused(POOL_ANG.slice(), used);
        var correct = tokF(n);
        var others = shuffle(POOL_ANG.filter(function(v){ return v !== n; }));
        var cands = others.slice(0, 3).map(function(v){ return tokF(v); });
        var wrongs = pickWrongs(correct, cands, others.slice(3).map(function(v){ return tokF(v); }), []);
        var o = optsOf(correct, wrongs);
        return { n:n, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var f = fracOf(d.n), g = gcdInt(d.n, FULL_DEG);
        return {
          stem: lang === 'zh' ? '一個扇形的<strong>圓心角</strong>是 <strong>' + d.n + ' 度</strong>，它是整個圓的幾分之幾？'
                              : 'A sector has an <strong>angle of ' + d.n + ' degrees</strong> at the centre. What share of the whole circle is it?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh'
            ? '整圈是 360 度，所以這一片占 ' + d.n + ' ÷ 360。上下同時除以 ' + g + '：' + d.n + ' ÷ ' + g + ' ＝ ' + f.p + '，360 ÷ ' + g + ' ＝ ' + f.q + '，約分之後是 ' + f.p + '/' + f.q + ' —— 整個圓剪成 ' + f.q + ' 份，這一片是其中的 ' + f.p + ' 份。'

    { id:'interCircle', cat:'inter',
      make:function(used){
        var r = pickUnused(POOL_R_WHOLE.slice(), used), wantArea = rand(2) === 0;
        var correct = wantArea ? tok(areaH(r), 'sq') : tok(circH(r), 'cm');
        var cands = wantArea
          ? [tok(circH(r), 'cm'), tok(r * PI_H, 'sq'), tok(4 * areaH(r), 'sq')]
          : [tok(areaH(r), 'sq'), tok(r * PI_H, 'cm'), tok(2 * circH(r), 'cm')];
        var wrongs = pickWrongs(correct, cands, nearFallbacks(tokVal(correct), wantArea ? 'sq' : 'cm'),
          [tok(r * 100, wantArea ? 'sq' : 'cm')]);
        var o = optsOf(correct, wrongs);
        return { r:r, wantArea:wantArea, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        if (d.wantArea) return {
          stem: lang === 'zh' ? '（六年級）一個<strong>整圓</strong>的半徑是 <strong>' + d.r + ' 公分</strong>，它的<strong>面積</strong>是多少？'
                              : '(Grade six) A <strong>whole circle</strong> has a radius of <strong>' + plEn(d.r, 'centimetre') + '</strong>. What is its <strong>area</strong>?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh' ? '整圓的面積是 半徑 × 半徑 × 3.14：' + d.r + ' × ' + d.r + ' × 3.14 ＝ ' + hText(areaH(d.r)) + '，單位是平方公分。這一題沒有圓心角，不必乘任何分數。'
                             : 'A whole circle’s area is radius × radius × 3.14: ' + d.r + ' × ' + d.r + ' × 3.14 ＝ ' + hText(areaH(d.r)) + ', in square centimetres. There is no angle here, so no fraction is needed.'
        };
        return {
          stem: lang === 'zh' ? '（六年級）一個<strong>整圓</strong>的半徑是 <strong>' + d.r + ' 公分</strong>，它的<strong>圓周長</strong>是多少？'
                              : '(Grade six) A <strong>whole circle</strong> has a radius of <strong>' + plEn(d.r, 'centimetre') + '</strong>. What is its <strong>circumference</strong>?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh' ? '整圓的圓周長是 半徑 × 2 × 3.14：' + d.r + ' × 2 × 3.14 ＝ ' + hText(circH(d.r)) + '，單位是公分。這一題沒有圓心角，不必乘任何分數。'
                             : 'A whole circle’s circumference is radius × 2 × 3.14: ' + d.r + ' × 2 × 3.14 ＝ ' + hText(circH(d.r)) + ', in centimetres. There is no angle here, so no fraction is needed.'
        };
      } },

    /* 12. 交錯題（四年級「角度測量站」）：一圈是 360 度，剩下的那一片是幾度。 */
    { id:'interAngle', cat:'inter',
      make:function(used){
        var n = pickUnused(POOL_ANG.slice(), used);
        var rest = FULL_DEG - n;
        var correct = tok(rest * 100, 'deg');
        /* 候選：把平角當一圈、切走兩片、剩下的一半。不合法（≤ 0 或不是整數度）的會被 pickWrongs 濾掉。 */
        var cands = [tok((180 - n) * 100, 'deg'), tok((FULL_DEG - 2 * n) * 100, 'deg'), tok((rest / 2) * 100, 'deg')];
        var wrongs = pickWrongs(correct, cands, degFallbacks(rest), [tok(n * 100, 'deg')]);
        var o = optsOf(correct, wrongs);
        return { n:n, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var rest = FULL_DEG - d.n;
        return {
          stem: lang === 'zh' ? '（四年級）一塊圓形蛋糕切走一片，切走的那一片<strong>圓心角</strong>是 <strong>' + d.n + ' 度</strong>。<strong>剩下</strong>的那一片圓心角是幾度？'
                              : '(Grade four) One slice is cut from a round cake, and that slice’s <strong>angle at the centre</strong> is <strong>' + d.n + ' degrees</strong>. What is the angle of the piece <strong>left over</strong>?',
          opts: d.opts.map(function(t){ return tokText(t, lang); }), ans:d.ans,
          why: lang === 'zh' ? '繞圓心一圈是 360 度，切走 ' + d.n + ' 度，剩下的就是 360 － ' + d.n + ' ＝ ' + rest + '，答案是 ' + rest + ' 度。'
                             : 'A full turn round the centre is 360 degrees and ' + d.n + ' were cut away, so what is left is 360 － ' + d.n + ' ＝ ' + rest + ' degrees.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 扇形披薩工廠', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：扇形披薩工廠',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題六年級的整圓周長與面積，和一題四年級的角度。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　整圓的周長與面積回<a href="../circle/index.html">圓周率工作坊</a>　·　圓心角占幾分之幾回五年級<a href="../../../grade-5/math/polygon/index.html">多邊形轉轉盤</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Sector Pizza Workshop', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Sector Pizza Workshop',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>One of them is the grade-6 circumference and area of a whole circle, and one is a grade-4 angle.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　whole circles in <a href="../circle/index.html">the pi lesson</a>　·　what share an angle takes in <a href="../../../grade-5/math/polygon/index.html">the grade-5 polygon lesson</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
