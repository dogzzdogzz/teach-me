<style>

    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;

  .quiz{display:grid;gap:18px;margin-top:20px}

    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;

  }

  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);word-break:break-word;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}

  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;
  }
  .result{margin-top:22px;background:var(--orange-soft);border-radius:18px;padding:18px;display:none}
  .result.on{display:block}
  .result .line{font-size:18px;font-weight:700}
  .result .links{margin-top:10px;font-size:15px}
  .result .links a{color:var(--blue)}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:15px}

<body>
<div class="wrap">

    <h1 data-i18n="h1">🔁 複習挑戰：倒數翻轉機</h1>
    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>
  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題五年級的分數乘法，和一題五年級的「分數除以整數」。</div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null：tools/simgen.js 每一批只呼叫 make() 一次、不重試。
     十二支產生器的抽樣池都事先過濾好（見下面的 POOL_*），抽到就一定做得出四個選項，
     所以全部直接建構，沒有 retry —— 永遠不會響的拒絕條件不是守衛，是裝飾。 */

  /* --- 這一課的工具（和 index.html 同一套定義）。 --- */
  var LIMIT = 12;        /* 分子、分母的上限 */
  var OPT_LIMIT = 144;   /* 選項裡任何一個分子或分母的上限（12 × 12） */
  function gcd(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
  function simplify(x){ var g = gcd(x.n, x.d); return { n:x.n / g, d:x.d / g }; }
  function rawText(x){ return x.d === 1 ? String(x.n) : x.n + '/' + x.d; }
  function fracText(x){ return rawText(simplify(x)); }
  function recip(x){ return { n:x.d, d:x.n }; }
  function mul(x, y){ return simplify({ n:x.n * y.n, d:x.d * y.d }); }
  function div(x, y){ return mul(x, recip(y)); }
  function cmp(x, y){ var l = x.n * y.d, r = y.n * x.d; return l === r ? 0 : (l > r ? 1 : -1); }
  var ONE = { n:1, d:1 };
  function quotientSide(y){ return -cmp(y, ONE); }

  /* --- 選項的「值」：分數與整數一律化成最簡分數當鍵（3/6 和 1/2 是同一個值）。 --- */
  function parseFrac(s){
    var m = /^(\d+)(?:\/(\d+))?$/.exec(String(s).trim());
    return m ? { n:Number(m[1]), d:m[2] === undefined ? 1 : Number(m[2]) } : null;
  }
  function valueKey(s){
    var f = parseFrac(s);
    if (f && f.d > 0) return 'v:' + rawText(simplify(f));
    return 'raw:' + String(s).replace(/\s+/g, '');
  }
  /* 從候選裡挑三個**值互不相同**、也和正解不同的誘答；候選不夠就用 fallbacks 補（同樣值去重）。
     avoidKeys 是「不可以出現的值」（例如抄題幹的數）。擠到不夠時少回傳（simgen 的選項數檢查會響，不會卡死）。 */
  function pickWrongs(correct, cands, fallbacks, avoidKeys){
    var seen = {}, out = [];
    seen[valueKey(correct)] = 1;
    (avoidKeys || []).forEach(function(k){ seen[k] = 1; });
    cands.concat(fallbacks).forEach(function(c){
      if (out.length >= 3 || c === null || c === undefined) return;
      var f = parseFrac(c);
      if (!f || f.d < 1 || f.n < 1 || f.n > OPT_LIMIT || f.d > OPT_LIMIT) return;
      var k = valueKey(c);
      if (seen[k]) return;
      seen[k] = 1; out.push(c);
    });
    return out;
  }
  function optsOf(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts:opts, ans:opts.indexOf(correct) };
  }
  /* 分數的保底：值長得像答案的鄰居（分子或分母 ±1、加倍、減半） */
  function fracFallbacks(x){
    var s = simplify(x);
    return [fracText({ n:s.n + 1, d:s.d }), fracText({ n:s.n, d:s.d + 1 }), fracText({ n:s.n + 2, d:s.d }),
            fracText({ n:2 * s.n, d:s.d }), fracText({ n:s.n, d:2 * s.d }), fracText({ n:s.n + 1, d:s.d + 1 })];
  }
  /* 把題幹上印出來的數（整數或分數）變成不可以出現的值 */
  function avoidOf(list){ return list.map(function(v){ return typeof v === 'object' ? valueKey(rawText(v)) : valueKey(String(v)); }); }

  /* --- 抽樣池 --- */
  var FRACS = [];                 /* 1 ~ 12 的最簡真分數與假分數（不含整數，不含 1） */
  (function(){ for (var n = 1; n <= LIMIT; n++) for (var d = 2; d <= LIMIT; d++) if (n !== d && gcd(n, d) === 1) FRACS.push(n + '/' + d); })();
  function fracOf(key){ var p = key.split('/'); return { n:Number(p[0]), d:Number(p[1]) }; }
  var POOL_UNIT = [];             /* 單位分數 1/k，k 是 2 ~ 8 */
  (function(){ for (var k = 2; k <= 8; k++) POOL_UNIT.push('1/' + k); })();
  var POOL_SMALL = FRACS.filter(function(s){ var f = fracOf(s); return f.n <= 6 && f.d <= 6; });          /* 兩邊都小，乘起來不會爆 */
  var POOL_PROPER = FRACS.filter(function(s){ var f = fracOf(s); return f.n < f.d && f.d <= 9; });        /* 真分數 */
  /* 文字題要整數的答案：m ÷ (n/d) 是整數 ⇔ n 整除 m。分子 ≤ 6（或 ≤ 9）就保證抽得到這樣的 m，不必留一條永遠不會走的保底。 */
  var POOL_COUNT = POOL_PROPER.filter(function(s){ return fracOf(s).n <= 6; });
  var POOL_UNITQ = POOL_PROPER.filter(function(s){ return fracOf(s).n <= 9; });
  var POOL_ANY = FRACS.filter(function(s){ var f = fracOf(s); return f.n <= 9 && f.d <= 9; });            /* 一般的分數 */
  /* 比大小那一支的除數池**要含 1**：不然「商和被除數一樣大」永遠是誘答，除數剛好等於 1 的那個邊界也從來沒被出過題。 */
  var POOL_DIVISOR = POOL_ANY.concat(['1/1']);

  /* --- 「哪一句話是對的」的句庫。每一句的真假寫死在這裡（設定檔另有一份獨立的真值表）。 --- */
  var STATEMENTS = {
    flipDivisor:      { truth:true,  zh:'除以一個不是 0 的分數，等於乘以它的倒數', en:'Dividing by a non-zero fraction is multiplying by its reciprocal' },
    recipProductOne:  { truth:true,  zh:'兩個數相乘等於 1，它們就互為倒數', en:'Two numbers whose product is 1 are reciprocals of each other' },
    divisorBelowOne:  { truth:true,  zh:'被除數比 0 大時，除數比 1 小，商就比被除數大', en:'With a dividend above 0, a divisor below 1 makes the quotient bigger than the dividend' },
    divisorOne:       { truth:true,  zh:'除以 1，商和被除數一樣', en:'Dividing by 1 leaves the quotient equal to the dividend' },
    sameDenNumerator: { truth:true,  zh:'兩個分數通分成同一個分母之後，分子相除就是商', en:'Once two fractions share a denominator, dividing the numerators gives the quotient' },
    wholeOverOne:     { truth:true,  zh:'整數 n 可以寫成 n/1，倒數是 1/n（n 不是 0）', en:'A whole number n can be written as n/1, with reciprocal 1/n (n not 0)' },
    quotientSmaller:  { truth:false, zh:'除法算出來的商一定比被除數小', en:'A quotient is always smaller than the dividend' },
    recipBigger:      { truth:false, zh:'一個分數的倒數一定比它大', en:'The reciprocal of a fraction is always bigger than the fraction' },
    flipDividend:     { truth:false, zh:'除以分數要把被除數翻過來再相乘', en:'To divide by a fraction you flip the dividend and multiply' },
    flipBoth:         { truth:false, zh:'除以分數要把兩個分數都翻過來再相乘', en:'To divide by a fraction you flip both fractions and multiply' },
    zeroRecip:        { truth:false, zh:'0 的倒數是 0', en:'The reciprocal of 0 is 0' },
    needCommonDen:    { truth:false, zh:'分數除法一定要先通分才算得出來', en:'Fraction division only works if you find a common denominator first' }
  };
  var TRUE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return STATEMENTS[k].truth; });
  var FALSE_KEYS = Object.keys(STATEMENTS).filter(function(k){ return !STATEMENTS[k].truth; });

  /* --- 應用題的情境（兩種讀法各兩個）。 --- */
  var SCEN = {
    zh: {
      ribbon: { tu:'公尺', pu:'公尺', ans:'段' },
      juice:  { tu:'公升', pu:'公升', ans:'瓶' },
      rope:   { tu:'公尺', pu:'公尺', ans:'條' },
      paint:  { tu:'平方公尺', pu:'公升', ans:'平方公尺' },
      sugar:  { tu:'元', pu:'公斤', ans:'元' },
      walk:   { tu:'公里', pu:'小時', ans:'公里' }
    },
    en: {
      ribbon: { tu:'metre', pu:'metre', ans:'piece' },
      juice:  { tu:'litre', pu:'litre', ans:'bottle' },
      rope:   { tu:'metre', pu:'metre', ans:'length' },
      paint:  { tu:'square metre', pu:'litre', ans:'square metre' },
      sugar:  { tu:'dollar', pu:'kilogram', ans:'dollar' },
      walk:   { tu:'kilometre', pu:'hour', ans:'kilometre' }
    }
  };
  var COUNT_IDS = ['ribbon', 'juice', 'rope'];
  var UNIT_IDS = ['paint', 'sugar', 'walk'];
  function plEn(n, w){ if (n === 1) return n + ' ' + w; return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's'); }
  /* 「4 段」／「4 pieces」：答案帶單位（英文的 1 要單數；分數當數量時英文一律用複數形） */
  function ansText(lang, id, t){
    var u = SCEN[lang][id].ans;
    if (lang === 'zh') return t + ' ' + u;
    return t === '1' ? '1 ' + u : t + ' ' + u + (/(s|x|z|ch|sh)$/.test(u) ? 'es' : 's');
  }
  /* 「3 公尺」／「3 metres」：題幹裡的量帶單位 */
  function amtText(lang, unit, x){
    var t = rawText(x);
    if (lang === 'zh') return t + ' ' + unit;
    return t === '1' ? '1 ' + unit : t + ' ' + unit + (/(s|x|z|ch|sh)$/.test(unit) ? 'es' : 's');
  }

  var GENS = [
    /* 1. 包含除：整數 a ÷ 單位分數 1/k ＝ a × k。誘答：相乘 a/k、倒過來 1/(ak)、a ＋ k。 */
    { id:'containsUnit', cat:'contains',
      make:function(used){
        var y = fracOf(pickUnused(POOL_UNIT.slice(), used)), a = 2 + rand(5);   /* a 是 2 ~ 6 */
        var x = { n:a, d:1 }, q = div(x, y);
        var cands = [fracText({ n:a, d:y.d }), fracText({ n:1, d:a * y.d }), String(a + y.d)];
        var wrongs = pickWrongs(fracText(q), cands, fracFallbacks(q), avoidOf([a, y.d]));
        var o = optsOf(fracText(q), wrongs);
        return { a:a, k:y.d, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var y = { n:1, d:d.k }, x = { n:d.a, d:1 }, q = div(x, y);
        return {
          stem: lang === 'zh' ? '<strong>' + d.a + '</strong> 裡面有幾個 <strong>' + rawText(y) + '</strong>？'
                              : 'How many groups of <strong>' + rawText(y) + '</strong> are there inside <strong>' + d.a + '</strong>?',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '1 裡面有 ' + d.k + ' 個 ' + rawText(y) + '，' + d.a + ' 裡面就有 ' + d.a + ' × ' + d.k + ' ＝ ' + fracText(q) + ' 個，所以 ' + d.a + ' ÷ ' + rawText(y) + ' ＝ ' + fracText(q) + '。把兩個數相乘、或是倒過來算 ' + rawText(y) + ' ÷ ' + d.a + '，都不是這一題在問的。'
            : 'There are ' + d.k + ' groups of ' + rawText(y) + ' in 1, so ' + d.a + ' holds ' + d.a + ' × ' + d.k + ' = ' + fracText(q) + ' of them, and ' + d.a + ' ÷ ' + rawText(y) + ' = ' + fracText(q) + '. Multiplying the two numbers, or dividing the wrong way round as ' + rawText(y) + ' ÷ ' + d.a + ', is not what the question asks.'
        };
      } },

    /* 2. 倒數：n/d → d/n。誘答：沒翻、1/n、n/1。 */
    { id:'reciprocal', cat:'recip',
      make:function(used){
        var x = fracOf(pickUnused(POOL_ANY.slice(), used)), r = recip(x);
        var cands = [rawText(x), fracText({ n:1, d:x.n }), fracText({ n:x.n * x.n, d:x.d * x.d })];
        var wrongs = pickWrongs(rawText(r), cands, fracFallbacks(r), []);
        var o = optsOf(rawText(r), wrongs);
        return { n:x.n, d:x.d, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var x = { n:d.n, d:d.d }, r = recip(x);
        return {
          stem: lang === 'zh' ? '<strong>' + rawText(x) + '</strong> 的<strong>倒數</strong>是多少？' : 'What is the <strong>reciprocal</strong> of <strong>' + rawText(x) + '</strong>?',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '倒數就是把分子和分母對調：' + rawText(x) + ' 的倒數是 ' + rawText(r) + '。檢查一下：' + rawText(x) + ' × ' + rawText(r) + ' ＝ ' + (x.n * r.n) + '/' + (x.d * r.d) + ' ＝ 1，相乘等於 1 就對了。'
            : 'A reciprocal swaps the numerator and the denominator, so the reciprocal of ' + rawText(x) + ' is ' + rawText(r) + '. Check it: ' + rawText(x) + ' × ' + rawText(r) + ' = ' + (x.n * r.n) + '/' + (x.d * r.d) + ' = 1, a product of exactly 1.'
        };
      } },

    /* 3. 分數 ÷ 分數。誘答：直接相乘、倒過來除、兩個都翻。 */
    { id:'divFrac', cat:'divide',
      make:function(used){
        var x = fracOf(pickUnused(POOL_SMALL.slice(), used));
        /* ⚠️ 除數不可以等於被除數：那時候商是 1，而「倒過來除」也是 1，
           解釋裡「倒過來除算出來不是它」那一句就變成假的。 */
        var y = fracOf(pick(POOL_SMALL.filter(function(t){ var f = fracOf(t); return !(f.n === x.n && f.d === x.d); })));
        var q = div(x, y);
        var cands = [fracText(mul(x, y)), fracText(div(y, x)), fracText(mul(recip(x), recip(y)))];
        var wrongs = pickWrongs(fracText(q), cands, fracFallbacks(q), []);
        var o = optsOf(fracText(q), wrongs);
        return { xn:x.n, xd:x.d, yn:y.n, yd:y.d, opts:o.opts, ans:o.ans };
      },
      fmt:function(d, lang){
        var x = { n:d.xn, d:d.xd }, y = { n:d.yn, d:d.yd }, r = recip(y), q = div(x, y);
        return {
          stem: lang === 'zh' ? '<strong>' + rawText(x) + ' ÷ ' + rawText(y) + '</strong> 是多少？（寫成最簡分數）' : 'What is <strong>' + rawText(x) + ' ÷ ' + rawText(y) + '</strong>? (simplest form)',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'

      },
      fmt:function(d, lang){
        var x = { n:d.xn, d:d.xd }, q = div(x, { n:d.k, d:1 });
        return {
          stem: lang === 'zh' ? '（五年級）<strong>' + rawText(x) + ' ÷ ' + d.k + '</strong> 是多少？（寫成最簡分數）' : '(Grade five) What is <strong>' + rawText(x) + ' ÷ ' + d.k + '</strong>? (simplest form)',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '除以整數 ' + d.k + ' 就是乘以它的倒數 1/' + d.k + '：' + rawText(x) + ' × 1/' + d.k + '。還沒約分前分子不變、分母變成 ' + x.d + ' × ' + d.k + ' ＝ ' + (x.d * d.k) + '，也就是 ' + (x.n) + '/' + (x.d * d.k) + '，再約成最簡是 ' + fracText(q) + '。除數 ' + d.k + ' 比 1 大，所以商比 ' + rawText(x) + ' 小。'
            : 'Dividing by the whole number ' + d.k + ' means multiplying by its reciprocal 1/' + d.k + ': ' + rawText(x) + ' × 1/' + d.k + '. Before simplifying, the numerator stays and the denominator becomes ' + x.d + ' × ' + d.k + ' = ' + (x.d * d.k) + ', that is ' + (x.n) + '/' + (x.d * d.k) + ', which simplifies to ' + fracText(q) + '. The divisor ' + d.k + ' is above 1, so the quotient is smaller than ' + rawText(x) + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 倒數翻轉機', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：倒數翻轉機',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾一題五年級的分數乘法，和一題五年級的「分數除以整數」。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　分數乘法回五年級<a href="../../../grade-5/math/fraction-multiply/index.html">分數乘法</a>　·　分數除以整數回五年級<a href="../../../grade-5/math/fraction-divide/index.html">分數大平分</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Flip-It Divider', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Flip-It Divider',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>One of them is grade-5 fraction multiplication, and one is the grade-5 “fraction divided by a whole number”.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　fraction multiplication in <a href="../../../grade-5/math/fraction-multiply/index.html">the grade-5 lesson</a>　·　dividing a fraction by a whole number in <a href="../../../grade-5/math/fraction-divide/index.html">the grade-5 lesson</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
