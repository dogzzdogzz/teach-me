<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>teach-me — 互動數學教室</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --blue:#3B7DD8; --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(32px,7vw,48px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:10px;font-size:18px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:20px;
    padding:20px 26px;margin:28px 0 40px;font-size:18px;text-align:center;
  }
  h2{font-size:22px;margin:36px 0 6px}
  .lessons{display:grid;gap:16px;margin-top:16px}
  a.lesson{
    display:flex;align-items:center;gap:18px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:20px 22px;box-shadow:0 4px 14px rgba(70,60,40,.06);
    transition:transform .12s, box-shadow .12s;
  }
  a.lesson:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(70,60,40,.10)}
  .badge{font-size:38px;line-height:1}
  .lesson h3{font-size:19px}
  .lesson p{font-size:15px;color:var(--muted)}
  .tag{
    margin-left:auto;flex-shrink:0;background:var(--orange-soft);color:var(--orange);
    font-size:13px;font-weight:700;border-radius:999px;padding:3px 14px;
  }
  .soon{
    display:flex;align-items:center;gap:18px;background:transparent;
    border:2px dashed var(--line);border-radius:18px;padding:20px 22px;color:var(--muted);
  }
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 teach-me</h1>
    <p>給小學生的互動數學教室 —— 看得懂、玩得動、記得住</p>
  </header>

  <div class="intro">
    每一課都有三樣東西：<strong>範例教學</strong>帶你看懂觀念、
    <strong>試題</strong>馬上檢查、<strong>小遊戲</strong>越玩越熟。
  </div>

  <h2>目前的課程</h2>
  <div class="lessons">
    <a class="lesson" href="math/factor/factor-1.html">
      <span class="badge">🏭</span>
      <span>
        <h3>因數 — 因數工廠</h3>
        <p>用排長方形認識因數，配對法找好找滿</p>
      </span>
      <span class="tag">數學</span>
    </a>
    <a class="lesson" href="math/multiple/multiple-1.html">
      <span class="badge">🐸</span>
      <span>
        <h3>倍數 — 跳跳蛙數字樂園</h3>
        <p>跟著青蛙跳格子，落腳的地方就是倍數</p>
      </span>
      <span class="tag">數學</span>
    </a>
    <div class="soon">
      <span class="badge">🌱</span>
      <span>更多課程準備中⋯⋯</span>
    </div>
  </div>

  <footer>teach-me · 慢慢學，學得牢</footer>
</div>
</body>
</html>
