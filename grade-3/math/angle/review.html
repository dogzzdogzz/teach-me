<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角度複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .qshape{display:flex;justify-content:center;margin-bottom:10px}
  .qshape svg{width:100%;max-width:260px;height:auto;display:block}
  .angleRow{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;align-items:flex-end}
  .angleRow svg{max-width:190px}
  .angleCap{text-align:center;font-weight:700;margin-top:2px}
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 角度複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：角、周長、乘法、除法交錯出現，<strong>每一批的角度和數字都是新出的</strong>，
    背答案沒有用，要真的看懂圖。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 角的幾何工具（跟上課頁同一套邏輯，獨立一份） ---------- */
  var ANGLE_FAIL = 0;
  function polar(cx, cy, dir, r){
    var rad = dir * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }
  function angleBetween(v, p1, p2){
    var a1 = Math.atan2(-(p1.y - v.y), p1.x - v.x) * 180 / Math.PI;
    var a2 = Math.atan2(-(p2.y - v.y), p2.x - v.x) * 180 / Math.PI;
    var diff = Math.abs(a1 - a2) % 360;
    if (diff > 180) diff = 360 - diff;
    return diff;
  }
  function assertAngle(label, intended, v, p1, p2){
    var actual = angleBetween(v, p1, p2);
    if (Math.abs(actual - intended) > 0.5){
      ANGLE_FAIL++;
      console.error('[angle-assert-fail]', label, 'intended', intended, 'actual', actual.toFixed(2));
    }
    return actual;
  }
  function svgOpen(size){
    return '<svg class="scene" viewBox="0 0 ' + size + ' ' + size + '" role="img">';
  }
  function drawAngle(size, dir1, angleDeg, r1, r2, label){
    var cx = size / 2, cy = size / 2;
    var v = { x: cx, y: cy };
    var p1 = polar(cx, cy, dir1, r1);
    var p2 = polar(cx, cy, dir1 + angleDeg, r2);
    assertAngle(label, angleDeg, v, p1, p2);
    var svg = svgOpen(size);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p1.x.toFixed(1) + '" y2="' + p1.y.toFixed(1) + '" stroke="#2B2A33" stroke-width="6" stroke-linecap="round"/>';
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="#E8871E" stroke-width="6" stroke-linecap="round"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#2B2A33"/>';
    svg += '</svg>';
    return svg;
  }
  function drawChecker(size, dir1, angleDeg, r, checkerR, label){
    var cx = size / 2, cy = size / 2;
    var v = { x: cx, y: cy };
    var p1 = polar(cx, cy, dir1, r);
    var p2 = polar(cx, cy, dir1 + angleDeg, r);
    assertAngle(label, angleDeg, v, p1, p2);
    var chk = polar(cx, cy, dir1 + 90, checkerR);
    var tick = 16;
    var tA = polar(cx, cy, dir1, tick), tB = polar(cx, cy, dir1 + 90, tick);
    var tC = { x: cx + (tA.x - cx) + (tB.x - cx), y: cy + (tA.y - cy) + (tB.y - cy) };
    var svg = svgOpen(size);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + chk.x.toFixed(1) + '" y2="' + chk.y.toFixed(1) + '" stroke="#3B7DD8" stroke-width="3" stroke-dasharray="6,5" stroke-linecap="round"/>';
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p1.x.toFixed(1) + '" y2="' + p1.y.toFixed(1) + '" stroke="#2B2A33" stroke-width="6" stroke-linecap="round"/>';
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="#E8871E" stroke-width="6" stroke-linecap="round"/>';
    svg += '<path d="M ' + tA.x.toFixed(1) + ',' + tA.y.toFixed(1) + ' L ' + tC.x.toFixed(1) + ',' + tC.y.toFixed(1) + ' L ' + tB.x.toFixed(1) + ',' + tB.y.toFixed(1) + '" fill="none" stroke="#3B7DD8" stroke-width="2"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#2B2A33"/>';
    svg += '</svg>';
    return svg;
  }
  function twoApartSVG(A, B, labelPrefix){
    var pad = 40;
    var maxR = Math.max(A.r, B.r);
    var size = Math.round(2 * (maxR + pad));
    var svgA = drawAngle(size, A.dir1, A.angleDeg, A.r, A.r, labelPrefix + 'A');
    var svgB = drawAngle(size, B.dir1, B.angleDeg, B.r, B.r, labelPrefix + 'B');
    return '<div class="angleRow">' +
      '<div><div>' + svgA + '</div><div class="angleCap">A</div></div>' +
      '<div><div>' + svgB + '</div><div class="angleCap">B</div></div>' +
      '</div>';
  }
  function overlaySVG(dir1, A, B, labelPrefix){
    var pad = 40;
    var baseLen = Math.max(A.r, B.r) * 0.7;
    var maxR = Math.max(A.r, B.r, baseLen);
    var size = Math.round(2 * (maxR + pad));
    var cx = size / 2, cy = size / 2;
    var v = { x: cx, y: cy };
    var pBase = polar(cx, cy, dir1, baseLen);
    var pA = polar(cx, cy, dir1 + A.angleDeg, A.r);
    var pB = polar(cx, cy, dir1 + B.angleDeg, B.r);
    assertAngle(labelPrefix + 'A', A.angleDeg, v, pBase, pA);
    assertAngle(labelPrefix + 'B', B.angleDeg, v, pBase, pB);
    var svg = svgOpen(size);
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + pBase.x.toFixed(1) + '" y2="' + pBase.y.toFixed(1) + '" stroke="#2B2A33" stroke-width="6" stroke-linecap="round"/>';
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + pA.x.toFixed(1) + '" y2="' + pA.y.toFixed(1) + '" stroke="#E8871E" stroke-width="6" stroke-linecap="round"/>';
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + pB.x.toFixed(1) + '" y2="' + pB.y.toFixed(1) + '" stroke="#2F9E69" stroke-width="6" stroke-linecap="round"/>';
    svg += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#2B2A33"/>';
    svg += '</svg>';
    return svg;
  }
  function threeCheckerSVG(list, labelPrefix){
    var maxR = 0;
    list.forEach(function(a){ maxR = Math.max(maxR, a.r, a.checkerR); });
    var size = Math.round(2 * (maxR + 40));
    var labels = ['A', 'B', 'C'];
    var out = '<div class="angleRow">';
    list.forEach(function(a, i){
      out += '<div><div>' + drawChecker(size, a.dir1, a.angleDeg, a.r, a.checkerR, labelPrefix + i) + '</div><div class="angleCap">' + labels[i] + '</div></div>';
    });
    out += '</div>';
    return out;
  }

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'角度複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 角度複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：角、周長、乘法、除法交錯出現，<strong>每一批的角度和數字都是新出的</strong>，背答案沒有用，要真的看懂圖。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      unit:function(v){ return v + ' 公分'; },
      labL:'長', labW:'寬', labS:'邊長',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Angles Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Angles Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving angles, perimeter, multiplication and division — <strong>every batch uses fresh angles and numbers</strong>, so memorising answers won’t help; you have to really read the picture.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      unit:function(v){ return v + ' cm'; },
      labL:'L', labW:'W', labS:'side',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { angle:'角', perimeter:'周長', multiply:'乘法', divide:'除法' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { angle:'📖 角 — 角度大搜查', perimeter:'📖 周長 — 繞一圈量量看', multiply:'📖 乘法 — 直式乘法工廠', divide:'📖 除法 — 分東西大隊' },
      acuteWord:'銳角', rightWord:'直角', obtuseWord:'鈍角', cannotWord:'看不出來',
      choiceA:'A 比較大', choiceB:'B 比較大', sameWord:'一樣大'
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { angle:'Angle', perimeter:'Perimeter', multiply:'Multiply', divide:'Divide' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { angle:'📖 Angles — The Angle Hunt', perimeter:'📖 Perimeter — Once Around the Edge', multiply:'📖 Multiply — The Long-Multiplication Factory', divide:'📖 Divide — Loading the Truck' },
      acuteWord:'Acute', rightWord:'Right', obtuseWord:'Obtuse', cannotWord:'Can’t tell',
      choiceA:'A is bigger', choiceB:'B is bigger', sameWord:'The same'
    }
  };

  var LINK_HREFS = { angle:'index.html', perimeter:'../perimeter/index.html', multiply:'../multiply/index.html', divide:'../divide/index.html' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 隨機角度，避開跟直角太接近的模糊地帶（|角度-90| < 5），除非明確要求剛好是 90 */
  function randAngleAvoidingRight(min, max){
    var v;
    do { v = min + rand(max - min + 1); } while (Math.abs(v - 90) < 5);
    return v;
  }
  /* 隨機產生一對比較用的角度，保證兩者相差至少 15 度（§六之二 最小可辨識間隔） */
  function randComparablePair(min, max, minGap){
    var a, b;
    do { a = min + rand(max - min + 1); b = min + rand(max - min + 1); } while (Math.abs(a - b) < minGap);
    return { a: a, b: b };
  }
  function mixCategoricalOpts(correctLabel, allLabels){
    var opts = shuffle(allLabels.slice());
    return { opts: opts, ans: opts.indexOf(correctLabel) };
  }
  /* 保證 3 個相異、且不等於正解的錯誤選項（先用候選值去重，不夠再往外補），
     用來避免像「周長剛好等於長×寬」這種巧合造成選項重複（§六之二 等值檢查）。 */
  function mixNumericOpts(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key] && c > 0){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    var opts = shuffle([correct].concat(out.slice(0, 3)));
    return { opts: opts.map(String), ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器：每次 make() 都用新角度／新數字 ---------- */
  var GENS = [
    { id:'classifyChecker', cat:'angle',
      make: function(used){
        var dir1 = rand(360);
        var angleDeg = (rand(10) < 3) ? 90 : randAngleAvoidingRight(20, 165);
        return { dir1:dir1, angleDeg:angleDeg };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var correctLabel = d.angleDeg === 90 ? t.rightWord : (d.angleDeg < 90 ? t.acuteWord : t.obtuseWord);
        var m = mixCategoricalOpts(correctLabel, [t.acuteWord, t.rightWord, t.obtuseWord, t.cannotWord]);
        var verdict = d.angleDeg === 90
          ? (lang === 'zh' ? '兩邊完全貼合' : 'the sides line up exactly')
          : (d.angleDeg < 90 ? (lang === 'zh' ? '角還沒張開到檢查角' : 'the angle hasn’t reached the checker') : (lang === 'zh' ? '角超出了檢查角' : 'the angle goes past the checker'));
        return {
          stem: lang === 'zh' ? '檢查角（虛線）放上去後，' + verdict + '，這是什麼角？' : 'After placing the checker corner (dashed line), ' + verdict + '. What kind of angle is this?',
          shape: drawChecker(300, d.dir1, d.angleDeg, 115, 62, 'gen-classify'),
          opts: m.opts, ans: m.ans,
          why: lang === 'zh' ? (d.angleDeg === 90 ? '兩邊完全貼合，所以是直角。' : (d.angleDeg < 90 ? '角比檢查角小，所以是銳角。' : '角比檢查角大，所以是鈍角。'))
            : (d.angleDeg === 90 ? 'The sides line up exactly, so it is a right angle.' : (d.angleDeg < 90 ? 'The angle is smaller than the checker, so it is acute.' : 'The angle is bigger than the checker, so it is obtuse.'))
        };
      } },
    { id:'compareDeceptive', cat:'angle',
      make: function(used){
        var pair = randComparablePair(20, 150, 15);
        var dir1 = rand(360);
        var biggerIsA = pair.a > pair.b;
        var rA = biggerIsA ? 55 + rand(30) : 130 + rand(50);
        var rB = biggerIsA ? 130 + rand(50) : 55 + rand(30);
        return { dir1:dir1, angleA:pair.a, angleB:pair.b, rA:rA, rB:rB, bigger: biggerIsA ? 'A' : 'B' };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var m = mixCategoricalOpts(d.bigger === 'A' ? t.choiceA : t.choiceB, [t.choiceA, t.choiceB, t.sameWord, t.cannotWord]);
        return {
          stem: lang === 'zh' ? '哪一個角比較大？' : 'Which angle is bigger?',
          shape: twoApartSVG({ dir1:d.dir1, angleDeg:d.angleA, r:d.rA }, { dir1:d.dir1, angleDeg:d.angleB, r:d.rB }, 'gen-cmp'),
          opts: m.opts, ans: m.ans,
          why: lang === 'zh' ? '角的大小要看開口，不看邊畫多長 —— ' + d.bigger + ' 的開口比較大，所以 ' + d.bigger + ' 比較大。'
            : 'The size of an angle depends on the opening, not the drawn side length — ' + d.bigger + '’s opening is wider, so ' + d.bigger + ' is bigger.'
        };
      } },
    { id:'compareOverlay', cat:'angle',
      make: function(used){
        var pair = randComparablePair(20, 150, 15);
        var dir1 = rand(360);
        var rA = 70 + rand(60), rB = 70 + rand(60);
        return { dir1:dir1, angleA:pair.a, angleB:pair.b, rA:rA, rB:rB, bigger: pair.a > pair.b ? 'A' : 'B' };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var m = mixCategoricalOpts(d.bigger === 'A' ? t.choiceA : t.choiceB, [t.choiceA, t.choiceB, t.sameWord, t.cannotWord]);
        return {
          stem: lang === 'zh' ? '這兩個角已經疊在一起了（頂點對頂點、一邊對一邊），哪一個比較大？' : 'These two angles are already overlapped (vertex on vertex, one side shared). Which is bigger?',
          shape: overlaySVG(d.dir1, { angleDeg:d.angleA, r:d.rA }, { angleDeg:d.angleB, r:d.rB }, 'gen-overlay'),
          opts: m.opts, ans: m.ans,
          why: lang === 'zh' ? d.bigger + ' 的邊超出了另一個角的外面，所以 ' + d.bigger + ' 比較大。'
            : d.bigger + '’s side reaches past the other angle’s side, so ' + d.bigger + ' is bigger.'
        };
      } },
    { id:'rotationTrueFalse', cat:'angle',
      make: function(used){
        var dir1a = rand(360);
        var dir1b = pickUnused([30,80,140,190,250,310], used);
        return { dir1a:dir1a, dir1b:dir1b };
      },
      fmt: function(d, lang){
        var opts = lang === 'zh'
          ? ['小美對','小華對','兩人都對','兩人都不對']
          : ['Mia is right','Jay is right','Both are right','Neither is right'];
        return {
          stem: lang === 'zh'
            ? '這兩個角都放上了檢查角，都剛好貼合。小美說：「角轉個方向，角度就會變。」小華說：「角轉個方向，角度不會變。」誰說的對？'
            : 'The checker corner lines up exactly on both of these angles. Mia says rotating an angle changes its size; Jay says it doesn’t. Who is right?',
          shape: twoApartSVG({ dir1:d.dir1a, angleDeg:90, r:110 }, { dir1:d.dir1b, angleDeg:90, r:110 }, 'gen-rot'),
          opts: opts, ans: 1,
          why: lang === 'zh' ? '兩個角不管畫成哪個方向，都剛好是直角，角度沒有改變，所以小華說的對。'
            : 'Both angles are exactly right angles no matter which direction they’re drawn in — the size hasn’t changed, so Jay is right.'
        };
      } },
    { id:'chordTrap', cat:'angle',
      make: function(used){
        var angleA, angleB, rA, rB, chordA, chordB, tries;
        for (tries = 0; tries < 40; tries++){
          angleA = 15 + rand(21); // 15..35
          angleB = 85 + rand(56); // 85..140
          rA = 170 + rand(41); // 170..210
          rB = 25 + rand(21); // 25..45
          chordA = 2 * rA * Math.sin(angleA * Math.PI / 360);
          chordB = 2 * rB * Math.sin(angleB * Math.PI / 360);
          if (chordA > chordB) break;
        }
        var dir1 = rand(360);
        return { dir1:dir1, angleA:angleA, angleB:angleB, rA:rA, rB:rB, bigger: angleA > angleB ? 'A' : 'B' };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var m = mixCategoricalOpts(d.bigger === 'A' ? t.choiceA : t.choiceB, [t.choiceA, t.choiceB, t.sameWord, t.cannotWord]);
        return {
          stem: lang === 'zh' ? '哪一個角比較大？' : 'Which angle is bigger?',
          shape: twoApartSVG({ dir1:d.dir1, angleDeg:d.angleA, r:d.rA }, { dir1:d.dir1, angleDeg:d.angleB, r:d.rB }, 'gen-chord'),
          opts: m.opts, ans: m.ans,
          why: lang === 'zh' ? '不要看兩個端點之間的距離，要看開口張開的程度：' + d.bigger + ' 的開口比較大，所以 ' + d.bigger + ' 比較大。'
            : 'Don’t judge by the distance between the endpoints — look at how far it opens: ' + d.bigger + '’s opening is wider, so ' + d.bigger + ' is bigger.'
        };
      } },
    { id:'lifeCompare', cat:'angle',
      make: function(used){
        var scenes = lang0Scenes();
        var a = pick(scenes), b, tries;
        b = a;
        for (tries = 0; tries < 40; tries++){
          var cand = pick(scenes);
          if (cand.id !== a.id && Math.abs(a.angleDeg - cand.angleDeg) >= 15){ b = cand; break; }
        }
        if (b.id === a.id){ b = scenes[(scenes.indexOf(a) + 1) % scenes.length]; }
        var dir1 = rand(360);
        return { dir1:dir1, a:a, b:b, bigger: a.angleDeg > b.angleDeg ? 'A' : 'B' };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var names = sceneNames(lang);
        var m = mixCategoricalOpts(d.bigger === 'A' ? t.choiceA : t.choiceB, [t.choiceA, t.choiceB, t.sameWord, t.cannotWord]);
        return {
          stem: lang === 'zh'
            ? (names[d.a.id] + '打開的角度是 A，' + names[d.b.id] + '打開的角度是 B，疊在一起比較後，哪一個角度比較大？')
            : (names[d.a.id] + ' opens to angle A, and ' + names[d.b.id] + ' opens to angle B. After overlapping, which is bigger?'),
          shape: overlaySVG(d.dir1, { angleDeg:d.a.angleDeg, r:100 }, { angleDeg:d.b.angleDeg, r:100 }, 'gen-life'),
          opts: m.opts, ans: m.ans,
          why: lang === 'zh' ? d.bigger + ' 的邊超出了另一邊，所以 ' + d.bigger + ' 比較大。'
            : d.bigger + '’s side reaches past the other, so ' + d.bigger + ' is bigger.'
        };
      } },
    { id:'vertexIdentify', cat:'angle',
      make: function(used){
        var dir1 = rand(360);
        var angleDeg = 40 + rand(90);
        var r = 110 + rand(30);
        return { dir1:dir1, angleDeg:angleDeg, r:r };
      },
      fmt: function(d, lang){
        var size = 300, cx = size / 2, cy = size / 2;
        var v = { x:cx, y:cy };
        var p1 = polar(cx, cy, d.dir1, d.r), p2 = polar(cx, cy, d.dir1 + d.angleDeg, d.r);
        assertAngle('gen-vertex', d.angleDeg, v, p1, p2);
        var Q = polar(cx, cy, d.dir1, d.r * 0.55);
        var R = polar(cx, cy, d.dir1 + d.angleDeg, d.r * 0.55);
        var S = polar(cx, cy, d.dir1 + d.angleDeg * 0.5, d.r * 0.35);
        var svg = svgOpen(size);
        svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p1.x.toFixed(1) + '" y2="' + p1.y.toFixed(1) + '" stroke="#2B2A33" stroke-width="5" stroke-linecap="round"/>';
        svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p2.x.toFixed(1) + '" y2="' + p2.y.toFixed(1) + '" stroke="#2B2A33" stroke-width="5" stroke-linecap="round"/>';
        [ ['P', v], ['Q', Q], ['R', R], ['S', S] ].forEach(function(item){
          svg += '<circle cx="' + item[1].x.toFixed(1) + '" cy="' + item[1].y.toFixed(1) + '" r="6" fill="#E8871E"/>';
          svg += '<text x="' + (item[1].x + 10).toFixed(1) + '" y="' + (item[1].y - 8).toFixed(1) + '" font-size="18" font-weight="700" fill="#2B2A33">' + item[0] + '</text>';
        });
        svg += '</svg>';
        return {
          stem: lang === 'zh' ? '圖裡的 P、Q、R、S 四個點，哪一個是這個角的頂點？' : 'Which of the points P, Q, R and S is the vertex of this angle?',
          shape: svg,
          opts: ['P','Q','R','S'], ans: 0,
          why: lang === 'zh' ? 'P 是兩條邊交會的那一點，是頂點；Q、R 在邊上，S 在開口裡面，都不是頂點。'
            : 'P is where the two sides meet — that’s the vertex. Q and R sit on the sides, and S sits inside the opening.'
        };
      } },
    { id:'pickCategoryAmongThree', cat:'angle',
      make: function(used){
        /* 銳角區間 20~74、鈍角區間 105~164，兩區間都離 90 度至少 16 度，
           目標角落在被問的那一類，另外兩個角一定落在「另一類」，
           這樣三個角裡永遠恰好一個符合題目問的類別，答案才唯一。 */
        var askAcute = rand(2) === 0;
        var targetRange = askAcute ? [20, 74] : [105, 164];
        var otherRange = askAcute ? [105, 164] : [20, 74];
        function inRange(rg){ return rg[0] + rand(rg[1] - rg[0] + 1); }
        var target = inRange(targetRange);
        var other1 = inRange(otherRange);
        var other2 = inRange(otherRange);
        var slot = rand(3);
        var angles = [0,0,0];
        angles[slot] = target;
        var others = [other1, other2];
        var oi = 0;
        for (var i = 0; i < 3; i++){ if (i !== slot) angles[i] = others[oi++]; }
        var dirs = [rand(360), rand(360), rand(360)];
        return { angles: angles, dirs: dirs, targetSlot: slot, askAcute: askAcute };
      },
      fmt: function(d, lang){
        var items = d.angles.map(function(a, i){ return { dir1:d.dirs[i], angleDeg:a, r:100, checkerR:58 }; });
        var labels = lang === 'zh' ? ['角 A','角 B','角 C'] : ['Angle A','Angle B','Angle C'];
        var opts = labels.concat([ lang === 'zh' ? '三個都是' : 'All three' ]);
        var catWord = d.askAcute ? (lang === 'zh' ? '銳角' : 'acute') : (lang === 'zh' ? '鈍角' : 'obtuse');
        return {
          stem: lang === 'zh' ? '角 A、B、C 都放上了檢查角，哪一個是' + catWord + '？' : 'The checker corner is placed on angles A, B and C. Which one is ' + catWord + '?',
          shape: threeCheckerSVG(items, 'gen-three'),
          opts: opts, ans: d.targetSlot,
          why: lang === 'zh' ? '用檢查角比較，只有' + labels[d.targetSlot] + '符合' + catWord + '的條件。'
            : 'Comparing with the checker corner, only ' + labels[d.targetSlot] + ' matches "' + catWord + '".'
        };
      } },
    /* ---- 交錯題：周長、乘法、除法（跟本課已存在的姊妹課互相呼應） ---- */
    { id:'perimeterCalc', cat:'perimeter',
      make: function(used){
        var l = pickUnused([4,5,6,7,8,9,10,11,12], used);
        var w = 2 + rand(8);
        var P = (l + w) * 2;
        var m = mixNumericOpts(P, [l + w, l * w, P + 2, P - 2]);
        return { l:l, w:w, P:P, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '長方形長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分，周長是多少？' : 'A rectangle is ' + d.l + ' cm long and ' + d.w + ' cm wide. What is its perimeter?',
          shape: '', opts: d.opts, ans: d.ans,
          why: lang === 'zh' ? '(' + d.l + ' + ' + d.w + ') × 2 = ' + d.P + ' 公分。' : '(' + d.l + ' + ' + d.w + ') × 2 = ' + d.P + ' cm.'
        };
      } },
    { id:'multiplyCalc', cat:'multiply',
      make: function(used){
        var a = pickUnused([12,13,14,21,23,24,31,32,41,42], used);
        var b = 2 + rand(6);
        var p = a * b;
        var m = mixNumericOpts(p, [p + b, p - b, a + b]);
        return { a:a, b:b, p:p, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: d.a + ' × ' + d.b + ' = ?',
          shape: '', opts: d.opts, ans: d.ans,
          why: lang === 'zh' ? d.a + ' × ' + d.b + ' = ' + d.p + '。' : d.a + ' × ' + d.b + ' = ' + d.p + '.'
        };
      } },
    { id:'divideCalc', cat:'divide',
      make: function(used){
        var divisor = pickUnused([3,4,5,6,7,8], used);
        var quotient = 4 + rand(9);
        var remainder = rand(divisor);
        var dividend = divisor * quotient + remainder;
        var wrongQ1 = quotient + 1, wrongQ2 = Math.max(1, quotient - 1);
        return { divisor:divisor, quotient:quotient, remainder:remainder, dividend:dividend, wrongQ1:wrongQ1, wrongQ2:wrongQ2 };
      },
      fmt: function(d, lang){
        var fmtAns = function(q, r){ return lang === 'zh' ? (q + ' 餘 ' + r) : (q + ' r ' + r); };
        var correct = fmtAns(d.quotient, d.remainder);
        /* 誘答：餘數比除數還大（真實的粗心錯：沒有繼續分下去） */
        var bigRemainder = d.remainder + Math.max(1, Math.floor(d.divisor / 2));
        var wrongBigRemainder = fmtAns(d.quotient - 1 >= 1 ? d.quotient - 1 : d.quotient, bigRemainder);
        var opts = shuffle([correct, fmtAns(d.wrongQ1, d.remainder), fmtAns(d.wrongQ2, d.remainder), wrongBigRemainder]);
        /* 去重（極少數情況可能重複），不足就補一個安全備援 */
        var uniq = []; var seen = {};
        opts.forEach(function(o){ if (!seen[o]){ seen[o] = true; uniq.push(o); } });
        while (uniq.length < 4) uniq.push(fmtAns(d.quotient + uniq.length, d.remainder));
        var ans = uniq.indexOf(correct);
        return {
          stem: d.dividend + ' ÷ ' + d.divisor + ' = ?',
          shape: '', opts: uniq, ans: ans,
          why: lang === 'zh' ? d.dividend + ' ÷ ' + d.divisor + ' = ' + d.quotient + ' 餘 ' + d.remainder + '（餘數一定要比除數小）。'
            : d.dividend + ' ÷ ' + d.divisor + ' = ' + d.quotient + ' r ' + d.remainder + ' (the remainder must be smaller than the divisor).'
        };
      } }
  ];

  function lang0Scenes(){
    return [
      { id:'scissors', angleDeg: 25 + rand(30) },
      { id:'door', angleDeg: 95 + rand(50) },
      { id:'clock', angleDeg: pick([30,60,90,120,150]) },
      { id:'book', angleDeg: 40 + rand(100) }
    ];
  }
  function sceneNames(lang){
    return lang === 'zh'
      ? { scissors:'剪刀', door:'門', clock:'時鐘的兩根針', book:'書本掀開' }
      : { scissors:'the scissors', door:'the door', clock:'the clock hands', book:'the open book' };
  }

  /* ---------- 出一批 12 題：8 種角的題型各一題 + 3 個交錯題型 + 1 題隨機加碼 ---------- */
  var ANGLE_GEN_IDS = ['classifyChecker','compareDeceptive','compareOverlay','rotationTrueFalse','chordTrap','lifeCompare','vertexIdentify','pickCategoryAmongThree'];
  var SIBLING_GEN_IDS = ['perimeterCalc','multiplyCalc','divideCalc'];

  function makePlan(){
    var byId = {};
    GENS.forEach(function(g){ byId[g.id] = g; });
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var idOrder = ANGLE_GEN_IDS.concat(SIBLING_GEN_IDS);
    var extraId = pick(ANGLE_GEN_IDS);
    idOrder.push(extraId);
    return shuffle(idOrder).map(function(id){
      var g = byId[id];
      return { gen: g, data: g.make(usedByGen[id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var shapeDiv = document.createElement('div');
      shapeDiv.className = 'qshape';
      shapeDiv.innerHTML = q.shape;
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c);
      if (shapeDiv.innerHTML) box.appendChild(shapeDiv);
      box.appendChild(stem); box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
