<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>除法複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>

  <nav class="coursenav">

    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>

  </nav>

  <header>
    <h1 data-i18n="h1">🔁 除法複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>

  <div class="intro" data-i18n="intro">

    背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。

  <div id="quiz" class="quiz"></div>

  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'除法複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 除法複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：除法、乘法驗算、分數交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Division Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Division Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving division, multiplication checks and fractions — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { divide:'除法', multiply:'乘法驗算', fraction:'分數' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪裡：'; },
      linkNames: { divide:'🗂️ 除法 — 速查卡', multiply:'📖 除法 — 乘除互逆（上課）', fraction:'📖 除法 — 分東西的故事（上課）' },
      fmtQR: function(q, r){ return '商 ' + q + '、餘 ' + r; }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { divide:'Division', multiply:'Multiplication check', fraction:'Fractions' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { divide:'🗂️ Division — cheat sheet', multiply:'📖 Division — inverse check (lesson)', fraction:'📖 Division — sharing stories (lesson)' },
      fmtQR: function(q, r){ return q + ' r ' + r; }
    }
  };

  var LINK_HREFS = { divide:'reference.html', multiply:'index.html', fraction:'index.html' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 保證 3 個相異、且不等於正解的整數錯誤選項 */
  function makeWrongsInt(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key] && c > 0){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOptsNum(correct, candidates){
    var wrongs = makeWrongsInt(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器：每次 make() 都用新數字 ---------- */
  var GENS = [
    { id:'equalShare', cat:'divide',
      make: function(used){
        var n = pickUnused([2,3,4,5,6], used);
        var per = pick([3,4,5,6,7,8,9]);
        var total = n * per;
        var m = mixOptsNum(per, [per - 1, per + 1, total]);
        return { n:n, per:per, total:total, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.total + ' 顆糖平分給 ' + d.n + ' 個人，每人分到幾顆？' : d.total + ' candies shared equally among ' + d.n + ' people. How many does each get?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.total + ' ÷ ' + d.n + ' ＝ ' + d.per + '，每人分到 ' + d.per + ' 顆。'
            : d.total + ' ÷ ' + d.n + ' = ' + d.per + ', so each person gets ' + d.per + '.'
        };
      } },
    { id:'groupPack', cat:'divide',
      make: function(used){
        var k = pickUnused([2,3,4,5,6], used);
        var bags = pick([3,4,5,6,7,8]);
        var total = k * bags;
        var m = mixOptsNum(bags, [bags - 1, bags + 1, k]);
        return { k:k, bags:bags, total:total, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.total + ' 顆糖，每 ' + d.k + ' 顆裝一袋，可以裝幾袋？' : d.total + ' candies, ' + d.k + ' per bag. How many bags?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.total + ' ÷ ' + d.k + ' ＝ ' + d.bags + '，可以裝 ' + d.bags + ' 袋。'
            : d.total + ' ÷ ' + d.k + ' = ' + d.bags + ', so ' + d.bags + ' bags.'
        };
      } },
    { id:'remainderCalc', cat:'divide',
      make: function(used){
        var k = pickUnused([3,4,5,6,7], used);
        var q = pick([2,3,4,5,6]);
        var r = 1 + rand(k - 1);
        var dividend = k * q + r;
        var wrongTuples = [
          { q:q - 1, r:r + k },
          { q:q + 1, r:r },
          { q:q, r: r + 1 === k ? Math.max(0, r - 1) : r + 1 }
        ];
        var tuples = shuffle([{ q:q, r:r }].concat(wrongTuples));
        var ansIdx = 0;
        for (var i = 0; i < tuples.length; i++){
          if (tuples[i].q === q && tuples[i].r === r){ ansIdx = i; break; }
        }
        return { dividend:dividend, k:k, q:q, r:r, tuples:tuples, ans:ansIdx };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        return {
          stem: d.dividend + ' ÷ ' + d.k + ' = ?',
          opts: d.tuples.map(function(tt){ return t.fmtQR(tt.q, tt.r); }),
          ans: d.ans,
          why: lang === 'zh'
            ? d.k + ' × ' + d.q + ' ＝ ' + (d.k * d.q) + '，' + d.dividend + ' − ' + (d.k * d.q) + ' ＝ ' + d.r + '，所以商 ' + d.q + '、餘 ' + d.r + '。'
            : d.k + ' × ' + d.q + ' = ' + (d.k * d.q) + ', and ' + d.dividend + ' − ' + (d.k * d.q) + ' = ' + d.r + ', so ' + d.q + ' r ' + d.r + '.'
        };
      } },
    { id:'leftoverCount', cat:'divide',
      make: function(used){
        var k = pickUnused([3,4,5,6,7,8], used);
        var q = pick([3,4,5,6]);
        var r = 1 + rand(k - 1);
        var total = k * q + r;
        var m = mixOptsNum(r, [r + 1, Math.max(1, r - 1), k]);
        return { total:total, k:k, q:q, r:r, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.total + ' 顆彈珠，每 ' + d.k + ' 顆裝一袋，裝完整袋後還剩下幾顆？'
            : d.total + ' marbles, ' + d.k + ' per bag. After packing full bags, how many are left over?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.k + ' × ' + d.q + ' ＝ ' + (d.k * d.q) + '，' + d.total + ' − ' + (d.k * d.q) + ' ＝ ' + d.r + '，還剩 ' + d.r + ' 顆。'
            : d.k + ' × ' + d.q + ' = ' + (d.k * d.q) + ', and ' + d.total + ' − ' + (d.k * d.q) + ' = ' + d.r + ' left over.'
        };
      } },
    { id:'roundUpTrip', cat:'divide',
      make: function(used){
        var k = pickUnused([4,5,6,7,8], used);
        var q = pick([3,4,5,6]);
        var r = 1 + rand(k - 1);
        var total = k * q + r;
        var answer = q + 1;
        var m = mixOptsNum(answer, [q, q + 2, total]);
        return { total:total, k:k, q:q, r:r, answer:answer, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.total + ' 人要搭車，每輛車坐 ' + d.k + ' 人，最少需要幾輛車？'
            : d.total + ' people need a ride, ' + d.k + ' per car. Fewest cars needed?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.total + ' ÷ ' + d.k + ' ＝ 商 ' + d.q + ' 餘 ' + d.r + '，剩下的 ' + d.r + ' 人也要坐車，所以要 ' + d.q + ' ＋ 1 ＝ ' + d.answer + ' 輛車。'
            : d.total + ' ÷ ' + d.k + ' = ' + d.q + ' r ' + d.r + '. The remaining ' + d.r + ' people still need a car, so ' + d.q + ' + 1 = ' + d.answer + ' cars.'
        };
      } },
    { id:'reverseDividend', cat:'divide',
      make: function(used){
        var k = pickUnused([3,4,5,6,7], used);
        var q = pick([4,5,6,7,8]);
        var r = 1 + rand(k - 1);
        var dividend = k * q + r;
        var m = mixOptsNum(dividend, [k * q, dividend - 1, dividend + k]);
        return { k:k, q:q, r:r, dividend:dividend, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '除法算式：除數是 ' + d.k + '、商是 ' + d.q + '、餘數是 ' + d.r + '，被除數應該是多少？'
            : 'A division fact has divisor ' + d.k + ', quotient ' + d.q + ', remainder ' + d.r + '. What is the dividend?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '被除數 ＝ 除數 × 商 ＋ 餘數 ＝ ' + d.k + ' × ' + d.q + ' ＋ ' + d.r + ' ＝ ' + d.dividend + '（別忘了加餘數）。'
            : 'Dividend = divisor × quotient + remainder = ' + d.k + ' × ' + d.q + ' + ' + d.r + ' = ' + d.dividend + ' (don’t forget the remainder).'
        };
      } },
    { id:'maxRemainder', cat:'divide',
      make: function(used){
        var k = pickUnused([3,4,5,6,7,8,9], used);
        var m = mixOptsNum(k, [k - 1, Math.max(0, k - 2), 0]);
        return { k:k, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '除以 ' + d.k + ' 的時候，餘數不可能是多少？' : 'When dividing by ' + d.k + ', what can the remainder never be?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '餘數一定要比除數（' + d.k + '）小，最大只能到 ' + (d.k - 1) + '，所以 ' + d.k + ' 不可能是餘數。'
            : 'The remainder must be smaller than the divisor (' + d.k + ') — the largest it can be is ' + (d.k - 1) + ', so ' + d.k + ' is impossible.'
        };
      } },
    { id:'verifyMultiply', cat:'multiply',
      make: function(used){
        var k = pickUnused([3,4,5,6,7,8], used);
        var q = pick([4,5,6,7,8,9]);
        var dividend = k * q;
        var m = mixOptsNum(dividend, [dividend - k, dividend + k, k + q]);
        return { k:k, q:q, dividend:dividend, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '小華算出 ' + d.dividend + ' ÷ ' + d.k + ' 的商是 ' + d.q + '，用乘法驗算：' + d.k + ' × ' + d.q + ' 等於多少？'
            : 'Jay says ' + d.dividend + ' ÷ ' + d.k + ' has quotient ' + d.q + '. Check with multiplication: what is ' + d.k + ' × ' + d.q + '?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.k + ' × ' + d.q + ' ＝ ' + d.dividend + '，跟被除數一樣，驗算正確。'
            : d.k + ' × ' + d.q + ' = ' + d.dividend + ', matching the dividend, so the check is correct.'
        };
      } },
    { id:'shareFraction', cat:'fraction',
      make: function(used){
        var n = pickUnused([2,3,4,5,6,7,8], used);
        var opts = shuffle(['1/' + n, n + '/1', '1/' + Math.max(1, n - 1), '1/' + (n + 1)]);
        var ans = opts.indexOf('1/' + n);
        return { n:n, opts:opts, ans:ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '把一個蛋糕平分給 ' + d.n + ' 個人，每人分到全部的幾分之幾？'
            : 'A cake is shared equally among ' + d.n + ' people. What fraction of the whole cake does each person get?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '平分成 ' + d.n + ' 份，每份就是全部的 1/' + d.n + '（分東西正是分數的起源）。'
            : 'Split into ' + d.n + ' equal parts, each part is 1/' + d.n + ' of the whole (sharing is exactly where fractions come from).'
        };
      } }
  ];

  /* ---------- 出一批 12 題：9 種題型各一題＋隨機 3 題（限除法類，數字不重複） ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){ return g.cat === 'divide'; });
    for (var i = 0; i < 3; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
</html>
