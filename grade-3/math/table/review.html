<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>表格複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .tblwrap{overflow-x:auto;margin:10px 0}
  table.databox{border-collapse:collapse;width:100%;min-width:300px}
  table.databox th,table.databox td{border:2px solid var(--line);padding:6px 9px;text-align:center;font-size:15px}
  table.databox th{background:var(--blue-soft);color:var(--blue);font-weight:700}
  table.databox td.rowhead{background:var(--orange-soft);color:var(--orange);font-weight:700}
  table.databox td.tot{background:var(--blue-soft);color:var(--blue);font-weight:700}
  .tallyrow{display:flex;flex-wrap:wrap;gap:6px}
  .tallychip{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 9px;font-size:13px;color:var(--ink)}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 表格複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：讀表格、算總計、加減文字題交錯出現，<strong>每一批的數字都是新出的</strong>，
    背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'表格複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 表格複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：讀表格、算總計、加減文字題交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Tables Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Tables Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving table reading, totals, and add/subtract word problems — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { table:'表格', addsub:'加減法', multiply:'乘法', divide:'除法' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { table:'📋 表格 — 表格讀心術', addsub:'➕ 加減法', multiply:'✖️ 乘法 — 直式乘法工廠', divide:'➗ 除法' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { table:'Tables', addsub:'Add/Subtract', multiply:'Multiply', divide:'Divide' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { table:'📋 Tables — Reading the Table', addsub:'➕ Add/Subtract', multiply:'✖️ Multiply — The Column Factory', divide:'➗ Divide' }
    }
  };

  var LINK_HREFS = { table:'index.html', addsub:'../add-sub/', multiply:'../multiply/', divide:'../divide/' };

  /* ---------- 翻譯用的資料表 ---------- */
  var FRUIT_KEYS = ['apple','banana','orange','grape','watermelon','mango','pineapple'];
  var FRUIT_NAMES = {
    zh:{apple:'蘋果',banana:'香蕉',orange:'橘子',grape:'葡萄',watermelon:'西瓜',mango:'芒果',pineapple:'鳳梨'},
    en:{apple:'apples',banana:'bananas',orange:'oranges',grape:'grapes',watermelon:'watermelons',mango:'mangoes',pineapple:'pineapples'}
  };
  var CLASS_KEYS = ['c1','c2','c3','c4'];
  var CLASS_NAMES = {
    zh:{c1:'三年一班',c2:'三年二班',c3:'三年三班',c4:'三年四班'},
    en:{c1:'Class 3-1',c2:'Class 3-2',c3:'Class 3-3',c4:'Class 3-4'}
  };
  var SPORT_KEYS = ['basketball','soccer','pingpong','jumprope','badminton'];
  var SPORT_NAMES = {
    zh:{basketball:'籃球',soccer:'足球',pingpong:'桌球',jumprope:'跳繩',badminton:'羽球'},
    en:{basketball:'basketball',soccer:'soccer',pingpong:'ping-pong',jumprope:'jump rope',badminton:'badminton'}
  };
  var TALLY_KEYS = ['zoo','beach','park','museum'];
  var TALLY_NAMES = {
    zh:{zoo:'動物園',beach:'海邊',park:'樂園',museum:'博物館'},
    en:{zoo:'the zoo',beach:'the beach',park:'the amusement park',museum:'the museum'}
  };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function sum(arr){ return arr.reduce(function(a,b){ return a+b; }, 0); }
  function allDistinct(arr){
    var seen = {};
    for (var i=0;i<arr.length;i++){ var k=String(arr[i]); if(seen[k]) return false; seen[k]=true; }
    return true;
  }
  /* n 個互不相同的整數，範圍 [lo,hi] */
  function distinctValues(n, lo, hi){
    var pool = [];
    for (var v = lo; v <= hi; v++) pool.push(v);
    return shuffle(pool).slice(0, n);
  }
  /* 保證每一列、每一欄的總和都彼此不同（供最多/最少題型使用） */
  function hasDistinctMargins(grid){
    var rs = grid.map(function(row){ return sum(row); });
    var cs = [];
    for (var c = 0; c < grid[0].length; c++){ cs.push(sum(grid.map(function(row){ return row[c]; }))); }
    return allDistinct(rs) && allDistinct(cs);
  }
  function makeDistinctMarginGrid(rows, cols, lo, hi){
    var grid;
    for (var tries = 0; tries < 60; tries++){
      grid = [];
      for (var r = 0; r < rows; r++){
        var row = [];
        for (var c = 0; c < cols; c++) row.push(lo + rand(hi - lo + 1));
        grid.push(row);
      }
      if (hasDistinctMargins(grid)) return grid;
    }
    for (var fix = 0; fix < 30 && !hasDistinctMargins(grid); fix++){
      var rr = rand(rows), cc = rand(cols);
      grid[rr][cc] = Math.min(hi, grid[rr][cc] + 1 + rand(2));
    }
    return grid;
  }
  /* 保證 3 個相異、且不等於正解的錯誤選項 */
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key]){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3){
      var lo = correct - step, hi = correct + step;
      if (lo >= 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  function buildFruit1DTableHtml(keys, values, lang){
    var h1 = lang === 'zh' ? '水果' : 'Fruit';
    var h2 = lang === 'zh' ? '賣出（箱）' : 'Boxes sold';
    var rows = keys.map(function(k,i){
      return '<tr><td class="rowhead">' + FRUIT_NAMES[lang][k] + '</td><td>' + values[i] + '</td></tr>';
    }).join('');
    return '<div class="tblwrap"><table class="databox"><tr><th>' + h1 + '</th><th>' + h2 + '</th></tr>' + rows + '</table></div>';
  }

  function build2DTableHtml(rowKeys, colKeys, grid, lang, opts){
    opts = opts || {};
    var corner = lang === 'zh' ? '班級 ＼ 運動' : 'Class ＼ Sport';
    var rowTotLabel = lang === 'zh' ? '列總計' : 'Row total';
    var colTotLabel = lang === 'zh' ? '行總計' : 'Column total';
    var html = '<div class="tblwrap"><table class="databox"><tr><th>' + corner + '</th>';
    colKeys.forEach(function(ck){ html += '<th>' + SPORT_NAMES[lang][ck] + '</th>'; });
    if (opts.showRowTotal) html += '<th>' + rowTotLabel + '</th>';
    html += '</tr>';
    rowKeys.forEach(function(rk, ri){
      html += '<tr><td class="rowhead">' + CLASS_NAMES[lang][rk] + '</td>';
      grid[ri].forEach(function(v){ html += '<td>' + v + '</td>'; });
      if (opts.showRowTotal) html += '<td class="tot">' + sum(grid[ri]) + '</td>';
      html += '</tr>';
    });
    if (opts.showColTotal){
      html += '<tr><td class="rowhead">' + colTotLabel + '</td>';
      for (var c = 0; c < colKeys.length; c++){
        html += '<td class="tot">' + sum(grid.map(function(row){ return row[c]; })) + '</td>';
      }
      if (opts.showRowTotal) html += '<td class="tot">' + sum(grid.map(function(row){ return sum(row); })) + '</td>';
      html += '</tr>';
    }
    html += '</table></div>';
    return html;
  }

  /* ---------- 題目產生器：每次 make() 都用新數字 ---------- */
  var GENS = [
    { id:'lookup1D', cat:'table',
      make: function(){
        var n = pick([4,5]);
        var keys = shuffle(FRUIT_KEYS).slice(0, n);
        var values = distinctValues(n, 5, 26);
        var idx = rand(n);
        var wrongPool = values.filter(function(v,i){ return i !== idx; });
        var m = mixOpts(values[idx], wrongPool);
        return { keys:keys, values:values, idx:idx, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var name = FRUIT_NAMES[lang][d.keys[d.idx]];
        return {
          stem: lang === 'zh' ? '根據下表，' + name + '賣出了幾箱？' : 'According to the table, how many boxes of ' + name + ' were sold?',
          picture: buildFruit1DTableHtml(d.keys, d.values, lang),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? '在表格中找到「' + name + '」那一列，數字是 ' + d.values[d.idx] + '。' : 'Find the row for “' + name + '” — the number is ' + d.values[d.idx] + '.'
        };
      } },
    { id:'extreme1D', cat:'table',
      make: function(){
        var n = pick([4,5]);
        var keys = shuffle(FRUIT_KEYS).slice(0, n);
        var values = distinctValues(n, 4, 27);
        var wantMax = Math.random() < 0.5;
        var target = wantMax ? Math.max.apply(null, values) : Math.min.apply(null, values);
        var idx = values.indexOf(target);
        return { keys:keys, values:values, wantMax:wantMax, idx:idx };
      },
      fmt: function(d, lang){
        var names = d.keys.map(function(k){ return FRUIT_NAMES[lang][k]; });
        var askWord = d.wantMax ? (lang === 'zh' ? '最多' : 'the most') : (lang === 'zh' ? '最少' : 'the least');
        return {
          stem: lang === 'zh' ? '根據下表，哪一種水果賣出' + askWord + '？' : 'According to the table, which fruit was sold ' + askWord + '?',
          picture: buildFruit1DTableHtml(d.keys, d.values, lang),
          opts: names.slice(), ans: d.idx,
          why: lang === 'zh' ? names[d.idx] + ' 是 ' + d.values[d.idx] + '，是表格中' + (d.wantMax ? '最大' : '最小') + '的數字。' : names[d.idx] + ' has ' + d.values[d.idx] + ', the ' + (d.wantMax ? 'largest' : 'smallest') + ' in the table.'
        };
      } },
    { id:'lookup2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var r = rand(3), c = rand(4);
        var correct = grid[r][c];
        var wrongPool = [];
        grid.forEach(function(row, ri){ row.forEach(function(v, ci){ if (!(ri===r && ci===c)) wrongPool.push(v); }); });
        var m = mixOpts(correct, shuffle(wrongPool));
        return { rk:rk, ck:ck, grid:grid, r:r, c:c, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var rowName = CLASS_NAMES[lang][d.rk[d.r]], colName = SPORT_NAMES[lang][d.ck[d.c]];
        return {
          stem: lang === 'zh' ? '根據下表，' + rowName + '選' + colName + '的有幾人？' : 'According to the table, how many students in ' + rowName + ' chose ' + colName + '?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {}),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? '找到「' + rowName + '」那一列與「' + colName + '」那一欄交叉的格子，是 ' + d.correct + '。' : 'Find where the “' + rowName + '” row crosses the “' + colName + '” column — it’s ' + d.correct + '.'
        };
      } },
    { id:'rowTotal2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var r = rand(3);
        var correct = sum(grid[r]);
        var otherRowSums = grid.map(function(row){ return sum(row); }).filter(function(v,i){ return i !== r; });
        var colSums = []; for (var c=0;c<4;c++) colSums.push(sum(grid.map(function(row){ return row[c]; })));
        var m = mixOpts(correct, otherRowSums.concat(colSums));
        return { rk:rk, ck:ck, grid:grid, r:r, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var rowName = CLASS_NAMES[lang][d.rk[d.r]];
        var nums = d.grid[d.r];
        return {
          stem: lang === 'zh' ? rowName + '選的運動人數總共是多少？' : 'What is the total number of students in ' + rowName + '?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {}),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? rowName + '那一列：' + nums.join(' + ') + ' = ' + d.correct + '。' : rowName + '’s row: ' + nums.join(' + ') + ' = ' + d.correct + '.'
        };
      } },
    { id:'colTotal2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var c = rand(4);
        var colVals = grid.map(function(row){ return row[c]; });
        var correct = sum(colVals);
        var otherColSums = [];
        for (var cc=0; cc<4; cc++){ if (cc!==c) otherColSums.push(sum(grid.map(function(row){ return row[cc]; }))); }
        var rowSums = grid.map(function(row){ return sum(row); });
        var m = mixOpts(correct, otherColSums.concat(rowSums));
        return { rk:rk, ck:ck, grid:grid, c:c, colVals:colVals, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var colName = SPORT_NAMES[lang][d.ck[d.c]];
        return {
          stem: lang === 'zh' ? '選「' + colName + '」的三年級學生總共有幾人？' : 'How many grade-3 students in total chose ' + colName + '?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {}),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? colName + '那一欄：' + d.colVals.join(' + ') + ' = ' + d.correct + '。' : colName + '’s column: ' + d.colVals.join(' + ') + ' = ' + d.correct + '.'
        };
      } },
    { id:'diff2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var rIdx = shuffle([0,1,2]).slice(0,2);
        var cOrder = shuffle([0,1,2,3]);
        var c = cOrder[0], v1 = grid[rIdx[0]][c], v2 = grid[rIdx[1]][c];
        for (var i=1; i<cOrder.length && v1===v2; i++){ c = cOrder[i]; v1 = grid[rIdx[0]][c]; v2 = grid[rIdx[1]][c]; }
        var correct = Math.abs(v1 - v2);
        var sumWrong = v1 + v2;
        var m = mixOpts(correct, [sumWrong, v1, v2]);
        return { rk:rk, ck:ck, grid:grid, c:c, rIdx:rIdx, v1:v1, v2:v2, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var rowName1 = CLASS_NAMES[lang][d.rk[d.rIdx[0]]], rowName2 = CLASS_NAMES[lang][d.rk[d.rIdx[1]]];
        var colName = SPORT_NAMES[lang][d.ck[d.c]];
        var big = Math.max(d.v1, d.v2), small = Math.min(d.v1, d.v2);
        return {
          stem: lang === 'zh' ? rowName1 + '和' + rowName2 + '選' + colName + '的人數相差多少？' : 'What is the difference between ' + rowName1 + ' and ' + rowName2 + ' choosing ' + colName + '?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {}),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? rowName1 + '是 ' + d.v1 + '，' + rowName2 + '是 ' + d.v2 + '，' + big + ' − ' + small + ' = ' + d.correct + '。' : rowName1 + ' is ' + d.v1 + ', ' + rowName2 + ' is ' + d.v2 + '. ' + big + ' − ' + small + ' = ' + d.correct + '.'
        };
      } },
    { id:'sumTwoCells2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var c = rand(4);
        var rIdx = shuffle([0,1,2]).slice(0,2);
        var v1 = grid[rIdx[0]][c], v2 = grid[rIdx[1]][c];
        var correct = v1 + v2;
        var diffWrong = Math.abs(v1 - v2);
        var m = mixOpts(correct, [diffWrong, v1, v2]);
        return { rk:rk, ck:ck, grid:grid, c:c, rIdx:rIdx, v1:v1, v2:v2, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var rowName1 = CLASS_NAMES[lang][d.rk[d.rIdx[0]]], rowName2 = CLASS_NAMES[lang][d.rk[d.rIdx[1]]];
        var colName = SPORT_NAMES[lang][d.ck[d.c]];
        return {
          stem: lang === 'zh' ? rowName1 + '和' + rowName2 + '一共有幾人選' + colName + '？' : 'How many students in total from ' + rowName1 + ' and ' + rowName2 + ' chose ' + colName + '?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {}),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.v1 + ' + ' + d.v2 + ' = ' + d.correct + '。' : d.v1 + ' + ' + d.v2 + ' = ' + d.correct + '.'
        };
      } },
    { id:'extremeRow2D', cat:'table',
      make: function(){
        var rk = shuffle(CLASS_KEYS).slice(0,3);
        var ck = shuffle(SPORT_KEYS).slice(0,4);
        var grid = makeDistinctMarginGrid(3,4,2,9);
        var rowSums = grid.map(function(row){ return sum(row); });
        var wantMax = Math.random() < 0.5;
        var target = wantMax ? Math.max.apply(null, rowSums) : Math.min.apply(null, rowSums);
        var idx = rowSums.indexOf(target);
        return { rk:rk, ck:ck, grid:grid, rowSums:rowSums, wantMax:wantMax, idx:idx };
      },
      fmt: function(d, lang){
        var names = d.rk.map(function(k){ return CLASS_NAMES[lang][k]; });
        var askWord = d.wantMax ? (lang === 'zh' ? '最多' : 'the most') : (lang === 'zh' ? '最少' : 'the fewest');
        return {
          stem: lang === 'zh' ? '哪一班選的運動人數' + askWord + '？' : 'Which class has ' + askWord + ' students in total?',
          picture: build2DTableHtml(d.rk, d.ck, d.grid, lang, {showRowTotal:true}),
          opts: names.slice(), ans: d.idx,
          why: lang === 'zh' ? names[d.idx] + ' 的總人數是 ' + d.rowSums[d.idx] + '，是' + (d.wantMax ? '最多' : '最少') + '的。' : names[d.idx] + ' has a total of ' + d.rowSums[d.idx] + ', the ' + (d.wantMax ? 'highest' : 'lowest') + '.'
        };
      } },
    { id:'tallyCount', cat:'table',
      make: function(){
        var keys = shuffle(TALLY_KEYS).slice(0,3);
        var n = 12 + rand(5);
        var records = [];
        for (var i=0;i<n;i++) records.push(pick(keys));
        var targetKey = pick(keys);
        var correct = records.filter(function(v){ return v === targetKey; }).length;
        var counts = keys.map(function(k){ return records.filter(function(v){ return v === k; }).length; });
        var otherCounts = counts.filter(function(c,i){ return keys[i] !== targetKey; });
        var m = mixOpts(correct, otherCounts.concat([correct+2, Math.max(0, correct-2)]));
        return { keys:keys, records:records, targetKey:targetKey, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var targetName = TALLY_NAMES[lang][d.targetKey];
        var listHtml = '<div class="tblwrap"><div class="tallyrow">' + d.records.map(function(k,i){
          return '<span class="tallychip">' + (i+1) + '. ' + TALLY_NAMES[lang][k] + '</span>';
        }).join('') + '</div></div>';
        return {
          stem: lang === 'zh' ? '這是全班投票想去哪裡玩的紀錄，投「' + targetName + '」的有幾票？' : 'This is how the class voted on where to go. How many votes did “' + targetName + '” get?',
          picture: listHtml,
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? '數一數紀錄裡「' + targetName + '」出現了幾次，總共 ' + d.correct + ' 票。' : 'Count how many times “' + targetName + '” appears in the list — ' + d.correct + ' votes in total.'
        };
      } },
    { id:'addsub', cat:'addsub',
      make: function(){
        var isAdd = Math.random() < 0.5;
        if (isAdd){
          var x = 100 + rand(400), y = 100 + rand(400);
          var correct = x + y;
          var m = mixOpts(correct, [correct-10, correct+10, correct-100]);
          return { isAdd:true, x:x, y:y, correct:correct, opts:m.opts, ans:m.ans };
        } else {
          var p = 300 + rand(600), q = 10 + rand(p - 10);
          var correct2 = p - q;
          var m2 = mixOpts(correct2, [correct2+10, correct2-10, p+q]);
          return { isAdd:false, x:p, y:q, correct:correct2, opts:m2.opts, ans:m2.ans };
        }
      },
      fmt: function(d, lang){
        var op = d.isAdd ? '+' : '−';
        return {
          stem: d.x + ' ' + op + ' ' + d.y + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.x + ' ' + op + ' ' + d.y + ' = ' + d.correct + '。' : d.x + ' ' + op + ' ' + d.y + ' = ' + d.correct + '.'
        };
      } },
    { id:'multiply', cat:'multiply',
      make: function(){
        var a = 12 + rand(87);
        var dd = 2 + rand(8);
        var correct = a * dd;
        var m = mixOpts(correct, [correct + dd, correct - dd, a + dd]);
        return { a:a, d:dd, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: d.a + ' × ' + d.d + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.a + ' × ' + d.d + ' = ' + d.correct + '。' : d.a + ' × ' + d.d + ' = ' + d.correct + '.'
        };
      } },
    { id:'divide', cat:'divide',
      make: function(){
        var divisor = 3 + rand(7);
        var quotient = 4 + rand(9);
        var remainder = rand(divisor);
        var dividend = divisor * quotient + remainder;
        var askRemainder = Math.random() < 0.5;
        var correct = askRemainder ? remainder : quotient;
        var wrongPool = askRemainder ? [remainder+1, Math.max(0, remainder-1), divisor] : [quotient+1, Math.max(1, quotient-1), dividend];
        var m = mixOpts(correct, wrongPool);
        return { divisor:divisor, quotient:quotient, remainder:remainder, dividend:dividend, askRemainder:askRemainder, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var askText = d.askRemainder ? (lang === 'zh' ? '餘多少？' : 'What is the remainder?') : (lang === 'zh' ? '商是多少？' : 'What is the quotient?');
        return {
          stem: d.dividend + ' ÷ ' + d.divisor + ' = ？ ' + askText,
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.dividend + ' ÷ ' + d.divisor + ' = ' + d.quotient + ' 餘 ' + d.remainder + '（因為 ' + d.divisor + ' × ' + d.quotient + ' + ' + d.remainder + ' = ' + d.dividend + '）。' : d.dividend + ' ÷ ' + d.divisor + ' = ' + d.quotient + ' remainder ' + d.remainder + ' (because ' + d.divisor + ' × ' + d.quotient + ' + ' + d.remainder + ' = ' + d.dividend + ').'
        };
      } }
  ];

  /* ---------- 出一批 12 題：9 種表格題型各一題 ＋ 3 個相關主題各一題 ---------- */
  function makePlan(){
    return shuffle(GENS).map(function(g){
      return { gen: g, data: g.make() };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      if (q.picture){
        var pic = document.createElement('div');
        pic.innerHTML = q.picture;
        box.appendChild(pic);
      }
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
