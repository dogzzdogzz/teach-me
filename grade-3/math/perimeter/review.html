<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>周長複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .qshape{display:flex;justify-content:center;margin-bottom:10px}
  .qshape svg{width:100%;max-width:280px;height:auto;display:block}
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>

    <h1 data-i18n="h1">🔁 周長複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：周長、乘法、除法交錯出現，<strong>每一批的數字都是新出的</strong>，
    背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>

    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 形狀繪圖工具（跟上課頁同一套邏輯） ---------- */
  var PXCM = 16, PAD = 40;
  function cmPoint(x, y, maxY){ return { x: PAD + x * PXCM, y: PAD + (maxY - y) * PXCM }; }
  /* 標籤字寬的估計值。SVG 是用字串拼出來的，拼的當下沒辦法量字，
     所以照字元類別估：中日韓一個字約一個字級寬，數字和英文字母窄一些。
     估寬只用來「留位置」，所以刻意乘 1.12 高估 —— 高估只是留白多一點，
     低估會把字裁掉。 */
  function estTextW(s, fs){
    var w = 0, i, c;
    s = String(s);
    for (i = 0; i < s.length; i++){
      c = s.charCodeAt(i);
      if (c >= 0x2E80 && c <= 0xFFEF) w += 1.0;        /* 中日韓 */
      else if (c === 32) w += 0.34;                     /* 空白 */
      else if (c >= 48 && c <= 57) w += 0.62;           /* 數字 */
      else if (c >= 65 && c <= 90) w += 0.98;           /* 大寫（最寬的 W 實測 0.953） */
      else w += 0.90;                                   /* 小寫（最寬的 m 實測 0.884） */
    }
    /* 每一個常數都取該類別**最寬**的那個字，再多留 6%：
       估寬只用來決定「要不要挪開」，高估只是多留白，低估會讓兩個標籤真的疊住
       （後面用 getBBox 的那一關只會把畫布撐大，不會再把標籤挪開）。 */
    return w * fs * 1.06;
  }

  /* 點到線段的距離。 */
  function segDist(px, py, p1, p2){
    var dx = p2.x - p1.x, dy = p2.y - p1.y, L = dx * dx + dy * dy;
    var t = L ? ((px - p1.x) * dx + (py - p1.y) * dy) / L : 0;
    t = Math.max(0, Math.min(1, t));
    return Math.sqrt(Math.pow(px - (p1.x + t * dx), 2) + Math.pow(py - (p1.y + t * dy), 2));
  }
  /* 這個標籤離「自己標的那條邊」是不是比離任何別條邊都近？
     不是的話，孩子會把數字看成在標另一條邊 —— 那就得拉一條引線。 */
  /* 這個字有沒有滑出自己那條邊的**兩端之外**？有的話，超出去幾個 px。
     用 px 而不是用「幾成邊長」：短邊只有 18px，字本身就有 41px 寬，
     一個貼在短邊旁邊的字必然會超出兩端，用比例會把它誤判成跑掉了。 */
  function segOverhang(px, py, p1, p2){
    var dx = p2.x - p1.x, dy = p2.y - p1.y, L = Math.sqrt(dx * dx + dy * dy);
    if (!L) return 0;
    var t = ((px - p1.x) * dx + (py - p1.y) * dy) / (L * L);
    return t < 0 ? -t * L : (t > 1 ? (t - 1) * L : 0);
  }
  function nearestIsOwn(shape, sp, bx, side){
    var cx = (bx.x0 + bx.x1) / 2, cy = (bx.y0 + bx.y1) / 2;
    var p1 = sp[side.from], p2 = sp[side.to];
    var mine = segDist(cx, cy, p1, p2);
    /* ⚠️ 光比距離會漏掉最要命的那一種：字一旦滑到自己那條邊的**外面**，
       它離自己這條邊最近的點、和離隔壁那條邊最近的點，會變成兩條邊**共用的那個角**，
       距離完全相等，於是「沒有別條邊更近」永遠成立 —— 字可以一路飄到天邊還被判合格。
       兩次線上災情都是這樣來的（2 公分和 1 公分顛倒、1 公分跑太上面）。
       所以先要求它得待在自己那條邊的旁邊（投影落在 -0.5～1.5 之間）。 */
    if (segOverhang(cx, cy, p1, p2) > 3 * (side.fs || LABEL_FS)) return false;
    for (var i = 0; i < shape.sides.length; i++){
      var o = shape.sides[i];
      if (o === side) continue;
      if (segDist(cx, cy, sp[o.from], sp[o.to]) < mine - 0.01) return false;
    }
    return true;
  }

  /* 缺角很小的時候（p 或 q 只有 1 公分 ＝ 16px），42px 寬的標籤不可能比
     隔壁那條邊更靠近自己那條 16px 的短邊 —— 位置怎麼挪都沒用。
     這時候拉一條細引線，把字和它標的那條邊接起來，誰標誰就沒有歧義了。
     （2026-08-29 Tony 從線上截圖抓到「2 公分和 1 公分顛倒」，就是這種情形。） */
  function leaderLines(shape, sp, labels){
    var out = '';
    labels.forEach(function(b){
      if (nearestIsOwn(shape, sp, b, b.side)) return;
      var p1 = sp[b.side.from], p2 = sp[b.side.to];
      var tx = (p1.x + p2.x) / 2, ty = (p1.y + p2.y) / 2;
      var cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
      var dx = tx - cx, dy = ty - cy, L = Math.sqrt(dx * dx + dy * dy);
      if (!(L > 1)) return;
      var ux = dx / L, uy = dy / L;
      /* 從方框邊緣起筆，不要從字的正中間穿出來 */
      var hx = (b.x1 - b.x0) / 2, hy = (b.y1 - b.y0) / 2;
      var t = Math.min(hx / Math.max(Math.abs(ux), 1e-6), hy / Math.max(Math.abs(uy), 1e-6));
      var sx = cx + ux * (t + 2), sy = cy + uy * (t + 2);
      if (Math.sqrt(Math.pow(tx - sx, 2) + Math.pow(ty - sy, 2)) < 2) return;
      out += '<line x1="' + sx.toFixed(1) + '" y1="' + sy.toFixed(1) +
             '" x2="' + tx.toFixed(1) + '" y2="' + ty.toFixed(1) +
             '" stroke="#6B6875" stroke-width="1" stroke-dasharray="3 2"/>';
    });
    return out;
  }

  /* 算出每一個標籤的方框，順便處理兩件畫布看不見的事：
     ① **兩個標籤疊在一起**時把後面那一個推開。L 形的缺角很小時，
        「缺角底」和「缺角右」兩個標籤會擠進同一個角落，疊成一團看不懂的字。
     ② 回報標籤真正佔到的範圍，讓畫布容得下它們。
     ⚠️ 原本畫布左右只留固定的 PAD，可是標籤是畫在圖形**外面**的，
     所以「寬 4 公分」這種比較長的標籤會被畫布直接裁掉，畫面上只剩「公分」
     （2026-08-29 Tony 從線上截圖抓到；當時所有檢查都是綠的，
     因為沒有任何一條在問「這個字有沒有落在畫布裡面」）。 */
  function layoutLabels(shape, sp, fs){
    var boxes = [];
    (shape.sides || []).forEach(function(s){
      if (s.label === null || s.label === undefined || s.label === '') return;
      var p1 = sp[s.from], p2 = sp[s.to];
      var mx = (p1.x + p2.x) / 2 + (s.offset ? s.offset.dx : 0);
      var my = (p1.y + p2.y) / 2 + (s.offset ? s.offset.dy : 0);
      var sfs = s.fs || fs;
      var w = estTextW(s.label, sfs);
      var a = s.anchor || 'middle';
      var x0 = (a === 'end') ? mx - w : ((a === 'start') ? mx : mx - w / 2);
      boxes.push({ side:s, x:mx, y:my, anchor:a,
                   fs:sfs, x0:x0, x1:x0 + w, y0:my - sfs * 1.05, y1:my + sfs * 0.34 });
    });
    /* 重疊就把後面那一個挪開。要同時滿足兩件事，缺一不可：
       ① 挪完不再和任何先前的標籤重疊；
       ② 挪完之後，這個標籤**離自己那條邊還是最近的**。
       ⚠️ ② 不是可有可無的講究，是正確性：只顧著「不要疊住」的話，標籤會被推到
       別條邊旁邊，孩子就把數字看成在標另一條邊。實際發生過 —— L 形缺角的
       「1 公分」被往右推了 74px，結果離右邊那條 3 公分的邊最近，
       畫面上看起來就是「2 公分」和「1 公分」標反了（2026-08-29 Tony 從線上截圖抓到）。
       所以候選方向**先試沿著自己那條邊滑動**（滑多遠都還是貼著它），
       再試往外，最後才試垂直方向。 */
    var i, j, k, r, b;
    var clashes = function(bx, upto){
      for (var j2 = 0; j2 < upto; j2++){
        var a2 = boxes[j2];
        var ix = Math.min(a2.x1, bx.x1) - Math.max(a2.x0, bx.x0);
        var iy = Math.min(a2.y1, bx.y1) - Math.max(a2.y0, bx.y0);
        if (ix > 0 && iy > 0) return true;
      }
      return false;
    };
    var ownIsNearest = function(bx, side){ return nearestIsOwn(shape, sp, bx, side); };
    for (i = 1; i < boxes.length; i++){
      b = boxes[i];
      if (!clashes(b, i) && ownIsNearest(b, b.side)) continue;
      var s1 = sp[b.side.from], s2p = sp[b.side.to];
      var ax = s2p.x - s1.x, ay = s2p.y - s1.y;
      var an = Math.sqrt(ax * ax + ay * ay) || 1;
      ax /= an; ay /= an;                                  /* 沿著自己那條邊 */
      var od = b.side.offset || { dx:0, dy:-1 };
      var on = Math.sqrt(od.dx * od.dx + od.dy * od.dy) || 1;
      var ox = od.dx / on, oy = od.dy / on;                 /* 往外離開那條邊 */
      var dirs = [[ax, ay], [-ax, -ay], [ox, oy], [-ay, ax], [ay, -ax]];
      var bfs = b.fs || fs;
      var step = bfs * 0.5, placed = false, fallback = null, fbD = Infinity;
      /* ⚠️ 挪動要有上限。沒有上限的話，標籤可以沿著自己那條邊一路滑到圖形外面 ——
         而且還會通過「離自己那條邊最近」這一關：滑出去以後，自己那條邊和隔壁那條邊
         最近的點都變成它們**共用的那個角**，兩邊距離完全相等，於是永遠判定合格。
         結果就是字飄到很上面、看不出在標哪一條邊
         （2026-08-29 Tony 從線上截圖抓到「1 公分跑太上面了」）。 */
      var MAXR = Math.max(1, Math.floor(MAXPUSH / step));
      for (r = 1; r <= MAXR && !placed; r++){
        for (k = 0; k < dirs.length && !placed; k++){
          var dx2 = dirs[k][0] * step * r, dy2 = dirs[k][1] * step * r;
          var t2 = { x0:b.x0 + dx2, x1:b.x1 + dx2, y0:b.y0 + dy2, y1:b.y1 + dy2 };
          if (clashes(t2, i)) continue;
          /* 退而求其次的時候，挑**離自己那條邊最近**的那一個，不是碰到的第一個。 */
          var od2 = segDist((t2.x0 + t2.x1) / 2, (t2.y0 + t2.y1) / 2, s1, s2p);
          if (od2 < fbD){ fbD = od2; fallback = { d:[dx2, dy2], t:t2 }; }
          if (!ownIsNearest(t2, b.side)) continue;
          b.x += dx2; b.y += dy2;
          b.x0 = t2.x0; b.x1 = t2.x1; b.y0 = t2.y0; b.y1 = t2.y1;
          placed = true;
        }
      }
      /* 兩個條件湊不齊的話，寧可保「不重疊」—— 疊在一起完全讀不到，
         比讀得到但靠得近更糟。 */
      if (!placed && fallback){
        b.x += fallback.d[0]; b.y += fallback.d[1];
        b.x0 = fallback.t.x0; b.x1 = fallback.t.x1; b.y0 = fallback.t.y0; b.y1 = fallback.t.y1;
      }
    }
    return boxes;
  }


  /* ⚠️ 上面的估寬只是「拼字串當下的近似值」，字型換了就不準。
     真正保證不會被裁掉的是這一段：圖插進畫面之後，用瀏覽器**量到的**實際範圍
     把 viewBox 撐大。只會變大、不會變小，所以原本的留白都還在。
     用 MutationObserver 是為了不必在每一個插入點各記一次 ——
     漏記一個，就會再出現一次「寬 4 公分只剩公分」那種缺陷。 */
  function fitSceneSVG(svg){
    var bb;
    try { bb = svg.getBBox(); } catch(e){ return; }
    if (!bb || !isFinite(bb.width) || bb.width <= 0 || bb.height <= 0) return;
    var vb = (svg.getAttribute('viewBox') || '').split(/\s+/).map(Number);
    if (vb.length !== 4) return;
    for (var k = 0; k < 4; k++) if (!isFinite(vb[k])) return;
    var m = 3;
    var x0 = Math.min(vb[0], bb.x - m), y0 = Math.min(vb[1], bb.y - m);
    var x1 = Math.max(vb[0] + vb[2], bb.x + bb.width + m);
    var y1 = Math.max(vb[1] + vb[3], bb.y + bb.height + m);
    if (x0 === vb[0] && y0 === vb[1] && x1 === vb[0] + vb[2] && y1 === vb[1] + vb[3]) return;
    svg.setAttribute('viewBox', x0.toFixed(1) + ' ' + y0.toFixed(1) + ' ' +
                                (x1 - x0).toFixed(1) + ' ' + (y1 - y0).toFixed(1));
  }
  /* ⚠️ 只處理 renderShape 畫出來的圖（class="scene"）。
     不可以對頁面上每一個 <svg> 都做 —— 有些圖是**故意**讓內容超出 viewBox 來裁切的，
     把它的畫布撐大會把本來看不到的部分露出來，等於改掉那張圖。 */
  function fitScenesIn(root){
    if (!root || root.nodeType !== 1) return;
    if (root.tagName && String(root.tagName).toLowerCase() === 'svg' &&
        root.classList && root.classList.contains('scene')) fitSceneSVG(root);
    var list = root.querySelectorAll ? root.querySelectorAll('svg.scene') : [];
    for (var i = 0; i < list.length; i++) fitSceneSVG(list[i]);
  }
  function watchScenes(){
    fitScenesIn(document.body);
    if (typeof MutationObserver !== 'function') return;
    /* 只看 childList：改 viewBox 是屬性變動，不會再觸發自己。 */
    new MutationObserver(function(muts){
      for (var i = 0; i < muts.length; i++)
        for (var j = 0; j < muts[i].addedNodes.length; j++) fitScenesIn(muts[i].addedNodes[j]);
    }).observe(document.body, { childList:true, subtree:true });
  }

      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var shapeDiv = document.createElement('div');
      shapeDiv.className = 'qshape';
      shapeDiv.innerHTML = q.shape;
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c);
      if (shapeDiv.innerHTML) box.appendChild(shapeDiv);
      box.appendChild(stem); box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
  watchScenes();
})();
</script>
</body>
</html>
