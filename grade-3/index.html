<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三年級數學 — teach-me</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --blue:#3B7DD8; --blue-soft:#E8F0FB; --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .crumb{font-size:15px;color:var(--muted)}
  .crumb a{color:var(--blue);text-decoration:none}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(28px,6vw,42px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .soonbox{
    background:var(--green-soft);border:2px solid var(--green);border-radius:20px;
    padding:18px 22px;margin:26px 0;font-size:16px;text-align:center;
  }
  .soonbox a{color:var(--green);font-weight:700}
  .strand{margin-top:32px}
  .strand h2{font-size:20px;padding-left:12px}
  .strand p{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;margin-top:8px;font-size:15px;color:var(--muted);
  }
  .lessons{display:grid;gap:14px;margin-top:14px}
  .lesson{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 20px;box-shadow:0 4px 14px rgba(70,60,40,.06);
  }
  .badge{font-size:34px;line-height:1}
  .lesson .info{flex:1;min-width:180px}
  .lesson h3{font-size:18px}
  .lesson h3 a{color:var(--ink);text-decoration:none}
  .lesson h3 a:hover{color:var(--green)}
  .lesson .info p{font-size:14px;color:var(--muted);background:none;border:0;padding:0;margin:2px 0 0}
  .plinks{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
  .plinks a{
    text-decoration:none;font-size:14px;font-weight:700;border-radius:999px;
    padding:5px 14px;border:2px solid var(--line);color:var(--ink);background:var(--bg);
  }
  .plinks a:first-child{background:var(--green);border-color:var(--green);color:#fff}
  .plinks a:hover{border-color:var(--green)}
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <nav class="crumb"><a href="../index.html" data-i18n="crumbHome">🏠 首頁</a> › <span data-i18n="crumbHere">三年級數學</span></nav>
    <button class="langbtn" id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

  <header>
    <h1 data-i18n="h1">🎒 三年級數學</h1>
    <p data-i18n="sub">這個年級要學什麼，先看這裡</p>
  </header>


  <section class="strand">
    <h2 style="border-left:8px solid var(--green)" data-i18n="sh0">數與計算</h2>
    <div class="lessons">
      <div class="lesson"><span class="badge">✖️</span>
        <span class="info"><h3><a href="math/multiply/" data-i18n="n1T"></a></h3><p data-i18n="n1D"></p></span>
        <span class="plinks"><a href="math/multiply/" data-i18n="pL">📖</a><a href="math/multiply/reference.html" data-i18n="pR">🗂️</a><a href="math/multiply/review.html" data-i18n="pV">🔁</a><a href="math/multiply/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
      <div class="lesson"><span class="badge">➗</span>
        <span class="info"><h3><a href="math/divide/" data-i18n="n2T"></a></h3><p data-i18n="n2D"></p></span>
        <span class="plinks"><a href="math/divide/" data-i18n="pL">📖</a><a href="math/divide/reference.html" data-i18n="pR">🗂️</a><a href="math/divide/review.html" data-i18n="pV">🔁</a><a href="math/divide/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
      <div class="lesson"><span class="badge">🍰</span>
        <span class="info"><h3><a href="math/fraction/" data-i18n="n3T"></a></h3><p data-i18n="n3D"></p></span>
        <span class="plinks"><a href="math/fraction/" data-i18n="pL">📖</a><a href="math/fraction/reference.html" data-i18n="pR">🗂️</a><a href="math/fraction/review.html" data-i18n="pV">🔁</a><a href="math/fraction/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
    </div>
    <p data-i18n="sc0">一萬以內的數、乘除直式、分數與一位小數入門</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--orange)" data-i18n="sh1">量與實測</h2>
    <p data-i18n="sc1">毫米、公斤公克、公升毫升、時分秒</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--blue)" data-i18n="sh2">空間與形狀</h2>
    <div class="lessons">
      <div class="lesson"><span class="badge">📏</span>
        <span class="info"><h3><a href="math/perimeter/" data-i18n="n4T"></a></h3><p data-i18n="n4D"></p></span>
        <span class="plinks"><a href="math/perimeter/" data-i18n="pL">📖</a><a href="math/perimeter/reference.html" data-i18n="pR">🗂️</a><a href="math/perimeter/review.html" data-i18n="pV">🔁</a><a href="math/perimeter/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
    </div>
    <p data-i18n="sc2">角、正方形長方形、圓與圓規、周長</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #9C6ADE" data-i18n="sh3">關係</h2>
    <p data-i18n="sc3">算式填充題</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #D64545" data-i18n="sh4">資料與統計</h2>
    <p data-i18n="sc4">報讀生活中的表格</p>
  </section>

  <footer data-i18n="footer">teach-me · 慢慢學，學得牢</footer>
</div>

<script>
(function(){
  "use strict";
  var I18N = {
    "zh": {
        "htmlLang": "zh-Hant",
        "title": "三年級數學 — teach-me",
        "btn": "EN",
        "crumbHome": "🏠 首頁",
        "crumbHere": "三年級數學",
        "h1": "🎒 三年級數學",
        "sub": "4 堂課，每堂都有：📖 上課 · 🗂️ 速查卡 · 🔁 複習挑戰 · 👨‍👩‍👧 給家長",
        "footer": "teach-me · 慢慢學，學得牢",
                "n1T": "直式乘法工廠 — 乘法",
        "n1D": "拆成十和個再合起來，看懂第二排為什麼往左移",
        "n2T": "分東西大隊 — 除法",
        "n2D": "等分除與包含除兩種故事，餘數一定比除數小",
        "n3T": "分數蛋糕店 — 分數",
        "n3D": "要平分才算分數；分母越大，每一份反而越小",
        "n4T": "繞一圈量量看 — 周長",
        "n4D": "繞一圈的長度就是周長，別跟面積搞混",
        "pL": "📖 上課", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "sh0": "數與計算",
        "sc0": "🌱 這個領域還沒有課程的單元：一萬以內的數、三四位數的加減、兩步驟問題與併式、一位小數",
        "sh1": "量與實測",
        "sc1": "🌱 這個領域的課程準備中：毫米與公里、公斤公克、公升毫升、時分秒的計算",
        "sh2": "空間與形狀",
        "sc2": "🌱 這個領域還沒有課程的單元：角的認識、正方形與長方形的性質、圓與圓規",
        "sh3": "關係",
        "sc3": "🌱 這個領域的課程準備中：算式填充題（用（　）代表未知的數）",
        "sh4": "資料與統計",
        "sc4": "🌱 這個領域的課程準備中：報讀生活中的一維與二維表格"
    },
    "en": {
        "htmlLang": "en",
        "title": "Grade 3 Math — teach-me",
        "btn": "中",
        "crumbHome": "🏠 Home",
        "crumbHere": "Grade 3 Math",
        "h1": "🎒 Grade 3 Math",
        "sub": "4 lessons — each with 📖 Lesson · 🗂️ Cheat sheet · 🔁 Review · 👨‍👩‍👧 For parents",
        "footer": "teach-me · learn slowly, remember firmly",
                "n1T": "The Column Multiplication Factory",
        "n1D": "Split into tens and ones — and see why the second row shifts left",
        "n2T": "The Sharing Squad — Division",
        "n2D": "Two sharing stories, and why the remainder is always smaller",
        "n3T": "The Fraction Bakery",
        "n3D": "Pieces must be equal; a bigger denominator means smaller pieces",
        "n4T": "Once Around the Edge — Perimeter",
        "n4D": "The distance around the outside — not to be confused with area",
        "pL": "📖 Lesson", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "sh0": "Numbers & Operations",
        "sc0": "🌱 Not covered yet: numbers to 10 000, 3–4 digit addition and subtraction, two-step problems, one-place decimals",
        "sh1": "Measurement",
        "sc1": "🌱 Lessons on the way: millimetres and kilometres, kilograms and grams, litres and millilitres, time calculations",
        "sh2": "Space & Shape",
        "sc2": "🌱 Not covered yet: angles, properties of squares and rectangles, circles and the compass",
        "sh3": "Relations",
        "sc3": "🌱 Lessons on the way: filling in the missing number in an equation",
        "sh4": "Data & Statistics",
        "sc4": "🌱 Lessons on the way: reading everyday tables"
    }
};

  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var btn = document.getElementById('langBtn');

  function applyLang(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    btn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (d[key] !== undefined) nodes[i].innerHTML = d[key];
    }
  }

  btn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>
