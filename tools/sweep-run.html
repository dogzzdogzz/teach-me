<!doctype html><meta charset="utf-8"><title>sweep runner</title>
<pre id="out">running…</pre>
<script src="sweep-lib.js"></script>
<script>
(async function(){
  const out = document.getElementById('out');
  try{
    const all = await (await fetch('/tools/paths.json')).json();
    const only = new URLSearchParams(location.search).get('only');
    const PATHS = only ? all.filter(p => p.indexOf(only) >= 0) : all;
    const lines = ['pages: ' + PATHS.length];
    for (const lang of ['zh','en']){
      const r = await runSweep(PATHS, lang);
      lines.push(lang + ': ' + (r.length ? JSON.stringify(r, null, 1) : 'clean'));
    }
    const reviews = PATHS.filter(p => p.endsWith('/review.html'));
    if (reviews.length){
      const o = await sweepOptions(reviews, 10);
      lines.push('options: ' + (o && o.length ? JSON.stringify(o, null, 1) : 'clean'));
    }
    out.textContent = 'DONE\n' + lines.join('\n');
  }catch(e){ out.textContent = 'DRIVER ERROR: ' + (e && e.stack || e); }
})();
</script>
