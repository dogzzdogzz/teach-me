<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錢幣複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
    --coin1:#B08C5A; --coin5:#6C8EBF; --coin10:#D4A017; --coin50:#8E6FB0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:18px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:17px;font-weight:700;cursor:pointer;min-height:44px;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,6vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:17px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:19px}
  .stempic{margin:8px 0}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;
    font-size:18px;cursor:pointer;color:var(--ink);min-height:44px;
  }
  .opt.pic{padding:8px}
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:16px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:12px 22px;cursor:pointer;margin-top:16px;min-height:44px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:17px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課（互動教學）</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡（重點整理）</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長（陪讀指引）</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 錢幣複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：錢幣、數字、湊十、加減交錯出現，<strong>每一批的數字都是新出的</strong>。<br>
    建議<strong>隔一天來一次</strong>。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 硬幣圖（語言無關） ---------- */
  var COIN_SIZE = {1:44, 5:50, 10:56, 50:64};
  var COIN_COLOR = {1:'var(--coin1)', 5:'var(--coin5)', 10:'var(--coin10)', 50:'var(--coin50)'};
  var DENOMS = [1, 5, 10, 50];

  function coinSVG(value, size){
    size = size || COIN_SIZE[value];
    var color = COIN_COLOR[value];
    var r = size / 2 - 2;
    var fs = value === 50 ? size * 0.34 : size * 0.38;
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" aria-hidden="true">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="' + color + '" stroke="#2B2A33" stroke-width="2"></circle>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + (r - 5) + '" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.6"></circle>' +
      '<text x="' + size / 2 + '" y="' + (size / 2 + fs * 0.35) + '" font-size="' + fs + '" font-weight="700" fill="#ffffff" text-anchor="middle">' + value + '</text>' +
    '</svg>';
  }
  function coinGroupHTML(values, size){ return values.map(function(v){ return coinSVG(v, size); }).join(''); }
  function sum(arr){ return arr.reduce(function(a, b){ return a + b; }, 0); }

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'錢幣複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 錢幣複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：錢幣、數字、湊十、加減交錯出現，<strong>每一批的數字都是新出的</strong>。<br>建議<strong>隔一天來一次</strong>。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Money Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Money Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving money, numbers, number bonds and addition — <strong>every batch uses fresh numbers</strong>.<br>Come back <strong>a day later</strong>.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { money:'錢幣', numbers:'數字', bonds:'湊十', addsub:'加減' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: '<b>再想想看。</b> ',
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { money:'🪙 錢幣 — 小小收銀員', numbers:'🔢 數字 — 數字探險隊', bonds:'🤝 湊十 — 好朋友配對', addsub:'🚂 加減 — 加加減減小火車' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { money:'Money', numbers:'Numbers', bonds:'Number bonds', addsub:'Add & subtract' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: '<b>Try thinking again.</b> ',
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { money:'🪙 Money — The Little Cashier', numbers:'🔢 Numbers — The Number Explorers', bonds:'🤝 Number Bonds — Number Buddies', addsub:'🚂 Add & Subtract — The Train' }
    }
  };

  var LINK_HREFS = { money:'index.html', numbers:'../numbers/', bonds:'../number-bonds/', addsub:'../add-sub/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 一年級的數在 100 以內：錢數題的選項不可以超過 100（換錢題 50、湊十 10、加減 20 各自更窄） */
  var MAX_OPT = 100;
  /* 給出 3 個相異、大於 0、且不等於正解的錯誤選項（avoid 與 max 把可用的數字擠到不夠時會少回傳幾個 ——
     那時 simgen 的選項數檢查會響，不會卡死）。
     avoid：題幹上已經印出來、但「不是」刻意迷思誘答的那些數字 —— 先當成已用過，候選與 ±step 保底
     都不會再端出來（孩子看到題幹上的數字又出現在選項裡，那不是誘答，是抄題）。
     max：這一題的上限，明寫的候選與保底都不可以超過（2026-09-15，比照其他一年級的課）。 */
  function makeWrongs(correct, candidates, avoid, max){
    max = max || MAX_OPT;
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (avoid || []).forEach(function(v){ seen[String(v)] = true; });
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (c > 0 && c <= max && !seen[key]){ seen[key] = true; out.push(c); }
    });
    for (var step = 1; out.length < 3 && step <= max; step++){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && hi <= max && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
    }
    return out.slice(0, 3);
  }
  /* 題幹上的數字，扣掉 keep（刻意拿來當誘答的那幾個），其餘都不可以出現在選項裡 */
  function avoidExcept(stemNums, keep){
    return stemNums.filter(function(v){ return keep.indexOf(v) < 0; });
  }
  /* 抽 n 個硬幣，總額不可以超過 100（一年級的數在 100 以內；3 個 50 元就會衝到 150） */
  function pickCoins(n){
    var coins;
    for (var tries = 0; tries < 100; tries++){
      coins = []; for (var i = 0; i < n; i++) coins.push(pick(DENOMS));
      if (sum(coins) <= MAX_OPT) return coins;
    }
    /* 100 次都抽到超過 100（機率極小）：退而給 n 個 1 元，總額一定在範圍內 */
    coins = []; for (var j = 0; j < n; j++) coins.push(1);
    return coins;
  }
  function mixOpts(correct, candidates, avoid, max){
    var wrongs = makeWrongs(correct, candidates, avoid, max);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器 ---------- */
  var EXPAIRS = [[5,1],[10,1],[10,5],[50,10],[50,5],[50,1]];

  var GENS = [
    { id:'identifyCoin', cat:'money',
      make: function(){
        var target = pick(DENOMS);
        var order = shuffle(DENOMS.slice());
        return { target:target, order:order, ans:order.indexOf(target) };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '哪一個是 ' + d.target + ' 元？' : 'Which one is $' + d.target + '?',
          optPics: d.order.map(function(v){ return { values:[v] }; }),
          opts: d.order.map(String), ans: d.ans,
          why: lang === 'zh' ? d.target + ' 元上面寫著「' + d.target + '」。' : 'The $' + d.target + ' coin has "' + d.target + '" printed on it.'
        };
      } },
    { id:'sumTwoCoins', cat:'money',
      make: function(){
        var a = pick(DENOMS), b = pick(DENOMS);
        var s = a + b;
        var m = mixOpts(s, [a, b, s - 5, s + 5]);
        return { a:a, b:b, s:s, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stemPic: [d.a, d.b],
          stem: lang === 'zh' ? '這些錢合起來是多少元？' : 'How much is this altogether?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.a + ' + ' + d.b + ' = ' + d.s + '。' : d.a + ' + ' + d.b + ' = ' + d.s + '.'
        };
      } },
    { id:'sumThreeCoins', cat:'money',
      make: function(){
        var three = pickCoins(3);
        var a = three[0], b = three[1], c = three[2];
        var s = a + b + c;
        var m = mixOpts(s, [s - 5, s + 5, s - 10, a + b, b + c]);
        return { a:a, b:b, c:c, s:s, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stemPic: [d.a, d.b, d.c],
          stem: lang === 'zh' ? '這些錢合起來是多少元？' : 'How much is this altogether?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.a + ' + ' + d.b + ' + ' + d.c + ' = ' + d.s + '。' : d.a + ' + ' + d.b + ' + ' + d.c + ' = ' + d.s + '.'
        };
      } },
    { id:'comparePiles', cat:'money',
      make: function(){
        var na = 1 + rand(3), nb = 1 + rand(3);
        var pileA, pileB, sa, sb;
        for (var tries = 0; tries < 30; tries++){
          pileA = pickCoins(na);
          pileB = pickCoins(nb);
          sa = sum(pileA); sb = sum(pileB);
          if (sa !== sb) break;
        }
        /* 30 次都一樣多（機率極小）：把 B 換成一個 1 元（A 也是 1 元時換成 5 元），一定不同而且不超過 100 */
        if (sa === sb){ pileB = sa === 1 ? [5] : [1]; sb = sum(pileB); }
        return { pileA:pileA, pileB:pileB, sa:sa, sb:sb, ans: sa > sb ? 0 : 1 };
      },
      fmt: function(d, lang){
        var big = Math.max(d.sa, d.sb);
        return {
          stem: lang === 'zh' ? '哪一堆錢比較多？' : 'Which pile is worth more?',
          optPics: [ { values:d.pileA }, { values:d.pileB } ],
          opts: [String(d.sa), String(d.sb)], ans: d.ans,
          why: lang === 'zh' ? '一堆是 ' + d.sa + ' 元，一堆是 ' + d.sb + ' 元，' + big + ' 比較多。' : 'One pile is $' + d.sa + ', the other is $' + d.sb + '. $' + big + ' is more.'
        };
      } },
    { id:'exchangeCount', cat:'money',
      make: function(){
        var pr = pick(EXPAIRS);
        var big = pr[0], small = pr[1];
        var count = big / small;
        /* 誘答刻意放 big（把面額當個數）；count − 1 在 10 換 5 時是 1，那是「一個換一個」的迷思
           （上課頁進階題就放了 1），也刻意留；small 不可以出現。換錢的個數最多 50。 */
        var m = mixOpts(count, [count - 1, count + 1, big], avoidExcept([1, big, small], [1, big]), 50);
        return { big:big, small:small, count:count, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stemPic: [d.big],
          stem: lang === 'zh' ? '1 個 ' + d.big + ' 元換成 ' + d.small + ' 元，可以換幾個？' : 'You exchange one $' + d.big + ' coin for $' + d.small + ' coins. How many do you get?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.big + ' ÷ ' + d.small + ' = ' + d.count + '。' : d.big + ' ÷ ' + d.small + ' = ' + d.count + '.'
        };
      } },
    { id:'payExact', cat:'money',
      make: function(){
        var n = 2 + rand(2);
        var correct = pickCoins(n);
        var price = sum(correct);
        var groups = [correct];
        var sums = {}; sums[String(price)] = true;
        var guard = 0;
        while (groups.length < 4 && guard < 200){
          guard++;
          var gn = 2 + rand(2);
          var g = pickCoins(gn);
          var s = sum(g);
          if (!sums[String(s)]){ sums[String(s)] = true; groups.push(g); }
        }
        var order = shuffle(groups.map(function(g, i){ return { g:g, correct: i === 0 }; }));
        var ans = order.map(function(o){ return o.correct; }).indexOf(true);
        return { price:price, groups:order.map(function(o){ return o.g; }), ans:ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '要付 ' + d.price + ' 元，哪一組正好？' : 'To pay $' + d.price + ', which group is exactly right?',
          optPics: d.groups.map(function(g){ return { values:g }; }),
          opts: d.groups.map(function(g){ return String(sum(g)); }), ans: d.ans,
          why: lang === 'zh' ? d.groups[d.ans].join('+') + ' = ' + d.price + '。' : d.groups[d.ans].join('+') + ' = ' + d.price + '.'
        };
      } },
    { id:'missingChange', cat:'money',
      make: function(){
        var paid = pick([10, 20, 50, 60, 100]);
        var price = 1 + rand(paid - 1);
        var change = paid - price;
        /* 誘答刻意放 price（把價錢當成找的錢）；paid 不可以出現（price = 5 時 change + 5 就是 paid） */
        var m = mixOpts(change, [change - 5, change + 5, price], avoidExcept([paid, price], [price]));
        return { paid:paid, price:price, change:change, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '付 ' + d.paid + ' 元買 ' + d.price + ' 元的東西，要找多少錢？' : 'You pay $' + d.paid + ' for something that costs $' + d.price + '. How much change do you get?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.paid + ' − ' + d.price + ' = ' + d.change + '。' : d.paid + ' − ' + d.price + ' = ' + d.change + '.'
        };
      } },
    { id:'countTotalHandful', cat:'money',
      make: function(){
        var n = 2 + rand(3);
        var coins = pickCoins(n);
        var s = sum(coins);
        var m = mixOpts(s, [s - 5, s + 5, s - 10, s + 10]);
        return { coins:coins, s:s, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stemPic: d.coins,
          stem: lang === 'zh' ? '這些錢合起來是多少元？' : 'How much is this altogether?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.coins.join(' + ') + ' = ' + d.s + '。' : d.coins.join(' + ') + ' = ' + d.s + '.'
        };
      } },
    { id:'numbersCompare', cat:'numbers',
      make: function(){
        var a = 10 + rand(90), b = 10 + rand(90);
        var guard = 0;
        while (b === a && guard < 20){ b = 10 + rand(90); guard++; }
        if (b === a) b = a === 99 ? a - 1 : a + 1;
        return { a:a, b:b, ans: a > b ? 0 : 1 };
      },
      fmt: function(d, lang){
        var big = Math.max(d.a, d.b);
        return {
          stem: lang === 'zh' ? '哪個數字比較大？' : 'Which number is bigger?',
          opts: [String(d.a), String(d.b)], ans: d.ans,
          why: lang === 'zh' ? d.a + ' 和 ' + d.b + ' 比，' + big + ' 比較大。' : 'Between ' + d.a + ' and ' + d.b + ', ' + big + ' is bigger.'
        };
      } },
    { id:'bondsMakeTen', cat:'bonds',
      make: function(){
        var n = 1 + rand(9);
        var partner = 10 - n;
        /* 誘答刻意放 n（把已知的數抄回來）；題幹上的 10 不可以出現（n = 1 時 partner + 1 就是 10） */
        var m = mixOpts(partner, [n, partner - 1, partner + 1], avoidExcept([n, 10], [n]), 10);
        return { n:n, partner:partner, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.n + ' 和幾湊成 10？' : 'What number pairs with ' + d.n + ' to make 10?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.n + ' + ' + d.partner + ' = 10。' : d.n + ' + ' + d.partner + ' = 10.'
        };
      } },
    { id:'addsubStory', cat:'addsub',
      make: function(){
        var a = 1 + rand(10), b = 1 + rand(20 - a);
        var s = a + b;
        /* 誘答刻意放 |a − b|（該加卻減）；它有時剛好等於 a 或 b，那仍是同一個迷思，其餘的加數不可以出現。
           20 以內的加減，選項不超過 20。 */
        var m = mixOpts(s, [s - 1, s + 1, Math.abs(a - b)], avoidExcept([a, b], [Math.abs(a - b)]), 20);
        return { a:a, b:b, s:s, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '小明有 ' + d.a + ' 顆糖，又得到 ' + d.b + ' 顆，一共幾顆？' : 'Jay has ' + d.a + ' candies and gets ' + d.b + ' more. How many does he have now?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? d.a + ' + ' + d.b + ' = ' + d.s + '。' : d.a + ' + ' + d.b + ' = ' + d.s + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：11 種題型各一題＋隨機 1 題錢幣加碼 ---------- */
  var EXTRA_POOL = GENS.filter(function(g){
    return ['sumTwoCoins','sumThreeCoins','countTotalHandful','payExact','exchangeCount'].indexOf(g.id) >= 0;
  });

  function makePlan(){
    var slots = GENS.slice();
    slots.push(pick(EXTRA_POOL));
    return shuffle(slots).map(function(g){ return { gen:g, data:g.make() }; });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.textContent = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt';
        if (q.optPics){
          b.classList.add('pic');
          b.innerHTML = coinGroupHTML(q.optPics[oi].values, 34);
          b.setAttribute('aria-label', opt);
        } else {
          b.textContent = opt;
        }
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      if (q.stemPic){
        var pic = document.createElement('div');
        pic.className = 'stempic';
        pic.innerHTML = coinGroupHTML(q.stemPic);
        box.appendChild(pic);
      }
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
