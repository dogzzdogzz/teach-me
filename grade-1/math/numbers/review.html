<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數字探險隊複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.8; font-size:19px;
  }
  .wrap{max-width:880px;margin:0 auto;padding:28px 18px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:17px;font-weight:700;cursor:pointer;min-height:44px;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted);font-weight:700}
  a.home{color:var(--blue);font-size:16px}
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(30px,6vw,42px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:18px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:22px 0;font-size:17px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:2px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:2px 10px;margin-left:6px;
  }
  .stem{margin:10px 0 14px;font-size:20px;text-align:center}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 8px;
    font-size:20px;cursor:pointer;color:var(--ink);min-height:56px;font-weight:700;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:16px;color:var(--muted);text-align:center;min-height:22px}
  .scoreboard{
    display:flex;gap:20px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:17px;justify-content:center;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:17px;display:none;text-align:center;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:14px;background:var(--green);color:#fff;font-size:18px;
    font-weight:700;padding:12px 24px;cursor:pointer;margin-top:16px;min-height:48px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:17px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 數字探險隊複習挑戰</h1>
    <p data-i18n="sub">憑記憶答題，想起來的那一刻，才是真的記住</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：數數、位值、比大小、排隊順序交錯出現，<strong>每一批數字都是新出的</strong>。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  function zhDigit(n){ return ['〇','一','二','三','四','五','六','七','八','九'][n]; }
  function zhNum(n){
    if (n === 100) return '一百';
    if (n < 10) return zhDigit(n);
    if (n < 20){ var o = n % 10; return '十' + (o ? zhDigit(o) : ''); }
    var t = Math.floor(n / 10), o2 = n % 10;
    return zhDigit(t) + '十' + (o2 ? zhDigit(o2) : '');
  }
  function enNum(n){
    var ones = ['','one','two','three','four','five','six','seven','eight','nine'];
    var teens = ['ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
    var tensW = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
    if (n === 100) return 'one hundred';
    if (n < 10) return ones[n];
    if (n < 20) return teens[n - 10];
    var t = Math.floor(n / 10), o = n % 10;
    return tensW[t] + (o ? '-' + ones[o] : '');
  }

  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'數字探險隊複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 數字探險隊複習挑戰',
      sub:'憑記憶答題，想起來的那一刻，才是真的記住',
      intro:'12 題<strong>混合題</strong>：數數、位值、比大小、排隊順序交錯出現，<strong>每一批數字都是新出的</strong>。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Number Explorers Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Number Explorers Review Challenge',
      sub:'Answer from memory — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving counting, place value, comparing and lining-up — <strong>every batch uses fresh numbers</strong>.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn:function(i){ return '第 ' + i + ' 題'; },
      cats:{ counting:'數數', placevalue:'位值', compare:'比大小', ordinal:'排隊順序' },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll:function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來玩一次。'; },
      resSome:function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目類別：'; },
      indexLink:'📖 回上課頁重看', refLink:'🗂️ 打開速查卡'
    },
    en: {
      qn:function(i){ return 'Question ' + i; },
      cats:{ counting:'Counting', placevalue:'Place value', compare:'Comparing', ordinal:'Lining up' },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll:function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow.'; },
      resSome:function(r, n){ return 'You got ' + r + '/' + n + '. Categories to review:'; },
      indexLink:'📖 Revisit the lesson', refLink:'🗂️ Open the cheat sheet'
    }
  };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (c > 0 && c <= 100 && !seen[key]){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3 && step < 200){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && lo <= 100 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && hi > 0 && hi <= 100 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  function twoNumberOpts(a, b){
    var big = Math.max(a, b), small = Math.min(a, b);
    var extras = [], delta = 1;
    while (extras.length < 2 && delta < 200){
      var c1 = big - delta, c2 = big + delta;
      if (c1 > 0 && c1 !== a && c1 !== b && extras.indexOf(c1) < 0) extras.push(c1);
      if (extras.length < 2 && c2 > 0 && c2 <= 100 && c2 !== a && c2 !== b && extras.indexOf(c2) < 0) extras.push(c2);
      delta++;
    }
    var opts = shuffle([a, b].concat(extras));
    return { opts: opts, ans: opts.indexOf(big), big: big, small: small };
  }

  var ANIMALS = ['🐰', '🐢', '🐱', '🐶', '🐥', '🦊', '🐻', '🐸'];

  /* ---------- 題目產生器：每次 make() 都用新數字，8 種題型 ---------- */
  var GENS = [
    { id:'countBy', cat:'counting',
      make: function(){
        var k = pick([2, 5, 10]);
        var n = 4 + rand(6); // 4..9
        var ans = k * n;
        var m = mixOpts(ans, [ans - k, ans + k, (n - 1) * k, (n + 1) * k]);
        return { k:k, n:n, ans:ans, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.k + '、' + (d.k * 2) + '、' + (d.k * 3) + '……這樣數下去，第 ' + d.n + ' 個是多少？'
            : 'Counting ' + d.k + ', ' + (d.k * 2) + ', ' + (d.k * 3) + ' ... what is the ' + d.n + numSuffix(d.n) + ' number?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? d.k + ' 個 ' + d.k + ' 個數，第 ' + d.n + ' 個是 ' + d.k + ' × ' + d.n + ' = ' + d.ans + '。'
            : 'Counting by ' + d.k + 's, the ' + d.n + numSuffix(d.n) + ' number is ' + d.k + ' × ' + d.n + ' = ' + d.ans + '.'
        };
      } },
    { id:'buildNumber', cat:'placevalue',
      make: function(){
        var tens = 1 + rand(9), ones = rand(10);
        var ans = tens * 10 + ones;
        var rev = ones * 10 + tens;
        var m = mixOpts(ans, [rev, tens + ones, ans + 10, ans - 10]);
        return { tens:tens, ones:ones, ans:ans, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.tens + ' 個十和 ' + d.ones + ' 個一，合起來是多少？'
            : d.tens + ' tens and ' + d.ones + ' ones make what number?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? d.tens + ' 個十是 ' + (d.tens * 10) + '，再加 ' + d.ones + ' 個一，是 ' + d.ans + '。'
            : d.tens + ' tens is ' + (d.tens * 10) + ', plus ' + d.ones + ' ones makes ' + d.ans + '.'
        };
      } },
    { id:'decomposeTens', cat:'placevalue',
      make: function(){
        var num = 10 + rand(90);
        var tens = Math.floor(num / 10), ones = num % 10;
        var m = mixOpts(tens, [ones, num, tens * 10, tens + 1]);
        return { num:num, tens:tens, ones:ones, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.num + ' 有幾個十？' : 'In ' + d.num + ', how many tens are there?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? d.num + ' 的十位是 ' + d.tens + '，所以有 ' + d.tens + ' 個十。'
            : 'The tens digit of ' + d.num + ' is ' + d.tens + ', so there are ' + d.tens + ' tens.'
        };
      } },
    { id:'decomposeOnes', cat:'placevalue',
      make: function(){
        var num = 10 + rand(90);
        var tens = Math.floor(num / 10), ones = num % 10;
        var m = mixOpts(ones === 0 ? 0 : ones, [tens, num, ones + 1, Math.max(0, ones - 1)]);
        return { num:num, tens:tens, ones:ones, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.num + ' 有幾個一？' : 'In ' + d.num + ', how many ones are there?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? d.num + ' 的個位是 ' + d.ones + '，所以有 ' + d.ones + ' 個一。'
            : 'The ones digit of ' + d.num + ' is ' + d.ones + ', so there are ' + d.ones + ' ones.'
        };
      } },
    { id:'compareLarger', cat:'compare',
      make: function(){
        var a, b;
        do { a = 10 + rand(90); b = 10 + rand(90); } while (a === b);
        var t = twoNumberOpts(a, b);
        return { a:a, b:b, opts:t.opts, answerIdx:t.ans, big:t.big, small:t.small };
      },
      fmt: function(d, lang){
        var sameT = Math.floor(d.a / 10) === Math.floor(d.b / 10);
        return {
          stem: lang === 'zh' ? d.a + ' 和 ' + d.b + '，哪個比較大？' : d.a + ' and ' + d.b + ' — which is bigger?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? (sameT
                ? '十位一樣，個位 ' + (d.big % 10) + ' 比 ' + (d.small % 10) + ' 大，所以 ' + d.big + ' 比較大。'
                : '十位 ' + Math.floor(d.big / 10) + ' 比 ' + Math.floor(d.small / 10) + ' 大，所以 ' + d.big + ' 比較大。')
            : (sameT
                ? 'Same tens digit; ' + (d.big % 10) + ' is bigger than ' + (d.small % 10) + ' in the ones place, so ' + d.big + ' is bigger.'
                : 'Tens digit ' + Math.floor(d.big / 10) + ' is bigger than ' + Math.floor(d.small / 10) + ', so ' + d.big + ' is bigger.')
        };
      } },
    { id:'nextPrevNumber', cat:'counting',
      make: function(){
        var base = 2 + rand(97); // 2..98
        var dir = pick(['next', 'prev']);
        if (base <= 1) dir = 'next';
        var ans = dir === 'next' ? base + 1 : base - 1;
        var rev = (ans >= 10 && ans <= 99) ? ((ans % 10) * 10 + Math.floor(ans / 10)) : ans + 5;
        var m = mixOpts(ans, [base, rev, ans + 1, ans - 1]);
        return { base:base, dir:dir, ans:ans, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.base + ' 的' + (d.dir === 'next' ? '後一個' : '前一個') + '數是多少？'
            : 'What number comes ' + (d.dir === 'next' ? 'right after' : 'right before') + ' ' + d.base + '?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? (d.dir === 'next' ? '順著數：' + d.base + ' 後面是 ' + d.ans + '。' : '倒著數：' + d.base + ' 前面是 ' + d.ans + '。')
            : (d.dir === 'next' ? 'Counting on: after ' + d.base + ' comes ' + d.ans + '.' : 'Counting back: before ' + d.base + ' is ' + d.ans + '.')
        };
      } },
    { id:'ordinalPosition', cat:'ordinal',
      make: function(){
        var n = 1 + rand(8);
        var correctIcon = ANIMALS[n - 1];
        var pool = ANIMALS.filter(function(ic){ return ic !== correctIcon; });
        var wrongIcons = shuffle(pool).slice(0, 3);
        var opts = shuffle([correctIcon].concat(wrongIcons));
        return { n:n, correctIcon:correctIcon, opts:opts, answerIdx:opts.indexOf(correctIcon) };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '排隊：' + ANIMALS.join('') + '　第 ' + d.n + ' 個是誰？'
            : 'In line: ' + ANIMALS.join('') + ' — who is ' + d.n + numSuffix(d.n) + '?',
          opts: d.opts, ans: d.answerIdx,
          why: lang === 'zh'
            ? '從左邊數過去，第 ' + d.n + ' 個是 ' + d.correctIcon + '。'
            : 'Counting from the left, the ' + d.n + numSuffix(d.n) + ' one is ' + d.correctIcon + '.'
        };
      } },
    { id:'readNumberWord', cat:'placevalue',
      make: function(){
        var num = 11 + rand(89);
        var rev = (num % 10) * 10 + Math.floor(num / 10);
        var m = mixOpts(num, [rev, num + 10, num - 10, num + 1]);
        return { num:num, opts:m.opts, answerIdx:m.ans };
      },
      fmt: function(d, lang){
        var word = lang === 'zh' ? zhNum(d.num) : enNum(d.num);
        return {
          stem: lang === 'zh' ? '『' + word + '』是多少？' : '“' + word + '” is what number?',
          opts: d.opts.map(String), ans: d.answerIdx,
          why: lang === 'zh'
            ? '「' + word + '」就是 ' + Math.floor(d.num / 10) + ' 個十加 ' + (d.num % 10) + ' 個一，也就是 ' + d.num + '。'
            : '“' + word + '” is ' + Math.floor(d.num / 10) + ' tens and ' + (d.num % 10) + ' ones, which is ' + d.num + '.'
        };
      } }
  ];

  function numSuffix(n){
    var j = n % 10, k = n % 100;
    if (j === 1 && k !== 11) return 'st';
    if (j === 2 && k !== 12) return 'nd';
    if (j === 3 && k !== 13) return 'rd';
    return 'th';
  }

  /* ---------- 出一批 12 題：8 種題型各一題 + 4 題隨機加強（限可重複出的類型） ---------- */
  function makePlan(){
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['buildNumber', 'decomposeTens', 'decomposeOnes', 'compareLarger', 'nextPrevNumber', 'countBy'].indexOf(g.id) >= 0;
    });
    for (var i = 0; i < 4; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make() };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length) + ' ' + cats.map(function(c){ return t.cats[c]; }).join('、');
      var li1 = document.createElement('li');
      var a1 = document.createElement('a'); a1.className = 'home'; a1.href = 'index.html'; a1.textContent = t.indexLink;
      li1.appendChild(a1); resultLinks.appendChild(li1);
      var li2 = document.createElement('li');
      var a2 = document.createElement('a'); a2.className = 'home'; a2.href = 'reference.html'; a2.textContent = t.refLink;
      li2.appendChild(a2); resultLinks.appendChild(li2);
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
</html>
