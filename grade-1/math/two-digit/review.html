<!DOCTYPE html>

<title>兩位數加減複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.75; font-size:18px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:19px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 10px;
    font-size:19px;cursor:pointer;color:var(--ink);min-height:52px;
    display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:16px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:14px 20px;font-size:17px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:14px;background:var(--green);color:#fff;font-size:18px;
    font-weight:700;padding:12px 24px;cursor:pointer;margin-top:16px;min-height:52px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'兩位數加減複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 兩位數加減複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：兩位數加減、數字位值、分與合、20 以內加減交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Two-Digit Add & Subtract Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Two-Digit Add & Subtract Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving two-digit addition/subtraction, place value, number bonds and addition/subtraction within 20 — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { twodigit:'兩位數', numbers:'位值', bonds:'分與合', addsub:'20以內加減' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { twodigit:'🧮 兩位數 — 兩位數大冒險', numbers:'🔢 數字 — 數字探險隊', bonds:'🤝 分與合 — 好朋友配對', addsub:'🚂 加減 — 加加減減小火車' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { twodigit:'Two-Digit', numbers:'Place Value', bonds:'Number Bonds', addsub:'Add/Sub Within 20' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { twodigit:'🧮 Two-Digit — Two-Digit Adventures', numbers:'🔢 Numbers — The Number Explorers', bonds:'🤝 Number Bonds — Number Buddies', addsub:'🚂 Add/Sub — The Add & Subtract Train' }
    }
  };

  var LINK_HREFS = { twodigit:'index.html', numbers:'../numbers/', bonds:'../number-bonds/', addsub:'../add-sub/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function digs(n){ return { t: Math.floor(n / 10), o: n % 10 }; }
  /* 保證 2 個相異、且不等於正解的錯誤選項 */
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key] && c >= 0){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 2){
      var lo = correct - step, hi = correct + step;
      if (lo >= 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 2 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 2);
  }
  /* 把選項值＋正解洗牌，回傳 {opts, ans}（三選一：正解 + 2 個錯誤選項） */
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* 隨機找一組兩位數加兩位數，個位、十位都不用進位 */
  function randAddPair(){
    for (var tries = 0; tries < 60; tries++){
      var a = 10 + rand(80), b = 10 + rand(80);
      var da = digs(a), db = digs(b);
      if (da.o + db.o <= 9 && da.t + db.t <= 9) return { a:a, b:b, sum:a + b };
    }
    return { a:32, b:25, sum:57 };
  }
  /* 隨機找一組兩位數減兩位數，個位、十位都不用退位 */
  function randSubPair(){
    for (var tries = 0; tries < 60; tries++){
      var a = 10 + rand(80), b = 10 + rand(80);
      var da = digs(a), db = digs(b);
      if (da.t >= db.t && da.o >= db.o && a > b) return { a:a, b:b, diff:a - b };
    }
    return { a:57, b:23, diff:34 };
  }
  /* 兩位數加一位數（考驗位值：一位數只能跟個位加） */
  function randAddOneDigit(){
    for (var tries = 0; tries < 60; tries++){
      var a = 10 + rand(80), b = 1 + rand(9);
      var da = digs(a);
      if (da.o + b <= 9) return { a:a, b:b, sum:a + b };
    }
    return { a:41, b:6, sum:47 };
  }
  /* 兩位數減一位數 */
  function randSubOneDigit(){
    for (var tries = 0; tries < 60; tries++){
      var a = 10 + rand(90), b = 1 + rand(9);
      var da = digs(a);
      if (da.o >= b) return { a:a, b:b, diff:a - b };
    }
    return { a:68, b:5, diff:63 };
  }

  /* ---------- 題目產生器：每次 make() 都用新數字 ---------- */
  var GENS = [
    { id:'addNoRegroup', cat:'twodigit',
      make: function(){ var p = randAddPair(); var m = mixOpts(p.sum, [p.a + digs(p.b).t, p.sum + 10, p.sum - 10]); return { p:p, opts:m.opts, ans:m.ans }; },
      fmt: function(d, lang){
        var da = digs(d.p.a), db = digs(d.p.b);
        return {
          stem: lang === 'zh' ? d.p.a + ' + ' + d.p.b + ' = ?' : d.p.a + ' + ' + d.p.b + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '十位 ' + da.t + ' + ' + db.t + ' = ' + (da.t + db.t) + '，個位 ' + da.o + ' + ' + db.o + ' = ' + (da.o + db.o) + '，合起來是 ' + d.p.sum + '。'
            : 'Tens: ' + da.t + ' + ' + db.t + ' = ' + (da.t + db.t) + '. Ones: ' + da.o + ' + ' + db.o + ' = ' + (da.o + db.o) + '. Together: ' + d.p.sum + '.'
        };
      } },
    { id:'subNoRegroup', cat:'twodigit',
      make: function(){ var p = randSubPair(); var m = mixOpts(p.diff, [p.diff + 10, p.diff - 10, digs(p.a).t - digs(p.b).t]); return { p:p, opts:m.opts, ans:m.ans }; },
      fmt: function(d, lang){
        var da = digs(d.p.a), db = digs(d.p.b);
        return {
          stem: d.p.a + ' − ' + d.p.b + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '十位 ' + da.t + ' − ' + db.t + ' = ' + (da.t - db.t) + '，個位 ' + da.o + ' − ' + db.o + ' = ' + (da.o - db.o) + '，' + d.p.a + ' − ' + d.p.b + ' = ' + d.p.diff + '。'
            : 'Tens: ' + da.t + ' − ' + db.t + ' = ' + (da.t - db.t) + '. Ones: ' + da.o + ' − ' + db.o + ' = ' + (da.o - db.o) + '. So ' + d.p.a + ' − ' + d.p.b + ' = ' + d.p.diff + '.'
        };
      } },
    { id:'addOneDigit', cat:'twodigit',
      make: function(){ var p = randAddOneDigit(); var da = digs(p.a); var wrongTens = (da.t + p.b) * 10 + da.o; var m = mixOpts(p.sum, [wrongTens, p.sum + 1]); return { p:p, opts:m.opts, ans:m.ans }; },
      fmt: function(d, lang){
        var da = digs(d.p.a);
        return {
          stem: d.p.a + ' + ' + d.p.b + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.p.b + ' 沒有十位，要跟個位對齊：個位 ' + da.o + ' + ' + d.p.b + ' = ' + (da.o + d.p.b) + '，十位不變是 ' + da.t + '，答案是 ' + d.p.sum + '。'
            : d.p.b + ' has no tens digit, so it lines up with the ones: ' + da.o + ' + ' + d.p.b + ' = ' + (da.o + d.p.b) + ', tens digit stays ' + da.t + ', so the answer is ' + d.p.sum + '.'
        };
      } },
    { id:'subOneDigit', cat:'twodigit',
      make: function(){ var p = randSubOneDigit(); var da = digs(p.a); var m = mixOpts(p.diff, [(da.t - p.b) * 10 + da.o, p.diff + 1]); return { p:p, opts:m.opts, ans:m.ans }; },
      fmt: function(d, lang){
        var da = digs(d.p.a);
        return {
          stem: d.p.a + ' − ' + d.p.b + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '個位 ' + da.o + ' − ' + d.p.b + ' = ' + (da.o - d.p.b) + '，十位不變是 ' + da.t + '，答案是 ' + d.p.diff + '。'
            : 'Ones: ' + da.o + ' − ' + d.p.b + ' = ' + (da.o - d.p.b) + '. Tens digit stays ' + da.t + '. Answer: ' + d.p.diff + '.'
        };
      } },
    { id:'inverseCheck', cat:'twodigit',
      make: function(){ var p = randAddPair(); var m = mixOpts(p.a, [p.b, p.sum]); return { p:p, opts:m.opts, ans:m.ans }; },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.p.a + ' + ' + d.p.b + ' = ' + d.p.sum + '，所以 ' + d.p.sum + ' − ' + d.p.b + ' = ?'
            : d.p.a + ' + ' + d.p.b + ' = ' + d.p.sum + ', so what is ' + d.p.sum + ' − ' + d.p.b + '?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '加減互逆：' + d.p.sum + ' 減掉 ' + d.p.b + '，會回到另一個加數 ' + d.p.a + '。'
            : 'Addition and subtraction check each other: ' + d.p.sum + ' minus ' + d.p.b + ' goes back to the other addend, ' + d.p.a + '.'
        };
      } },
    { id:'wordProblem', cat:'twodigit',
      make: function(){
        var isAdd = pick([true, false]);
        var p = isAdd ? randAddOneDigit() : randSubOneDigit();
        var names = ['小美', '小安', '小杰', '小華'];
        var namesEn = ['Mia', 'Ann', 'Jay', 'Hua'];
        var name = rand(names.length);
        var val = isAdd ? p.sum : p.diff;
        var m = mixOpts(val, [val + 1, val - 1]);
        return { isAdd:isAdd, p:p, name:name, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var names = lang === 'zh' ? ['小美', '小安', '小杰', '小華'] : ['Mia', 'Ann', 'Jay', 'Hua'];
        var name = names[d.name];
        var val = d.isAdd ? d.p.sum : d.p.diff;
        var stem, why;
        if (lang === 'zh'){
          stem = d.isAdd
            ? name + '原本有 ' + d.p.a + ' 元，又得到 ' + d.p.b + ' 元，現在有多少元？'
            : name + '原本有 ' + d.p.a + ' 元，花掉了 ' + d.p.b + ' 元，還剩下多少元？';
          why = d.isAdd ? d.p.a + ' + ' + d.p.b + ' = ' + val + ' 元。' : d.p.a + ' − ' + d.p.b + ' = ' + val + ' 元。';
        } else {
          stem = d.isAdd
            ? name + ' had $' + d.p.a + ' and got $' + d.p.b + ' more. How much does ' + name + ' have now?'
            : name + ' had $' + d.p.a + ' and spent $' + d.p.b + '. How much is left?';
          why = d.isAdd ? d.p.a + ' + ' + d.p.b + ' = $' + val + '.' : d.p.a + ' − ' + d.p.b + ' = $' + val + '.';
        }
        return { stem: stem, opts: d.opts.map(String), ans: d.ans, why: why };
      } },
    { id:'placeValue', cat:'numbers',
      make: function(){
        var n = 10 + rand(90);
        var d = digs(n);
        var m = mixOpts(d.t, [d.t + 1 <= 9 ? d.t + 1 : d.t - 1, d.o]);
        return { n:n, d:d, opts:m.opts, ans:m.ans };
      },
      fmt: function(data, lang){
        return {
          stem: lang === 'zh' ? data.n + ' 的十位是多少？' : 'What is the tens digit of ' + data.n + '?',
          opts: data.opts.map(String), ans: data.ans,
          why: lang === 'zh'
            ? data.n + ' = ' + data.d.t + ' 個十 + ' + data.d.o + ' 個一，十位是 ' + data.d.t + '。'
            : data.n + ' = ' + data.d.t + ' tens + ' + data.d.o + ' ones, so the tens digit is ' + data.d.t + '.'
        };
      } },
    { id:'numberBonds', cat:'bonds',
      make: function(){
        var whole = 5 + rand(6); // 5..10
        var part1 = 1 + rand(whole - 1);
        var part2 = whole - part1;
        var m = mixOpts(part2, [part2 + 1, whole]);
        return { whole:whole, part1:part1, part2:part2, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.whole + ' 可以分成 ' + d.part1 + ' 和多少？' : d.whole + ' can split into ' + d.part1 + ' and how much more?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.part1 + ' + ' + d.part2 + ' = ' + d.whole + '，所以另一個部分是 ' + d.part2 + '。'
            : d.part1 + ' + ' + d.part2 + ' = ' + d.whole + ', so the other part is ' + d.part2 + '.'
        };
      } },
    { id:'addSub20', cat:'addsub',
      make: function(){
        var isAdd = pick([true, false]);
        var a, b, ans;
        if (isAdd){ a = 1 + rand(15); b = 1 + rand(20 - a); ans = a + b; }
        else { a = 5 + rand(15); b = 1 + rand(a); ans = a - b; }
        var m = mixOpts(ans, [ans + 1, ans - 1]);
        return { isAdd:isAdd, a:a, b:b, ans2:ans, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var opSym = d.isAdd ? '+' : '−';
        return {
          stem: d.a + ' ' + opSym + ' ' + d.b + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' ' + opSym + ' ' + d.b + ' = ' + d.ans2 + '。'
            : d.a + ' ' + opSym + ' ' + d.b + ' = ' + d.ans2 + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：9 種題型各一題＋隨機 3 題（限本課題型） ---------- */
  function makePlan(){
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){ return g.cat === 'twodigit'; });
    for (var i = 0; i < 3; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){ return { gen: g, data: g.make() }; });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
