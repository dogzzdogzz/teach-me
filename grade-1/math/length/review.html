<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>比長度複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:18px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;cursor:pointer;min-height:44px;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 4px;font-size:18px}
  .qpic{margin:8px 0 12px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;
    font-size:17px;cursor:pointer;color:var(--ink);min-height:48px;
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:12px 22px;cursor:pointer;margin-top:16px;min-height:48px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:17px;
  }
  .iconrow{display:flex;gap:4px;flex-wrap:wrap}
  .iconrow span{width:26px;height:26px;border-radius:5px;display:inline-block}
  .rowline{display:flex;align-items:center;gap:8px;margin-top:6px}
  .rowlabel{font-weight:700;font-size:15px;min-width:36px}
  .unittrack{display:flex;border:3px dashed var(--line);border-radius:8px;background:var(--card);height:34px}
  .unitblock{height:100%;box-sizing:border-box;border-right:2px solid #fff}
  .u-ok{background:var(--green)}
  .u-a{background:#F2B441}
  .u-b{background:#5FB8D1}
  .barsrows{display:flex;flex-direction:column;gap:8px}
  .barblock{height:26px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 比長度複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：比長度、數數、加減、形狀交錯出現，<strong>每一批的數字都是新出的</strong>。<br>
    建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'比長度複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 比長度複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：比長度、數數、加減、形狀交錯出現，<strong>每一批的數字都是新出的</strong>。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Length Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Length Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving length, counting, addition/subtraction and shapes — <strong>every batch uses fresh numbers</strong>.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { length:'長度', numbers:'數數', addsub:'加減', shapes:'形狀' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { length:'📖 誰比較長？ — 比長度', numbers:'🔢 數數 — 數字探險隊', addsub:'🚂 加減 — 加加減減小火車', shapes:'🔺 形狀 — 形狀積木屋' },
      names: ['小明','小華','小美','小杰','小安'],
      nouns: ['桌子','書架','沙發','窗台'],
      objNames: { wardrobe:'衣櫃', table:'桌子', bed:'床', tv:'電視', bookshelf:'書架', chair:'椅子' },
      shapeNames: { triangle:'三角形', square:'正方形', rectangle:'長方形', pentagon:'五邊形' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { length:'Length', numbers:'Counting', addsub:'Add/Sub', shapes:'Shapes' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { length:'📖 Which One Is Longer? — Length', numbers:'🔢 Counting — Number Explorers', addsub:'🚂 Add/Sub — The Add & Subtract Train', shapes:'🔺 Shapes — The Shape House' },
      names: ['Ming','Hua','Mia','Jay','Ann'],
      nouns: ['table','bookshelf','sofa','windowsill'],
      objNames: { wardrobe:'wardrobe', table:'table', bed:'bed', tv:'TV', bookshelf:'bookshelf', chair:'chair' },
      shapeNames: { triangle:'triangle', square:'square', rectangle:'rectangle', pentagon:'pentagon' }
    }
  };

  var LINK_HREFS = { length:'index.html', numbers:'../numbers/', addsub:'../add-sub/', shapes:'../shapes/' };

  /* ---------- 共用工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 保證 n 個相異、且不等於正解的錯誤選項 */
  function makeWrongs(correct, candidates, need){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key]){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < need){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < need && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, need);
  }
  function mixOpts(correct, candidates, total){
    var wrongs = makeWrongs(correct, candidates, (total || 4) - 1);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 兩個文字選項洗牌，回傳 {opts:[o0,o1], ans} */
  function mixTwo(labels, correctIdx){
    var pair = [ {t:labels[0], c: correctIdx === 0}, {t:labels[1], c: correctIdx === 1} ];
    pair = shuffle(pair);
    var opts = pair.map(function(p){ return p.t; });
    var ans = pair[0].c ? 0 : 1;
    return { opts: opts, ans: ans };
  }

  /* ---------- 畫圖工具（無文字，跨語言共用） ---------- */
  function renderIconRow(container, count, color){
    container.textContent = '';
    var row = document.createElement('div');
    row.className = 'iconrow';
    for (var i = 0; i < count; i++){
      var s = document.createElement('span');
      s.style.background = color;
      row.appendChild(s);
    }
    container.appendChild(row);
  }
  function renderUnitsTrack(container, outline, blocks, justify){
    container.textContent = '';
    var track = document.createElement('div');
    track.className = 'unittrack';
    track.style.width = outline + 'px';
    track.style.justifyContent = justify || 'flex-start';
    blocks.forEach(function(b){
      var blk = document.createElement('div');
      blk.className = 'unitblock ' + (b.cls || 'u-ok');
      blk.style.width = b.w + 'px';
      track.appendChild(blk);
    });
    container.appendChild(track);
  }
  function renderBars(container, bars){
    container.textContent = '';
    var rows = document.createElement('div');
    rows.className = 'barsrows';
    bars.forEach(function(b){
      var bar = document.createElement('div');
      bar.className = 'barblock';
      bar.style.width = b.w + 'px';
      bar.style.background = b.color;
      rows.appendChild(bar);
    });
    container.appendChild(rows);
  }

  var OBJECT_PAIRS = [
    { keyA:'wardrobe', keyB:'table' },
    { keyA:'bed', keyB:'tv' },
    { keyA:'bookshelf', keyB:'chair' }
  ];
  var SHAPES = [
    { key:'triangle', sides:3 },
    { key:'square', sides:4 },
    { key:'rectangle', sides:4 },
    { key:'pentagon', sides:5 }
  ];

  /* ---------- 題目產生器 ---------- */
  var GENS = [
    { id:'countUnits', cat:'length',
      make: function(used){
        var k = pickUnused([4,5,6,7,8,9], used);
        var unit = pick([20,24,30]);
        var m = mixOpts(k, [k - 1, k + 1, k + 2], 4);
        return { k:k, unit:unit, opts:m.opts, ans:m.ans };
      },
      pic: function(container, d){
        var blocks = [];
        for (var i = 0; i < d.k; i++) blocks.push({ w:d.unit, cls:'u-ok' });
        renderUnitsTrack(container, d.k * d.unit, blocks, 'flex-start');
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '這排小方塊頭尾相接、沒有縫隙，一共量出幾個長度單位？' : 'These blocks are end to end with no gaps. How many length units is this?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? '從頭數到尾，一共 ' + d.k + ' 個，中間沒有縫隙也沒有重疊。' : 'Counting from start to end, there are ' + d.k + ', with no gaps and no overlaps.'
        };
      } },
    { id:'compareByCount', cat:'length',
      make: function(used){
        var a = pickUnused([3,4,5,6,7,8], used);
        var pool = [3,4,5,6,7,8].filter(function(v){ return v !== a; });
        var b = pick(pool);
        var m = mixTwo(['A','B'], a > b ? 0 : 1);
        return { a:a, b:b, opts:m.opts, ans:m.ans };
      },
      pic: function(container, d){
        container.textContent = '';
        var wrap = document.createElement('div');
        var lineA = document.createElement('div'); lineA.className = 'rowline';
        var labA = document.createElement('span'); labA.className = 'rowlabel'; labA.textContent = 'A';
        var rowA = document.createElement('div'); renderIconRow(rowA, d.a, '#E8871E');
        lineA.appendChild(labA); lineA.appendChild(rowA);
        var lineB = document.createElement('div'); lineB.className = 'rowline';
        var labB = document.createElement('span'); labB.className = 'rowlabel'; labB.textContent = 'B';
        var rowB = document.createElement('div'); renderIconRow(rowB, d.b, '#3B7DD8');
        lineB.appendChild(labB); lineB.appendChild(rowB);
        wrap.appendChild(lineA); wrap.appendChild(lineB);
        container.appendChild(wrap);
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? 'A 排和 B 排都是同樣大小的方塊，哪一排比較長？' : 'Row A and Row B use the same-sized blocks. Which row is longer?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? 'A 有 ' + d.a + ' 個、B 有 ' + d.b + ' 個，單位一樣大，個數多的就比較長。'
            : 'Row A has ' + d.a + ' and row B has ' + d.b + '. Same-sized units, so more units means longer.'
        };
      } },
    { id:'barCompare', cat:'length',
      make: function(used){
        var pool = [80,100,120,140,160,180];
        var wa = pickUnused(pool, used);
        var wbPool = pool.filter(function(v){ return v !== wa; });
        var wb = pick(wbPool);
        var m = mixTwo(['red','blue'], wa > wb ? 0 : 1);
        return { wa:wa, wb:wb, opts:m.opts, ans:m.ans };
      },
      pic: function(container, d){
        renderBars(container, [{ w:d.wa, color:'#D64545' }, { w:d.wb, color:'#3B7DD8' }]);
      },
      fmt: function(d, lang){
        var names = lang === 'zh' ? { red:'紅色', blue:'藍色' } : { red:'Red', blue:'Blue' };
        return {
          stem: lang === 'zh' ? '紅色和藍色的緞帶，左邊都對齊了，哪一條比較長？' : 'The red and blue ribbons have their left ends lined up. Which one is longer?',
          opts: d.opts.map(function(k){ return names[k]; }), ans: d.ans,
          why: lang === 'zh' ? '左邊已經對齊，比較長的那條會往右邊伸得比較遠。' : 'The left ends are aligned, so the longer ribbon reaches further to the right.'
        };
      } },
    { id:'smallToBig', cat:'length',
      make: function(used){
        var g = pickUnused([3,4,5,6,7,8], used);
        var smallCount = g * 2;
        var m = mixOpts(g, [g + 1, g > 1 ? g - 1 : g + 3, smallCount], 4);
        return { g:g, smallCount:smallCount, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '同一根繩子，用小方塊量是 ' + d.smallCount + ' 個；換成大方塊（1 個大方塊等於 2 個小方塊）量，會是幾個？'
            : 'The same rope measures ' + d.smallCount + ' small blocks. Using big blocks instead (1 big block = 2 small blocks), how many will it be?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.smallCount + ' 個小方塊 ÷ 2 = ' + d.g + ' 個大方塊。單位變大，數字變小。'
            : d.smallCount + ' small blocks ÷ 2 = ' + d.g + ' big blocks. Bigger units give a smaller number.'
        };
      } },
    { id:'bigToSmall', cat:'length',
      make: function(used){
        var b = pickUnused([3,4,5,6,7,8], used);
        var result = b * 2;
        var m = mixOpts(result, [b, result - 2 > 0 ? result - 2 : result + 4, result + 2], 4);
        return { b:b, result:result, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '同一根繩子，用大方塊量是 ' + d.b + ' 個；換成小方塊（1 個大方塊等於 2 個小方塊）量，會是幾個？'
            : 'The same rope measures ' + d.b + ' big blocks. Using small blocks instead (1 big block = 2 small blocks), how many will it be?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.b + ' 個大方塊 × 2 = ' + d.result + ' 個小方塊。單位變小，數字變大。'
            : d.b + ' big blocks × 2 = ' + d.result + ' small blocks. Smaller units give a bigger number.'
        };
      } },
    { id:'indirectCompareStory', cat:'length',
      make: function(used){
        var idx = pickUnused([0,1,2], used);
        var pair = OBJECT_PAIRS[idx % OBJECT_PAIRS.length];
        var ropeLonger = rand(2) === 0;
        var m = mixTwo([pair.keyA, pair.keyB], ropeLonger ? 0 : 1);
        return { keyA:pair.keyA, keyB:pair.keyB, ropeLonger:ropeLonger, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var nameA = t.objNames[d.keyA], nameB = t.objNames[d.keyB];
        var cmp = d.ropeLonger ? (lang === 'zh' ? '長' : 'longer') : (lang === 'zh' ? '短' : 'shorter');
        var tallerName = d.ropeLonger ? nameA : nameB;
        return {
          stem: lang === 'zh'
            ? '用一條繩子先量了 ' + nameA + ' 的高度，再拿去比 ' + nameB + '，發現繩子比 ' + nameB + '' + cmp + '，這代表誰比較高？'
            : 'A rope measured the height of the ' + nameA + ', then was carried over to compare with the ' + nameB + ', and the rope was ' + cmp + ' than the ' + nameB + '. Which one is taller?',
          opts: d.opts.map(function(k){ return t.objNames[k]; }), ans: d.ans,
          why: lang === 'zh'
            ? '繩子量出來的長度就是 ' + nameA + ' 的高度，跟 ' + nameB + ' 比較之後就知道 ' + tallerName + ' 比較高。'
            : 'The rope’s length is exactly the ' + nameA + '’s height — comparing it with the ' + nameB + ' shows the ' + tallerName + ' is taller.'
        };
      } },
    { id:'gapMistakeSpot', cat:'length',
      make: function(used){
        var idx = pickUnused([0,1,2,3,4], used);
        var names = null; /* filled at fmt time from TXT, keep only indices here */
        var nameIdxA = idx % 5, nameIdxB = (idx + 1) % 5;
        var cnt = pick([5,6,7,8]);
        var gapFirst = rand(2) === 0;
        var m = mixTwo(['A','B'], gapFirst ? 1 : 0);
        return { nameIdxA:nameIdxA, nameIdxB:nameIdxB, cnt:cnt, gapFirst:gapFirst, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var nameA = t.names[d.nameIdxA], nameB = t.names[d.nameIdxB];
        var gapName = d.gapFirst ? nameA : nameB;
        var goodName = d.gapFirst ? nameB : nameA;
        return {
          stem: lang === 'zh'
            ? gapName + '排積木中間留了縫隙，也說量出來是 ' + d.cnt + ' 個；' + goodName + '頭尾相接排好，也量出 ' + d.cnt + ' 個。誰的量法才正確？'
            : gapName + ' left gaps between the blocks but also said the count was ' + d.cnt + '; ' + goodName + ' lined them up end to end with no gaps and also got ' + d.cnt + '. Whose method is correct?',
          opts: d.opts.map(function(k){ return k === 'A' ? nameA : nameB; }), ans: d.ans,
          why: lang === 'zh'
            ? goodName + '頭尾相接、沒有縫隙，量出來的數字才準確；' + gapName + '中間留了縫隙，數字其實不準。'
            : goodName + ' placed the blocks end to end with no gaps, so the count is accurate; ' + gapName + ' left gaps, so that count is not reliable.'
        };
      } },
    { id:'mixedSizeMistakeSpot', cat:'length',
      make: function(used){
        var idx = pickUnused([0,1,2,3], used);
        var m = mixTwo(['accurate','inaccurate'], 1);
        return { nounIdx:idx, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var noun = t.nouns[d.nounIdx];
        var labels = lang === 'zh' ? { accurate:'準', inaccurate:'不準' } : { accurate:'Accurate', inaccurate:'Not accurate' };
        return {
          stem: lang === 'zh' ? '用大小不一樣的積木來量 ' + noun + ' 的長度，量出來的數字準不準？' : 'Using different-sized blocks to measure the length of a ' + noun + ' — is the resulting count accurate?',
          opts: d.opts.map(function(k){ return labels[k]; }), ans: d.ans,
          why: lang === 'zh' ? '量長度的單位一定要一樣大，大小不一樣的話，量出來的數字就不準確。' : 'The units used to measure length must be the same size — mixing sizes makes the count inaccurate.'
        };
      } },
    { id:'numbersCount', cat:'numbers',
      make: function(used){
        var n = pickUnused([8,10,12,14,15,16,18,20], used);
        var m = mixOpts(n, [n - 1, n + 1, n + 2], 4);
        return { n:n, opts:m.opts, ans:m.ans };
      },
      pic: function(container, d){ renderIconRow(container, d.n, '#2F9E69'); },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '這排圓點一共有幾個？' : 'How many dots are in this row?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? '一個一個數，一共 ' + d.n + ' 個。' : 'Counting one by one, there are ' + d.n + '.'
        };
      } },
    { id:'addsubWithin20', cat:'addsub',
      make: function(used){
        var isAdd = rand(2) === 0;
        var x, y, correct;
        if (isAdd){
          x = pickUnused([2,3,4,5,6,7,8,9], used);
          y = 1 + rand(9);
          correct = x + y;
        } else {
          x = pickUnused([10,12,14,15,16,18], used);
          y = 1 + rand(8);
          correct = x - y;
        }
        var m = mixOpts(correct, [correct - 1, correct + 1, correct + 2], 4);
        return { isAdd:isAdd, x:x, y:y, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var stem = d.isAdd ? (d.x + ' + ' + d.y + ' = ?') : (d.x + ' − ' + d.y + ' = ?');
        return {
          stem: stem,
          opts: d.opts.map(String), ans: d.ans,
          why: d.isAdd
            ? (lang === 'zh' ? d.x + ' + ' + d.y + ' = ' + d.correct + '。' : d.x + ' + ' + d.y + ' = ' + d.correct + '.')
            : (lang === 'zh' ? d.x + ' − ' + d.y + ' = ' + d.correct + '。' : d.x + ' − ' + d.y + ' = ' + d.correct + '.')
        };
      } },
    { id:'shapesSides', cat:'shapes',
      make: function(used){
        var idx = pickUnused([0,1,2,3], used);
        var sh = SHAPES[idx % SHAPES.length];
        var m = mixOpts(sh.sides, [sh.sides - 1 > 1 ? sh.sides - 1 : sh.sides + 3, sh.sides + 1, sh.sides + 2], 4);
        return { key:sh.key, sides:sh.sides, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var t = TXT[lang];
        var name = t.shapeNames[d.key];
        return {
          stem: lang === 'zh' ? name + '有幾條邊？' : 'How many sides does a ' + name + ' have?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh' ? name + '有 ' + d.sides + ' 條邊。' : 'A ' + name + ' has ' + d.sides + ' sides.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：8 種長度題型 + 3 種交錯主題 + 1 題隨機長度加碼 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['countUnits','compareByCount','barCompare','smallToBig','bigToSmall'].indexOf(g.id) >= 0;
    });
    slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var picBox = document.createElement('div');
      picBox.className = 'qpic';
      if (item.gen.pic) item.gen.pic(picBox, item.data);
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      if (item.gen.pic) box.appendChild(picBox);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
