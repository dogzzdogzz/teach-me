<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>形狀速查卡</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.6; font-size:17px;
  }
  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 60px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:24px 0 4px}
  header h1{font-size:clamp(26px,5vw,38px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:6px;font-size:16px}
  .sheet{
    background:var(--card);border:2px solid var(--ink);border-radius:20px;
    padding:26px;margin-top:22px;
  }
  .sheet h2{
    font-size:19px;border-left:6px solid var(--green);padding-left:10px;margin:22px 0 8px;
  }
  .sheet h2:first-child{margin-top:0}
  .famtable{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:10px}
  .famcard{border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
  .famcard svg{margin:0 auto}
  .famcard h3{font-size:17px;margin-top:6px}
  .famcard p{font-size:14px;color:var(--muted);margin-top:4px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  th{background:var(--blue-soft);color:var(--blue)}
  td.left{text-align:left}
  td svg{vertical-align:middle}
  .comboBox{display:flex;justify-content:center;gap:18px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .printbtn{
    margin-top:18px;border:none;border-radius:12px;background:var(--green);color:#fff;
    font-size:16px;font-weight:700;padding:10px 22px;cursor:pointer;
  }
  footer{margin-top:28px;text-align:center;color:var(--muted);font-size:14px}
  svg.refshape polygon, svg.refshape circle{ fill:none; stroke:#000; stroke-width:5 }
  svg.reffam .rf-face{ fill:none; stroke:#000; stroke-width:3 }
  @media print{
    body{background:#fff}
    .topbar,.coursenav,.printbtn,footer{display:none}
    .wrap{padding:0}
    .sheet{border-color:#000;margin-top:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <span data-i18n="nav2">🗂️ 速查卡（本頁）</span>
    <a href="review.html" data-i18n="nav3">🔁 複習挑戰</a>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🗂️ 形狀速查卡</h1>
    <p data-i18n="sub">一張卡把形狀重點帶著走 —— 印出來貼在書桌前</p>
  </header>

  <div class="sheet">
    <h2 data-i18n="s1">平面圖形家族</h2>
    <div class="famtable" id="planeTable"></div>
    <p style="margin-top:10px" data-i18n="planeNote">重點：形狀轉一轉、歪一歪，只要邊和角一樣，還是同一個形狀！</p>

    <h2 data-i18n="s2">平面圖形 vs 立體形體</h2>
    <table>
      <tr><th data-i18n="colPlane">平面圖形（扁扁的）</th><th data-i18n="colSolid">立體形體（有厚度）</th></tr>
      <tr>
        <td id="planeExamples"></td>
        <td id="solidExamples"></td>
      </tr>
    </table>
    <p style="margin-top:10px" data-i18n="planeSolidNote">平面圖形可以畫在紙上；立體形體可以拿在手上、會佔空間。</p>

    <h2 data-i18n="s3">立體形體三家族</h2>
    <div class="famtable" id="solidTable"></div>

    <h2 data-i18n="s4">圖形拼排</h2>
    <div class="comboBox" id="comboBox"></div>
    <p style="margin-top:10px" data-i18n="comboNote">兩個一樣大的直角三角形，斜邊對斜邊，剛好合成一個正方形。</p>
  </div>

  <button class="printbtn" onclick="window.print()" data-i18n="printBtn">🖨️ 印出速查卡</button>

  <footer data-i18n="foot">看不懂的地方，回到<a class="home" href="index.html">課程</a>再玩一次，或問爸媽、問 AI 老師。</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---- shape geometry (identical to index.html, verified via scratchpad/test-shapegeo.js) ---- */
  function deg2rad(d){ return d * Math.PI / 180; }
  function rotatePoint(x, y, cx, cy, angleDeg){
    var a = deg2rad(angleDeg);
    var dx = x - cx, dy = y - cy;
    return { x: cx + dx*Math.cos(a) - dy*Math.sin(a), y: cy + dx*Math.sin(a) + dy*Math.cos(a) };
  }
  function makeSquare(cx, cy, side, rot){
    var h = side/2;
    var base = [{x:cx-h,y:cy-h},{x:cx+h,y:cy-h},{x:cx+h,y:cy+h},{x:cx-h,y:cy+h}];
    return base.map(function(p){ return rotatePoint(p.x,p.y,cx,cy,rot); });
  }
  function makeRectangle(cx, cy, w, h, rot){
    var hw=w/2, hh=h/2;
    var base=[{x:cx-hw,y:cy-hh},{x:cx+hw,y:cy-hh},{x:cx+hw,y:cy+hh},{x:cx-hw,y:cy+hh}];
    return base.map(function(p){ return rotatePoint(p.x,p.y,cx,cy,rot); });
  }
  function ptsAttr(pts){ return pts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' '); }

  function refShapeSVG(kind, px){
    px = px || 90;
    var cx=60, cy=60, body;
    if (kind === 'triangle'){
      body = '<polygon points="60,14 14,102 106,102"></polygon>';
    } else if (kind === 'square'){
      body = '<polygon points="'+ptsAttr(makeSquare(cx,cy,70,0))+'"></polygon>';
    } else if (kind === 'rectangle'){
      body = '<polygon points="'+ptsAttr(makeRectangle(cx,cy,90,50,0))+'"></polygon>';
    } else {
      body = '<circle cx="'+cx+'" cy="'+cy+'" r="34"></circle>';
    }
    return '<svg viewBox="0 0 120 120" width="'+px+'" height="'+px+'" class="refshape">'+body+'</svg>';
  }
  function refFamilySVG(fam, px){
    px = px || 70;
    var body;
    if (fam==='box'){
      body = '<polygon class="rf-face" points="18,42 58,42 58,84 18,84"></polygon>'+
             '<polygon class="rf-face" points="18,42 33,22 73,22 58,42"></polygon>'+
             '<polygon class="rf-face" points="58,42 73,22 73,64 58,84"></polygon>';
    } else if (fam==='ball'){
      body = '<circle class="rf-face" cx="50" cy="55" r="32"></circle>';
    } else {
      body = '<ellipse class="rf-face" cx="50" cy="28" rx="24" ry="9"></ellipse>'+
             '<path class="rf-face" d="M26,28 L26,74 A24,9 0 0 0 74,74 L74,28"></path>';
    }
    return '<svg viewBox="0 0 100 100" width="'+px+'" height="'+px+'" class="reffam">'+body+'</svg>';
  }

  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'形狀速查卡', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡（本頁）', nav3:'🔁 複習挑戰', nav4:'👨‍👩‍👧 給家長',
      h1:'🗂️ 形狀速查卡', sub:'一張卡把形狀重點帶著走 —— 印出來貼在書桌前',
      s1:'平面圖形家族',
      planeNote:'重點：形狀轉一轉、歪一歪，只要邊和角一樣，還是同一個形狀！',
      s2:'平面圖形 vs 立體形體',
      colPlane:'平面圖形（扁扁的）', colSolid:'立體形體（有厚度）',
      planeSolidNote:'平面圖形可以畫在紙上；立體形體可以拿在手上、會佔空間。',
      s3:'立體形體三家族',
      s4:'圖形拼排',
      comboNote:'兩個一樣大的直角三角形，斜邊對斜邊，剛好合成一個正方形。',
      printBtn:'🖨️ 印出速查卡',
      foot:'看不懂的地方，回到<a class="home" href="index.html">課程</a>再玩一次，或問爸媽、問 AI 老師。',
      shapeName: function(k){ return {triangle:'三角形',square:'正方形',rectangle:'長方形',circle:'圓形'}[k]; },
      shapeCount: function(k){ return {triangle:{sides:3,angles:0}, square:{sides:4,angles:4}, rectangle:{sides:4,angles:4}, circle:{sides:0,angles:0}}[k]; },
      sidesLabel:'邊', anglesLabel:'直角',
      shapeFact: function(k){ return {
        triangle:'3 個直直的邊，沒有直角',
        square:'4 個一樣長的邊、4 個直角',
        rectangle:'對邊一樣長、4 個直角',
        circle:'圓圓的，到中心一樣遠，沒有直邊也沒有角'
      }[k]; },
      familyName: function(f){ return {box:'像盒子的',ball:'像球的',can:'像罐子的'}[f]; },
      familyFact: function(f){ return {
        box:'例：禮物盒、書、骰子',
        ball:'例：足球、橘子、彈珠',
        can:'例：罐頭、水桶、蠟燭'
      }[f]; },
      planeExList:'三角形、正方形、長方形、圓形',
      solidExList:'像盒子的、像球的、像罐子的東西'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Shapes Cheat Sheet', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (this page)', nav3:'🔁 Review challenge', nav4:'👨‍👩‍👧 For parents',
      h1:'🗂️ Shapes Cheat Sheet', sub:'The whole topic on one card — print it for your desk',
      s1:'The Flat Shape Family',
      planeNote:'Key point: turn it or tilt it — same sides and angles means it’s still the same shape!',
      s2:'Flat Shapes vs Solids',
      colPlane:'Flat shapes (2D)', colSolid:'Solids (3D, has thickness)',
      planeSolidNote:'A flat shape can be drawn on paper; a solid can be held in your hand and takes up space.',
      s3:'The Three Solid Families',
      s4:'Composing Shapes',
      comboNote:'Two equal right triangles, hypotenuse to hypotenuse, fit together into exactly one square.',
      printBtn:'🖨️ Print this card',
      foot:'Anything unclear? Replay the <a class="home" href="index.html">lesson</a>, or ask your parents / AI teacher.',
      shapeName: function(k){ return {triangle:'Triangle',square:'Square',rectangle:'Rectangle',circle:'Circle'}[k]; },
      shapeCount: function(k){ return {triangle:{sides:3,angles:0}, square:{sides:4,angles:4}, rectangle:{sides:4,angles:4}, circle:{sides:0,angles:0}}[k]; },
      sidesLabel:'sides', anglesLabel:'right angles',
      shapeFact: function(k){ return {
        triangle:'3 straight sides, no right angles',
        square:'4 equal sides, 4 right angles',
        rectangle:'opposite sides equal, 4 right angles',
        circle:'perfectly round, same distance from center, no straight sides or angles'
      }[k]; },
      familyName: function(f){ return {box:'Box-like',ball:'Ball-like',can:'Can-like'}[f]; },
      familyFact: function(f){ return {
        box:'e.g. gift box, book, die',
        ball:'e.g. soccer ball, orange, marble',
        can:'e.g. can, bucket, candle'
      }[f]; },
      planeExList:'triangle, square, rectangle, circle',
      solidExList:'box-like, ball-like, and can-like things'
    }
  };

  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
  }

  var PLANE_KINDS = ['triangle','square','rectangle','circle'];
  var SOLID_FAMS = ['box','ball','can'];

  function renderTables(){
    var d = I18N[lang];
    var planeTable = document.getElementById('planeTable');
    planeTable.textContent = '';
    PLANE_KINDS.forEach(function(k){
      var c = document.createElement('div');
      c.className = 'famcard';
      var cnt = d.shapeCount(k);
      c.innerHTML = refShapeSVG(k, 90) + '<h3>' + d.shapeName(k) + '</h3>' +
        '<p style="font-weight:700;color:var(--ink)">' + cnt.sides + ' ' + d.sidesLabel + '　' + cnt.angles + ' ' + d.anglesLabel + '</p>' +
        '<p>' + d.shapeFact(k) + '</p>';
      planeTable.appendChild(c);
    });

    var solidTable = document.getElementById('solidTable');
    solidTable.textContent = '';
    SOLID_FAMS.forEach(function(f){
      var c = document.createElement('div');
      c.className = 'famcard';
      c.innerHTML = refFamilySVG(f, 70) + '<h3>' + d.familyName(f) + '</h3><p>' + d.familyFact(f) + '</p>';
      solidTable.appendChild(c);
    });

    var planeEx = document.getElementById('planeExamples');
    planeEx.textContent = '';
    var pRow = document.createElement('div');
    pRow.style.display='flex'; pRow.style.gap='10px'; pRow.style.justifyContent='center'; pRow.style.flexWrap='wrap';
    PLANE_KINDS.forEach(function(k){ var s=document.createElement('span'); s.innerHTML=refShapeSVG(k,44); pRow.appendChild(s); });
    planeEx.appendChild(pRow);
    var pLabel = document.createElement('div');
    pLabel.style.marginTop='6px'; pLabel.style.fontSize='13px'; pLabel.style.color='var(--muted)';
    pLabel.textContent = d.planeExList;
    planeEx.appendChild(pLabel);

    var solidEx = document.getElementById('solidExamples');
    solidEx.textContent = '';
    var sRow = document.createElement('div');
    sRow.style.display='flex'; sRow.style.gap='10px'; sRow.style.justifyContent='center'; sRow.style.flexWrap='wrap';
    SOLID_FAMS.forEach(function(f){ var s=document.createElement('span'); s.innerHTML=refFamilySVG(f,44); sRow.appendChild(s); });
    solidEx.appendChild(sRow);
    var sLabel = document.createElement('div');
    sLabel.style.marginTop='6px'; sLabel.style.fontSize='13px'; sLabel.style.color='var(--muted)';
    sLabel.textContent = d.solidExList;
    solidEx.appendChild(sLabel);

    var comboBox = document.getElementById('comboBox');
    comboBox.textContent = '';
    var triSize = 90;
    comboBox.innerHTML =
      '<svg viewBox="0 0 '+triSize+' '+triSize+'" width="'+triSize+'" height="'+triSize+'" class="refshape"><polygon points="0,0 '+triSize+',0 0,'+triSize+'"></polygon></svg>' +
      '<span style="font-size:22px">＋</span>' +
      '<svg viewBox="0 0 '+triSize+' '+triSize+'" width="'+triSize+'" height="'+triSize+'" class="refshape"><polygon points="'+triSize+',0 '+triSize+','+triSize+' 0,'+triSize+'"></polygon></svg>' +
      '<span style="font-size:22px">＝</span>' +
      '<svg viewBox="0 0 '+triSize+' '+triSize+'" width="'+triSize+'" height="'+triSize+'" class="refshape"><polygon points="0,0 '+triSize+',0 '+triSize+','+triSize+' 0,'+triSize+'"></polygon></svg>';
  }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    renderTables();
  });

  applyStatic();
  renderTables();
})();
</script>
</body>
</html>
