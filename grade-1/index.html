<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一年級數學 — teach-me</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --blue:#3B7DD8; --blue-soft:#E8F0FB; --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .crumb{font-size:15px;color:var(--muted)}
  .crumb a{color:var(--blue);text-decoration:none}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  header{text-align:center;padding:28px 0 6px}
  header h1{font-size:clamp(28px,6vw,42px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .soonbox{
    background:var(--green-soft);border:2px solid var(--green);border-radius:20px;
    padding:18px 22px;margin:26px 0;font-size:16px;text-align:center;
  }
  .soonbox a{color:var(--green);font-weight:700}
  .strand{margin-top:32px}
  .strand h2{font-size:20px;padding-left:12px}
  .strand p{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 18px;margin-top:8px;font-size:15px;color:var(--muted);
  }
  .lessons{display:grid;gap:14px;margin-top:14px}
  .lesson{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 20px;box-shadow:0 4px 14px rgba(70,60,40,.06);
  }
  .badge{font-size:34px;line-height:1}
  .lesson .info{flex:1;min-width:180px}
  .lesson h3{font-size:18px}
  .lesson h3 a{color:var(--ink);text-decoration:none}
  .lesson h3 a:hover{color:var(--green)}
  .lesson .info p{font-size:14px;color:var(--muted);background:none;border:0;padding:0;margin:2px 0 0}
  .plinks{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
  .plinks a{
    text-decoration:none;font-size:14px;font-weight:700;border-radius:999px;
    padding:5px 14px;border:2px solid var(--line);color:var(--ink);background:var(--bg);
  }
  .plinks a:first-child{background:var(--green);border-color:var(--green);color:#fff}
  .plinks a:hover{border-color:var(--green)}
  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <nav class="crumb"><a href="../index.html" data-i18n="crumbHome">🏠 首頁</a> › <span data-i18n="crumbHere">一年級數學</span></nav>
    <button class="langbtn" id="langBtn" type="button" aria-label="Switch language">EN</button>
  </div>

  <header>
    <h1 data-i18n="h1">🎒 一年級數學</h1>
    <p data-i18n="sub">這個年級要學什麼，先看這裡</p>
  </header>


  <section class="strand">
    <h2 style="border-left:8px solid var(--green)" data-i18n="sh0">數與計算</h2>
    <div class="lessons">
      <div class="lesson"><span class="badge">🔢</span>
        <span class="info"><h3><a href="math/numbers/" data-i18n="n1T"></a></h3><p data-i18n="n1D"></p></span>
        <span class="plinks"><a href="math/numbers/" data-i18n="pL">📖</a><a href="math/numbers/reference.html" data-i18n="pR">🗂️</a><a href="math/numbers/review.html" data-i18n="pV">🔁</a><a href="math/numbers/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
      <div class="lesson"><span class="badge">🤝</span>
        <span class="info"><h3><a href="math/number-bonds/" data-i18n="n2T"></a></h3><p data-i18n="n2D"></p></span>
        <span class="plinks"><a href="math/number-bonds/" data-i18n="pL">📖</a><a href="math/number-bonds/reference.html" data-i18n="pR">🗂️</a><a href="math/number-bonds/review.html" data-i18n="pV">🔁</a><a href="math/number-bonds/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
      <div class="lesson"><span class="badge">🚂</span>
        <span class="info"><h3><a href="math/add-sub/" data-i18n="n3T"></a></h3><p data-i18n="n3D"></p></span>
        <span class="plinks"><a href="math/add-sub/" data-i18n="pL">📖</a><a href="math/add-sub/reference.html" data-i18n="pR">🗂️</a><a href="math/add-sub/review.html" data-i18n="pV">🔁</a><a href="math/add-sub/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
    </div>
    <p data-i18n="sc0">100 以內的數、分與合、加減法（和 20 以內）、加減文字題</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--orange)" data-i18n="sh1">量與實測</h2>
    <p data-i18n="sc1">長度直接與間接比較、時鐘整點半點、認識錢幣</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid var(--blue)" data-i18n="sh2">空間與形狀</h2>
    <div class="lessons">
      <div class="lesson"><span class="badge">🔺</span>
        <span class="info"><h3><a href="math/shapes/" data-i18n="n4T"></a></h3><p data-i18n="n4D"></p></span>
        <span class="plinks"><a href="math/shapes/" data-i18n="pL">📖</a><a href="math/shapes/reference.html" data-i18n="pR">🗂️</a><a href="math/shapes/review.html" data-i18n="pV">🔁</a><a href="math/shapes/parents.html" data-i18n="pP">👨‍👩‍👧</a></span>
      </div>
    </div>
    <p data-i18n="sc2">立體與平面圖形辨認、圖形拼排</p>
  </section>
  <section class="strand">
    <h2 style="border-left:8px solid #9C6ADE" data-i18n="sh3">關係</h2>
    <p data-i18n="sc3">數的規律</p>
  </section>

  <footer data-i18n="footer">teach-me · 慢慢學，學得牢</footer>
</div>

<script>
(function(){
  "use strict";
  var I18N = {
    "zh": {
        "htmlLang": "zh-Hant",
        "title": "一年級數學 — teach-me",
        "btn": "EN",
        "crumbHome": "🏠 首頁",
        "crumbHere": "一年級數學",
        "h1": "🎒 一年級數學",
        "sub": "4 堂課，每堂都有：📖 上課 · 🗂️ 速查卡 · 🔁 複習挑戰 · 👨‍👩‍👧 給家長",
        "footer": "teach-me · 慢慢學，學得牢",
                "n1T": "數字探險隊 — 100 以內的數",
        "n1D": "數一數、十位個位、比大小，第幾個",
        "n2T": "好朋友配對 — 分與合",
        "n2D": "7 可以分成 3 和 4；湊十是加減法的祕密武器",
        "n3T": "加加減減小火車 — 20 以內加減",
        "n3D": "合併、添加、拿走、比較，四種故事一次搞懂",
        "n4T": "形狀積木屋 — 平面與立體圖形",
        "n4D": "歪的、斜的也算三角形；認識像盒子像球的家族",
        "pL": "📖 上課", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "sh0": "數與計算",
        "sc0": "🌱 這個領域還沒有課程的單元：二位數的加減（不進位／不退位）",
        "sh1": "量與實測",
        "sc1": "🌱 這個領域的課程準備中：長度的比較、時鐘的整點與半點、認識錢幣",
        "sh2": "空間與形狀",
        "sc2": "✅ 這個領域的單元都有課程了",
        "sh3": "關係",
        "sc3": "🌱 這個領域的課程準備中：數的規律（依規律接續排列）"
    },
    "en": {
        "htmlLang": "en",
        "title": "Grade 1 Math — teach-me",
        "btn": "中",
        "crumbHome": "🏠 Home",
        "crumbHere": "Grade 1 Math",
        "h1": "🎒 Grade 1 Math",
        "sub": "4 lessons — each with 📖 Lesson · 🗂️ Cheat sheet · 🔁 Review · 👨‍👩‍👧 For parents",
        "footer": "teach-me · learn slowly, remember firmly",
                "n1T": "The Number Explorers — Numbers to 100",
        "n1D": "Count, tens and ones, compare, and ordinal position",
        "n2T": "Number Buddies — Making and Breaking Numbers",
        "n2D": "7 splits into 3 and 4; bonds of ten unlock everything later",
        "n3T": "The Add & Subtract Train — Within 20",
        "n3D": "Combine, add more, take away, compare — all four stories",
        "n4T": "The Shape House — Flat & Solid Shapes",
        "n4D": "Tilted ones are still triangles; meet the box, can and ball families",
        "pL": "📖 Lesson", "pR": "🗂️", "pV": "🔁", "pP": "👨‍👩‍👧",
        "sh0": "Numbers & Operations",
        "sc0": "🌱 Not covered yet in this strand: two-digit addition and subtraction (no regrouping)",
        "sh1": "Measurement",
        "sc1": "🌱 Lessons on the way: comparing lengths, o’clock and half past, coins",
        "sh2": "Space & Shape",
        "sc2": "✅ Every unit in this strand has a lesson",
        "sh3": "Relations",
        "sc3": "🌱 Lessons on the way: number patterns"
    }
};

  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var btn = document.getElementById('langBtn');

  function applyLang(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    btn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (d[key] !== undefined) nodes[i].innerHTML = d[key];
    }
  }

  btn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyLang();
  });

  applyLang();
})();
</script>
</body>
</html>
