<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(26px,5vw,38px);letter-spacing:1px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'通分加減複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 通分加減複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：異分母加減、擴分約分、比較大小、最小公倍數、分數乘法交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Common Denominators Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Common Denominators Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving unlike-fraction addition/subtraction, expanding/simplifying, comparing size, least common multiples, and multiplying fractions — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { fracadd:'通分加減', common:'最小公倍數', fracmul:'分數乘法' },
      fbRight: '<b>答對了。</b>',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b>'; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { fracadd:'🍕 通分加減 — 通分披薩屋', common:'🚏 公因數與公倍數 — 好朋友車站', fracmul:'✂️ 分數乘法 — 切了再切' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { fracadd:'Common denom.', common:'LCM', fracmul:'Fraction ×' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { fracadd:'🍕 Common denom. — The Pizza House', common:'🚏 Common Factors & Multiples', fracmul:'✂️ Multiplying Fractions' }
    }
  };

  var LINK_HREFS = { fracadd:'index.html', common:'../common-factor/', fracmul:'../fraction-multiply/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  function lcm(a, b){ return a * b / gcd(a, b); }
  function simplify(n, d){ var g = gcd(n, d); return [n / g, d / g]; }
  /* 把選項值＋正解洗牌，回傳 {opts, ans} */
  function mixOpts(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 去重要看「值」不是字串：'1/3' 和 '2/6' 值一樣，兩個都放
     孩子看到的其實只有 3 個選項。 */
  function optKey(v){
    var t = String(v).trim();
    var m = /^(-?\d+)\s*\/\s*(\d+)$/.exec(t);
    if (m && Number(m[2]) !== 0) return 'N' + (Number(m[1]) / Number(m[2]));
    var n = Number(t);
    return (t === '' || isNaN(n)) ? 'S' + t : 'N' + n;
  }
  /* 從候選字串中挑出跟正解不同、彼此「值」也不重複的 n 個錯誤選項 */
  function uniqueWrongs(correct, cands, n){
    var out = [], seen = {};
    seen[optKey(correct)] = true;
    cands.forEach(function(c){
      if (!c) return;
      var k = optKey(c);
      if (!seen[k]){ seen[k] = true; out.push(c); }
    });
    /* 保底也要長得像答案：舊版會生出「3/4#1」這種字串給孩子選 */
    var fm = /^(-?\d+)\s*\/\s*(\d+)$/.exec(String(correct).trim());
    for (var i = 1; out.length < n && i < 40; i++){
      var cand = fm ? (fm[1] + '/' + (Number(fm[2]) + i)) : String(Number(correct) + i);
      if (fm && i % 2 === 0) cand = (Number(fm[1]) + i) + '/' + fm[2];
      var kk = optKey(cand);
      if (seen[kk]) continue;
      seen[kk] = true; out.push(cand);
    }
    return out.slice(0, n);
  }

  /* ---------- 題目產生器：每次 make() 都用新數字（分母 ≤ 24、結果為真分數） ---------- */
  var DPAIRS_ADD = [[2,3],[2,5],[3,4],[3,5],[4,6],[3,6],[6,8],[4,8],[5,10],[6,9]];
  var DPAIRS_SUB = [[2,3],[3,4],[4,6],[3,6],[6,8],[4,8],[5,10],[6,9],[3,5],[2,5]];
  var EQUIV_BASE = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[1,6],[5,6]];
  var SIMPLIFY_BASE = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[1,6],[5,6],[1,8],[3,8]];
  var COMPARE_POOL = [[2,3,3,5],[3,4,4,5],[1,2,3,7],[5,6,7,8],[2,5,3,7],[3,8,2,5],[1,3,2,7],[5,9,4,7]];
  var COMMONDEN_POOL = [[2,3],[3,4],[2,5],[4,6],[3,5],[6,8],[4,8],[6,9]];
  var LCM_POOL = [[4,6],[6,9],[4,10],[6,8],[8,12],[3,4],[4,8],[6,12]];
  var FRACMUL_POOL = [[1,2,1,3],[1,3,1,4],[2,3,1,4],[1,2,2,5],[3,4,1,3],[1,5,2,3],[2,5,1,2],[1,4,2,5]];

  var GENS = [
    { id:'addUnlike', cat:'fracadd',
      make: function(used){
        var keys = DPAIRS_ADD.map(function(p){ return p[0]+'-'+p[1]; });
        var key = pickUnused(keys, used);
        var p = DPAIRS_ADD[keys.indexOf(key)];
        var b = p[0], d = p[1], l = lcm(b, d);
        var a, c, ka, kc, s, tries = 0;
        do {
          a = 1 + rand(b - 1);
          c = 1 + rand(d - 1);
          ka = a * (l / b); kc = c * (l / d); s = ka + kc;
          tries++;
        } while (s >= l && tries < 20);
        if (s >= l){ a = 1; c = 1; ka = l / b; kc = l / d; s = ka + kc; }
        var simp = simplify(s, l);
        var correctStr = simp[0] + '/' + simp[1];
        var cand = [ s+'/'+l, (a+c)+'/'+(b+d), (simp[0]+1)+'/'+simp[1], simp[0]+'/'+(simp[1]+1) ];
        var wrongs = uniqueWrongs(correctStr, cand, 3);
        var m = mixOpts(correctStr, wrongs);
        return { a:a,b:b,c:c,d:d,l:l,ka:ka,kc:kc,correctStr:correctStr,opts:m.opts,ans:m.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: dd.a+'/'+dd.b+' + '+dd.c+'/'+dd.d + (lang === 'zh' ? ' 等於多少？（答案要化到最簡）' : ' = ? (simplify your answer)'),
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? '通分成 '+dd.l+'：'+dd.a+'/'+dd.b+' = '+dd.ka+'/'+dd.l+'，'+dd.c+'/'+dd.d+' = '+dd.kc+'/'+dd.l+'，相加得 '+(dd.ka+dd.kc)+'/'+dd.l+'，化簡後是 '+dd.correctStr+'。'
            : 'Convert to a denominator of '+dd.l+': '+dd.a+'/'+dd.b+' = '+dd.ka+'/'+dd.l+', '+dd.c+'/'+dd.d+' = '+dd.kc+'/'+dd.l+'. Sum = '+(dd.ka+dd.kc)+'/'+dd.l+', simplified: '+dd.correctStr+'.'
        };
      } },
    { id:'subUnlike', cat:'fracadd',
      make: function(used){
        var keys = DPAIRS_SUB.map(function(p){ return p[0]+'-'+p[1]; });
        var key = pickUnused(keys, used);
        var p = DPAIRS_SUB[keys.indexOf(key)];
        var b = p[0], d = p[1], l = lcm(b, d);
        var a = 1 + rand(b - 1), c = 1 + rand(d - 1);
        var ka = a * (l / b), kc = c * (l / d);
        if (ka === kc){ if (c > 1) c -= 1; else c += 1; kc = c * (l / d); }
        if (ka < kc){
          var ta = a, tb = b, tka = ka;
          a = c; b = d; ka = kc; c = ta; d = tb; kc = tka;
        }
        var diff = ka - kc;
        var simp = simplify(diff, l);
        var correctStr = simp[0] + '/' + simp[1];
        var cand = [ diff+'/'+l, (simp[0]+1)+'/'+simp[1], simp[0]+'/'+(simp[1]+1), Math.abs(a-c)+'/'+Math.abs(b-d || 1) ];
        var wrongs = uniqueWrongs(correctStr, cand, 3);
        var m = mixOpts(correctStr, wrongs);
        return { a:a,b:b,c:c,d:d,l:l,ka:ka,kc:kc,diff:diff,correctStr:correctStr,opts:m.opts,ans:m.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: dd.a+'/'+dd.b+' − '+dd.c+'/'+dd.d + (lang === 'zh' ? ' 等於多少？（答案要化到最簡）' : ' = ? (simplify your answer)'),
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? '通分成 '+dd.l+'：'+dd.a+'/'+dd.b+' = '+dd.ka+'/'+dd.l+'，'+dd.c+'/'+dd.d+' = '+dd.kc+'/'+dd.l+'，相減得 '+dd.diff+'/'+dd.l+'，化簡後是 '+dd.correctStr+'。'
            : 'Convert to a denominator of '+dd.l+': '+dd.a+'/'+dd.b+' = '+dd.ka+'/'+dd.l+', '+dd.c+'/'+dd.d+' = '+dd.kc+'/'+dd.l+'. Difference = '+dd.diff+'/'+dd.l+', simplified: '+dd.correctStr+'.'
        };
      } },
    { id:'equivFraction', cat:'fracadd',
      make: function(used){
        var keys = EQUIV_BASE.map(function(p){ return p[0]+'-'+p[1]; });
        var key = pickUnused(keys, used);
        var p = EQUIV_BASE[keys.indexOf(key)];
        var a = p[0], b = p[1];
        var ms = [2,3,4].filter(function(m){ return b*m <= 24; });
        var m = pick(ms);
        var correctStr = (a*m)+'/'+(b*m);
        var cand = [ a+'/'+(b*m), (a*m+1)+'/'+(b*m), (a*m)+'/'+(b*m+1), (a+m)+'/'+(b+m) ];
        var wrongs = uniqueWrongs(correctStr, cand, 3);
        var mo = mixOpts(correctStr, wrongs);
        return { a:a,b:b,m:m,correctStr:correctStr,opts:mo.opts,ans:mo.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: lang === 'zh'
            ? '把 ' + dd.a + '/' + dd.b + ' 擴分，分子分母同乘 ' + dd.m + '，會變成哪一個分數？'
            : 'Expand ' + dd.a + '/' + dd.b + ' by multiplying the top and bottom by ' + dd.m + '. Which fraction do you get?',
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? dd.a + '/' + dd.b + ' 的分子分母同乘 ' + dd.m + ' → ' + dd.correctStr + '，還是一樣大。'
            : 'Multiply both the top and bottom of ' + dd.a + '/' + dd.b + ' by ' + dd.m + ' → ' + dd.correctStr + ' — still the same size.'
        };
      } },
    { id:'simplifyFrac', cat:'fracadd',
      make: function(used){
        var keys = SIMPLIFY_BASE.map(function(p){ return p[0]+'-'+p[1]; });
        var key = pickUnused(keys, used);
        var p = SIMPLIFY_BASE[keys.indexOf(key)];
        var pn = p[0], q = p[1];
        var gs = [2,3,4].filter(function(g){ return q*g <= 24; });
        var g = pick(gs);
        var num = pn*g, den = q*g;
        var correctStr = pn+'/'+q;
        var cand = [ num+'/'+den, (pn+1)+'/'+q, pn+'/'+(q+1), (pn>1?pn-1:pn+1)+'/'+q ];
        var wrongs = uniqueWrongs(correctStr, cand, 3);
        var mo = mixOpts(correctStr, wrongs);
        return { pn:pn,q:q,g:g,num:num,den:den,correctStr:correctStr,opts:mo.opts,ans:mo.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: lang === 'zh'
            ? dd.num + '/' + dd.den + ' 約分到最簡分數是多少？'
            : 'Simplify ' + dd.num + '/' + dd.den + ' to its simplest form.',
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? dd.num + ' 和 ' + dd.den + ' 的最大公因數是 ' + dd.g + '，同除以 ' + dd.g + ' → ' + dd.correctStr + '，分子分母已經沒有共同因數了。'
            : 'The greatest common factor of ' + dd.num + ' and ' + dd.den + ' is ' + dd.g + '. Dividing both by ' + dd.g + ' gives ' + dd.correctStr + ' — no common factor remains.'
        };
      } },
    { id:'compareFrac', cat:'fracadd',
      make: function(used){
        var keys = COMPARE_POOL.map(function(p){ return p.join('-'); });
        var key = pickUnused(keys, used);
        var p = COMPARE_POOL[keys.indexOf(key)];
        var a=p[0], b=p[1], c=p[2], d=p[3];
        var l = lcm(b, d);
        var ka = a*(l/b), kc = c*(l/d);
        var ans = ka > kc ? 0 : 1;
        return { a:a,b:b,c:c,d:d,l:l,ka:ka,kc:kc,ans:ans };
      },
      fmt: function(dd, lang){
        var fa = dd.a+'/'+dd.b, fc = dd.c+'/'+dd.d;
        var opts = lang === 'zh'
          ? [fa+' 比較大', fc+' 比較大', '兩個一樣大', '沒辦法比較']
          : [fa+' is bigger', fc+' is bigger', 'They are equal', 'Cannot be compared'];
        return {
          stem: lang === 'zh' ? fa + ' 和 ' + fc + ' 哪一個比較大？' : 'Which is bigger, ' + fa + ' or ' + fc + '?',
          opts: opts, ans: dd.ans,
          why: lang === 'zh'
            ? '通分成 ' + dd.l + '：' + fa + ' = ' + dd.ka + '/' + dd.l + '，' + fc + ' = ' + dd.kc + '/' + dd.l + '，' + (dd.ans === 0 ? fa : fc) + ' 比較大。'
            : 'Convert to a denominator of ' + dd.l + ': ' + fa + ' = ' + dd.ka + '/' + dd.l + ', ' + fc + ' = ' + dd.kc + '/' + dd.l + ' — ' + (dd.ans === 0 ? fa : fc) + ' is bigger.'
        };
      } },
    { id:'commonDenom', cat:'fracadd',
      make: function(used){
        var keys = COMMONDEN_POOL.map(function(p){ return p.join('-'); });
        var key = pickUnused(keys, used);
        var p = COMMONDEN_POOL[keys.indexOf(key)];
        var b = p[0], d = p[1], l = lcm(b, d);
        var a = 1 + rand(b - 1), c = 1 + rand(d - 1);
        var cand = [b*d, b+d, gcd(b,d), Math.max(b,d), Math.min(b,d), l+1, l-1]
          .filter(function(v){ return v > 0; }).map(String);
        var wrongs = uniqueWrongs(String(l), cand, 3);
        var mo = mixOpts(String(l), wrongs);
        return { a:a,b:b,c:c,d:d,l:l,opts:mo.opts,ans:mo.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: lang === 'zh'
            ? '要計算 ' + dd.a + '/' + dd.b + ' 和 ' + dd.c + '/' + dd.d + ' 的加減，通分後最小的新分母是多少？'
            : 'To add or subtract ' + dd.a + '/' + dd.b + ' and ' + dd.c + '/' + dd.d + ', what is the SMALLEST common denominator?',
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? dd.b + ' 的倍數：' + dd.b + '、' + 2*dd.b + '⋯⋯；' + dd.d + ' 的倍數：' + dd.d + '、' + 2*dd.d + '⋯⋯ 最早一起出現的是 ' + dd.l + '。'
            : 'Multiples of ' + dd.b + ': ' + dd.b + ', ' + 2*dd.b + '…; of ' + dd.d + ': ' + dd.d + ', ' + 2*dd.d + '… — the first shared one is ' + dd.l + '.'
        };
      } },
    { id:'lcmSimple', cat:'common',
      make: function(used){
        var keys = LCM_POOL.map(function(p){ return p.join('-'); });
        var key = pickUnused(keys, used);
        var p = LCM_POOL[keys.indexOf(key)];
        var a = p[0], b = p[1], l = lcm(a, b);
        var cand = [a*b, a+b, gcd(a,b), Math.max(a,b), Math.min(a,b), l+1, l-1]
          .filter(function(v){ return v > 0; }).map(String);
        var wrongs = uniqueWrongs(String(l), cand, 3);
        var mo = mixOpts(String(l), wrongs);
        return { a:a,b:b,l:l,opts:mo.opts,ans:mo.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: lang === 'zh' ? dd.a + ' 和 ' + dd.b + ' 的最小公倍數是多少？' : 'What is the least common multiple of ' + dd.a + ' and ' + dd.b + '?',
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? dd.a + ' 的倍數：' + dd.a + '、' + 2*dd.a + '⋯⋯；' + dd.b + ' 的倍數：' + dd.b + '、' + 2*dd.b + '⋯⋯ 最早一起出現的是 ' + dd.l + '。'
            : 'Multiples of ' + dd.a + ': ' + dd.a + ', ' + 2*dd.a + '…; of ' + dd.b + ': ' + dd.b + ', ' + 2*dd.b + '… — the first shared one is ' + dd.l + '.'
        };
      } },
    { id:'fracMulSimple', cat:'fracmul',
      make: function(used){
        var keys = FRACMUL_POOL.map(function(p){ return p.join('-'); });
        var key = pickUnused(keys, used);
        var p = FRACMUL_POOL[keys.indexOf(key)];
        var a=p[0], b=p[1], c=p[2], d=p[3];
        var num = a*c, den = b*d;
        var simp = simplify(num, den);
        var correctStr = simp[0] + '/' + simp[1];
        var cand = [ num+'/'+den, (a+c)+'/'+(b+d), (simp[0]+1)+'/'+simp[1], simp[0]+'/'+(simp[1]+1) ];
        var wrongs = uniqueWrongs(correctStr, cand, 3);
        var mo = mixOpts(correctStr, wrongs);
        return { a:a,b:b,c:c,d:d,num:num,den:den,correctStr:correctStr,opts:mo.opts,ans:mo.ans };
      },
      fmt: function(dd, lang){
        return {
          stem: dd.a+'/'+dd.b+' × '+dd.c+'/'+dd.d + (lang === 'zh' ? ' 等於多少？（答案要化到最簡）' : ' = ? (simplify your answer)'),
          opts: dd.opts, ans: dd.ans,
          why: lang === 'zh'
            ? '分子乘分子、分母乘分母：' + dd.num + '/' + dd.den + '，化簡後是 ' + dd.correctStr + '。'
            : 'Multiply the numerators together and the denominators together: ' + dd.num + '/' + dd.den + ', simplified: ' + dd.correctStr + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：8 種題型各一題＋隨機 4 題（限「通分加減」大類，數字不重複） ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){ return g.cat === 'fracadd'; });
    for (var i = 0; i < 4; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
