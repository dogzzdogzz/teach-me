<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小數複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 小數複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：小數乘除、分數換小數、百分率、異分母加法交錯出現，<strong>每一批的數字都是新出的</strong>，
    背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'小數複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）',
      h1:'🔁 小數複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：小數乘除、分數換小數、百分率、異分母加法交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Decimals Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)',
      h1:'🔁 Decimals Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving decimal ×/÷, fraction-to-decimal, percentages and adding fractions — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { decimal:'小數', percent:'百分率', fracadd:'異分母加法' },
      fbRight: '<b>答對了。</b>',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b>'; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { decimal:'💰 小數 — 小數商店', percent:'🎯 百分率 — 百分百大挑戰', fracadd:'🍕 異分母加法 — 通分披薩屋' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { decimal:'Decimals', percent:'Percentages', fracadd:'Adding fractions' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { decimal:'💰 Decimals — The Decimal Shop', percent:'🎯 Percentages — The 100% Challenge', fracadd:'🍕 Adding Fractions — The Pizza House' }
    }
  };

  var LINK_HREFS = { decimal:'index.html', percent:'../percent/', fracadd:'../fraction-add/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 把選項值＋正解洗牌，回傳 {opts, ans} */
  function mixOpts(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 用整數（十分位/百分位）運算，避免浮點誤差；再轉回乾淨的小數字串 */
  function fmtTenths(t){
    var sign = t < 0 ? '-' : ''; t = Math.abs(t);
    var whole = Math.floor(t / 10), frac = t % 10;
    return sign + whole + (frac ? ('.' + frac) : '');
  }
  function fmtHundredths(h){
    var sign = h < 0 ? '-' : ''; h = Math.abs(h);
    var whole = Math.floor(h / 100), frac = h % 100;
    if (frac === 0) return sign + whole;
    if (frac % 10 === 0) return sign + whole + '.' + (frac / 10);
    var fracStr = (frac < 10 ? '0' : '') + frac;
    return sign + whole + '.' + fracStr;
  }
  /* 純小數（<1）補成兩位小數顯示用，例如 6 -> '0.60' */
  function pad2(h){ return '0.' + (h < 10 ? '0' + h : String(h)); }
  /* 選一張夠大的鈔票；順便避開「找的錢剛好等於商品總價」的巧合（避免選項重複） */
  function pickBank(totalTenths){
    var banks = [20, 50, 100, 200];
    for (var i = 0; i < banks.length; i++){
      var b = banks[i];
      if (b * 10 > totalTenths && b * 10 !== 2 * totalTenths) return b;
    }
    return banks[banks.length - 1];
  }

  /* ---------- 題目產生器：每次 make() 都用新數字 ---------- */
  var GENS = [
    { id:'multDecimal', cat:'decimal',
      make: function(used){
        var t = pickUnused([11,12,13,14,16,17,18,19,21,22,23,24,26,27,28,29,31,32,33,34,36,37,38,39,41,42,43,44,46,47,48,49], used);
        var n = 2 + rand(5);
        var prod = t * n;
        var correct = fmtTenths(prod);
        var wrongs = [ String(prod), fmtHundredths(prod), fmtTenths(prod + n) ];
        var m = mixOpts(correct, wrongs);
        return { t:t, n:n, prod:prod, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var aStr = fmtTenths(d.t);
        return {
          stem: aStr + ' × ' + d.n + ' = ?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '先當整數乘：' + d.t + ' × ' + d.n + ' = ' + d.prod + '；' + aStr + ' 有 1 位小數，小數點左移 1 位 → ' + fmtTenths(d.prod) + '。'
            : 'Multiply as whole numbers first: ' + d.t + ' × ' + d.n + ' = ' + d.prod + '. ' + aStr + ' has 1 decimal place, so move the point one place left → ' + fmtTenths(d.prod) + '.'
        };
      } },
    { id:'divDecimal', cat:'decimal',
      make: function(used){
        var n = pickUnused([2,3,4,5,6], used);
        var q = 11 + rand(8);
        var t = q * n;
        var correct = fmtTenths(q);
        var wrongs = [ String(q), fmtHundredths(q), fmtTenths(q + n) ];
        var m = mixOpts(correct, wrongs);
        return { t:t, n:n, q:q, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var aStr = fmtTenths(d.t);
        return {
          stem: aStr + ' ÷ ' + d.n + ' = ?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '先當整數除：' + d.t + ' ÷ ' + d.n + ' = ' + d.q + '；商的小數點對齊被除數（1 位小數）→ ' + fmtTenths(d.q) + '。'
            : 'Divide as whole numbers first: ' + d.t + ' ÷ ' + d.n + ' = ' + d.q + '. Line the quotient point up with the dividend (1 decimal place) → ' + fmtTenths(d.q) + '.'
        };
      } },
    { id:'wordMoneyTotal', cat:'decimal',
      make: function(used){
        var t = pickUnused([15,25,35,45,55,65,75,85,12,22,32,42,52,62,72,82], used);
        var n = 2 + rand(5);
        var prod = t * n;
        var correct = fmtTenths(prod);
        var wrongs = [ String(prod), fmtHundredths(prod), fmtTenths(prod - n) ];
        var m = mixOpts(correct, wrongs);
        return { t:t, n:n, prod:prod, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var priceStr = fmtTenths(d.t);
        return {
          stem: lang === 'zh' ? '文字題：一枝筆 ' + priceStr + ' 元，買 ' + d.n + ' 枝，一共要多少錢？'
            : 'Word problem: A pen costs $' + priceStr + ' each. How much for ' + d.n + ' pens?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? priceStr + ' × ' + d.n + '：先當整數乘 ' + d.t + ' × ' + d.n + ' = ' + d.prod + '，' + priceStr + ' 有 1 位小數，小數點左移 1 位 → ' + fmtTenths(d.prod) + ' 元。'
            : priceStr + ' × ' + d.n + ': multiply as whole numbers first, ' + d.t + ' × ' + d.n + ' = ' + d.prod + '. ' + priceStr + ' has 1 decimal place, so move the point one place left → $' + fmtTenths(d.prod) + '.'
        };
      } },
    { id:'wordChange', cat:'decimal',
      make: function(used){
        var t = pickUnused([105,115,125,135,145,155,165,175,185,195,205,215,225,235,245], used);
        var n = 2 + rand(3);
        var total = t * n;
        var P = pickBank(total);
        var change = P * 10 - total;
        var correct = fmtTenths(change);
        var wrongs = [ fmtTenths(total), String(change), fmtTenths(change + n) ];
        var m = mixOpts(correct, wrongs);
        return { t:t, n:n, total:total, P:P, change:change, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var priceStr = fmtTenths(d.t);
        var totalStr = fmtTenths(d.total);
        return {
          stem: lang === 'zh' ? '文字題：一枝筆 ' + priceStr + ' 元，買 ' + d.n + ' 枝，付 ' + d.P + ' 元，該找多少錢？'
            : 'Word problem: A pen costs $' + priceStr + ' each. You buy ' + d.n + ' and pay with $' + d.P + '. How much change do you get back?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? priceStr + ' × ' + d.n + ' = ' + totalStr + ' 元；' + d.P + ' − ' + totalStr + ' = ' + fmtTenths(d.change) + ' 元。'
            : priceStr + ' × ' + d.n + ' = $' + totalStr + '. ' + d.P + ' − ' + totalStr + ' = $' + fmtTenths(d.change) + '.'
        };
      } },
    { id:'fracToDecimal', cat:'decimal',
      make: function(used){
        var POOL = [
          { frac:'1/2', dec:'0.5',  why_zh:'1/2 是分成 2 份拿 1 份，等於 0.5。',  why_en:'1/2 means splitting into 2 parts and taking 1 — equal to 0.5.' },
          { frac:'1/4', dec:'0.25', why_zh:'1/4 是分成 4 份拿 1 份，等於 0.25。', why_en:'1/4 means splitting into 4 parts and taking 1 — equal to 0.25.' },
          { frac:'3/4', dec:'0.75', why_zh:'3/4 是分成 4 份拿 3 份，等於 0.75。', why_en:'3/4 means splitting into 4 parts and taking 3 — equal to 0.75.' },
          { frac:'1/5', dec:'0.2',  why_zh:'1/5 是分成 5 份拿 1 份，等於 0.2。',  why_en:'1/5 means splitting into 5 parts and taking 1 — equal to 0.2.' },
          { frac:'2/5', dec:'0.4',  why_zh:'2/5 是分成 5 份拿 2 份，等於 0.4。',  why_en:'2/5 means splitting into 5 parts and taking 2 — equal to 0.4.' },
          { frac:'3/5', dec:'0.6',  why_zh:'3/5 是分成 5 份拿 3 份，等於 0.6。',  why_en:'3/5 means splitting into 5 parts and taking 3 — equal to 0.6.' },
          { frac:'4/5', dec:'0.8',  why_zh:'4/5 是分成 5 份拿 4 份，等於 0.8。',  why_en:'4/5 means splitting into 5 parts and taking 4 — equal to 0.8.' },
          { frac:'1/10', dec:'0.1', why_zh:'1/10 是分成 10 份拿 1 份，等於 0.1。', why_en:'1/10 means splitting into 10 parts and taking 1 — equal to 0.1.' }
        ];
        var fracs = POOL.map(function(p){ return p.frac; });
        var key = pickUnused(fracs, used);
        var entry = POOL[fracs.indexOf(key)];
        var otherDecs = POOL.filter(function(p){ return p.frac !== key; }).map(function(p){ return p.dec; });
        var wrongs = shuffle(otherDecs).slice(0, 3);
        var m = mixOpts(entry.dec, wrongs);
        return { frac:entry.frac, dec:entry.dec, why_zh:entry.why_zh, why_en:entry.why_en, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.frac + ' 等於多少小數？' : 'What is ' + d.frac + ' as a decimal?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh' ? d.why_zh : d.why_en
        };
      } },
    { id:'compareDecimals', cat:'decimal',
      make: function(used){
        var t1 = pickUnused([1,2,3,4,5,6,7,8,9], used);
        var offset = (1 + rand(9)) * (rand(2) ? 1 : -1);
        var h2 = t1 * 10 + offset;
        var biggerToken = (t1 * 10 > h2) ? 'A' : 'B';
        var order = shuffle(['A', 'B', 'EQUAL', 'CANNOT']);
        return { t1:t1, h2:h2, biggerToken:biggerToken, order:order };
      },
      fmt: function(d, lang){
        var aStr = fmtTenths(d.t1);
        var bStr = fmtHundredths(d.h2);
        var textMap = {
          A: aStr, B: bStr,
          EQUAL: lang === 'zh' ? '一樣大' : 'They are equal',
          CANNOT: lang === 'zh' ? '位數不同，無法比較' : 'Cannot compare — different number of decimal places'
        };
        var opts = d.order.map(function(tok){ return textMap[tok]; });
        var ans = d.order.indexOf(d.biggerToken);
        var biggerStr = d.biggerToken === 'A' ? aStr : bStr;
        return {
          stem: lang === 'zh' ? '哪一個比較大？' + aStr + ' 還是 ' + bStr + '？' : 'Which is bigger: ' + aStr + ' or ' + bStr + '?',
          opts: opts, ans: ans,
          why: lang === 'zh'
            ? aStr + ' 補成兩位小數是 ' + pad2(d.t1 * 10) + '，跟 ' + bStr + ' 比較十分位、百分位：' + biggerStr + ' 比較大（位數多不代表比較大）。'
            : aStr + ' padded to 2 decimal places is ' + pad2(d.t1 * 10) + '. Compare tenths then hundredths against ' + bStr + ': ' + biggerStr + ' is bigger (more digits does not mean bigger).'
        };
      } },
    { id:'percentToDecimal', cat:'percent',
      make: function(used){
        var p = pickUnused([15,20,25,30,35,40,45,55,60,65,70,75,80,85,90], used);
        var correct = fmtHundredths(p);
        var wrongs = [ fmtTenths(p), String(p), fmtHundredths(100 - p) ];
        var m = mixOpts(correct, wrongs);
        return { p:p, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.p + '% 等於多少小數？' : 'What is ' + d.p + '% as a decimal?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? d.p + '% 表示 ' + d.p + '/100，把百分號拿掉、小數點往左移 2 位 → ' + fmtHundredths(d.p) + '。'
            : d.p + '% means ' + d.p + '/100 — drop the % sign and move the point 2 places left → ' + fmtHundredths(d.p) + '.'
        };
      } },
    { id:'fracAddSimple', cat:'fracadd',
      make: function(used){
        var POOL = [
          { a:'1/2', b:'1/4', correct:'3/4', wrongs:['2/6','4/4','1/6'],
            why_zh:'1/2 通分成 2/4，2/4 + 1/4 = 3/4。', why_en:'1/2 becomes 2/4. 2/4 + 1/4 = 3/4.' },
          { a:'1/3', b:'1/6', correct:'1/2', wrongs:['2/9','3/6','1/9'],
            why_zh:'1/3 通分成 2/6，2/6 + 1/6 = 3/6，化簡成 1/2。', why_en:'1/3 becomes 2/6. 2/6 + 1/6 = 3/6, which simplifies to 1/2.' },
          { a:'1/4', b:'1/8', correct:'3/8', wrongs:['2/12','1/8','4/12'],
            why_zh:'1/4 通分成 2/8，2/8 + 1/8 = 3/8。', why_en:'1/4 becomes 2/8. 2/8 + 1/8 = 3/8.' },
          { a:'1/2', b:'1/6', correct:'2/3', wrongs:['4/8','2/6','1/3'],
            why_zh:'1/2 通分成 3/6，3/6 + 1/6 = 4/6，化簡成 2/3。', why_en:'1/2 becomes 3/6. 3/6 + 1/6 = 4/6, which simplifies to 2/3.' },
          { a:'1/3', b:'1/9', correct:'4/9', wrongs:['2/12','1/12','5/9'],
            why_zh:'1/3 通分成 3/9，3/9 + 1/9 = 4/9。', why_en:'1/3 becomes 3/9. 3/9 + 1/9 = 4/9.' },
          { a:'1/4', b:'1/12', correct:'1/3', wrongs:['4/16','2/12','1/12'],
            why_zh:'1/4 通分成 3/12，3/12 + 1/12 = 4/12，化簡成 1/3。', why_en:'1/4 becomes 3/12. 3/12 + 1/12 = 4/12, which simplifies to 1/3.' }
        ];
        var keys = POOL.map(function(p){ return p.a + '+' + p.b; });
        var key = pickUnused(keys, used);
        var entry = POOL[keys.indexOf(key)];
        var m = mixOpts(entry.correct, entry.wrongs);
        return { a:entry.a, b:entry.b, why_zh:entry.why_zh, why_en:entry.why_en, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: d.a + ' + ' + d.b + ' = ?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh' ? d.why_zh : d.why_en
        };
      } }
  ];

  /* ---------- 出一批 12 題：8 種題型各一題＋隨機 4 題（偏向本課的小數題，數字不重複） ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['multDecimal','divDecimal','wordMoneyTotal','wordChange','fracToDecimal','compareDecimals'].indexOf(g.id) >= 0;
    });
    for (var i = 0; i < 4; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
