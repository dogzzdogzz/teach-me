<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>展開圖複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 展開圖複習挑戰</h1>
    <p data-i18n="sub">不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢</p>
  </header>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：立體形體、體積、面積、線對稱交錯出現，<strong>每一批的數字都是新出的</strong>，
    背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。
  </div>

  <div id="quiz" class="quiz"></div>
  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b></span>
  </div>

  <div class="result" id="result">
    <p id="resultLine" style="font-weight:700"></p>
    <ul id="resultLinks"></ul>
  </div>
  <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🆕 換一批新題目</button>

  <footer data-i18n="foot">
    複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。
  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'展開圖複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）',
      h1:'🔁 展開圖複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：立體形體、體積、面積、線對稱交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Nets Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)',
      h1:'🔁 Nets Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving solids, volume, area and symmetry — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { solid:'立體形體', volume:'體積', area:'面積', symmetry:'線對稱' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { solid:'📦 立體形體 — 展開圖工作坊', volume:'🧊 體積 — 體積積木塔', area:'📐 面積 — 面積魔術師', symmetry:'🦋 線對稱 — 對摺魔鏡' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { solid:'Solids', volume:'Volume', area:'Area', symmetry:'Symmetry' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { solid:'📦 Solids — The Nets Workshop', volume:'🧊 Volume — The Block Tower', area:'📐 Area — The Area Magician', symmetry:'🦋 Symmetry — The Fold Mirror' }
    }
  };

  var LINK_HREFS = { solid:'index.html', volume:'../volume/', area:'../area/', symmetry:'../symmetry/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 保證 3 個相異、且不等於正解的錯誤選項 */
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key] && c > 0){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器：每次 make() 都用新數字（已逐一手算覆核） ---------- */
  var GENS = [
    /* 1. 面／稜／頂點 數量 */
    { id:'countFact', cat:'solid',
      make: function(used){
        var kind = pickUnused(['face','edge','vertex'], used);
        var val = { face:6, edge:12, vertex:8 }[kind];
        var others = [6,12,8].filter(function(v){ return v !== val; });
        var m = mixOpts(val, others.concat([val + 2]));
        return { kind:kind, val:val, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var kindName = { face:{zh:'面',en:'face'}, edge:{zh:'稜',en:'edge'}, vertex:{zh:'頂點',en:'vertex'} }[d.kind];
        var unit = { face:{zh:'個',en:''}, edge:{zh:'條',en:''}, vertex:{zh:'個',en:''} }[d.kind];
        return {
          stem: lang === 'zh' ? '一個長方體總共有幾' + unit.zh + kindName.zh + '？' : 'How many ' + kindName.en + 's does a cuboid have in total?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '長方體固定有 6 個面、12 條稜、8 個頂點，這題問的是' + kindName.zh + '，答案是 ' + d.val + '。'
            : 'A cuboid always has 6 faces, 12 edges and 8 vertices — this asks for ' + kindName.en + 's, so the answer is ' + d.val + '.'
        };
      } },
    /* 2. 長方體表面積 */
    { id:'surfaceCuboid', cat:'solid',
      make: function(used){
        var l = pickUnused([2,3,4,5,6,7,8,9], used);
        var w = 2 + rand(7), h = 2 + rand(7);
        var lw=l*w, lh=l*h, wh=w*h, ans = 2*(lw+lh+wh);
        var m = mixOpts(ans, [l*w*h, lw+lh+wh, ans - 2*Math.min(lw,lh,wh)]);
        return { l:l, w:w, h:h, lw:lw, lh:lh, wh:wh, ans:ans, opts:m.opts, ans_:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '長方體長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分、高 ' + d.h + ' 公分，表面積是多少平方公分？' : 'A cuboid is ' + d.l + ' cm long, ' + d.w + ' cm wide and ' + d.h + ' cm tall. What is its surface area, in cm²?',
          opts: d.opts.map(String), ans: d.ans_,
          why: lang === 'zh'
            ? '2×(' + d.l + '×' + d.w + ' + ' + d.l + '×' + d.h + ' + ' + d.w + '×' + d.h + ') = 2×(' + d.lw + '+' + d.lh + '+' + d.wh + ') = 2×' + (d.lw+d.lh+d.wh) + ' = ' + d.ans + ' 平方公分。'
            : '2×(' + d.l + '×' + d.w + ' + ' + d.l + '×' + d.h + ' + ' + d.w + '×' + d.h + ') = 2×(' + d.lw + '+' + d.lh + '+' + d.wh + ') = 2×' + (d.lw+d.lh+d.wh) + ' = ' + d.ans + ' cm².'
        };
      } },
    /* 3. 正方體表面積 */
    { id:'surfaceCube', cat:'solid',
      make: function(used){
        var a = pickUnused([2,3,4,5,6,7,8,9], used);
        var ans = 6*a*a;
        var m = mixOpts(ans, [a*a*a, 4*a*a, a*a]);
        return { a:a, ans:ans, opts:m.opts, ans_:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '正方體邊長 ' + d.a + ' 公分，表面積是多少平方公分？' : 'A cube has an edge of ' + d.a + ' cm. What is its surface area, in cm²?',
          opts: d.opts.map(String), ans: d.ans_,
          why: lang === 'zh'
            ? '6 × ' + d.a + '×' + d.a + ' = 6 × ' + (d.a*d.a) + ' = ' + d.ans + ' 平方公分。'
            : '6 × ' + d.a + '×' + d.a + ' = 6 × ' + (d.a*d.a) + ' = ' + d.ans + ' cm².'
        };
      } },
    /* 4. 稜長總和 */
    { id:'totalEdge', cat:'solid',
      make: function(used){
        var l = pickUnused([2,3,4,5,6,7,8,9], used);
        var w = 2 + rand(7), h = 2 + rand(7);
        var sum3 = l+w+h, ans = 4*sum3;
        var m = mixOpts(ans, [sum3, 2*sum3, ans + 4]);
        return { l:l, w:w, h:h, sum3:sum3, ans:ans, opts:m.opts, ans_:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '長方體長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分、高 ' + d.h + ' 公分，把 12 條稜的長度全部加起來，總共是多少公分？' : 'A cuboid is ' + d.l + ' cm long, ' + d.w + ' cm wide and ' + d.h + ' cm tall. What is the total length of all 12 edges, in cm?',
          opts: d.opts.map(String), ans: d.ans_,
          why: lang === 'zh'
            ? '長方體有 4 條長、4 條寬、4 條高：4×(' + d.l + '+' + d.w + '+' + d.h + ') = 4×' + d.sum3 + ' = ' + d.ans + ' 公分。'
            : 'A cuboid has 4 edges each of length, width and height: 4×(' + d.l + '+' + d.w + '+' + d.h + ') = 4×' + d.sum3 + ' = ' + d.ans + ' cm.'
        };
      } },
    /* 5. 比較兩個正方體的表面積 */
    { id:'compareCube', cat:'solid',
      make: function(used){
        var a1 = pickUnused([2,3,4,5,6], used);
        var a2 = a1 + 1 + rand(3);
        var s1 = 6*a1*a1, s2 = 6*a2*a2, diff = s2 - s1;
        var m = mixOpts(diff, [6*(a2-a1)*(a2-a1), a2*a2*a2 - a1*a1*a1, diff + 6]);
        return { a1:a1, a2:a2, s1:s1, s2:s2, diff:diff, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '一個正方體邊長 ' + d.a1 + ' 公分，另一個邊長 ' + d.a2 + ' 公分，兩個表面積相差多少平方公分？' : 'One cube has an edge of ' + d.a1 + ' cm, another has an edge of ' + d.a2 + ' cm. How much bigger is the second cube’s surface area, in cm²?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '邊長 ' + d.a1 + '：6×' + d.a1 + '×' + d.a1 + '=' + d.s1 + '；邊長 ' + d.a2 + '：6×' + d.a2 + '×' + d.a2 + '=' + d.s2 + '；相差 ' + d.s2 + '−' + d.s1 + '=' + d.diff + ' 平方公分。'
            : 'Edge ' + d.a1 + ': 6×' + d.a1 + '×' + d.a1 + '=' + d.s1 + '. Edge ' + d.a2 + ': 6×' + d.a2 + '×' + d.a2 + '=' + d.s2 + '. Difference = ' + d.s2 + '−' + d.s1 + '=' + d.diff + ' cm².'
        };
      } },
    /* 6. 已知稜長總和與兩邊，求第三邊 */
    { id:'missingDim', cat:'solid',
      make: function(used){
        var l = pickUnused([2,3,4,5,6,7,8], used);
        var w = 2 + rand(6), h = 2 + rand(6);
        var total = 4*(l+w+h);
        var m = mixOpts(h, [total/4, l+w, h+2]);
        return { l:l, w:w, h:h, total:total, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '長方體 12 條稜的總長是 ' + d.total + ' 公分，已知長是 ' + d.l + ' 公分、寬是 ' + d.w + ' 公分，高是多少公分？'
            : 'The total length of a cuboid’s 12 edges is ' + d.total + ' cm. Its length is ' + d.l + ' cm and width is ' + d.w + ' cm. What is its height, in cm?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '總長 ÷ 4 = 長+寬+高：' + d.total + ' ÷ 4 = ' + (d.total/4) + '，' + (d.total/4) + ' − ' + d.l + ' − ' + d.w + ' = ' + d.h + ' 公分。'
            : 'Total ÷ 4 = length+width+height: ' + d.total + ' ÷ 4 = ' + (d.total/4) + ', and ' + (d.total/4) + ' − ' + d.l + ' − ' + d.w + ' = ' + d.h + ' cm.'
        };
      } },
    /* 7. 展開圖判斷（文字敘述版，池子裡隨機挑一個，已用「滾骰子」演算法驗證過） */
    { id:'netFold', cat:'solid',
      make: function(used){
        var pool = [0,1,2,3,4,5];
        var idx = pickUnused(pool, used);
        return { idx: idx };
      },
      fmt: function(d, lang){
        var items = {
          zh: [
            { desc:'6 個正方形排成「一直排 6 個」', ok:false, why:'一直排 6 個摺起來會有面重疊、也會露出空隙，摺不成正方體。' },
            { desc:'6 個正方形排成「2 排 3 列」的長方形', ok:false, why:'2×3 的長方形摺起來會有 2 個面重疊、2 個面沒蓋到，摺不成正方體。' },
            { desc:'一直排 4 個，最左邊那格上面接 1 個、最右邊那格下面接 1 個', ok:true, why:'這是可以摺成正方體的排法之一：一直排 4 個繞成上下前後左右，兩側翼分別變成剩下的兩面。' },
            { desc:'一直排 4 個，中間偏左那格上面接 1 個、中間偏右那格下面接 1 個（十字形）', ok:true, why:'這種十字形排法也是能摺成正方體的 11 種之一。' },
            { desc:'排成「兩排各 3 個、往旁邊錯開一格」的階梯形', ok:true, why:'階梯形（3-3 交錯）也是能摺成正方體的排法之一。' },
            { desc:'排成 ㄩ 字形（三邊都有小正方形，中間缺一塊）', ok:false, why:'這種 ㄩ 字形摺起來會有兩格疊到同一面，另一面卻空著，摺不成正方體。' }
          ],
          en: [
            { desc:'6 squares arranged in "a straight line of 6"', ok:false, why:'A straight line of 6 folds with faces overlapping and a gap left over — it does not fold into a cube.' },
            { desc:'6 squares arranged as a "2 rows × 3 columns" rectangle', ok:false, why:'A 2×3 rectangle folds with 2 faces overlapping and 2 faces left uncovered — it does not fold into a cube.' },
            { desc:'a straight run of 4, with 1 square above the leftmost and 1 square below the rightmost', ok:true, why:'This is one of the valid arrangements: the run of 4 wraps around top/bottom/front/back, and the two flaps become the remaining two faces.' },
            { desc:'a straight run of 4, with 1 square above a middle-left square and 1 below a middle-right square (a cross shape)', ok:true, why:'This cross-like arrangement is also one of the 11 that fold into a cube.' },
            { desc:'a staircase shape: two rows of 3, offset sideways by one square', ok:true, why:'This staircase (offset 3-3) arrangement is also one of the valid cube nets.' },
            { desc:'a "U" shape: squares along three sides with the middle one missing', ok:false, why:'This U shape folds two squares onto the same face while leaving another face empty — it does not fold into a cube.' }
          ]
        };
        var item = items[lang][d.idx];
        var yesOpt = lang === 'zh' ? '可以摺成正方體' : 'Folds into a cube';
        var noOpt = lang === 'zh' ? '不能摺成正方體' : 'Does not fold into a cube';
        var opts = [yesOpt, noOpt];
        return {
          stem: lang === 'zh' ? item.desc + '，能不能摺成正方體？' : item.desc + ' — does it fold into a cube?',
          opts: opts, ans: item.ok ? 0 : 1, why: item.why
        };
      } },
    /* 8. 體積（交錯主題） */
    { id:'volume', cat:'volume',
      make: function(used){
        var l = pickUnused([2,3,4,5,6,7,8], used);
        var w = 2 + rand(6), h = 2 + rand(6);
        var ans = l*w*h;
        var m = mixOpts(ans, [2*(l*w+l*h+w*h), l+w+h, ans + l]);
        return { l:l, w:w, h:h, ans:ans, opts:m.opts, ans_:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '長方體長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分、高 ' + d.h + ' 公分，體積是多少立方公分？' : 'A cuboid is ' + d.l + ' cm long, ' + d.w + ' cm wide and ' + d.h + ' cm tall. What is its volume, in cm³?',
          opts: d.opts.map(String), ans: d.ans_,
          why: lang === 'zh'
            ? '體積 = 長×寬×高 = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.ans + ' 立方公分。'
            : 'Volume = length×width×height = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.ans + ' cm³.'
        };
      } },
    /* 9. 面積（交錯主題） */
    { id:'area', cat:'area',
      make: function(used){
        var l = pickUnused([3,4,5,6,7,8,9,10], used);
        var w = 2 + rand(8);
        var ans = l*w;
        var m = mixOpts(ans, [2*(l+w), l+w, ans + w]);
        return { l:l, w:w, ans:ans, opts:m.opts, ans_:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '一個長方形長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分，面積是多少平方公分？' : 'A rectangle is ' + d.l + ' cm long and ' + d.w + ' cm wide. What is its area, in cm²?',
          opts: d.opts.map(String), ans: d.ans_,
          why: lang === 'zh'
            ? '面積 = 長×寬 = ' + d.l + '×' + d.w + ' = ' + d.ans + ' 平方公分。'
            : 'Area = length×width = ' + d.l + '×' + d.w + ' = ' + d.ans + ' cm².'
        };
      } },
    /* 10. 線對稱（交錯主題） */
    { id:'symmetry', cat:'symmetry',
      make: function(used){
        var table = { zh:['正方形','長方形','正三角形','正五邊形','正六邊形'], en:['a square','a rectangle','an equilateral triangle','a regular pentagon','a regular hexagon'] };
        var counts = [4, 2, 3, 5, 6];
        var idx = pickUnused([0,1,2,3,4], used);
        var val = counts[idx];
        var others = counts.filter(function(v){ return v !== val; });
        var m = mixOpts(val, others);
        return { idx:idx, val:val, table:table, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var name = d.table[lang][d.idx];
        return {
          stem: lang === 'zh' ? name + '總共有幾條對稱軸？' : 'How many lines of symmetry does ' + name + ' have?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? name + '有 ' + d.val + ' 條對稱軸。'
            : name + ' has ' + d.val + ' line' + (d.val === 1 ? '' : 's') + ' of symmetry.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：7 種本課題型各一題＋3 個交錯主題各一題＋2 題隨機補滿 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var ownTypes = GENS.filter(function(g){ return g.cat === 'solid'; });
    var siblingTypes = GENS.filter(function(g){ return g.cat !== 'solid'; });
    var slots = ownTypes.concat(siblingTypes);
    var extraPool = GENS.filter(function(g){
      return ['surfaceCuboid','surfaceCube','totalEdge','volume','area','symmetry'].indexOf(g.id) >= 0;
    });
    for (var i = 0; i < 2; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
