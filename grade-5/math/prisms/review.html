<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柱體錐體複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  .solidWrap{display:flex;justify-content:center;margin:0 auto 8px;max-width:200px}
  .solidWrap svg{width:100%;height:auto;display:block}
  .edgeSolid{stroke:var(--ink);stroke-width:3;fill:none}
  .edgeHidden{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5;fill:none}
  .faceTop{fill:var(--blue-soft);stroke:var(--ink);stroke-width:3}
  .faceBase{fill:var(--green-soft);stroke:var(--ink);stroke-width:2.5}
  .faceRect{fill:var(--orange-soft);stroke:var(--ink);stroke-width:2.5}
  .apexDot{fill:var(--ink)}
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>

  </footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 幾何工具（與 index.html 相同邏輯） ---------- */
  var POLY_ORD_ZH = {3:'三角',4:'四角',5:'五角',6:'六角',7:'七角',8:'八角'};
  var POLY_ORD_EN = {3:'triangular',4:'quadrangular',5:'pentagonal',6:'hexagonal',7:'heptagonal',8:'octagonal'};
  var POLY_SHAPE_ZH = {3:'三角形',4:'四邊形',5:'五邊形',6:'六邊形',7:'七邊形',8:'八邊形'};
  var POLY_SHAPE_EN = {3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon'};
  function polyOrd(n, lang){ var d = lang === 'zh' ? POLY_ORD_ZH : POLY_ORD_EN; return d[n] || (lang === 'zh' ? (n + '角') : (n + '-gonal')); }
  function polyShapeName(n, lang){ var d = lang === 'zh' ? POLY_SHAPE_ZH : POLY_SHAPE_EN; return d[n] || (lang === 'zh' ? (n + '邊形') : (n + '-gon')); }
  function prismName(n, lang){ return lang === 'zh' ? (polyOrd(n,'zh') + '柱') : (polyOrd(n,'en') + ' prism'); }
  function pyramidName(n, lang){ return lang === 'zh' ? (polyOrd(n,'zh') + '錐') : (polyOrd(n,'en') + ' pyramid'); }
  function prismCounts(n){ return { f: n + 2, e: 3 * n, v: 2 * n }; }
  function pyramidCounts(n){ return { f: n + 1, e: 2 * n, v: n + 1 }; }

  function ngonPoints(n, cx, cy, rx, ry, rotDeg){
    var pts = [];
    for (var i = 0; i < n; i++){
      var theta = (rotDeg == null ? -90 : rotDeg) + i * 360 / n;
      var rad = theta * Math.PI / 180;
      pts.push([cx + rx * Math.cos(rad), cy + ry * Math.sin(rad)]);
    }
    return pts;
  }
  function line(p1, p2, cls){
    return '<line class="' + cls + '" x1="' + p1[0].toFixed(1) + '" y1="' + p1[1].toFixed(1) + '" x2="' + p2[0].toFixed(1) + '" y2="' + p2[1].toFixed(1) + '"></line>';
  }
  function polygonEl(pts, cls){
    return '<polygon class="' + cls + '" points="' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"></polygon>';
  }
  function frontSin(deg){ return Math.sin(deg * Math.PI / 180); }
  function drawPrismSVG(n){
    var cx = 150, topY = 62, rx = 78, ry = 26, H = 96;
    var top = ngonPoints(n, cx, topY, rx, ry, -90);
    var bot = top.map(function(p){ return [p[0], p[1] + H]; });
    var svg = '<svg viewBox="0 0 300 220">';
    var i, j, midDeg, front;
    for (i = 0; i < n; i++){ j=(i+1)%n; midDeg=-90+i*360/n+(360/n)/2; front=frontSin(midDeg)>0.02; if(!front) svg+=line(bot[i],bot[j],'edgeHidden'); }
    for (i = 0; i < n; i++){ var deg=-90+i*360/n; front=frontSin(deg)>-0.02; svg+=line(top[i],bot[i],front?'edgeSolid':'edgeHidden'); }
    for (i = 0; i < n; i++){ j=(i+1)%n; midDeg=-90+i*360/n+(360/n)/2; front=frontSin(midDeg)>0.02; if(front) svg+=line(bot[i],bot[j],'edgeSolid'); }
    svg += polygonEl(top, 'faceTop');
    svg += '</svg>';
    return svg;
  }
  function drawPyramidSVG(n){
    var cx = 150, baseY = 172, rx = 80, ry = 26, apex = [cx, 40];
    var base = ngonPoints(n, cx, baseY, rx, ry, -90);
    var svg = '<svg viewBox="0 0 300 220">';
    var i, j, midDeg, front;
    for (i = 0; i < n; i++){ j=(i+1)%n; midDeg=-90+i*360/n+(360/n)/2; front=frontSin(midDeg)>0.02; if(!front) svg+=line(base[i],base[j],'edgeHidden'); }
    for (i = 0; i < n; i++){ var deg=-90+i*360/n; front=frontSin(deg)>-0.02; if(!front) svg+=line(apex,base[i],'edgeHidden'); }
    for (i = 0; i < n; i++){ var deg2=-90+i*360/n; front=frontSin(deg2)>-0.02; if(front) svg+=line(apex,base[i],'edgeSolid'); }
    for (i = 0; i < n; i++){ j=(i+1)%n; midDeg=-90+i*360/n+(360/n)/2; front=frontSin(midDeg)>0.02; if(front) svg+=line(base[i],base[j],'edgeSolid'); }
    svg += '<circle class="apexDot" cx="' + apex[0] + '" cy="' + apex[1] + '" r="4"></circle>';
    svg += '</svg>';
    return svg;
  }
  function ellipseArc(cx, cy, rx, ry, front){
    var sweep = front ? 1 : 0;
    var cls = front ? 'edgeSolid' : 'edgeHidden';
    return '<path class="' + cls + '" d="M ' + (cx - rx) + ' ' + cy + ' A ' + rx + ' ' + ry + ' 0 0 ' + sweep + ' ' + (cx + rx) + ' ' + cy + '" fill="none"></path>';
  }
  function drawCylinderSVG(){
    var cx = 150, topY = 56, rx = 74, ry = 24, H = 104;
    var svg = '<svg viewBox="0 0 300 220">';
    svg += ellipseArc(cx, topY + H, rx, ry, false);
    svg += line([cx - rx, topY], [cx - rx, topY + H], 'edgeSolid');
    svg += line([cx + rx, topY], [cx + rx, topY + H], 'edgeSolid');
    svg += ellipseArc(cx, topY + H, rx, ry, true);
    svg += '<ellipse class="faceTop" cx="' + cx + '" cy="' + topY + '" rx="' + rx + '" ry="' + ry + '"></ellipse>';
    svg += '</svg>';
    return svg;
  }
  function drawConeSVG(){
    var cx = 150, apexY = 40, baseY = 178, rx = 76, ry = 24;
    var svg = '<svg viewBox="0 0 300 220">';
    svg += ellipseArc(cx, baseY, rx, ry, false);
    svg += line([cx, apexY], [cx - rx, baseY], 'edgeSolid');
    svg += line([cx, apexY], [cx + rx, baseY], 'edgeSolid');
    svg += ellipseArc(cx, baseY, rx, ry, true);
    svg += '<circle class="apexDot" cx="' + cx + '" cy="' + apexY + '" r="4"></circle>';
    svg += '</svg>';
    return svg;
  }
  function drawSphereSVG(){
    var cx = 150, cy = 110, r = 78;
    var svg = '<svg viewBox="0 0 300 220">';
    svg += '<circle class="faceTop" cx="' + cx + '" cy="' + cy + '" r="' + r + '"></circle>';
    svg += ellipseArc(cx, cy, r, r * 0.32, false);
    svg += ellipseArc(cx, cy, r, r * 0.32, true);
    svg += '<ellipse class="edgeHidden" cx="' + cx + '" cy="' + cy + '" rx="' + (r * 0.32) + '" ry="' + r + '" fill="none"></ellipse>';
    svg += '</svg>';
    return svg;
  }
  function drawSolidByKind(kind, n){
    if (kind === 'prism') return drawPrismSVG(n);
    if (kind === 'pyramid') return drawPyramidSVG(n);
    if (kind === 'cylinder') return drawCylinderSVG();
    if (kind === 'cone') return drawConeSVG();
    return drawSphereSVG();
  }
  function picWrap(svg){ return '<div class="solidWrap">' + svg + '</div>'; }

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      htmlLang:'zh-Hant', title:'柱體錐體複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長',
      h1:'🔁 柱體錐體複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：柱體錐體、立體形體、體積、多邊形交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      htmlLang:'en', title:'Prisms & Pyramids Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents',
      h1:'🔁 Prisms & Pyramids Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving prisms/pyramids, solids, volume and polygons — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { prisms:'柱體錐體', solid:'立體形體', volume:'體積', polygon:'多邊形' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { prisms:'🎪 柱體錐體 — 柱體錐體俱樂部', solid:'📦 立體形體 — 展開圖工作坊', volume:'📏 體積', polygon:'🔷 多邊形' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { prisms:'Prisms & Pyramids', solid:'Solids', volume:'Volume', polygon:'Polygons' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { prisms:'🎪 Prisms & Pyramids — The Prism & Pyramid Club', solid:'📦 Solids — The Nets Workshop', volume:'📏 Volume', polygon:'🔷 Polygons' }
    }
  };

  var LINK_HREFS = { prisms:'index.html', solid:'../solid/', volume:'../volume/', polygon:'../polygon/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[String(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = String(c);
      if (!seen[key]){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3){
      var lo = correct - step, hi = correct + step;
      if (lo > 0 && !seen[String(lo)]){ seen[String(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[String(hi)]){ seen[String(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  function mixOptsText(correctText, allTexts){
    var others = allTexts.filter(function(t){ return t !== correctText; });
    var wrongs = shuffle(others).slice(0, 3);
    var opts = shuffle([correctText].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correctText) };
  }

  /* ---------- 題目產生器 ---------- */
  var GENS = [
    { id:'prismFaces', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = prismCounts(n);
        var m = mixOpts(c.f, [c.e, c.v, n + 1]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? prismName(d.n,'zh') + '有幾個面？' : 'How many faces does a ' + prismName(d.n,'en') + ' have?'),
          pic: drawPrismSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角柱的面 = n+2，' + d.n + '+2 = ' + d.c.f + '。'
            : 'For an n-gonal prism, faces = n+2, so ' + d.n + '+2 = ' + d.c.f + '.'
        };
      } },
    { id:'prismEdges', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = prismCounts(n);
        var m = mixOpts(c.e, [c.f, c.v, 3 * n - 1]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? prismName(d.n,'zh') + '有幾條稜？' : 'How many edges does a ' + prismName(d.n,'en') + ' have?'),
          pic: drawPrismSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角柱的稜 = 3n，3×' + d.n + ' = ' + d.c.e + '。'
            : 'For an n-gonal prism, edges = 3n, so 3×' + d.n + ' = ' + d.c.e + '.'
        };
      } },
    { id:'prismVerts', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = prismCounts(n);
        var m = mixOpts(c.v, [c.f, c.e, 2 * n - 1]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? prismName(d.n,'zh') + '有幾個頂點？' : 'How many vertices does a ' + prismName(d.n,'en') + ' have?'),
          pic: drawPrismSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角柱的頂點 = 2n，2×' + d.n + ' = ' + d.c.v + '。'
            : 'For an n-gonal prism, vertices = 2n, so 2×' + d.n + ' = ' + d.c.v + '.'
        };
      } },
    { id:'pyramidFaces', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = pyramidCounts(n);
        var m = mixOpts(c.f, [c.e, 3 * n, n]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? pyramidName(d.n,'zh') + '有幾個面？' : 'How many faces does a ' + pyramidName(d.n,'en') + ' have?'),
          pic: drawPyramidSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角錐的面 = n+1，' + d.n + '+1 = ' + d.c.f + '。'
            : 'For an n-gonal pyramid, faces = n+1, so ' + d.n + '+1 = ' + d.c.f + '.'
        };
      } },
    { id:'pyramidEdges', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = pyramidCounts(n);
        var m = mixOpts(c.e, [c.f, 3 * n, n]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? pyramidName(d.n,'zh') + '有幾條稜？' : 'How many edges does a ' + pyramidName(d.n,'en') + ' have?'),
          pic: drawPyramidSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角錐的稜 = 2n，2×' + d.n + ' = ' + d.c.e + '。'
            : 'For an n-gonal pyramid, edges = 2n, so 2×' + d.n + ' = ' + d.c.e + '.'
        };
      } },
    { id:'pyramidVerts', cat:'prisms',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = pyramidCounts(n);
        var m = mixOpts(c.v, [c.e, 3 * n, n]);
        return { n:n, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: (lang === 'zh' ? pyramidName(d.n,'zh') + '有幾個頂點？' : 'How many vertices does a ' + pyramidName(d.n,'en') + ' have?'),
          pic: drawPyramidSVG(d.n),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? 'n 角錐的頂點 = n+1，' + d.n + '+1 = ' + d.c.v + '。'
            : 'For an n-gonal pyramid, vertices = n+1, so ' + d.n + '+1 = ' + d.c.v + '.'
        };
      } },
    { id:'cylinderConeFact', cat:'prisms',
      make: function(used){
        var shape = pickUnused(['cylinder','cylinder','cone'], used); // 圓柱較常出現
        var attr = shape === 'cone' ? 'e' : pick(['e', 'v']);
        var m = mixOpts(0, [1, 2, 3]);
        return { shape:shape, attr:attr, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var shapeName = d.shape === 'cylinder' ? (lang === 'zh' ? '圓柱' : 'cylinder') : (lang === 'zh' ? '圓錐' : 'cone');
        var kindLabel = d.attr === 'e' ? (lang === 'zh' ? '稜' : 'edges') : (lang === 'zh' ? '頂點' : 'vertices');
        return {
          stem: lang === 'zh' ? shapeName + '有幾條' + kindLabel + '？' : 'How many ' + kindLabel + ' does a ' + shapeName + ' have?',
          pic: drawSolidByKind(d.shape, 0),
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? kindLabel + '要是「直直的邊」或「角」；' + shapeName + '的邊界是彎的、也沒有角，所以是 0。'
            : (d.attr === 'e' ? 'An edge must be straight; ' : 'A vertex must be a corner; ') + 'a ' + shapeName + '’s boundary is curved with no corner, so the answer is 0.'
        };
      } },
    { id:'sphereFact', cat:'prisms',
      make: function(used){
        var STATEMENTS = [
          { truth:false, zh:'球可以像正方體一樣攤成展開圖', en:'A sphere can be unfolded into a net, just like a cube',
            whyZh:'球整個是曲面，沒有平面可以攤平，所以沒有展開圖。', whyEn:'A sphere is curved everywhere with no flat part, so it has no net.' },
          { truth:true, zh:'球沒有任何平平的面', en:'A sphere has no flat face at all',
            whyZh:'球從裡到外都是曲面，確實沒有一塊是平的。', whyEn:'A sphere is curved from every angle — there really is no flat part.' },
          { truth:false, zh:'球有 1 個頂點', en:'A sphere has 1 vertex',
            whyZh:'頂點是稜與稜交會的角；球沒有稜，也沒有頂點。', whyEn:'A vertex is a corner where edges meet; a sphere has no edges, so it has no vertex either.' },
          { truth:true, zh:'球從任何角度看，外形都是圓的', en:'From any angle, a sphere always looks round',
            whyZh:'這是球最特別的地方：不管轉到哪一面，看起來都一樣圓。', whyEn:'That’s what makes a sphere special: no matter how you turn it, it looks the same round shape.' }
        ];
        var idx = pickUnused([0,1,2,3], used);
        return { idx: idx, s: STATEMENTS[idx] };
      },
      fmt: function(d, lang){
        var opts = lang === 'zh' ? ['對','不對'] : ['True','False'];
        var ans = d.s.truth ? 0 : 1;
        return {
          stem: lang === 'zh' ? '判斷對錯：「' + d.s.zh + '」' : 'True or false: “' + d.s.en + '”',
          pic: drawSphereSVG(),
          opts: opts, ans: ans,
          why: lang === 'zh' ? d.s.whyZh : d.s.whyEn
        };
      } },
    { id:'reverseCount', cat:'prisms',
      make: function(used){
        var shape = pick(['prism', 'pyramid']);
        var n = pickUnused([3,4,5,6,7,8], used);
        var c = shape === 'prism' ? prismCounts(n) : pyramidCounts(n);
        var attr = pick(['f', 'e', 'v']);
        var given = c[attr];
        var names = [n - 1, n, n + 1, n + 2].map(function(k){ return shape === 'prism' ? prismName(k, 'zh') : pyramidName(k, 'zh'); });
        return { shape:shape, n:n, attr:attr, given:given, names:names };
      },
      fmt: function(d, lang){
        var shapeWord = d.shape === 'prism' ? (lang === 'zh' ? '角柱' : 'prism') : (lang === 'zh' ? '角錐' : 'pyramid');
        var kindLabel = d.attr === 'f' ? (lang === 'zh' ? '面' : 'faces') : (d.attr === 'e' ? (lang === 'zh' ? '稜' : 'edges') : (lang === 'zh' ? '頂點' : 'vertices'));
        var ns = [d.n - 1, d.n, d.n + 1, d.n + 2];
        var names = ns.map(function(k){ return d.shape === 'prism' ? prismName(k, lang) : pyramidName(k, lang); });
        var ans = 1; // d.n 對應 index 1
        var formula = d.shape === 'prism'
          ? (d.attr === 'f' ? 'n+2' : (d.attr === 'e' ? '3n' : '2n'))
          : (d.attr === 'f' ? 'n+1' : (d.attr === 'e' ? '2n' : 'n+1'));
        return {
          stem: lang === 'zh'
            ? '已知一個' + shapeWord + '有 ' + d.given + ' 個' + kindLabel + '，它是幾' + shapeWord + '？'
            : 'A ' + shapeWord + ' has ' + d.given + ' ' + kindLabel + '. Which ' + shapeWord + ' is it?',
          pic: d.shape === 'prism' ? drawPrismSVG(d.n) : drawPyramidSVG(d.n),
          opts: names, ans: ans,
          why: lang === 'zh'
            ? kindLabel + ' = ' + formula + '，代入 n=' + d.n + ' 剛好是 ' + d.given + '，所以是' + names[ans] + '。'
            : kindLabel + ' = ' + formula + '; with n=' + d.n + ' that gives ' + d.given + ', so it’s a ' + names[ans] + '.'
        };
      } },
    { id:'solidFact', cat:'solid',
      make: function(used){
        var attr = pickUnused(['face', 'edge', 'vertex'], used);
        var VALUES = { face:6, edge:12, vertex:8 };
        var correct = VALUES[attr];
        var wrongCandidates = Object.keys(VALUES).filter(function(k){ return k !== attr; }).map(function(k){ return VALUES[k]; });
        wrongCandidates.push(correct + 2);
        var m = mixOpts(correct, wrongCandidates);
        return { attr:attr, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var kindZh = d.attr === 'face' ? '面' : (d.attr === 'edge' ? '稜' : '頂點');
        var kindEn = d.attr === 'face' ? 'faces' : (d.attr === 'edge' ? 'edges' : 'vertices');
        return {
          stem: lang === 'zh' ? '長方體有幾個' + kindZh + '？' : 'How many ' + kindEn + ' does a cuboid have?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '長方體固定有 6 個面、12 條稜、8 個頂點，這裡問的是' + kindZh + '，答案是 ' + d.correct + '。'
            : 'A cuboid always has 6 faces, 12 edges and 8 vertices — here we asked about ' + kindEn + ', so the answer is ' + d.correct + '.'
        };
      } },
    { id:'volumeFact', cat:'volume',
      make: function(used){
        var l = pickUnused([2,3,4,5,6,7,8,9], used);
        var w = pick([2,3,4,5,6]);
        var h = pick([2,3,4,5,6]);
        var vol = l * w * h;
        var m = mixOpts(vol, [l * w, w * h, l * h]);
        return { l:l, w:w, h:h, vol:vol, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一個長方體長 ' + d.l + ' 公分、寬 ' + d.w + ' 公分、高 ' + d.h + ' 公分，體積是多少立方公分？'
            : 'A cuboid is ' + d.l + ' cm long, ' + d.w + ' cm wide and ' + d.h + ' cm tall. What is its volume, in cm³?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '體積 = 長×寬×高 = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.vol + ' 立方公分。'
            : 'Volume = length × width × height = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.vol + ' cm³.'
        };
      } },
    { id:'polygonName', cat:'polygon',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        return { n:n };
      },
      fmt: function(d, lang){
        var ns = [d.n - 1, d.n, d.n + 1, d.n + 2].filter(function(k){ return k >= 3 && k <= 9; });
        while (ns.length < 4) ns.push(ns[ns.length - 1] + 1);
        var names = ns.slice(0, 4).map(function(k){ return polyShapeName(k, lang); });
        var ans = ns.indexOf(d.n);
        return {
          stem: lang === 'zh' ? '有 ' + d.n + ' 條邊的多邊形，叫做什麼？' : 'What do you call a polygon with ' + d.n + ' sides?',
          opts: names, ans: ans,
          why: lang === 'zh'
            ? d.n + ' 條邊的多邊形叫做「' + polyShapeName(d.n, 'zh') + '」。'
            : 'A polygon with ' + d.n + ' sides is called a "' + polyShapeName(d.n, 'en') + '".'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 個題型各一題，順序洗牌 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    return shuffle(GENS).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c);
      if (q.pic) box.insertAdjacentHTML('beforeend', picWrap(q.pic));
      box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
