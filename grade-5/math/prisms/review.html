<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柱體錐體複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  .solidWrap{display:flex;justify-content:center;margin:0 auto 8px;max-width:200px}
  .solidWrap svg{width:100%;height:auto;display:block}
  .edgeSolid{stroke:var(--ink);stroke-width:3;fill:none}
  .edgeHidden{stroke:var(--muted);stroke-width:2;stroke-dasharray:6 5;fill:none}
  .faceTop{fill:var(--blue-soft);stroke:var(--ink);stroke-width:3}
  .faceBase{fill:var(--green-soft);stroke:var(--ink);stroke-width:2.5}
  .faceRect{fill:var(--orange-soft);stroke:var(--ink);stroke-width:2.5}
  .apexDot{fill:var(--ink)}
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>

<script>
(function(){
  "use strict";

  /* ---------- 幾何工具（與 index.html 相同邏輯） ---------- */
  var POLY_ORD_ZH = {3:'三角',4:'四角',5:'五角',6:'六角',7:'七角',8:'八角',9:'九角',10:'十角'};
  var POLY_ORD_EN = {3:'triangular',4:'quadrangular',5:'pentagonal',6:'hexagonal',7:'heptagonal',8:'octagonal',9:'nonagonal',10:'decagonal'};
  var POLY_SHAPE_ZH = {3:'三角形',4:'四邊形',5:'五邊形',6:'六邊形',7:'七邊形',8:'八邊形',9:'九邊形',10:'十邊形'};
  var POLY_SHAPE_EN = {3:'triangle',4:'quadrilateral',5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon'};
  function polyOrd(n, lang){ var d = lang === 'zh' ? POLY_ORD_ZH : POLY_ORD_EN; return d[n] || (lang === 'zh' ? (n + '角') : (n + '-gonal')); }
  function polyShapeName(n, lang){ var d = lang === 'zh' ? POLY_SHAPE_ZH : POLY_SHAPE_EN; return d[n] || (lang === 'zh' ? (n + '邊形') : (n + '-gon')); }
  function prismName(n, lang){ return lang === 'zh' ? (polyOrd(n,'zh') + '柱') : (polyOrd(n,'en') + ' prism'); }
  function pyramidName(n, lang){ return lang === 'zh' ? (polyOrd(n,'zh') + '錐') : (polyOrd(n,'en') + ' pyramid'); }
  function prismCounts(n){ return { f: n + 2, e: 3 * n, v: 2 * n }; }
  function pyramidCounts(n){ return { f: n + 1, e: 2 * n, v: n + 1 }; }

  /* ---------- 立體圖引擎（index / reference / review 三頁共用同一份，一字不差；設定檔會比對） ----------
     立體先用真的 3D 座標建出來（y 朝上、z 朝向看的人），再從前上方 SOLID_EL 度正投影到紙上。
     一個面看不看得到：它朝外的法向量和「朝向看的人」的方向內積 > 0。
     一條稜：旁邊兩個面有一個看得到就畫實線，兩個都看不到就畫虛線（被擋住的稜）。
     圓柱、圓錐的側面是曲面（用 SOLID_SEG 片窄窄的平面拼成），兩片曲面之間的接縫不是稜 ——
     只有「一片看得到、一片看不到」的那一條（輪廓）畫實線，其他接縫不畫。
     底面頂點的起始角 solidPhase(n)：任兩個頂點都不會左右對稱地落在同一條鉛直線上（不然兩條稜會畫在一起）。 */
  var SOLID_EL = 22, SOLID_SEG = 48;
  var SOLID_SHAPE = { prism:{ r:1, h:1.25 }, pyramid:{ r:1, h:1.55 }, cylinder:{ r:1, h:1.3 }, cone:{ r:1, h:1.6 } };
  function solidPhase(n){ var s = 360 / n; return 90 + s / 2 + (n % 2 === 0 ? s / 4 : 0); }
  function solidModel(kind, n, phase){
    var S = SOLID_SHAPE[kind], curved = kind === 'cylinder' || kind === 'cone';
    var m = curved ? SOLID_SEG : n, ph = (phase == null) ? solidPhase(m) : phase, V = [], F = [], i, j;
    function ring(y){
      var a = [];
      for (var k = 0; k < m; k++){ var t = (ph + k * 360 / m) * Math.PI / 180; a.push(V.length); V.push([S.r * Math.cos(t), y, S.r * Math.sin(t)]); }
      return a;
    }
    var bot = ring(0), apex = -1;
    if (kind === 'prism' || kind === 'cylinder'){
      var top = ring(S.h);
      F.push({ v:bot.slice(), base:true }); F.push({ v:top.slice(), base:true });
      for (i = 0; i < m; i++){ j = (i + 1) % m; F.push({ v:[bot[i], bot[j], top[j], top[i]], curved:curved }); }
    } else {
      apex = V.length; V.push([0, S.h, 0]);
      F.push({ v:bot.slice(), base:true });
      for (i = 0; i < m; i++){ j = (i + 1) % m; F.push({ v:[bot[i], bot[j], apex], curved:curved }); }
    }
    return { V:V, F:F, apex:apex };
  }
  /* pose：phase ＝ 底面第一個頂點的角度（不給就用 solidPhase）、roll ＝ 繞 z 軸轉（90 就是躺下來）、flip ＝ 上下顛倒、
     yaw ＝ 最後繞鉛直軸轉（躺著的柱體要轉一點，底面才看得到） */
  function solidPose(V, pose){
    pose = pose || {};
    var c = [0, 0, 0];
    V.forEach(function(p){ c[0] += p[0] / V.length; c[1] += p[1] / V.length; c[2] += p[2] / V.length; });
    var r = (pose.roll || 0) * Math.PI / 180, y = (pose.yaw || 0) * Math.PI / 180;
    return V.map(function(p){
      var x = p[0] - c[0], yy = p[1] - c[1], z = p[2] - c[2], t;
      t = x * Math.cos(r) - yy * Math.sin(r); yy = x * Math.sin(r) + yy * Math.cos(r); x = t;
      if (pose.flip){ yy = -yy; z = -z; }
      t = x * Math.cos(y) + z * Math.sin(y); z = -x * Math.sin(y) + z * Math.cos(y); x = t;
      return [x, yy, z];
    });
  }
  /* 純資料的「怎麼畫」：投影後的點 P、每一條要畫的線（a、b 是點的編號，k 是 solid／hidden）、每一個面看不看得到。不碰 DOM。 */
  function solidPlan(kind, n, pose){
    var M = solidModel(kind, n, pose && pose.phase), V = solidPose(M.V, pose), e = SOLID_EL * Math.PI / 180;
    var eye = [0, Math.sin(e), Math.cos(e)], C = [0, 0, 0];
    var P = V.map(function(p){ return [p[0], -(p[1] * Math.cos(e) - p[2] * Math.sin(e))]; });
    var faces = M.F.map(function(f){
      var nx = 0, ny = 0, nz = 0, cx = 0, cy = 0, cz = 0;
      f.v.forEach(function(a, i){
        var p = V[a], q = V[f.v[(i + 1) % f.v.length]];
        nx += (p[1] - q[1]) * (p[2] + q[2]); ny += (p[2] - q[2]) * (p[0] + q[0]); nz += (p[0] - q[0]) * (p[1] + q[1]);
        cx += p[0] / f.v.length; cy += p[1] / f.v.length; cz += p[2] / f.v.length;
      });
      if (nx * (cx - C[0]) + ny * (cy - C[1]) + nz * (cz - C[2]) < 0){ nx = -nx; ny = -ny; nz = -nz; }
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      return { v:f.v, base:!!f.base, curved:!!f.curved, vis:(nx * eye[0] + ny * eye[1] + nz * eye[2]) / len > 1e-6 };
    });
    var map = {}, list = [];
    faces.forEach(function(f, fi){
      f.v.forEach(function(a, i){
        var b = f.v[(i + 1) % f.v.length], key = Math.min(a, b) + '-' + Math.max(a, b);
        if (!map[key]){ map[key] = { a:Math.min(a, b), b:Math.max(a, b), f:[] }; list.push(map[key]); }
        map[key].f.push(fi);
      });
    });
    var lines = [];
    list.forEach(function(E){
      var f1 = faces[E.f[0]], f2 = faces[E.f[1]];
      if (f1.curved && f2.curved){ if (f1.vis !== f2.vis) lines.push({ a:E.a, b:E.b, k:'solid', seam:true }); return; }
      lines.push({ a:E.a, b:E.b, k:(f1.vis || f2.vis) ? 'solid' : 'hidden', seam:false });
    });
    return { P:P, lines:lines, faces:faces, apex:M.apex };
  }
  /* 把投影的點等比縮放、置中放進框 { x, y, w, h } */
  function solidFit(plan, box){
    var xs = plan.P.map(function(p){ return p[0]; }), ys = plan.P.map(function(p){ return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var s = Math.min(box.w / (x1 - x0), box.h / (y1 - y0));
    var ox = box.x + (box.w - (x1 - x0) * s) / 2 - x0 * s, oy = box.y + (box.h - (y1 - y0) * s) / 2 - y0 * s;
    return plan.P.map(function(p){ return [ox + p[0] * s, oy + p[1] * s]; });
  }
  /* 同一種線接成一條一條的折線（虛線的節奏才不會每一小段重新開始） */
  function solidChains(lines, k){
    var segs = lines.filter(function(L){ return L.k === k; }).map(function(L){ return [L.a, L.b]; }), used = [], out = [];
    for (var s = 0; s < segs.length; s++){
      if (used[s]) continue;
      used[s] = true;
      var ch = segs[s].slice(), grew = true;
      while (grew){
        grew = false;
        for (var t = 0; t < segs.length; t++){
          if (used[t]) continue;
          var a = segs[t][0], b = segs[t][1], last = ch[ch.length - 1];
          if (a === last){ ch.push(b); used[t] = true; grew = true; }
          else if (b === last){ ch.push(a); used[t] = true; grew = true; }
          else if (a === ch[0]){ ch.unshift(b); used[t] = true; grew = true; }
          else if (b === ch[0]){ ch.unshift(a); used[t] = true; grew = true; }
        }
      }
      out.push(ch);
    }
    return out;
  }
  function solidSVG(kind, n, pose, W, H, extra){
    W = W || 300; H = H || 220;
    var m = extra ? 6 : 14, plan = solidPlan(kind, n, pose), Q = solidFit(plan, { x:m, y:m, w:W - 2 * m, h:H - 2 * m });
    var f2 = function(v){ return v.toFixed(1); }, pt = function(i){ return f2(Q[i][0]) + ',' + f2(Q[i][1]); };
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" ' + (extra || 'class="solidSvg" role="img"') + '>';
    plan.faces.forEach(function(f){ if (f.base && f.vis) svg += '<polygon class="faceTop" points="' + f.v.map(pt).join(' ') + '"></polygon>'; });
    ['hidden', 'solid'].forEach(function(k){
      solidChains(plan.lines, k).forEach(function(ch){ svg += '<polyline class="' + (k === 'solid' ? 'edgeSolid' : 'edgeHidden') + '" points="' + ch.map(pt).join(' ') + '"></polyline>'; });
    });
    if (plan.apex >= 0) svg += '<circle class="apexDot" cx="' + f2(Q[plan.apex][0]) + '" cy="' + f2(Q[plan.apex][1]) + '" r="4"></circle>';
    return svg + '</svg>';
  }
  function drawPrismSVG(n){ return solidSVG('prism', n); }
  function drawPyramidSVG(n){ return solidSVG('pyramid', n); }
  function drawCylinderSVG(){ return solidSVG('cylinder', 0); }
  function drawConeSVG(){ return solidSVG('cone', 0); }
  /* 球：一個圓（輪廓）＋赤道（前半圈實線、後半圈虛線）。extra：畫在小圖卡上（框緊一點，另外給屬性） */
  function drawSphereSVG(extra){
    var cx = 150, cy = 110, r = 78;
    var arc = function(front){ return '<path class="' + (front ? 'edgeSolid' : 'edgeHidden') + '" d="M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + (r * 0.32).toFixed(2) + ' 0 0 ' + (front ? 1 : 0) + ' ' + (cx + r) + ' ' + cy + '" fill="none"></path>'; };
    return '<svg viewBox="' + (extra ? '64 24 172 172' : '0 0 300 220') + '" ' + (extra || 'class="solidSvg" role="img"') + '><circle class="faceTop" cx="' + cx + '" cy="' + cy + '" r="' + r + '"></circle>' + arc(false) + arc(true) + '</svg>';
  }
  function drawSolidByKind(kind, n){
    if (kind === 'prism') return drawPrismSVG(n);
    if (kind === 'pyramid') return drawPyramidSVG(n);
    if (kind === 'cylinder') return drawCylinderSVG();
    if (kind === 'cone') return drawConeSVG();
    return drawSphereSVG();
  }

  /* ---------- 展開圖：每一張都真的摺得起來 ----------
     角柱：n 個長方形排成一排（寬 ＝ 底面的邊長），兩個正 n 邊形各貼著一個長方形的上邊、下邊（摺起來在相對的兩頭）。
     角錐：正 n 邊形的每一條邊貼一個等腰三角形（高比底面的內切圓半徑長，三個角才收得到一點）。
     圓柱：長方形的長 ＝ 圓周長（2 × 3.14 × 半徑），兩個圓貼著長方形的上下兩邊。
     圓錐：扇形的弧長 ＝ 底面的圓周長（圓心角 ＝ 360° × 底面半徑 ÷ 扇形半徑），圓貼著弧的正中間。 */
  function ngonOnEdge(A, B, n){
    var pts = [A, B], d = [B[0] - A[0], B[1] - A[1]], t = -2 * Math.PI / n;
    for (var k = 2; k < n; k++){
      d = [d[0] * Math.cos(t) - d[1] * Math.sin(t), d[0] * Math.sin(t) + d[1] * Math.cos(t)];
      var p = pts[pts.length - 1];
      pts.push([p[0] + d[0], p[1] + d[1]]);
    }
    return pts;
  }
  function polygonEl(pts, cls){
    return '<polygon class="' + cls + '" points="' + pts.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') + '"></polygon>';
  }
  function prismNetPlan(n){
    var a = Math.min(46, 230 / n), H = 64, k = Math.floor((n - 1) / 2);
    var ap = a / (2 * Math.tan(Math.PI / n)), R = a / (2 * Math.sin(Math.PI / n));
    var up = (n % 2 === 0) ? 2 * ap : ap + R;   /* 正 n 邊形貼著一條水平的邊時，離那條邊最遠的地方 */
    var x0 = 12, y0 = 12 + up, rects = [];
    for (var i = 0; i < n; i++) rects.push([[x0 + i * a, y0], [x0 + (i + 1) * a, y0], [x0 + (i + 1) * a, y0 + H], [x0 + i * a, y0 + H]]);
    var top = ngonOnEdge([x0 + k * a, y0], [x0 + (k + 1) * a, y0], n);
    var bot = ngonOnEdge([x0 + (k + 1) * a, y0 + H], [x0 + k * a, y0 + H], n);
    return { W:2 * x0 + n * a, H:2 * 12 + 2 * up + H, rects:rects, bases:[top, bot], a:a, h:H };
  }
  function drawPrismNetSVG(n){
    var p = prismNetPlan(n), svg = '<svg viewBox="0 0 ' + p.W.toFixed(1) + ' ' + p.H.toFixed(1) + '" class="netSvg" role="img">';
    p.rects.forEach(function(r){ svg += polygonEl(r, 'faceRect'); });
    p.bases.forEach(function(b){ svg += polygonEl(b, 'faceBase'); });
    return svg + '</svg>';
  }
  function pyramidNetPlan(n){
    var cx = 150, cy = 110, R = 40, slant = 55, base = [];
    for (var i = 0; i < n; i++){ var t = (-90 + i * 360 / n) * Math.PI / 180; base.push([cx + R * Math.cos(t), cy + R * Math.sin(t)]); }
    var tris = base.map(function(p, i){

          why: lang === 'zh'
            ? '體積 = 長×寬×高 = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.vol + ' 立方公分。'
            : 'Volume = length × width × height = ' + d.l + '×' + d.w + '×' + d.h + ' = ' + d.vol + ' cm³.'
        };
      } },
    { id:'polygonName', cat:'polygon',
      make: function(used){
        var n = pickUnused([3,4,5,6,7,8], used);
        var lo = Math.max(3, n - 1);
        return { n:n, ks:shuffle([lo, lo + 1, lo + 2, lo + 3]) };
      },
      fmt: function(d, lang){
        var lo = Math.max(3, d.n - 1), ns = d.ks || [lo, lo + 1, lo + 2, lo + 3];
        var names = ns.map(function(k){ return polyShapeName(k, lang); });
        var ans = ns.indexOf(d.n);
        return {
          stem: lang === 'zh' ? '有 ' + d.n + ' 條邊的多邊形，叫做什麼？' : 'What do you call a polygon with ' + d.n + ' sides?',
          opts: names, ans: ans,
          why: lang === 'zh'
            ? d.n + ' 條邊的多邊形叫做' + polyShapeName(d.n, 'zh') + '。'
            : 'A polygon with ' + d.n + ' sides is called a "' + polyShapeName(d.n, 'en') + '".'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 個題型各一題，順序洗牌 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    return shuffle(GENS).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c);
      if (q.pic) box.insertAdjacentHTML('beforeend', picWrap(q.pic));
      box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
