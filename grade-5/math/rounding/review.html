  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{

  .coursenav span{color:var(--muted)}

  .intro{

    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;

  .cat{

  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>

<script>
(function(){
  "use strict";

  /* ---------- 四捨五入核心（字串／整數運算，不用浮點數） ---------- */
  function incStr(s){
    var arr = s.split('');
    var i = arr.length - 1;
    while (i >= 0){
      if (arr[i] === '9'){ arr[i] = '0'; i--; }
      else { arr[i] = String(Number(arr[i]) + 1); break; }
    }
    if (i < 0) arr.unshift('1');
    return arr.join('');
  }
  function roundDecimalStr(numStr, places){
    numStr = String(numStr).trim();
    var neg = false;
    if (numStr.charAt(0) === '-'){ neg = true; numStr = numStr.slice(1); }
    var dot = numStr.indexOf('.');
    var intPart = dot < 0 ? numStr : numStr.slice(0, dot);
    var fracPart = dot < 0 ? '' : numStr.slice(dot + 1);
    if (intPart === '') intPart = '0';
    while (fracPart.length <= places) fracPart += '0';
    var lookDigit = Number(fracPart.charAt(places));
    var kept = intPart + fracPart.slice(0, places);
    if (lookDigit >= 5) kept = incStr(kept);
    var newIntPart, newFracPart;
    if (places === 0){
      newIntPart = kept; newFracPart = '';
    } else {
      if (kept.length <= places) kept = kept.padStart(places + 1, '0');
      newIntPart = kept.slice(0, kept.length - places);
      newFracPart = kept.slice(kept.length - places);
    }
    newIntPart = newIntPart.replace(/^0+(?=\d)/, '');
    var result = newIntPart + (places > 0 ? '.' + newFracPart : '');
    var isZero = /^0(\.0+)?$/.test(result);
    return (neg && !isZero ? '-' : '') + result;
  }

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'四捨五入複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 四捨五入複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：四捨五入、平均、小數、百分率交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Rounding Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Rounding Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving rounding, averages, decimals and percentages — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { rounding:'四捨五入', average:'平均', decimal:'小數', percent:'百分率' },
      fbRight: '<b>答對了。</b> ',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { rounding:'📍 四捨五入 — 差不多剛剛好', average:'⚖️ 平均 — 平均分配站', decimal:'💰 小數 — 小數商店', percent:'💯 百分率' },
      placeName: function(p){ return p === 0 ? '整數' : (p === 1 ? '小數第一位' : '小數第二位'); }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { rounding:'Rounding', average:'Averages', decimal:'Decimals', percent:'Percentages' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { rounding:'📍 Rounding — About How Much?', average:'⚖️ Averages — The Level-Up Station', decimal:'💰 Decimals — The Decimal Shop', percent:'💯 Percentages' },
      placeName: function(p){ return p === 0 ? 'the nearest whole number' : (p === 1 ? 'the first decimal place' : 'the second decimal place'); }
    }
  };

  var LINK_HREFS = { rounding:'index.html', average:'../average/', decimal:'../decimal/', percent:'../percent/' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 去重要用「數值」而不是字串：'9' 和 '9.0' 字串不同、值一樣，
     若只比字串，四捨五入到 9.0 時會把 9 當成誘答選項，孩子選 9 會被判錯。 */
  function dedupKey(v){
    var n = Number(v);
    return (v === '' || isNaN(n)) ? 'S' + String(v) : 'N' + n;
  }
  function makeWrongs(correct, candidates){
    var out = [];
    var seen = {}; seen[dedupKey(correct)] = true;
    (candidates || []).forEach(function(c){
      var key = dedupKey(c);
      if (!seen[key]){ seen[key] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3 && step < 50){
      var lo = correct - step, hi = correct + step;
      if (!seen[dedupKey(lo)]){ seen[dedupKey(lo)] = true; out.push(lo); }
      if (out.length < 3 && !seen[dedupKey(hi)]){ seen[dedupKey(hi)] = true; out.push(hi); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates){
    var wrongs = makeWrongs(correct, candidates);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  function randDigit(){ return rand(10); }

  /* ---------- 題目產生器：每次 make() 都用新數字 ---------- */
  var GENS = [
    /* A. 四捨五入到整數 */
    { id:'roundInt', cat:'rounding',
      make: function(used){
        var intPart = pickUnused([12,15,18,23,27,31,36,42,45,58,64,71,89], used);
        var d1 = randDigit();
        var numStr = intPart + '.' + d1;
        var correct = roundDecimalStr(numStr, 0);
        var m = mixOpts(correct, [String(intPart), String(intPart + 1), numStr]);
        return { numStr:numStr, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '把 ' + d.numStr + ' 四捨五入到整數，答案是多少？' : 'Round ' + d.numStr + ' to the nearest whole number. What’s the answer?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '小數點後第一位是 ' + d.numStr.split('.')[1] + '，' + (Number(d.numStr.split('.')[1]) >= 5 ? '滿 5 要進位' : '不到 5 直接捨去') + '，答案是 ' + d.correct + '。'
            : 'The 1st decimal digit is ' + d.numStr.split('.')[1] + ', ' + (Number(d.numStr.split('.')[1]) >= 5 ? 'which is 5 or more (round up)' : 'less than 5 (round down)') + ' — the answer is ' + d.correct + '.'
        };
      } },
    /* B. 四捨五入到小數第一位 */
    { id:'roundTenths', cat:'rounding',
      make: function(used){
        var intPart = pickUnused([2,4,6,8,11,14,17,21,25], used);
        var d1 = randDigit(), d2 = randDigit();
        var numStr = intPart + '.' + d1 + d2;
        var correct = roundDecimalStr(numStr, 1);
        var m = mixOpts(correct, [intPart + '.' + d1, numStr, roundDecimalStr(numStr, 0)]);
        return { numStr:numStr, correct:correct, lookDigit:String(d2), opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '把 ' + d.numStr + ' 四捨五入到小數第一位，答案是多少？' : 'Round ' + d.numStr + ' to the first decimal place. What’s the answer?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '小數點後第二位是 ' + d.lookDigit + '，' + (Number(d.lookDigit) >= 5 ? '滿 5 要進位' : '不到 5 直接捨去') + '，答案是 ' + d.correct + '。'
            : 'The 2nd decimal digit is ' + d.lookDigit + ', ' + (Number(d.lookDigit) >= 5 ? 'which is 5 or more (round up)' : 'less than 5 (round down)') + ' — the answer is ' + d.correct + '.'
        };
      } },
    /* C. 四捨五入到小數第二位 */
    { id:'roundHundredths', cat:'rounding',
      make: function(used){
        var intPart = pickUnused([0,1,3,5,7,9,10,13,16], used);
        var d1 = randDigit(), d2 = randDigit(), d3 = randDigit();
        var numStr = intPart + '.' + d1 + d2 + d3;
        var correct = roundDecimalStr(numStr, 2);
        var m = mixOpts(correct, [intPart + '.' + d1 + d2, numStr, roundDecimalStr(numStr, 1)]);
        return { numStr:numStr, correct:correct, lookDigit:String(d3), opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '把 ' + d.numStr + ' 四捨五入到小數第二位，答案是多少？' : 'Round ' + d.numStr + ' to the second decimal place. What’s the answer?',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '小數點後第三位是 ' + d.lookDigit + '，' + (Number(d.lookDigit) >= 5 ? '滿 5 要進位' : '不到 5 直接捨去') + '，答案是 ' + d.correct + '。'
            : 'The 3rd decimal digit is ' + d.lookDigit + ', ' + (Number(d.lookDigit) >= 5 ? 'which is 5 or more (round up)' : 'less than 5 (round down)') + ' — the answer is ' + d.correct + '.'
        };
      } },
    /* D. 進位的情境（刻意製造進位） */
    { id:'carryCase', cat:'rounding',
      make: function(used){
        var intPart = pickUnused([2,4,6,8,9,11,14,19,24], used);
        var tail = pick([5,6,7,8,9]);
        var numStr = intPart + '.9' + tail;
        var correct = roundDecimalStr(numStr, 1);
        var wrongNoCarry = intPart + '.9';
        var wrongDropPlace = (intPart + 1) + '.' + tail;
        var m = mixOpts(correct, [wrongNoCarry, wrongDropPlace, numStr]);
        return { numStr:numStr, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '把 ' + d.numStr + ' 四捨五入到小數第一位，答案是多少？（注意會不會進位到整數）' : 'Round ' + d.numStr + ' to the first decimal place. (Watch out for a carry into the whole number!)',
          opts: d.opts, ans: d.ans,
          why: lang === 'zh'
            ? '小數點後第二位滿 5，9 要進位，進位後往前推到整數位，答案是 ' + d.correct + '，要記得留一位小數。'
            : 'The 2nd decimal digit is 5 or more, so the 9 carries into the whole-number place — the answer is ' + d.correct + ', keeping one decimal place.'
        };
      } },
    /* E. 無條件進位文字題 */
    { id:'ceilingWord', cat:'rounding',
      make: function(used){
        var total = pickUnused([86, 97, 112, 138, 154, 176, 203, 219], used);
        var boxSize = pick([12, 15, 18, 20, 25]);
        var boxes = Math.floor(total / boxSize) + (total % boxSize === 0 ? 0 : 1);
        var wrongFloor = Math.floor(total / boxSize);
        var m = mixOpts(boxes, [wrongFloor, boxes + 1, total]);
        return { total:total, boxSize:boxSize, boxes:boxes, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '有 ' + d.total + ' 顆糖果，每個袋子最多裝 ' + d.boxSize + ' 顆，至少需要幾個袋子？'
            : 'There are ' + d.total + ' candies, at most ' + d.boxSize + ' per bag. How many bags are needed at least?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.total + ' ÷ ' + d.boxSize + ' = ' + Math.floor(d.total / d.boxSize) + ' 袋又 ' + (d.total % d.boxSize) + ' 顆，剩下的也要裝，用無條件進位，答案是 ' + d.boxes + ' 袋。'
            : d.total + ' ÷ ' + d.boxSize + ' = ' + Math.floor(d.total / d.boxSize) + ' bags with ' + (d.total % d.boxSize) + ' left over, which still need a bag — round up (ceiling): ' + d.boxes + ' bags.'
        };
      } },
    /* F. 無條件捨去文字題 */
    { id:'floorWord', cat:'rounding',
      make: function(used){
        var intPart = pickUnused([4,5,6,7,8,9,10,11,12], used);
        var frac = randDigit() + '' + randDigit();
        while (frac === '00') frac = randDigit() + '' + randDigit();
        var lenStr = intPart + '.' + frac;
        var pieces = intPart;
        var m = mixOpts(pieces, [pieces + 1, Number(roundDecimalStr(lenStr, 0)), pieces - 1 < 0 ? pieces : pieces - 1]);
        return { lenStr:lenStr, pieces:pieces, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一條繩子長 ' + d.lenStr + ' 公尺，最多能剪成幾段 1 公尺的繩子？'
            : 'A rope is ' + d.lenStr + ' meters long. How many full 1-meter pieces can be cut from it?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.lenStr + ' 裡面有 ' + d.pieces + ' 個完整的 1 公尺，剩下的不夠剪一整段，用無條件捨去，答案是 ' + d.pieces + ' 段。'
            : d.lenStr + ' contains ' + d.pieces + ' whole meters; the leftover isn’t enough for another piece — round down (floor): ' + d.pieces + ' pieces.'
        };
      } },
    /* G. 估算：兩數相乘大約多少 */
    { id:'estimateProduct', cat:'rounding',
      make: function(used){
        var a = pickUnused([3,4,6,7,8,9], used);
        var aFrac = pick([1,2,3,4,6,7,8,9]);
        var b = pick([3,4,5,6,7]);
        var aStr = a + '.' + aFrac;
        var aRounded = Number(roundDecimalStr(aStr, 0));
        var correct = aRounded * b;
        var m = mixOpts(correct, [a * b, correct + b, correct - b]);
        return { aStr:aStr, b:b, aRounded:aRounded, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.aStr + ' × ' + d.b + ' 大約是多少？（先把 ' + d.aStr + ' 四捨五入到整數再乘）' : 'About how much is ' + d.aStr + ' × ' + d.b + '? (Round ' + d.aStr + ' to a whole number first, then multiply.)',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.aStr + ' 四捨五入到整數約 ' + d.aRounded + '，' + d.aRounded + ' × ' + d.b + ' = ' + d.correct + '。'
            : d.aStr + ' rounds to about ' + d.aRounded + ', and ' + d.aRounded + ' × ' + d.b + ' = ' + d.correct + '.'
        };
      } },
    /* H. 要看哪一個數字（概念題） */
    { id:'whichDigit', cat:'rounding',
      make: function(used){
        var place = pick([0, 1, 2]);
        var intPart = pickUnused([3,5,8,12,17,24,9,6], used);
        var d1 = randDigit(), d2 = randDigit(), d3 = randDigit();
        var numStr = intPart + '.' + d1 + d2 + d3;
        var lookDigit = place === 0 ? d1 : (place === 1 ? d2 : d3);
        var pool = [d1, d2, d3].filter(function(x){ return x !== lookDigit; });
        var m = mixOpts(lookDigit, pool.length ? pool : [((lookDigit + 3) % 10), ((lookDigit + 7) % 10)]);
        return { numStr:numStr, place:place, lookDigit:lookDigit, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '要把 ' + d.numStr + ' 四捨五入到' + TXT.zh.placeName(d.place) + '，應該要看哪一個數字，來決定進位還是捨去？'
            : 'To round ' + d.numStr + ' to ' + TXT.en.placeName(d.place) + ', which digit decides rounding up or down?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '要看目標位（' + TXT.zh.placeName(d.place) + '）後面那一位，也就是「' + d.lookDigit + '」。'
            : 'Check the digit right after the target place (' + TXT.en.placeName(d.place) + ') — that’s "' + d.lookDigit + '".'
        };
      } },
    /* I. 交錯：平均（簡化版） */
    { id:'avgSimple', cat:'average',
      make: function(used){
        var n = pick([2, 3, 4]);
        var avg = pickUnused([6,8,9,10,12,14,15,16,18,20], used);
        var nums = [];
        var total = 0;
        for (var i = 0; i < n - 1; i++){ var dv = rand(7) - 3; nums.push(avg + dv); total += dv; }
        nums.push(avg - total);
        var s = nums.reduce(function(a,b){ return a+b; }, 0);
        var m = mixOpts(avg, [avg - 1, avg + 1, s]);
        return { nums:nums, n:n, sum:s, avg:avg, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '這組數字：' + d.nums.join('、') + '，平均是多少？' : 'What is the average of: ' + d.nums.join(', ') + '?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.nums.join(' + ') + ' = ' + d.sum + '，' + d.sum + ' ÷ ' + d.n + ' = ' + d.avg + '。'
            : d.nums.join(' + ') + ' = ' + d.sum + ', and ' + d.sum + ' ÷ ' + d.n + ' = ' + d.avg + '.'
        };
      } },
    /* J. 交錯：小數除法（簡化版） */
    { id:'decimalDivideSimple', cat:'decimal',
      make: function(used){
        var k = pickUnused([2, 3, 4, 5, 6], used);
        var qt = 20 + rand(70);
        var dividendTenths = qt * k;
        var dividend = roundTenthsStr(dividendTenths);
        var q = roundTenthsStr(qt);
        var m = mixOpts(q, [roundTenthsStr(qt - 1), roundTenthsStr(qt + 1), roundTenthsStr(qt * 2)]);
        return { k:k, dividend:dividend, dividendTenths:dividendTenths, q:q, qt:qt, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: d.dividend + ' ÷ ' + d.k + ' = ?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.dividend + ' 裡面有 ' + d.dividendTenths + ' 個 0.1，' + d.dividendTenths + ' ÷ ' + d.k + ' = ' + d.qt + ' 個 0.1，也就是 ' + d.q + '。'
            : d.dividend + ' is ' + d.dividendTenths + ' tenths. ' + d.dividendTenths + ' ÷ ' + d.k + ' = ' + d.qt + ' tenths, which is ' + d.q + '.'
        };
      } },
    /* K. 交錯：百分率（簡化版） */
    { id:'percentSimple', cat:'percent',
      make: function(used){
        var base = pickUnused([20, 40, 60, 80, 120, 160, 200], used);
        var pct = pick([5, 10, 20, 25, 50]);
        var val = base * pct / 100;
        var m = mixOpts(val, [val * 2, val / 2 === Math.floor(val / 2) ? val / 2 : val - 1, base]);
        return { base:base, pct:pct, val:val, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.base + ' 的 ' + d.pct + '% 是多少？' : 'What is ' + d.pct + '% of ' + d.base + '?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.base + ' × ' + d.pct + '% = ' + d.base + ' × ' + d.pct + ' ÷ 100 = ' + d.val + '。'
            : d.base + ' × ' + d.pct + '% = ' + d.base + ' × ' + d.pct + ' ÷ 100 = ' + d.val + '.'
        };
      } }
  ];

  /* qt、qt±1、qt*2 都是整數個「0.1」，用字串組合避免浮點數 */
  function roundTenthsStr(tenths){
    var neg = tenths < 0; tenths = Math.abs(tenths);
    var s = String(tenths);
    while (s.length < 2) s = '0' + s;
    var intPart = s.slice(0, s.length - 1);
    var fracPart = s.slice(s.length - 1);
    return (neg ? '-' : '') + intPart + '.' + fracPart;
  }

  /* ---------- 出一批 12 題：8 種四捨五入題型各一題＋隨機 4 題（交錯平均／小數／百分率） ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var roundingGens = GENS.filter(function(g){ return g.cat === 'rounding'; });
    var extraPool = GENS.filter(function(g){ return g.cat !== 'rounding'; });
    var slots = roundingGens.slice();
    for (var i = 0; i < 4; i++) slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
