<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7; font-size:17px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}

  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{
    margin-top:20px;background:var(--card);border:2px solid var(--green);border-radius:16px;
    padding:18px 22px;font-size:16px;display:none;
  }
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:16px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>

<script>
(function(){
  "use strict";

  /* ---------- 靜態文字 ---------- */
  var I18N = {
    zh: {
      langAria: '切換語言',
      htmlLang:'zh-Hant', title:'公因數與公倍數複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡', nav3:'🔁 複習挑戰（本頁）',
      h1:'🔁 公因數與公倍數複習挑戰',
      sub:'不看課本、憑記憶答 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：公因數、公倍數、因數、倍數交錯出現，<strong>每一批的數字都是新出的</strong>，背答案沒有用，要真的會算。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria: 'Switch language',
      htmlLang:'en', title:'Common Factors & Multiples Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet', nav3:'🔁 Review challenge (this page)',
      h1:'🔁 Common Factors & Multiples Review Challenge',
      sub:'No peeking at notes — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving common factors, common multiples, factors and multiples — <strong>every batch uses fresh numbers</strong>, so memorising answers won’t help; you have to really compute.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn: function(i){ return '第 ' + i + ' 題'; },
      cats: { factor:'因數', multiple:'倍數', common:'公因數/公倍數' },
      fbRight: '<b>答對了。</b>',
      fbWrong: function(ans){ return '<b>正確答案是「' + ans + '」。</b>'; },
      resAll: function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome: function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪一課：'; },
      linkNames: { factor:'📖 因數 — 因數工廠', multiple:'🐸 倍數 — 跳跳蛙數字樂園', common:'🚏 公因數與公倍數 — 好朋友車站' }
    },
    en: {
      qn: function(i){ return 'Question ' + i; },
      cats: { factor:'Factors', multiple:'Multiples', common:'Common factors/multiples' },
      fbRight: '<b>Correct!</b> ',
      fbWrong: function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll: function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome: function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      linkNames: { factor:'📖 Factors — The Factor Factory', multiple:'🐸 Multiples — Jumping Frog', common:'🚏 Common Factors & Multiples — The Best-Friends Station' }
    }
  };

  var LINK_HREFS = { factor:'../factor/', multiple:'../multiple/', common:'index.html' };

  /* ---------- 工具 ---------- */
  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  function factorsOf(n){
    var f = [];
    for (var i = 1; i <= n; i++) if (n % i === 0) f.push(i);
    return f;
  }
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  function lcm(a, b){ return a * b / gcd(a, b); }
  function commonFactorsOf(a, b){ return factorsOf(a).filter(function(x){ return b % x === 0; }); }
  function joinNums(arr, lang){ return arr.join(lang === 'zh' ? '、' : ', '); }
  /* 把選項值＋正解洗牌，回傳 {opts, ans} */
  function mixOpts(correct, wrongs){
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 公因數／最大公因數用的干擾選項：其他公因數、a 或 b 各自才有的因數 —— 全部即時算出，不寫死 */
  function buildGcfWrongs(a, b, common, correct){
    var wrongs = [];
    var oc = common.filter(function(x){ return x !== correct; });
    if (oc.length) wrongs.push(pick(oc));
    var ncA = factorsOf(a).filter(function(x){ return common.indexOf(x) < 0; });
    if (ncA.length) wrongs.push(pick(ncA));
    var ncB = factorsOf(b).filter(function(x){ return common.indexOf(x) < 0; });
    if (ncB.length) wrongs.push(pick(ncB));
    var seen = {}; seen[correct] = true;
    var out = [];
    wrongs.forEach(function(w){ if (!seen[w]){ seen[w] = true; out.push(w); } });
    var filler = correct + 1;
    while (out.length < 3){ if (!seen[filler]){ seen[filler] = true; out.push(filler); } filler++; }
    return out.slice(0, 3);
  }
  /* 最小公倍數用的干擾選項：最大公因數、a×b（忘了除以公因數）、2a、2b、a+b —— 即時算出 */
  function buildLcmWrongs(a, b, correct){
    var cand = [gcd(a, b), a * b, 2 * a, 2 * b, a + b];
    var seen = {}; seen[correct] = true;
    var out = [];
    cand.forEach(function(c){ if (!seen[c]){ seen[c] = true; out.push(c); } });
    var filler = correct + 1;
    while (out.length < 3){ if (!seen[filler]){ seen[filler] = true; out.push(filler); } filler++; }
    return shuffle(out).slice(0, 3);
  }

  /* ---------- 數對池（供公因數／最大公因數／最小公倍數三種產生器共用） ---------- */
  var PAIRS = {};
  var PAIR_LIST = [[12,18],[12,20],[8,12],[10,15],[16,24],[6,9],[9,12],[14,21],[15,20],[20,30]];
  var PAIR_KEYS = PAIR_LIST.map(function(p){
    var k = p[0] + '-' + p[1];
    PAIRS[k] = { a:p[0], b:p[1] };
    return k;
  });

  var GW_POOL = [
    { a:24, b:36, itemZh:'蘋果', itemZh2:'橘子', itemEn:'apples', itemEn2:'oranges' },
    { a:18, b:24, itemZh:'貼紙', itemZh2:'卡片', itemEn:'stickers', itemEn2:'cards' },
    { a:20, b:30, itemZh:'珠子', itemZh2:'扭蛋', itemEn:'beads', itemEn2:'capsule toys' },
    { a:16, b:40, itemZh:'彩色筆', itemZh2:'橡皮擦', itemEn:'markers', itemEn2:'erasers' }
  ];

  var LW_POOL = [
    { a:4, b:6, unitZh:'分鐘', unitEn:'minutes',
      stemZh: function(a,b){ return '紅燈每 ' + a + ' 分鐘閃一次、鈴每 ' + b + ' 分鐘響一次，兩個剛好同時發生後，下一次同時發生是幾分鐘後？'; },
      stemEn: function(a,b){ return 'A red light flashes every ' + a + ' minutes and a bell rings every ' + b + ' minutes. After they happen together once, how many minutes until they happen together again?'; } },
    { a:6, b:8, unitZh:'分鐘', unitEn:'minutes',
      stemZh: function(a,b){ return '公車 A 每 ' + a + ' 分鐘發一班、公車 B 每 ' + b + ' 分鐘發一班，兩班車剛好同時出發後，下一次同時出發是幾分鐘後？'; },
      stemEn: function(a,b){ return 'Bus A leaves every ' + a + ' minutes and Bus B leaves every ' + b + ' minutes. After they leave together once, how many minutes until they leave together again?'; } },
    { a:9, b:12, unitZh:'秒', unitEn:'seconds',
      stemZh: function(a,b){ return '兩台機器分別每 ' + a + ' 秒、每 ' + b + ' 秒發出一次警示聲，剛好同時響過後，下一次同時響是幾秒後？'; },
      stemEn: function(a,b){ return 'Two machines beep every ' + a + ' seconds and every ' + b + ' seconds. After they beep together once, how many seconds until they beep together again?'; } },
    { a:10, b:15, unitZh:'秒', unitEn:'seconds',
      stemZh: function(a,b){ return '水滴 A 每 ' + a + ' 秒滴一次、水滴 B 每 ' + b + ' 秒滴一次，剛好同時滴下後，下一次同時滴下是幾秒後？'; },
      stemEn: function(a,b){ return 'Drop A falls every ' + a + ' seconds and Drop B falls every ' + b + ' seconds. After they fall together once, how many seconds until they fall together again?'; } }
  ];

  /* ---------- 題目產生器：每次 make() 都用新數字，正解全部即時算出 ---------- */
  var GENS = [
    { id:'commonSet', cat:'common',
      make: function(used){
        var key = pickUnused(PAIR_KEYS, used);
        var p = PAIRS[key];
        var correct = commonFactorsOf(p.a, p.b);
        var fullA = factorsOf(p.a), fullB = factorsOf(p.b);
        var pool = [];
        if (fullA.length !== correct.length) pool.push(fullA.slice());
        var extraA = fullA.filter(function(x){ return correct.indexOf(x) < 0; });
        if (extraA.length) pool.push(shuffle(correct.concat([pick(extraA)])).sort(function(x,y){ return x - y; }));
        if (correct.length > 1) pool.push(correct.slice(0, -1));
        var extraB = fullB.filter(function(x){ return correct.indexOf(x) < 0; });
        if (extraB.length) pool.push(shuffle(correct.concat([pick(extraB)])).sort(function(x,y){ return x - y; }));
        var seen = {}; seen[correct.join(',')] = true;
        var wrongs = [];
        pool.forEach(function(w){ var k = w.join(','); if (!seen[k]){ seen[k] = true; wrongs.push(w); } });
        while (wrongs.length < 3) wrongs.push(correct.concat([correct[correct.length - 1] + wrongs.length + 1]));
        wrongs = wrongs.slice(0, 3);
        var m = mixOpts(correct, wrongs);
        return { a:p.a, b:p.b, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.a + ' 和 ' + d.b + ' 的公因數是哪些？' : 'What are the common factors of ' + d.a + ' and ' + d.b + '?',
          opts: d.opts.map(function(arr){ return joinNums(arr, lang); }),
          ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' 的因數 ' + joinNums(factorsOf(d.a), 'zh') + '；' + d.b + ' 的因數 ' + joinNums(factorsOf(d.b), 'zh') + ' —— 兩邊都有的是 ' + joinNums(d.correct, 'zh') + '。'
            : 'Factors of ' + d.a + ': ' + joinNums(factorsOf(d.a), 'en') + '; of ' + d.b + ': ' + joinNums(factorsOf(d.b), 'en') + ' — shared: ' + joinNums(d.correct, 'en') + '.'
        };
      } },
    { id:'gcf', cat:'common',
      make: function(used){
        var key = pickUnused(PAIR_KEYS, used);
        var p = PAIRS[key];
        var common = commonFactorsOf(p.a, p.b);
        var correct = common[common.length - 1];
        var wrongs = buildGcfWrongs(p.a, p.b, common, correct);
        var m = mixOpts(correct, wrongs);
        return { a:p.a, b:p.b, common:common, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.a + ' 和 ' + d.b + ' 的最大公因數是多少？' : 'What is the greatest common factor of ' + d.a + ' and ' + d.b + '?',
          opts: d.opts.map(String),
          ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' 的因數 ' + joinNums(factorsOf(d.a), 'zh') + '；' + d.b + ' 的因數 ' + joinNums(factorsOf(d.b), 'zh') + '；公因數 ' + joinNums(d.common, 'zh') + '，最大的是 ' + d.correct + '。'
            : 'Factors of ' + d.a + ': ' + joinNums(factorsOf(d.a), 'en') + '; of ' + d.b + ': ' + joinNums(factorsOf(d.b), 'en') + '; common factors: ' + joinNums(d.common, 'en') + ' — the greatest is ' + d.correct + '.'
        };
      } },
    { id:'lcm', cat:'common',
      make: function(used){
        var key = pickUnused(PAIR_KEYS, used);
        var p = PAIRS[key];
        var correct = lcm(p.a, p.b);
        var wrongs = buildLcmWrongs(p.a, p.b, correct);
        var m = mixOpts(correct, wrongs);
        return { a:p.a, b:p.b, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? d.a + ' 和 ' + d.b + ' 的最小公倍數是多少？' : 'What is the least common multiple of ' + d.a + ' and ' + d.b + '?',
          opts: d.opts.map(String),
          ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' 的倍數：' + d.a + '、' + 2 * d.a + '⋯⋯；' + d.b + ' 的倍數：' + d.b + '、' + 2 * d.b + '⋯⋯ 最早一起出現的是 ' + d.correct + '。'
            : 'Multiples of ' + d.a + ': ' + d.a + ', ' + 2 * d.a + '…; of ' + d.b + ': ' + d.b + ', ' + 2 * d.b + '… — the first shared one is ' + d.correct + '.'
        };
      } },
    { id:'gcfWord', cat:'common',
      make: function(used){
        var keys = GW_POOL.map(function(p){ return p.a + '/' + p.b; });
        var key = pickUnused(keys, used);
        var p = GW_POOL[keys.indexOf(key)];
        var common = commonFactorsOf(p.a, p.b);
        var correct = common[common.length - 1];
        var wrongs = buildGcfWrongs(p.a, p.b, common, correct);
        var m = mixOpts(correct, wrongs);
        return { a:p.a, b:p.b, itemZh:p.itemZh, itemZh2:p.itemZh2, itemEn:p.itemEn, itemEn2:p.itemEn2, common:common, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh'
            ? '文字題：' + d.a + ' 顆' + d.itemZh + '和 ' + d.b + ' 顆' + d.itemZh2 + '要分裝成幾份，每份' + d.itemZh + '數相同、' + d.itemZh2 + '數也相同，且剛好分完，最多可以分成幾份？'
            : 'Word problem: ' + d.a + ' ' + d.itemEn + ' and ' + d.b + ' ' + d.itemEn2 + ' are packed into equal groups, nothing left over. What is the greatest possible number of groups?',
          opts: d.opts.map(String),
          ans: d.ans,
          why: lang === 'zh'
            ? '份數要同時整除 ' + d.a + ' 和 ' + d.b + '，也就是公因數；「最多」就是最大公因數。公因數：' + joinNums(d.common, 'zh') + '，最大的是 ' + d.correct + '。'
            : 'The number of groups must divide both ' + d.a + ' and ' + d.b + ' evenly — a common factor; “greatest” means the GCF. Common factors: ' + joinNums(d.common, 'en') + ' — the greatest is ' + d.correct + '.'
        };
      } },
    { id:'lcmWord', cat:'common',
      make: function(used){
        var keys = LW_POOL.map(function(p){ return p.a + '/' + p.b; });
        var key = pickUnused(keys, used);
        var p = LW_POOL[keys.indexOf(key)];
        var correct = lcm(p.a, p.b);
        var wrongs = buildLcmWrongs(p.a, p.b, correct);
        var m = mixOpts(correct, wrongs);
        return { a:p.a, b:p.b, unitZh:p.unitZh, unitEn:p.unitEn, stemZh:p.stemZh, stemEn:p.stemEn, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var unit = lang === 'zh' ? d.unitZh : d.unitEn;
        return {
          stem: lang === 'zh' ? d.stemZh(d.a, d.b) : d.stemEn(d.a, d.b),
          opts: d.opts.map(String),
          ans: d.ans,
          why: lang === 'zh'
            ? '兩件事下次同時發生的時間，就是兩個週期的公倍數，「下一次」代表要用最小公倍數。' + d.a + ' 的倍數：' + d.a + '、' + 2 * d.a + '⋯⋯；' + d.b + ' 的倍數：' + d.b + '、' + 2 * d.b + '⋯⋯ 最早重複的是 ' + d.correct + ' ' + unit + '。'
            : 'The next time both happen together is a common multiple of the two cycles — “next time” means the LCM. Multiples of ' + d.a + ': ' + d.a + ', ' + 2 * d.a + '…; of ' + d.b + ': ' + d.b + ', ' + 2 * d.b + '… — the first shared one is ' + d.correct + ' ' + unit + '.'
        };
      } },
    { id:'factorCount', cat:'factor',
      make: function(used){
        var n = pickUnused([12,16,18,20,24,28,30,32,36,40,45,48], used);
        var facs = factorsOf(n), c = facs.length;
        var m = mixOpts(c, [c-1, c+1, c+2]);
        return { n:n, facs:facs, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var unit = lang === 'zh' ? ' 個' : '';
        return {
          stem: lang === 'zh' ? d.n + ' 的因數一共有幾個？' : 'How many factors does ' + d.n + ' have?',
          opts: d.opts.map(function(v){ return v + unit; }),
          ans: d.ans,
          why: lang === 'zh'
            ? d.n + ' 的因數：' + joinNums(d.facs, 'zh') + '，共 ' + d.c + ' 個。'
            : 'Factors of ' + d.n + ': ' + joinNums(d.facs, 'en') + ' — ' + d.c + ' in total.'
        };
      } },
    { id:'isMultiple', cat:'multiple',
      make: function(used){
        var k = pickUnused([3,4,6,7,8,9], used);
        var c = k * (4 + rand(6));
        var wrongs = [], delta = 1;
        while (wrongs.length < 3){
          var cand = (wrongs.length % 2 === 0) ? c + delta : c - delta;
          if (cand > 0 && cand % k !== 0 && wrongs.indexOf(cand) < 0) wrongs.push(cand);
          delta++;
        }
        var m = mixOpts(c, wrongs);
        return { k:k, c:c, q:c/k, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        return {
          stem: lang === 'zh' ? '下面哪一個是 ' + d.k + ' 的倍數？' : 'Which of these is a multiple of ' + d.k + '?',
          opts: d.opts.map(String),
          ans: d.ans,
          why: lang === 'zh'
            ? d.c + ' ÷ ' + d.k + ' = ' + d.q + '，整除，所以 ' + d.c + ' 是 ' + d.k + ' 的倍數。'
            : d.c + ' ÷ ' + d.k + ' = ' + d.q + ' exactly, so ' + d.c + ' is a multiple of ' + d.k + '.'
        };
      } },
    { id:'multiplesCount', cat:'multiple',
      make: function(used){
        var k = pickUnused([3,4,6,7,8,9], used);
        var range = pick([30, 50]);
        var c = Math.floor(range / k);
        var m = mixOpts(c, [c - 1, c + 1, c + 2]);
        return { k:k, range:range, c:c, opts:m.opts, ans:m.ans };
      },
      fmt: function(d, lang){
        var unit = lang === 'zh' ? ' 個' : '';
        var rem = d.range % d.k;
        return {
          stem: lang === 'zh' ? '1～' + d.range + ' 裡面，' + d.k + ' 的倍數共有幾個？' : 'How many multiples of ' + d.k + ' are there from 1 to ' + d.range + '?',
          opts: d.opts.map(function(v){ return v + unit; }),
          ans: d.ans,
          why: lang === 'zh'
            ? d.k + '、' + 2 * d.k + '、' + 3 * d.k + '⋯⋯每 ' + d.k + ' 個出現一次：' + d.range + ' ÷ ' + d.k + ' = ' + d.c + (rem ? ' 餘 ' + rem : '') + '，共 ' + d.c + ' 個。'
            : d.k + ', ' + 2 * d.k + ', ' + 3 * d.k + '… one every ' + d.k + ' numbers: ' + d.range + ' ÷ ' + d.k + ' = ' + d.c + (rem ? ' r ' + rem : '') + ' — ' + d.c + ' of them.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：8 種題型各一題＋隨機 4 題（數字不重複） ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    for (var i = 0; i < 4; i++) slots.push(pick(GENS));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongCats = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongCats = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongCats[cat] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var cats = [];
    for (var c in wrongCats) if (wrongCats[c]) cats.push(c);
    if (cats.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      cats.forEach(function(c){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[c]; a.textContent = t.linkNames[c];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  /* 換一批新題目 = 重新產生題目資料；切語言 = 同一批題目換語言呈現 */
  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
