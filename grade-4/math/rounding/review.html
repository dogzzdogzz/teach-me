<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概數複習挑戰</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.75; font-size:18px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:19px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:17px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{display:none;margin-top:20px;background:var(--green-soft);border-radius:16px;padding:18px}
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:16px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:18px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>
</head>
<body>

  <div class="intro" data-i18n="intro">
    12 題<strong>混合題</strong>：四捨五入、規則、數線、範圍、估算交錯出現，<strong>每一批的數字都是新出的</strong>。<br>

  </footer>
</div>

<script>
(function(){
  "use strict";

  var I18N = {
    zh: {
      langAria:'切換語言',
      htmlLang:'zh-Hant', title:'概數複習挑戰', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課（互動教學）', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 概數複習挑戰',
      sub:'不看速查卡、自己想一次 —— 想起來的那一刻，記憶才會變牢',
      intro:'12 題<strong>混合題</strong>：四捨五入、規則、數線、範圍、估算交錯出現，<strong>每一批的數字都是新出的</strong>。<br>建議<strong>隔一天來一次</strong>，連續三天全對就是真的會了。',
      qDoneLabel:'已作答', qRightLabel:'答對',
      retryBtn:'🆕 換一批新題目',
      foot:'複習的黃金時間：<strong>今天 → 明天 → 三天後 → 一星期後</strong>。每次全對，間隔就拉長一點。'
    },
    en: {
      langAria:'Switch language',
      htmlLang:'en', title:'Rounding Review Challenge', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Rounding Review Challenge',
      sub:'No peeking at the cheat sheet — the moment you recall it is the moment it sticks',
      intro:'12 <strong>mixed questions</strong> interleaving rounding, the rule itself, the number line, ranges and estimating — <strong>every batch uses fresh numbers</strong>.<br>Come back <strong>a day later</strong> — three perfect days in a row means you truly know it.',
      qDoneLabel:'Answered', qRightLabel:'Correct:',
      retryBtn:'🆕 New batch of questions',
      foot:'The golden review schedule: <strong>today → tomorrow → 3 days → a week</strong>. Every perfect run, stretch the gap.'
    }
  };

  var TXT = {
    zh: {
      qn:function(i){ return '第 ' + i + ' 題'; },
      cats:{ round:'四捨五入', rule:'規則', line:'數線', range:'範圍', estimate:'估算' },
      places:['個位','十位','百位','千位','萬位','十萬位'],
      placeOpt:function(p){ return this.places[p]; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(ans){ return '<b>正確答案是「' + ans + '」。</b> '; },
      resAll:function(n){ return '全對 ' + n + '/' + n + '！🏆 明天再來一批新題目，讓記憶更牢。'; },
      resSome:function(r, n){ return '答對 ' + r + '/' + n + '。錯的題目看看下面該複習哪裡：'; },
      groupNames:{
        rule:'🚏 四捨五入的三個步驟（範例教學 3）',
        line:'📏 數線上最近的那一站（範例教學 2）',
        estimate:'🧾 先估再算（範例教學 5）'
      }
    },
    en: {
      qn:function(i){ return 'Question ' + i; },
      cats:{ round:'Rounding', rule:'The rule', line:'Number line', range:'Range', estimate:'Estimating' },
      places:['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands'],
      placeOpt:function(p){ return 'the ' + this.places[p] + ' digit'; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(ans){ return '<b>The correct answer is “' + ans + '”.</b> '; },
      resAll:function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome:function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      groupNames:{
        rule:'🚏 The three steps of rounding (Example 3)',
        line:'📏 The nearest stop on the number line (Example 2)',
        estimate:'🧾 Estimate first (Example 5)'
      }
    }
  };

  var LINK_HREFS = { rule:'index.html#secSteps', line:'index.html#secLine', estimate:'index.html#secEstimate' };
  var GROUP_OF = { round:'rule', rule:'rule', line:'line', range:'line', estimate:'estimate' };

  /* ---------- 工具 ---------- */
  /* 這一課只做整數的四捨五入，目標位只有十位、百位、千位、萬位。
     題幹裡的數最多六位數；四捨五入之後最大到 1000000。 */
  var STEM_MAX = 999999;
  var MAXV = 1000000;
  var PV = [1, 10, 100, 1000, 10000, 100000];

  function digitAt(n, place){ return Math.floor(n / PV[place]) % 10; }
  /* 目標位右邊隔壁那一位 —— 整條規則就靠這一個數字。 */
  function nextDigit(n, place){ return digitAt(n, place - 1); }
  /* 四捨五入到第 place 位（1 ≤ place ≤ 4）。
     「入」寫成 lower + pv，所以目標位是 9 時的連鎖進位自動發生。 */
  function roundTo(n, place){
    var pv = PV[place];
    var lower = Math.floor(n / pv) * pv;
    return nextDigit(n, place) >= 5 ? lower + pv : lower;
  }

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* head ＝ 目標位以上的部分，一定 ≥ 1 —— 所以四捨五入的答案永遠不會是 0
     （47 四捨五入到百位是 0，那不是這一課想教的題目）。 */
  function headMax(place){ return Math.floor(STEM_MAX / PV[place]); }
  function pickHead(place, endsIn9){
    var hi = headMax(place);
    if (!endsIn9) return 1 + rand(hi);
    /* head 的個位就是目標位的數字；要它是 9，「入」才會連鎖進位。
       可是**左邊那一位也不能是 9** —— 999996 四捨五入到十位會一路進到 1000000，
       那時候「再往左邊進一位」這句話就變成假的（codex 第二輪 #3）。 */
    var head = rand(Math.floor((hi - 9) / 10) + 1) * 10 + 9;
    if (Math.floor(head / 10) % 10 === 9) head -= 10;
    return head;
  }
  /* n ＝ head × 位值 ＋ look × 下一格位值 ＋ tail。 */
  function buildN(place, look, tail, head){
    return head * PV[place] + look * (PV[place] / 10) + tail;
  }
  /* 值 ＋ 單位的去重鍵（和 tools/sweep.html 的 parseVU 同一套判準）。 */
  function vkey(s){
    var t = String(s).replace(/　/g, ' ').replace(/[−–]/g, '-').trim();
    var m = t.match(/^-?\d+(?:\.\d+)?/);
    if (!m) return 'raw:' + t.replace(/\s+/g, '');
    return String(Number(m[0])) + '|' + t.slice(m[0].length).replace(/\s+/g, '');
  }
  /* 保證 3 個相異（依值）、都落在範圍內、且不等於正解的錯誤選項。
     候選不夠時的保底是「長得像答案的數」（正解 ± step × 單位），不是垃圾字串。 */
  function makeWrongs(correct, candidates, lo, hi, unit, forbid){
    var min = (typeof lo === 'number') ? lo : 0;
    var max = (typeof hi === 'number') ? hi : MAXV;
    var u = unit || 1;
    function ok(v){ return v >= min && v <= max; }
    var out = [];
    var seen = {}; seen[vkey(correct)] = true;
    /* 有些值就是不可以出現在選項裡（估算題的精確答案）。光在候選清單裡濾掉不夠
       —— 候選不足時的保底（正解 ± step × 單位）會自己走回那個值上，
       所以要在這裡先佔位。 */
    (forbid || []).forEach(function(v){ seen[vkey(v)] = true; });
    (candidates || []).forEach(function(c){
      if (out.length >= 3) return;
      var k = vkey(c);
      if (ok(c) && !seen[k]){ seen[k] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3 && step < 200){
      var down = correct - step * u, up = correct + step * u;
      if (ok(down) && !seen[vkey(down)]){ seen[vkey(down)] = true; out.push(down); }
      if (out.length < 3 && ok(up) && !seen[vkey(up)]){ seen[vkey(up)] = true; out.push(up); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates, lo, hi, unit, forbid){
    var wrongs = makeWrongs(correct, candidates, lo, hi, unit, forbid);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 四個互不相同的數直接當選項：正解是其中唯一符合條件的那一個。 */
  function pickAmong(nums, correct){
    var opts = shuffle(nums);
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器：每次 make() 都用新數字，正解由程式算出來 ---------- */
  var GENS = [
    /* 1. 一般的四捨五入（捨或入都可能） */
    { id:'roundNum', cat:'round',
      make:function(used){
        var place = pickUnused([1,2,3,4], used);
        var pv = PV[place], sub = pv / 10;
        var look = rand(10);
        var tail = rand(sub);
        /* 「剛好在正中間」由 roundHalf 專門出題，這裡避開 ——
           兩個產生器出同一種題目、解釋卻不一樣，孩子會混亂。 */
        if (look === 5 && tail === 0){ if (sub > 1) tail = 1 + rand(sub - 1); else look = 6 + rand(4); }
        /* look ＝ 0 且 tail ＝ 0 的話 n 本來就已經是整齊的數，答案等於題幹 ——
           那既沒東西可做，選項也會把題幹抄回來。 */
        if (look === 0 && tail === 0) look = 1 + rand(4);
        var head = pickHead(place, false);
        var n = buildN(place, look, tail, head);
        var lower = head * pv;
        var correct = roundTo(n, place);
        /* 誘答：捨入弄反、看成別的目標位、進位以後忘記把右邊變成 0。 */
        var cands = [ correct === lower ? lower + pv : lower ];
        if (place < 4) cands.push(roundTo(n, place + 1));
        if (place > 1) cands.push(roundTo(n, place - 1));
        if (correct > lower) cands.push(n + pv);
        cands = cands.filter(function(v){
          return v !== correct && v !== n && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv);
        return { n:n, place:place, look:look, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place], ln = t.places[d.place - 1];
        return {
          stem: lang === 'zh'
            ? d.n + ' 四捨五入到' + pn + '是多少？'
            : 'What is ' + d.n + ' rounded to the ' + pn + ' place?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '只看' + pn + '右邊隔壁的' + ln + '，那一位是 ' + d.look + '，'
              + (d.look >= 5 ? '是 5 或比 5 大，所以入' : '比 5 小，所以捨')
              + '，再把右邊全部變成 0 —— 答案是 ' + d.correct + '。'
            : 'Look only at the ' + ln + ' digit immediately to the right of the ' + pn + ' place. It is ' + d.look + ', which is '
              + (d.look >= 5 ? '5 or more, so it goes up' : 'less than 5, so it goes down')
              + '. Turn everything to the right into 0 and the answer is ' + d.correct + '.'
        };
      } },
    /* 2. 要看哪一位（規則本身） */
    { id:'whichDigit', cat:'rule',
      make:function(used){
        var place = pickUnused([1,2,3,4], used);
        var head = pickHead(place, false);
        var n = buildN(place, rand(10), rand(PV[place] / 10), head);
        var correct = place - 1;
        /* 誘答：目標位自己（最常見的錯）、再左邊一格、再右邊一格。 */
        var cands = [place, place + 1, place - 2, place + 2].filter(function(p){
          return p >= 0 && p <= 5 && p !== correct;
        });
        var m = mixOpts(correct, shuffle(cands), 0, 5, 1);
        return { n:n, place:place, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        return {
          stem: lang === 'zh'
            ? '要把 ' + d.n + ' 四捨五入到' + pn + '，應該看哪一位的數字來決定捨或入？'
            : 'To round ' + d.n + ' to the ' + pn + ' place, which digit tells you whether to go down or up?',
          opts: d.opts.map(function(p){ return t.placeOpt(p); }), ans: d.ans,
          why: lang === 'zh'
            ? '要四捨五入到哪一位，就看那一位右邊隔壁的那一位。' + pn + '右邊隔壁是' + t.places[d.correct] + '，所以看' + t.places[d.correct] + '。'
            : 'Whichever place you round to, you read the digit immediately to its right. Immediately right of the ' + pn + ' place is the ' + t.places[d.correct] + ' digit, so that is the one you read.'
        };
      } },
    /* 3. 剛好停在正中間（約定往上） */
    { id:'roundHalf', cat:'round',
      make:function(used){
        var place = pickUnused([1,2,3,4], used);
        var pv = PV[place];
        var head = pickHead(place, false);
        /* 連鎖進位交給 roundCarry，這裡的目標位不要是 9。 */
        if (head % 10 === 9) head = (head > 1) ? head - 1 : 1;
        var n = buildN(place, 5, 0, head);
        var lower = head * pv;
        var correct = lower + pv;
        var cands = [lower, correct + pv, lower - pv];
        if (place < 4) cands.push(roundTo(n, place + 1));
        cands = cands.filter(function(v){
          return v !== correct && v !== n && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv);
        return { n:n, place:place, lower:lower, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place], ln = t.places[d.place - 1];
        return {
          stem: lang === 'zh'
            ? d.n + ' 四捨五入到' + pn + '是多少？'
            : 'What is ' + d.n + ' rounded to the ' + pn + ' place?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? pn + '右邊隔壁的' + ln + '是 5，' + d.n + ' 剛好停在 ' + d.lower + ' 和 ' + d.correct + ' 的正中間，兩邊一樣遠 —— 剛好在正中間的時候，約定往上，所以答案是 ' + d.correct + '。'
            : 'The ' + ln + ' digit immediately to the right is 5, so ' + d.n + ' lands exactly halfway between ' + d.lower + ' and ' + d.correct + ' — equally far from both. When a number lands exactly halfway the agreed rule is to go up, so the answer is ' + d.correct + '.'
        };
      } },
    /* 4. 要入，可是目標位剛好是 9（連鎖進位） */
    { id:'roundCarry', cat:'round',
      make:function(used){
        var place = pickUnused([1,2,3,4], used);
        var pv = PV[place], sub = pv / 10;
        var head = pickHead(place, true);
        var look = 5 + rand(5);
        var tail = rand(sub);
        /* look ＝ 5 且 tail ＝ 0 是「正中間」，那是 roundHalf 的題目。 */
        if (look === 5 && tail === 0){ if (sub > 1) tail = 1 + rand(sub - 1); else look = 6 + rand(4); }
        var n = buildN(place, look, tail, head);
        var lower = head * pv;
        var correct = lower + pv;
        var cands = [lower, n + pv, correct + pv];
        if (place < 4) cands.push(roundTo(n, place + 1));
        cands = cands.filter(function(v){
          return v !== correct && v !== n && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv);
        return { n:n, place:place, look:look, lower:lower, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place], ln = t.places[d.place - 1];
        return {
          stem: lang === 'zh'
            ? d.n + ' 四捨五入到' + pn + '是多少？'
            : 'What is ' + d.n + ' rounded to the ' + pn + ' place?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? ln + '是 ' + d.look + '，要入；可是' + pn + '剛好是 9，加 1 之後滿十，要再往左邊進一位 —— 答案是 ' + d.correct + '，不是 ' + d.lower + '。'
            : 'The ' + ln + ' digit is ' + d.look + ', so it goes up. But the ' + pn + ' digit is 9, and adding 1 makes ten, so it carries one more place to the left — the answer is ' + d.correct + ', not ' + d.lower + '.'
        };
      } },
    /* 5. 數線：比較靠近哪一站 */
    { id:'nearestStop', cat:'line',
      make:function(used){
        var place = pickUnused([2,3,4], used);
        var pv = PV[place], sub = pv / 10;
        var head = pickHead(place, false);
        var look = rand(10), tail = rand(sub);
        /* 正中間兩邊一樣遠，「比較靠近」那句話會變成假的 —— 一定要避開。 */
        if (look === 5 && tail === 0) tail = 1 + rand(sub - 1);
        /* 剛好停在站上也不出題（那不需要判斷遠近）。 */
        if (look === 0 && tail === 0) look = 1;
        var n = buildN(place, look, tail, head);
        var lo = head * pv, hi = lo + pv;
        var correct = roundTo(n, place);
        var cands = [correct === lo ? hi : lo, lo - pv, hi + pv];
        cands = cands.filter(function(v){
          return v !== correct && v !== n && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv);
        return { n:n, place:place, lo:lo, hi:hi, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        var far = (d.correct === d.lo) ? d.hi : d.lo;
        return {
          stem: lang === 'zh'
            ? d.n + ' 夾在 ' + d.lo + ' 和 ' + d.hi + ' 中間。它比較靠近哪一個？'
            : d.n + ' sits between ' + d.lo + ' and ' + d.hi + '. Which one is it closer to?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.n + ' 離 ' + d.correct + ' 比較近，離 ' + far + ' 比較遠，所以四捨五入到' + pn + '就停在 ' + d.correct + '。'
            : d.n + ' is closer to ' + d.correct + ' and further from ' + far + ', so rounded to the ' + pn + ' place it stops at ' + d.correct + '.'
        };
      } },
    /* 6. 反過來想：四捨五入以後是 X，最小可能是多少 */
    { id:'rangeLow', cat:'range',
      make:function(used){
        var place = pickUnused([2,3,4], used);
        var pv = PV[place], half = pv / 2;
        var head = 1 + rand(headMax(place) - 1);
        var target = head * pv;
        var correct = target - half;
        /* 誘答：以為就是 X 本身、差一個的 X−half−1（那個會掉到下面那一站）、
           整個下面那一站、以及上界那一側。 */
        var cands = [target, correct - 1, target - pv, correct + 1, target + half];
        cands = cands.filter(function(v){
          return v !== correct && v > 0 && v <= STEM_MAX;
        });
        var m = mixOpts(correct, shuffle(cands), 1, STEM_MAX, half);
        return { place:place, target:target, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        return {
          stem: lang === 'zh'
            ? '有一個數，四捨五入到' + pn + '以後是 ' + d.target + '。這個數最小可能是多少？'
            : 'A number rounded to the ' + pn + ' place is ' + d.target + '. What is the smallest it could be?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '最小的那一個剛好停在正中間：' + d.correct + ' 離兩站一樣遠，約定往上就變成 ' + d.target + '；再小一個的 ' + (d.correct - 1) + ' 就會往下掉了。'
            : 'The smallest one lands exactly halfway: ' + d.correct + ' is equally far from both stops, and the agreed rule sends it up to ' + d.target + '. One less, ' + (d.correct - 1) + ', would go down instead.'
        };
      } },
    /* 7. 反過來想：哪一個數四捨五入以後是 X */
    { id:'rangeCheck', cat:'range',
      make:function(used){
        var place = pickUnused([2,3,4], used);
        var pv = PV[place], half = pv / 2;
        var head = 2 + rand(headMax(place) - 2);
        var target = head * pv;
        var correct = target - half + rand(pv);
        if (correct === target) correct = target + 1;
        /* 三個誘答都落在隔壁那一站的區間裡，所以四捨五入以後一定不是 X。 */
        var w1 = target - half - 1 - rand(half);
        var w2 = target + half + rand(half);
        var w3 = target - pv - rand(half);
        if (w3 === w1) w3 = w1 - 1;
        var m = pickAmong([correct, w1, w2, w3], correct);
        return { place:place, target:target, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        var half = PV[d.place] / 2;
        return {
          stem: lang === 'zh'
            ? '下面哪一個數，四捨五入到' + pn + '以後是 ' + d.target + '？'
            : 'Which of these numbers becomes ' + d.target + ' when rounded to the ' + pn + ' place?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '四捨五入到' + pn + '以後是 ' + d.target + ' 的數，從 ' + (d.target - half) + ' 到 ' + (d.target + half - 1) + '。只有 ' + d.correct + ' 在這個範圍裡。'
            : 'The numbers that round to ' + d.target + ' at the ' + pn + ' place run from ' + (d.target - half) + ' to ' + (d.target + half - 1) + '. Only ' + d.correct + ' is inside that range.'
        };
      } },
    /* 8. 先估再算：各自取概數再相加 */
    { id:'estimateSum', cat:'estimate',
      make:function(used){
        var place = pickUnused([2,3,4], used);
        var pv = PV[place], sub = pv / 10;
        var hm = Math.max(2, Math.floor(400000 / pv));
        var a = 0, b = 0, ra = 0, rb = 0, correct = 0, exact = 0, ok = false;
        for (var tries = 0; tries < 60 && !ok; tries++){
          a = buildN(place, rand(10), rand(sub), 1 + rand(hm));
          b = buildN(place, rand(10), rand(sub), 1 + rand(hm));
          ra = roundTo(a, place); rb = roundTo(b, place);
          correct = ra + rb; exact = a + b;
          /* 估算題絕對不可以讓精確答案剛好等於估計值 ——
             那樣「估出來的和算出來的不一樣」這句話就變成假的；
             正解也不可以剛好等於題幹印出來的 a 或 b（codex 第二輪 #4）。 */
          ok = exact !== correct && exact <= STEM_MAX && correct <= MAXV &&
               correct !== a && correct !== b;
        }
        /* 60 次都抽不到就用造的：a 的尾巴放一個 1、b 剛好停在站上，
           估計值 ＝ 精確答案 − 1，保證不相等（codex 第二輪 #1：
           原本的迴圈跑完不檢查成敗，會把不合格的那一組直接端出去）。 */
        if (!ok){
          a = (1 + rand(hm)) * pv + 1;
          b = (1 + rand(hm)) * pv;
          ra = roundTo(a, place); rb = roundTo(b, place);
          correct = ra + rb; exact = a + b;
        }
        /* 誘答：上下各差一個位值、多加了兩格。
           **精確答案 a ＋ b 一律不可以進選項**（§六之二：估算題不放精確答案）。 */
        var cands = [correct + pv, correct - pv, correct + 2 * pv];
        cands = cands.filter(function(v){
          return v !== correct && v !== exact && v !== roundTo(exact, place) &&
                 v !== a && v !== b && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv, [exact, a, b]);
        return { place:place, a:a, b:b, ra:ra, rb:rb, exact:exact, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        return {
          stem: lang === 'zh'
            ? '先把 ' + d.a + ' 和 ' + d.b + ' 各自四捨五入到' + pn + '，再相加。估計大約是多少？'
            : 'Round ' + d.a + ' and ' + d.b + ' each to the ' + pn + ' place first, then add them. Roughly how much is that?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' 變成 ' + d.ra + '，' + d.b + ' 變成 ' + d.rb + '，' + d.ra + ' ＋ ' + d.rb + ' ＝ ' + d.correct + '。題目問的是估計值，不是精確的總和。'
            : d.a + ' becomes ' + d.ra + ' and ' + d.b + ' becomes ' + d.rb + ', so ' + d.ra + ' + ' + d.rb + ' = ' + d.correct + '. The question asks for the estimate, not for the exact total.'
        };
      } },
    /* 9. 先估再算：各自取概數再相減 */
    { id:'estimateDiff', cat:'estimate',
      make:function(used){
        var place = pickUnused([2,3,4], used);
        var pv = PV[place], sub = pv / 10;
        var hm = Math.max(6, Math.floor(400000 / pv));
        var a = 0, b = 0, ra = 0, rb = 0, correct = 0, exact = 0, ok = false;
        for (var tries = 0; tries < 60 && !ok; tries++){
          var hb = 1 + rand(Math.floor(hm / 3));
          var ha = hb + 2 + rand(Math.max(1, hm - hb - 2));
          a = buildN(place, rand(10), rand(sub), ha);
          b = buildN(place, rand(10), rand(sub), hb);
          ra = roundTo(a, place); rb = roundTo(b, place);
          correct = ra - rb; exact = a - b;
          /* 正解不可以剛好等於題幹印出來的 a 或 b：400 － 200 ＝ 200 會把答案
             直接印在題目上（codex 第二輪 #4）。 */
          ok = exact !== correct && correct > 0 && exact > 0 && a <= STEM_MAX &&
               correct !== a && correct !== b;
        }
        /* 抽不到就用造的（codex 第二輪 #1）。差距寫成 hb2 ＋ 3 個位值，
           正解 (hb2 ＋ 3) × pv 就不可能剛好等於 b（hb2 × pv）——
           固定差 2 個位值的版本在 hb2 ＝ 2 時真的會撞上，改壞測試抓到了。 */
        if (!ok){
          var hb2 = 1 + rand(Math.floor(hm / 3));
          a = (2 * hb2 + 3) * pv + 1;
          b = hb2 * pv;
          ra = roundTo(a, place); rb = roundTo(b, place);
          correct = ra - rb; exact = a - b;
        }
        var cands = [correct + pv, correct - pv, ra + rb];
        cands = cands.filter(function(v){
          return v !== correct && v !== exact && v !== roundTo(exact, place) &&
                 v !== a && v !== b && v >= 10 && v <= MAXV;
        });
        var m = mixOpts(correct, shuffle(cands), 10, MAXV, pv, [exact, a, b]);
        return { place:place, a:a, b:b, ra:ra, rb:rb, exact:exact, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place];
        return {
          stem: lang === 'zh'
            ? '先把 ' + d.a + ' 和 ' + d.b + ' 各自四捨五入到' + pn + '，再相減。估計大約是多少？'
            : 'Round ' + d.a + ' and ' + d.b + ' each to the ' + pn + ' place first, then subtract. Roughly how much is that?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? d.a + ' 變成 ' + d.ra + '，' + d.b + ' 變成 ' + d.rb + '，' + d.ra + ' － ' + d.rb + ' ＝ ' + d.correct + '。題目問的是估計值，不是精確的差。'
            : d.a + ' becomes ' + d.ra + ' and ' + d.b + ' becomes ' + d.rb + ', so ' + d.ra + ' − ' + d.rb + ' = ' + d.correct + '. The question asks for the estimate, not for the exact difference.'
        };
      } },
    /* 10. 哪一個數會被「捨」（規則的直接檢驗） */
    { id:'whichRoundsDown', cat:'rule',
      make:function(used){
        var place = pickUnused([1,2,3,4], used);
        var sub = PV[place] / 10;
        /* 看的那一位是 0~4 才會「捨」；但 look ＝ 0 且 tail ＝ 0 的數本來就停在站上，
           根本沒有往下走，那句「往下停在小的那一站」就落空了（codex 第二輪 #2）。 */
        var cl = rand(5), ct = rand(sub);
        if (cl === 0 && ct === 0) cl = 1 + rand(4);
        var correct = buildN(place, cl, ct, pickHead(place, false));
        var wrongs = [];
        for (var i = 0; i < 200 && wrongs.length < 3; i++){
          var v = buildN(place, 5 + rand(5), rand(sub), pickHead(place, false));
          if (v !== correct && wrongs.indexOf(v) < 0) wrongs.push(v);
        }
        /* 隨機抽 200 次幾乎一定湊得滿三個，可是「幾乎」不是保證 —— 不足時就
           從正解那一站往旁邊一格一格造，每一個都保證會「入」（codex 第二輪 #5）。 */
        var cbase = Math.floor(correct / PV[place]);
        for (var k = 1; wrongs.length < 3 && k <= 60; k++){
          var h2 = (cbase - k >= 1) ? cbase - k : cbase + k;
          var v2 = buildN(place, 5 + (k % 5), 0, h2);
          if (v2 !== correct && v2 >= PV[place] && v2 <= STEM_MAX && wrongs.indexOf(v2) < 0) wrongs.push(v2);
        }
        var m = pickAmong([correct].concat(wrongs), correct);
        return { place:place, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var pn = t.places[d.place], ln = t.places[d.place - 1];
        return {
          stem: lang === 'zh'
            ? '四捨五入到' + pn + '的時候，下面哪一個數會被「捨」，也就是往下停在小的那一站？'
            : 'When rounding to the ' + pn + ' place, which of these goes down — that is, stops at the lower stop?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '看每一個數的' + ln + '：只有 ' + d.correct + ' 的' + ln + '比 5 小，所以只有它會被捨，其他三個都要入。'
            : 'Read the ' + ln + ' digit of each one: only ' + d.correct + ' has a ' + ln + ' digit below 5, so only that one goes down — the other three go up.'
        };
      } },
    /* 11. 大約是幾萬（把概數說成「幾個萬」） */
    { id:'aboutWan', cat:'round',
      make:function(used){
        var head = pickUnused([3,7,12,18,25,34,46,58,67,79,86,93], used);
        var look = rand(10);
        var n = buildN(4, look, rand(1000), head);
        var correct = roundTo(n, 4) / 10000;
        var cands = [head, correct + 1, correct - 1, correct + 10];
        cands = cands.filter(function(v){ return v !== correct && v >= 1 && v <= 100; });
        var m = mixOpts(correct, shuffle(cands), 1, 100, 1);
        return { n:n, place:4, head:head, look:look, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? d.n + ' 四捨五入到萬位以後，大約是幾萬？'
            : 'Rounded to the ten-thousands place, ' + d.n + ' is about how many ten-thousands?',
          opts: d.opts.map(String), ans: d.ans,
          why: lang === 'zh'
            ? '萬位右邊隔壁的千位是 ' + d.look + '，' + (d.look >= 5 ? '要入' : '要捨') + '，所以 ' + d.n + ' 大約是 ' + (d.correct * 10000) + '，也就是 ' + d.correct + ' 萬。'
            : 'The thousands digit immediately to the right of the ten-thousands place is ' + d.look + ', so it goes ' + (d.look >= 5 ? 'up' : 'down') + '. That makes ' + d.n + ' about ' + (d.correct * 10000) + ', which is ' + d.correct + ' ten-thousands.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：11 種題型各一題＋核心題型隨機 1 題 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['roundNum','whichDigit','roundHalf','roundCarry','rangeCheck'].indexOf(g.id) >= 0;
    });
    slots.push(pick(extraPool));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongGroups = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongGroups = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongGroups[GROUP_OF[cat]] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var groups = [];
    for (var g in wrongGroups) if (wrongGroups[g]) groups.push(g);
    if (groups.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      groups.forEach(function(g){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[g]; a.textContent = t.groupNames[g];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
