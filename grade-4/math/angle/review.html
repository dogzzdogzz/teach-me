<title>角度複習挑戰</title>
<style>

    --line:#E8E2D6;
  }

  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.75; font-size:18px;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:8px 20px;font-size:16px;font-weight:700;cursor:pointer;
  }
  .coursenav{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  a.home{color:var(--blue);font-size:15px}
  header{text-align:center;padding:30px 0 6px}
  header h1{font-size:clamp(28px,5vw,40px);letter-spacing:2px}
  header p{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--blue-soft);border:2px solid var(--blue);border-radius:20px;
    padding:16px 22px;margin:24px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .cat{
    display:inline-block;background:var(--orange-soft);color:var(--orange);font-size:12px;
    font-weight:700;border-radius:999px;padding:1px 10px;margin-left:6px;
  }
  .stem{margin:8px 0 12px;font-size:19px}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:17px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .result{display:none;margin-top:20px;background:var(--green-soft);border-radius:16px;padding:18px}
  .result ul{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:16px}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:18px;
  }
  footer{
    margin-top:56px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:20px;font-size:16px;
  }
</style>

      kinds:{ acute:'an acute angle', right:'a right angle', obtuse:'an obtuse angle', straight:'a straight angle' },
      kindRange:{ acute:'more than 0° and less than 90°', right:'exactly 90°',

      wholeName:{ 90:'a right angle', 180:'a straight angle' },
      turnNames:['a twelfth of a turn','a sixth of a turn','a quarter turn','a third of a turn','half a turn','two thirds of a turn','three quarters of a turn','a full turn'],

      ],

      resAll:function(n){ return 'Perfect ' + n + '/' + n + '! 🏆 Come back tomorrow for a fresh batch.'; },
      resSome:function(r, n){ return 'You got ' + r + '/' + n + '. For the ones you missed, revisit:'; },
      groupNames:{

        classify:'🏷️ Sorting angles by degrees (Example 4)',
        turn:'🔄 One full turn is 360 degrees (Example 1)',
        combine:'➕ Putting together and taking apart (Example 5)'

  };

  var LINK_HREFS = {
    measure:'index.html#secMeasure',
    classify:'index.html#secClass',
    turn:'index.html#secTurn',
    combine:'index.html#secCombo'
  };
  /* 規則題也算「量角器」那一組 —— 五條規則有四條在講量角器怎麼用。 */
  var GROUP_OF = { measure:'measure', classify:'classify', turn:'turn', combine:'combine', rule:'measure' };

  /* ---------- 工具 ---------- */
  /* 這一課用半圓量角器，一次量得到的角在 0° 到 180° 之間；
     分類講到平角 180° 為止，優角不在這一課；轉一整圈是 360°。 */
  var DEG_MIN = 1, DEG_MAX = 179;
  var RIGHT_DEG = 90, STRAIGHT_DEG = 180, FULL_TURN = 360;

  /* 一整圈平分成 den 份、取 num 份。deg 一律等於 360 × num ÷ den。 */
  var TURN_TABLE = [
    { num:1, den:12, deg:30 },
    { num:1, den:6,  deg:60 },
    { num:1, den:4,  deg:90 },
    { num:1, den:3,  deg:120 },
    { num:1, den:2,  deg:180 },
    { num:2, den:3,  deg:240 },
    { num:3, den:4,  deg:270 },
    { num:1, den:1,  deg:360 }
  ];
  /* 大於 0° 小於 90° ＝ 銳角；等於 90° ＝ 直角；
     **大於 90° 而且小於 180°** ＝ 鈍角；等於 180° ＝ 平角。範圍外回 null。 */
  function kindOf(deg){
    if (deg > 0 && deg < RIGHT_DEG) return 'acute';
    if (deg === RIGHT_DEG) return 'right';
    if (deg > RIGHT_DEG && deg < STRAIGHT_DEG) return 'obtuse';
    if (deg === STRAIGHT_DEG) return 'straight';
    return null;
  }
  /* 鐘面一整圈平分成 12 格，所以時針走一格是 30°。 */
  var CLOCK_SLOTS = 12;
  var CLOCK_STEP = FULL_TURN / CLOCK_SLOTS;

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function pickUnused(pool, used){
    var avail = pool.filter(function(x){ return used.indexOf(String(x)) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(String(v));
    return v;
  }
  function shuffle(arr){
    var a = arr.slice();
    for (var j = a.length - 1; j > 0; j--){
      var k = rand(j + 1);
      var t = a[j]; a[j] = a[k]; a[k] = t;
    }
    return a;
  }
  /* 只取 5 的倍數的角度 —— 課程畫的量角器每 5 度一格，讀得到的就是這些。 */
  function degsBy5(lo, hi, skip){
    var out = [];
    for (var d = Math.ceil(lo / 5) * 5; d <= hi; d += 5){
      if (skip && skip.indexOf(d) >= 0) continue;
      out.push(d);
    }
    return out;
  }
  /* 明顯看得出是銳角或鈍角的角度（離 90° 至少 20°）—— 題幹說「明顯比直角小／大」，
     那句話必須真的成立，不可以拿 88° 來說「明顯比直角小」。 */
  var CLEAR_GAP = 20;
  var READ_DEGS = degsBy5(DEG_MIN, DEG_MAX, []).filter(function(d){ return Math.abs(d - RIGHT_DEG) >= CLEAR_GAP; });
  /* 兩排數字不一樣的角度（90° 兩排一樣，那一題就沒東西可問）。 */
  var ANY_DEGS = degsBy5(DEG_MIN, DEG_MAX, [RIGHT_DEG]);

  /* 值 ＋ 單位的去重鍵（和 tools/sweep.html 的 parseVU 同一套判準）。 */
  function vkey(s){
    var t = String(s).replace(/　/g, ' ').replace(/[−–]/g, '-').trim();
    var m = t.match(/^-?\d+(?:\.\d+)?/);
    if (!m) return 'raw:' + t.replace(/\s+/g, '');
    return String(Number(m[0])) + '|' + t.slice(m[0].length).replace(/\s+/g, '');
  }
  /* 保證 3 個相異（依值）、都落在範圍內、且不等於正解的錯誤選項。
     候選不夠時的保底是「長得像答案的數」（正解 ± step × 單位），不是垃圾字串。 */
  function makeWrongs(correct, candidates, lo, hi, unit, forbid){
    var min = (typeof lo === 'number') ? lo : DEG_MIN;
    var max = (typeof hi === 'number') ? hi : FULL_TURN;
    var u = unit || 1;
    function ok(v){ return v >= min && v <= max; }
    var out = [];
    var seen = {}; seen[vkey(correct)] = true;
    (forbid || []).forEach(function(v){ seen[vkey(v)] = true; });
    (candidates || []).forEach(function(c){
      if (out.length >= 3) return;
      var k = vkey(c);
      if (ok(c) && !seen[k]){ seen[k] = true; out.push(c); }
    });
    var step = 1;
    while (out.length < 3 && step < 400){
      var down = correct - step * u, up = correct + step * u;
      if (ok(down) && !seen[vkey(down)]){ seen[vkey(down)] = true; out.push(down); }
      if (out.length < 3 && ok(up) && !seen[vkey(up)]){ seen[vkey(up)] = true; out.push(up); }
      step++;
    }
    return out.slice(0, 3);
  }
  function mixOpts(correct, candidates, lo, hi, unit, forbid){
    var wrongs = makeWrongs(correct, candidates, lo, hi, unit, forbid);
    var opts = shuffle([correct].concat(wrongs));
    return { opts: opts, ans: opts.indexOf(correct) };
  }
  /* 四個互不相同的項目直接當選項：正解是其中唯一符合條件的那一個。 */
  function pickAmong(items, correct){
    var opts = shuffle(items);
    return { opts: opts, ans: opts.indexOf(correct) };
  }

  /* ---------- 題目產生器：每次 make() 都用新數字，正解由程式算出來 ---------- */
  var GENS = [
    /* 1. 量角器讀數：兩排數字寫著 a 和 180 − a，用「銳角一定小於 90°」挑出正解。
          這樣問就不必記「內圈在左邊還是右邊」—— 真的量角器兩排的內外位置不一定一樣。 */
    { id:'protractorRead', cat:'measure',
      make:function(used){
        var correct = pickUnused(READ_DEGS, used);
        var other = STRAIGHT_DEG - correct;
        var acute = (correct < RIGHT_DEG);

      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '量角器同一格上有兩個數字。其中一排寫著 ' + d.a + '，另一排會寫著幾？'
            : 'One mark on a protractor carries two numbers. One row says ' + d.a + '. What does the other row say?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? '同一格的兩個數字加起來永遠是 ' + STRAIGHT_DEG + '，所以另一排是 ' + STRAIGHT_DEG + ' － ' + d.a + ' ＝ ' + d.correct + '。'
            : 'The two numbers on one mark always add up to ' + STRAIGHT_DEG + ', so the other row says ' + STRAIGHT_DEG + ' − ' + d.a + ' = ' + d.correct + '.'
        };
      } },
    /* 3. 用度數說出名字。90 與 180 也要出得到，界線才練得到。 */
    { id:'classify', cat:'classify',
      make:function(used){
        var pool = degsBy5(DEG_MIN, STRAIGHT_DEG, []).concat([89, 91]);
        var deg = pickUnused(pool, used);
        var correct = kindOf(deg);
        var m = pickAmong(['acute','right','obtuse','straight'], correct);
        return { deg:deg, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個角是 ' + d.deg + '°，它是什麼角？'
            : 'An angle measures ' + d.deg + '°. What kind of angle is it?',
          opts: d.opts.map(function(k){ return t.kinds[k]; }), ans: d.ans,
          why: lang === 'zh'
            ? d.deg + '° ' + t.kindRange[d.correct] + '，所以它是' + t.kinds[d.correct] + '。'
            : d.deg + '° is ' + t.kindRange[d.correct] + ', so it is ' + t.kinds[d.correct] + '.'
        };
      } },
    /* 4. 四個度數裡挑出唯一符合的那一個（界線的反向練習）。 */
    { id:'pickKind', cat:'classify',
      make:function(used){
        var want = pickUnused(['acute','obtuse'], used);
        var inPool = (want === 'acute') ? degsBy5(5, 85, []) : degsBy5(95, 175, []);
        var outPool = (want === 'acute') ? degsBy5(95, 175, []).concat([RIGHT_DEG, STRAIGHT_DEG])
                                         : degsBy5(5, 85, []).concat([RIGHT_DEG, STRAIGHT_DEG]);
        var correct = pick(inPool);
        var wrongs = [];
        var guard = 0;
        while (wrongs.length < 3 && guard++ < 200){
          var v = pick(outPool);
          if (v !== correct && wrongs.indexOf(v) < 0) wrongs.push(v);
        }
        /* outPool 有二十幾個相異值，隨機 200 次幾乎一定湊得滿；「幾乎」不是保證，
           所以不足時再從 outPool 依序補完。 */
        for (var i = 0; i < outPool.length && wrongs.length < 3; i++){
          if (outPool[i] !== correct && wrongs.indexOf(outPool[i]) < 0) wrongs.push(outPool[i]);
        }
        var m = pickAmong([correct].concat(wrongs), correct);
        return { want:want, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '下面哪一個角度是' + t.kinds[d.want] + '？'
            : 'Which one of these is ' + t.kinds[d.want] + '?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? t.kinds[d.want] + '要' + t.kindRange[d.want] + '，四個選項裡只有 ' + d.correct + '° 做得到。'
            : 'To be ' + t.kinds[d.want] + ' it has to be ' + t.kindRange[d.want] + ', and ' + d.correct + '° is the only one of the four that is.'
        };
      } },
    /* 5. 轉幾分之幾圈是幾度 */
    { id:'turnToDeg', cat:'turn',
      make:function(used){
        var i = pickUnused([0,1,2,3,4,5,6,7], used);
        var row = TURN_TABLE[i];
        var correct = FULL_TURN * row.num / row.den;
        /* 誘答：只算一份就交卷、把一整圈當成 180、上下差一格。 */
        var cands = [FULL_TURN / row.den, STRAIGHT_DEG * row.num / row.den, correct + 30, correct - 30];
        cands = cands.filter(function(v){
          return v !== correct && Number.isInteger(v) && v >= DEG_MIN && v <= FULL_TURN;
        });
        var m = mixOpts(correct, shuffle(cands), DEG_MIN, FULL_TURN, 15);
        return { idx:i, num:row.num, den:row.den, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var name = t.turnNames[d.idx];
        var part = FULL_TURN / d.den;
        return {
          stem: lang === 'zh'
            ? '轉了' + name + '，是轉了幾度？'
            : 'Something turns ' + name + '. How many degrees is that?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? '一整圈是 ' + FULL_TURN + '°，平分成 ' + d.den + ' 份，一份是 ' + part + '°；'
              + name + '是 ' + d.num + ' 份，' + d.num + ' × ' + part + '° ＝ ' + d.correct + '°。'
            : 'A full turn is ' + FULL_TURN + '°. Split into ' + d.den + ' equal parts, one part is ' + part
              + '°, and ' + name + ' is ' + d.num + ' of them: ' + d.num + ' × ' + part + '° = ' + d.correct + '°.'
        };
      } },
    /* 6. 反過來：幾度是轉了多少 */
    { id:'degToTurn', cat:'turn',
      make:function(used){
        var i = pickUnused([0,1,2,3,4,5,6,7], used);
        var others = [0,1,2,3,4,5,6,7].filter(function(k){ return k !== i; });
        var wrongs = shuffle(others).slice(0, 3);
        var m = pickAmong([i].concat(wrongs), i);
        return { idx:i, deg:TURN_TABLE[i].deg, num:TURN_TABLE[i].num, den:TURN_TABLE[i].den, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var part = FULL_TURN / d.den;
        return {
          stem: lang === 'zh'
            ? '轉了 ' + d.deg + '°，等於轉了多少？'
            : 'A turn of ' + d.deg + '° is how much of a turn?',
          opts: d.opts.map(function(k){ return t.turnNames[k]; }), ans: d.ans,
          why: lang === 'zh'
            ? '一整圈是 ' + FULL_TURN + '°，' + FULL_TURN + '° ÷ ' + d.den + ' ＝ ' + part + '°；'
              + d.deg + '° 裡面有 ' + d.num + ' 個 ' + part + '°，所以是' + t.turnNames[d.idx] + '。'
            : 'A full turn is ' + FULL_TURN + '°, and ' + FULL_TURN + '° ÷ ' + d.den + ' = ' + part
              + '°. There are ' + d.num + ' of those in ' + d.deg + '°, so it is ' + t.turnNames[d.idx] + '.'
        };
      } },
    /* 7. 鐘面：時針走一格 30° */
    { id:'clockHour', cat:'turn',
      make:function(used){
        var k = pickUnused([1,2,3,4,5,6], used);
        var h1 = 1 + rand(CLOCK_SLOTS - k);
        var h2 = h1 + k;
        var correct = k * CLOCK_STEP;
        /* 誘答：一格算成 15°、一格算成 60°、上下差一格。全部 ≥ 15，不會撞到題幹的鐘點。 */
        var cands = [k * 15, k * 60, correct + CLOCK_STEP, correct - CLOCK_STEP];
        cands = cands.filter(function(v){ return v !== correct && v >= 15 && v <= FULL_TURN; });
        var m = mixOpts(correct, shuffle(cands), 15, FULL_TURN, 15);
        return { h1:h1, h2:h2, k:k, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '時鐘的時針從 ' + d.h1 + ' 走到 ' + d.h2 + '，走過的角是幾度？'
            : 'The hour hand of a clock moves from ' + d.h1 + ' to ' + d.h2 + '. How many degrees does it turn through?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? '鐘面一整圈 ' + FULL_TURN + '° 平分成 ' + CLOCK_SLOTS + ' 格，一格是 ' + CLOCK_STEP + '°。從 ' + d.h1
              + ' 走到 ' + d.h2 + ' 走了 ' + d.k + ' 格，' + d.k + ' × ' + CLOCK_STEP + '° ＝ ' + d.correct + '°。'
            : 'A clock face is a full turn of ' + FULL_TURN + '° split into ' + CLOCK_SLOTS + ' equal slots, so one slot is '
              + CLOCK_STEP + '°. From ' + d.h1 + ' to ' + d.h2 + ' is ' + d.k + ' slots, and ' + d.k + ' × ' + CLOCK_STEP + '° = ' + d.correct + '°.'
        };
      } },
    /* 8. 合成：兩個角拼起來 */
    { id:'sumAngles', cat:'combine',
      make:function(used){
        var a = 0, b = 0, correct = 0, ok = false;
        for (var tries = 0; tries < 60 && !ok; tries++){
          a = pickUnused(degsBy5(10, 120, []), used);
          b = pick(degsBy5(10, 120, []));
          correct = a + b;
          /* a ＝ b 的話「大的減小的」這個誘答會變成 0，離開合理範圍；
             合起來也不可以超過 180（半圓量角器畫不出來，也超出這一課的範圍）。 */
          ok = (a !== b) && correct <= STRAIGHT_DEG;
        }
        /* 60 次都抽不到就用造的一組，保證 a ≠ b 而且和 ≤ 180。 */
        if (!ok){ a = 40; b = 55; correct = 95; }
        var diff = Math.abs(a - b);
        var cands = [diff, correct + 10, correct - 10, STRAIGHT_DEG - correct];
        cands = cands.filter(function(v){ return v !== correct && v >= DEG_MIN && v <= STRAIGHT_DEG; });
        var m = mixOpts(correct, shuffle(cands), DEG_MIN, STRAIGHT_DEG, 5);
        return { a:a, b:b, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '兩個角頂點相同、共用一條邊、而且沒有重疊地拼在一起，一個是 ' + d.a + '°、另一個是 ' + d.b + '°。合起來的角是幾度？'
            : 'Two angles are joined at the same vertex, sharing one side and not overlapping. One is ' + d.a + '° and the other is ' + d.b + '°. How many degrees is the whole angle?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? '這樣拼起來，合起來的角度就是兩個角度相加：' + d.a + '° ＋ ' + d.b + '° ＝ ' + d.correct + '°。'
            : 'Joined like that, the whole angle is the two of them added: ' + d.a + '° + ' + d.b + '° = ' + d.correct + '°.'
        };
      } },
    /* 9. 分解：合起來是直角或平角，找回另一個 */
    { id:'partOfWhole', cat:'combine',
      make:function(used){
        var whole = pickUnused([RIGHT_DEG, STRAIGHT_DEG], used);
        /* 剛好一半的話，答案會等於題幹印出來的那個數 —— 等於把答案印在題目上。 */
        var a = pick(degsBy5(5, whole - 5, [whole / 2]));
        var correct = whole - a;
        var cands = [whole + a, (whole === RIGHT_DEG ? STRAIGHT_DEG - a : RIGHT_DEG - a),
                     correct + 10, correct - 10, correct + 5];
        cands = cands.filter(function(v){ return v !== correct && v >= DEG_MIN && v <= DEG_MAX; });
        var m = mixOpts(correct, shuffle(cands), DEG_MIN, DEG_MAX, 5);
        return { whole:whole, a:a, correct:correct, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var wn = t.wholeName[d.whole];
        return {
          stem: lang === 'zh'
            ? '兩個角頂點相同、共用一條邊、而且沒有重疊地拼在一起，合起來剛好是一個' + wn + '。其中一個角是 ' + d.a + '°，另一個角是幾度？'
            : 'Two angles are joined at the same vertex, sharing one side and not overlapping, and together they make exactly ' + wn + '. One of them is ' + d.a + '°. How many degrees is the other one?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans: d.ans,
          why: lang === 'zh'
            ? wn + '是 ' + d.whole + '°。合成是相加，分解就是相減：' + d.whole + '° － ' + d.a + '° ＝ ' + d.correct + '°。'
            : 'A ' + wn.replace(/^an? /, '') + ' is ' + d.whole + '°. Joining means adding, so taking apart means subtracting: '
              + d.whole + '° − ' + d.a + '° = ' + d.correct + '°.'
        };
      } },
    /* 10. 規則本身。每一條規則自己帶三個誘答，所以四個選項一定互不相同、也只有一個對。 */
    { id:'toolRule', cat:'rule',
      make:function(used){
        var rid = pickUnused([0,1,2,3,4], used);
        var m = pickAmong([0,1,2,3], 0);   // 0 ＝ 正解，1~3 ＝ 那一條規則自己的三個誘答
        return { rid:rid, opts:m.opts, ans:m.ans };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var r = t.rules[d.rid];
        return {
          stem: r.q,
          opts: d.opts.map(function(k){ return (k === 0) ? r.a : r.w[k - 1]; }), ans: d.ans,
          why: lang === 'zh'
            ? '正確的做法是：' + r.a + '。'
            : 'The right answer is: ' + r.a + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：10 種題型各一題＋核心題型隨機 2 題 ---------- */
  function makePlan(){
    var usedByGen = {};
    GENS.forEach(function(g){ usedByGen[g.id] = []; });
    var slots = GENS.slice();
    var extraPool = GENS.filter(function(g){
      return ['protractorRead','classify','sumAngles','partOfWhole','turnToDeg'].indexOf(g.id) >= 0;
    });
    slots = slots.concat(shuffle(extraPool).slice(0, 2));
    return shuffle(slots).map(function(g){
      return { gen: g, data: g.make(usedByGen[g.id]) };
    });
  }

  /* ---------- 渲染 ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}
  var langBtn = document.getElementById('langBtn');

  function applyStatic(){
    var d = I18N[lang];
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var ai = 0; ai < arias.length; ai++){
      var akey = arias[ai].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[ai].setAttribute('aria-label', d[akey]);
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var plan = makePlan();
  var done = 0, right = 0, wrongGroups = {};

  function buildQuiz(){
    var t = TXT[lang];
    quizEl.textContent = '';
    resultEl.style.display = 'none';
    resultLinks.textContent = '';
    done = 0; right = 0; wrongGroups = {};
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = plan.length;
    plan.forEach(function(item, pos){
      var q = item.gen.fmt(item.data, lang);
      var cat = item.gen.cat;
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(pos + 1);
      var c = document.createElement('span');
      c.className = 'cat'; c.textContent = t.cats[cat];
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(opt, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = opt;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good){ b.classList.add('wrong'); wrongGroups[GROUP_OF[cat]] = true; }
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === plan.length) showResult();
        });
        opts.appendChild(b);
      });
      box.appendChild(n); box.appendChild(c); box.appendChild(stem);
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function showResult(){
    var t = TXT[lang];
    resultEl.style.display = 'block';
    var groups = [];
    for (var g in wrongGroups) if (wrongGroups[g]) groups.push(g);
    if (groups.length === 0){
      resultLine.textContent = t.resAll(plan.length);
    } else {
      resultLine.textContent = t.resSome(right, plan.length);
      groups.forEach(function(g){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.className = 'home'; a.href = LINK_HREFS[g]; a.textContent = t.groupNames[g];
        li.appendChild(a);
        resultLinks.appendChild(li);
      });
    }
  }

  retryBtn.addEventListener('click', function(){
    plan = makePlan();
    buildQuiz();
  });

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    buildQuiz();
  });

  applyStatic();
  buildQuiz();
})();
</script>
</body>
</html>
