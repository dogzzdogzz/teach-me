<style>

  .coursenav span{color:var(--muted)}

  .intro{

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖的座標也在這裡定案（shapeFig／splitFig 回傳一張**展示清單**），
     由 fmt() 放進 fig 回傳，這樣檢查驗到的就是「頁面真的畫成什麼」。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* ⚠️ make() 一律不可以回 null。tools/simgen.js 每一批只呼叫 make() 一次、
     **不重試**，所以拒絕取樣的重試必須放在 make() 裡面。 */
  function retry(fn){
    for (var i = 0; i < 300; i++){
      var d = fn();
      if (d) return d;
    }
    return null;
  }

  /* --- 這一課的數值範圍：角度一律是 1 ~ 180 的整數；
         「最少要幾片」那一題的答案是 1 ~ 4 片。 --- */
  var RIGHT_DEG = 90, STRAIGHT_DEG = 180, STEP_DEG = 15;
  var DEG_MIN = 1, DEG_MAX = 180;
  var PIECE_MIN = 1, PIECE_MAX = 4;
  function inDeg(v){
    return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= DEG_MIN && v <= DEG_MAX;
  }

  /* --- 三角板：定義和上課頁完全一致。 --- */
  var PIECES = [ { id:'a', base:30 }, { id:'b', base:45 } ];
  function pieceAngles(p){ return [RIGHT_DEG, p.base, RIGHT_DEG - p.base]; }
  function uniqSorted(list){
    var seen = {}, out = [];
    list.forEach(function(a){ seen[a] = 1; });
    Object.keys(seen).forEach(function(k){ out.push(Number(k)); });
    out.sort(function(x, y){ return x - y; });
    return out;
  }
  function pieceAngleSet(p){ return uniqSorted(pieceAngles(p)); }
  function pieceAngleList(){
    var all = [];
    PIECES.forEach(function(p){ all = all.concat(pieceAngles(p)); });
    return uniqSorted(all);
  }
  function joinDeg(a, b){ return a + b; }
  function layDeg(big, small){ return big - small; }
  function comboValue(c){ return c.op === 'join' ? joinDeg(c.a, c.b) : layDeg(c.a, c.b); }
  /* ⚠️ 「兩片」是兩片實體：拼或疊的時候兩個角一定**分別來自不同的那一片**。
     同一片上的兩個角沒辦法同時擺成兩個角，所以「60° ＝ 30° ＋ 30°」做不出來。 */
  function crossCombos(){
    var A = pieceAngleSet(PIECES[0]), B = pieceAngleSet(PIECES[1]);
    var out = [], seen = {};
    A.forEach(function(x){
      B.forEach(function(y){
        var big = Math.max(x, y), small = Math.min(x, y);
        var push = function(c){
          var k = c.op + ':' + c.a + ':' + c.b;
          if (!seen[k]){ seen[k] = 1; out.push(c); }
        };
        if (joinDeg(x, y) <= STRAIGHT_DEG) push({ op:'join', a:big, b:small });
        if (big > small) push({ op:'lay', a:big, b:small });
      });
    });
    return out;
  }
  function twoPieceList(){
    var vals = pieceAngleList().slice();
    crossCombos().forEach(function(c){ vals.push(comboValue(c)); });
    return uniqSorted(vals);
  }
  function canMakeTwo(x){ return twoPieceList().indexOf(x) >= 0; }
  /* 一個角最少要接幾個三角板的角。一個、兩個（一片出一個）、三個依序試，都不行回 －1。 */
  function minPieces(target){
    var list = pieceAngleList(), i, j, k;
    if (list.indexOf(target) >= 0) return 1;
    if (canMakeTwo(target)) return 2;
    for (i = 0; i < list.length; i++)
      for (j = 0; j < list.length; j++)
        for (k = 0; k < list.length; k++)
          if (list[i] + list[j] + list[k] === target) return 3;
    return -1;
  }
  /* 所有合法的做法 ＝ crossCombos（一片出一個角）。 */
  function allCombos(){ return crossCombos(); }
  function comboKey(c){ return c.op + ':' + c.a + ':' + c.b; }

  /* --- 角的分類（「角度測量站」教過的四個名字）。範圍外一律回 null。 --- */
  function kindOfDeg(deg){
    if (deg > 0 && deg < RIGHT_DEG) return 'acute';
    if (deg === RIGHT_DEG) return 'right';
    if (deg > RIGHT_DEG && deg < STRAIGHT_DEG) return 'obtuse';
    if (deg === STRAIGHT_DEG) return 'straight';
    return null;
  }
  /* --- 三角形依角分類（「三角形家族」教過的：只看最大的那一個角）。 --- */
  function triKindOfMax(deg){
    if (deg > 0 && deg < RIGHT_DEG) return 'acuteTri';
    if (deg === RIGHT_DEG) return 'rightTri';
    if (deg > RIGHT_DEG && deg < STRAIGHT_DEG) return 'obtuseTri';
    return null;
  }

  /* --- 四邊形：和上課頁一樣用角度定義，四個角是 a、180 － a、a、180 － a。 --- */
  function shapeAngles(a){ return [a, STRAIGHT_DEG - a, a, STRAIGHT_DEG - a]; }
  function oppositeIndex(i){ return (i + 2) % 4; }
  function shapePts(w, h, a){
    var dx = h * Math.cos(toRad(a)), dy = h * Math.sin(toRad(a));
    return [[0, 0], [w, 0], [w + dx, dy], [dx, dy]];
  }

  /* --- 英文的單複數。只有 1 會出錯。 --- */
  function plEn(n, w){ return n === 1 ? w : w + 's'; }

  /* --- 版面。和課程頁同一套規格，只是畫布小一點。
         圖上只有 line／path／circle，一個字都沒有。 --- */
  var FIG_W = 340, FIG_H = 210, FIG_PAD = 16;
  var ARC_MAX = 20, ARC_RATIO = 0.2, DOT_R = 3, MARK_LEN = 11;
  var SPLIT_W = 170, SPLIT_H = 105, SPLIT_R = 42;
  /* 取樣用的合法池子（先算好，抽出來的每一個都合法 —— make() 因此不會回 null）。 */
  var CUT_POOL = (function(){
    var out = [], x;
    for (x = 10; x <= 80; x += 5) if (x !== RIGHT_DEG - x) out.push(x);
    return out;
  })();
  var SPLIT_ANY_POOL = (function(){
    var out = [], wholes = [60, 70, 80, 100, 110, 120, 130, 140];
    wholes.forEach(function(w){
      for (var c = 10; c <= w - 10; c += 5){
        var v = w - c, wrong = RIGHT_DEG - c;
        if (v > 0 && c !== v && wrong > 0 && wrong !== v) out.push([w, c]);
      }
    });
    return out;
  })();

  function toRad(deg){ return deg * Math.PI / 180; }
  function polarX(cx, deg, r){ return cx + r * Math.cos(toRad(deg)); }
  function polarY(cy, deg, r){ return cy - r * Math.sin(toRad(deg)); }
  function wedgePath(cx, cy, fromDeg, toDeg, r){
    return 'M ' + cx + ' ' + cy + ' L ' + polarX(cx, fromDeg, r) + ' ' + polarY(cy, fromDeg, r) +
           ' A ' + r + ' ' + r + ' 0 0 ' + ((toDeg > fromDeg) ? 0 : 1) + ' ' +
           polarX(cx, toDeg, r) + ' ' + polarY(cy, toDeg, r) + ' Z';
  }
  /* 兩條邊的方向夾出來的**內角**該從哪裡畫到哪裡：取比較短的那一邊轉法，
     所以 to － from 一定等於那個內角（凸多邊形的內角都小於 180°）。 */
  function arcSpan(d1, d2){
    var diff = ((d2 - d1) % 360 + 360) % 360;
    if (diff <= 180) return { from:d1, to:d1 + diff };
    return { from:d2, to:d2 + (360 - diff) };
  }
  function dirDeg(from, to){
    return Math.atan2(to[1] - from[1], to[0] - from[0]) * 180 / Math.PI;
  }
  function distOf(p, q){
    return Math.sqrt((p[0] - q[0]) * (p[0] - q[0]) + (p[1] - q[1]) * (p[1] - q[1]));
  }
  /* 數學座標（y 往上）→ 畫布座標。整塊先縮到放得進留白裡，再置中。 */
  function fitOf(pts){
    var xs = pts.map(function(p){ return p[0]; }), ys = pts.map(function(p){ return p[1]; });
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var w = maxX - minX, h = maxY - minY;
    var s = Math.min((FIG_W - 2 * FIG_PAD) / w, (FIG_H - 2 * FIG_PAD) / h);
    var ox = (FIG_W - w * s) / 2, oy = (FIG_H + h * s) / 2;
    return { s:s, w:w * s, h:h * s, minX:minX, minY:minY, ox:ox, oy:oy,
             at:function(p){ return { x:ox + (p[0] - minX) * s, y:oy - (p[1] - minY) * s }; } };
  }
  /* 一個凸多邊形的展示清單：邊、每個角的記號、頂點的小圓點。
     mark 傳 'pair' 就照對角分兩色，傳 null 就不畫角的記號。 */
  function polyFig(pts, angles, mark){
    var fit = fitOf(pts), lines = [], wedges = [], dots = [];
    pts.forEach(function(pt, i){
      var p1 = fit.at(pt), p2 = fit.at(pts[(i + 1) % pts.length]);
      lines.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, w:2 });
      dots.push({ x:p1.x, y:p1.y, r:DOT_R });
    });
    if (mark){
      pts.forEach(function(pt, i){
        var prev = pts[(i + pts.length - 1) % pts.length], next = pts[(i + 1) % pts.length];
        var span = arcSpan(dirDeg(pt, next), dirDeg(pt, prev));
        var c = fit.at(pt);
        var r = Math.min(ARC_MAX, ARC_RATIO * fit.s * Math.min(distOf(pt, prev), distOf(pt, next)));
        /* ⚠️ 用**數學座標**的角：畫布的 y 反轉已經包在 polarX／polarY 裡，
           再取負會把角記號鏡射到圖形外面去。 */
        var d1 = dirDeg(pt, next), d2 = dirDeg(pt, prev);
        if (angles[i] === RIGHT_DEG){
          /* 直角記號：沿兩條邊各走一段，接成一個小方框。 */
          var m = Math.min(MARK_LEN, r);
          var q1 = { x:polarX(c.x, d1, m), y:polarY(c.y, d1, m) };
          var q2 = { x:polarX(c.x, d2, m), y:polarY(c.y, d2, m) };
          var q3 = { x:q1.x + q2.x - c.x, y:q1.y + q2.y - c.y };
          lines.push({ x1:q1.x, y1:q1.y, x2:q3.x, y2:q3.y, w:1.5 });
          lines.push({ x1:q3.x, y1:q3.y, x2:q2.x, y2:q2.y, w:1.5 });
        } else {
          wedges.push({ tone:(i % 2 === 0) ? 'a' : 'b', deg:angles[i], r:r,
                        from:span.from, to:span.to,
                        d:wedgePath(c.x, c.y, span.from, span.to, r) });
        }
      });
    }
    return { kind:'shape', w:FIG_W, h:FIG_H, lines:lines, wedges:wedges, dots:dots };
  }
  /* 一個四邊形的圖（四個角是 a、180 － a、a、180 － a）。 */
  function shapeFig(a, w, h){
    return polyFig(shapePts(w, h, a), shapeAngles(a), 'pair');
  }
  /* 長方形左上那個直角被一條線切成兩塊的圖。切線畫到碰到對面的邊為止。 */
  function splitFig(cut){
    var pts = [[0, 0], [SPLIT_W, 0], [SPLIT_W, SPLIT_H], [0, SPLIT_H]];
    var fit = fitOf(pts), lines = [], wedges = [], dots = [];
    pts.forEach(function(pt, i){
      var p1 = fit.at(pt), p2 = fit.at(pts[(i + 1) % 4]);
      lines.push({ x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y, w:2 });
    });
    var v = fit.at([0, SPLIT_H]);
    var rad = toRad(cut);
    var len = Math.min(SPLIT_W / Math.cos(rad), SPLIT_H / Math.sin(rad)) * fit.s;
    lines.push({ x1:v.x, y1:v.y, x2:polarX(v.x, -cut, len), y2:polarY(v.y, -cut, len), w:2 });
    wedges.push({ tone:'a', deg:cut, r:SPLIT_R, from:0, to:-cut,
                  d:wedgePath(v.x, v.y, 0, -cut, SPLIT_R) });
    wedges.push({ tone:'b', deg:layDeg(RIGHT_DEG, cut), r:SPLIT_R, from:-cut, to:-RIGHT_DEG,
                  d:wedgePath(v.x, v.y, -cut, -RIGHT_DEG, SPLIT_R) });
    dots.push({ x:v.x, y:v.y, r:DOT_R });
    return { kind:'split', w:FIG_W, h:FIG_H, lines:lines, wedges:wedges, dots:dots };
  }

  /* --- 數值選項：正解 ＋ 三個誘答。
         誘答一律「值去重」、必須是這一課範圍裡的整數度數，
         而且**不可以是題幹印出來的數字**（forbid）。
         候選不夠時保底往外找一個長得像答案的度數，不生垃圾字串。 --- */
  function degOpts(correct, cands, forbid){
    if (!inDeg(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!inDeg(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1;
      out.push(v);
    });
    for (var k = 5; out.length < 4 && k <= 180; k += 5){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!inDeg(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1;
        out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      pieceName:{ a:'30°／60°／90°', b:'45°／45°／90°' },
      shapeName:{ square:'正方形', rect:'長方形', para:'平行四邊形', rhomb:'菱形' },
      cornerName:['左下角', '右下角', '右上角', '左上角'],
      kindName:{ acute:'銳角', right:'直角', obtuse:'鈍角', straight:'平角' },
      triKindName:{ acuteTri:'銳角三角形', rightTri:'直角三角形', obtuseTri:'鈍角三角形', unknown:'無法判斷' },
      comboText:function(c){
        return c.op === 'join' ? ('把 ' + c.a + '° 和 ' + c.b + '° 拼起來') : ('把 ' + c.b + '° 疊上 ' + c.a + '°');
      },
      capShape:'📐 同一個顏色的兩個角是對角（斜對面那一組）',
      capSplit:'📐 橘色那一塊是量到的，藍色那一塊是剩下的'
    },
    en: {
      pieceName:{ a:'30°／60°／90°', b:'45°／45°／90°' },
      shapeName:{ square:'square', rect:'rectangle', para:'parallelogram', rhomb:'rhombus' },
      cornerName:['bottom-left corner', 'bottom-right corner', 'top-right corner', 'top-left corner'],
      kindName:{ acute:'an acute angle', right:'a right angle', obtuse:'an obtuse angle', straight:'a straight angle' },
      triKindName:{ acuteTri:'an acute triangle', rightTri:'a right triangle', obtuseTri:'an obtuse triangle', unknown:'there is no way to tell' },
      comboText:function(c){
        return c.op === 'join' ? ('Join ' + c.a + '° and ' + c.b + '°') : ('Lay ' + c.b + '° on ' + c.a + '°');
      },
      capShape:'📐 Two corners in the same colour are opposite angles (the diagonal pair)',
      capSplit:'📐 The orange piece is the measured one, the blue piece is what is left'
    }
  };

  var GENS = [
    /* 1. 三角板剩下的那一個角。誘答一定要有 90°（兩片都有的那一個角）。 */
    { id:'pieceOther', cat:'piece',
      make:function(){
        return retry(function(){
          var p = pick(PIECES);
          var given = pick([p.base, RIGHT_DEG - p.base]);
          var want = RIGHT_DEG - given;
          if (!inDeg(want) || want <= 0) return null;
          var forbid = (given === want) ? [] : [given];
          var opts = degOpts(want, [RIGHT_DEG, STEP_DEG, STRAIGHT_DEG - given], forbid);
          if (!opts) return null;
          if (opts.indexOf(RIGHT_DEG) < 0) return null;
          return { id:p.id, given:given, want:want, opts:opts, ans:opts.indexOf(want) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一副三角板有兩片。有一個 <strong>' + d.given + '°</strong> 的角、又有一個直角的那一片，<strong>剩下</strong>那一個角是幾度？'
            : 'A pair of set squares has two pieces. On the one with a <strong>' + d.given + '°</strong> angle and a right angle, how many degrees is the <strong>remaining</strong> angle?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '那一片是 ' + t.pieceName[d.id] + '：除掉 ' + d.given + '° 和那個直角，剩下的是 <strong>' + d.want + '°</strong>。三角板上只有 30°、45°、60°、90° 這四種角。'
            : 'That piece is the ' + t.pieceName[d.id] + ' one: take away the ' + d.given + '° and the right angle, and <strong>' + d.want + '°</strong> is what is left. A set square carries only 30°, 45°, 60° and 90°.'
        };
      } },

    /* 2. 拼起來是幾度。誘答一定要有「相減」（把拼當成疊）。 */
    { id:'joinTwo', cat:'join',
      /* ⚠️ 從**合法的池子**裡抽，不是抽了再丟：retry() 只試 300 次，
         而 simgen 每一批只呼叫一次不重試 —— 抽了再丟的寫法理論上回得了 null。 */
      make:function(){
        var pool = crossCombos().filter(function(c){ return c.op === 'join' && c.a !== c.b; });
        return retry(function(){
          var c = pick(pool);
          var a = c.a, b = c.b, v = joinDeg(a, b);
          var gap = layDeg(a, b);
          var opts = degOpts(v, [gap, v - 5, v + 15, RIGHT_DEG], [a, b]);
          if (!opts) return null;
          if (opts.indexOf(gap) < 0) return null;
          return { a:a, b:b, v:v, gap:gap, opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '把 <strong>' + d.a + '°</strong> 的角和 <strong>' + d.b + '°</strong> 的角<strong>拼</strong>在一起（共用一條邊、不重疊），合起來是幾度？'
            : '<strong>Join</strong> a <strong>' + d.a + '°</strong> angle and a <strong>' + d.b + '°</strong> angle (sharing a side, no overlap). How many degrees is the angle you get?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '拼起來就是相加：' + d.a + '° ＋ ' + d.b + '° ＝ <strong>' + d.v + '°</strong>。（答 ' + d.gap + '° 是把它們疊起來看露出來的那一塊，那是相減。）'
            : 'Joining means adding: ' + d.a + '° + ' + d.b + '° = <strong>' + d.v + '°</strong>. (Answering ' + d.gap + '° reads the part left showing when one is laid on the other, which is a subtraction.)'
        };
      } },

    /* 3. 疊起來露出來幾度。誘答一定要有「相加」（把疊當成拼）。 */
    { id:'layTwo', cat:'lay',
      make:function(){
        var pool = crossCombos().filter(function(c){
          return c.op === 'lay' && joinDeg(c.a, c.b) <= STRAIGHT_DEG;
        });
        return retry(function(){
          var c = pick(pool);
          var big = c.a, small = c.b;
          var v = layDeg(big, small), sum = joinDeg(big, small);
          var opts = degOpts(v, [sum, big, v + 15], [big, small]);
          if (!opts) return null;
          if (opts.indexOf(sum) < 0) return null;
          return { big:big, small:small, v:v, sum:sum, opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '把 <strong>' + d.small + '°</strong> 的角<strong>疊</strong>進 <strong>' + d.big + '°</strong> 的角裡面（共用一條邊），<strong>露出來</strong>的角是幾度？'
            : '<strong>Lay</strong> a <strong>' + d.small + '°</strong> angle inside a <strong>' + d.big + '°</strong> angle (sharing a side). How many degrees is the part <strong>left showing</strong>?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '疊起來要看露出來的那一塊，那是相減：' + d.big + '° － ' + d.small + '° ＝ <strong>' + d.v + '°</strong>。（答 ' + d.sum + '° 是把它們拼起來。）'
            : 'Laying one inside the other means reading the part left showing, a subtraction: ' + d.big + '° − ' + d.small + '° = <strong>' + d.v + '°</strong>. (Answering ' + d.sum + '° joins them instead.)'
        };
      } },

    /* 4. 要做出這個角，用哪一個做法。四個做法只有一個算出來剛好是目標。 */
    { id:'whichCombo', cat:'join',
      make:function(){
        return retry(function(){
          var all = allCombos();
          var good = pick(all);
          var target = comboValue(good);
          var bad = [], seenVal = {}, seenKey = {};
          seenVal[String(target)] = 1;
          seenKey[comboKey(good)] = 1;
          shuffle(all).forEach(function(c){
            if (bad.length >= 3) return;
            var v = comboValue(c);
            if (v === target || seenVal[String(v)] || seenKey[comboKey(c)]) return;
            seenVal[String(v)] = 1; seenKey[comboKey(c)] = 1;
            bad.push(c);
          });
          if (bad.length < 3) return null;
          var combos = shuffle([good].concat(bad));
          return { target:target, combos:combos, ans:combos.indexOf(good) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var good = d.combos[d.ans];
        return {
          stem: lang === 'zh'
            ? '手上只有一副三角板，想做出一個 <strong>' + d.target + '°</strong> 的角。下面哪一個做法做得出來？'
            : 'With just a pair of set squares, you want a <strong>' + d.target + '°</strong> angle. Which of these builds it?',
          opts: d.combos.map(function(c){ return t.comboText(c); }), ans:d.ans,
          why: lang === 'zh'
            ? (good.op === 'join'
                ? ('拼是相加：' + good.a + '° ＋ ' + good.b + '° ＝ <strong>' + d.target + '°</strong>。')
                : ('疊是相減，看露出來的那一塊：' + good.a + '° － ' + good.b + '° ＝ <strong>' + d.target + '°</strong>。'))
              + '別的做法各算一次，都對不上。'
            : (good.op === 'join'
                ? ('A join adds: ' + good.a + '° + ' + good.b + '° = <strong>' + d.target + '°</strong>.')
                : ('A lay subtracts, reading the part left showing: ' + good.a + '° − ' + good.b + '° = <strong>' + d.target + '°</strong>.'))
              + ' Work out the other options and none of them lands on it.'
        };
      } },

    /* 5. 哪一個角兩片做不出來。只有一個做不出來（不是 15 的倍數，或剛好是 165°）。 */
    { id:'notMakeable', cat:'rule',
      make:function(){
        return retry(function(){
          var makeable = twoPieceList().filter(function(v){ return v >= STEP_DEG && v <= 150; });
          var badPool = [], x;
          for (x = 10; x <= 170; x += 5) if (!canMakeTwo(x)) badPool.push(x);
          var bad = pick(badPool);
          var good = shuffle(makeable).slice(0, 3);
          if (good.length < 3) return null;
          var opts = shuffle([bad].concat(good));
          return { bad:bad, opts:opts, ans:opts.indexOf(bad), mul15:(bad % STEP_DEG === 0) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '下面哪一個角，<strong>不可能</strong>用一副三角板做出來（直接用一個角，或兩片各出一個角拼起來、疊起來）？'
            : 'Which of these angles <strong>cannot</strong> be built with a pair of set squares (one corner as it is, or one corner from each piece joined or laid)?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? (d.mul15
                ? ('<strong>' + d.bad + '°</strong> 雖然是 15 的倍數，一副三角板還是湊不出來 —— 180° 以內只有 165° 是這樣，它要接三個角：90° ＋ 45° ＋ 30°。')
                : ('三角板上的角是 30°、45°、60°、90°，都是 15 的倍數，相加相減以後還是 15 的倍數。<strong>' + d.bad + '° 不是 15 的倍數</strong>，所以做不出來。'))
            : (d.mul15
                ? ('<strong>' + d.bad + '°</strong> is a multiple of 15, and a pair still cannot reach it — up to 180° only 165° is like that, and it takes three corners: 90° + 45° + 30°.')
                : ('The angles on a set square are 30°, 45°, 60° and 90°, all multiples of 15, and adding or subtracting keeps that. <strong>' + d.bad + '° is not a multiple of 15</strong>, so it cannot be built.'))
        };
      } },

    /* 6. 正方形或長方形的角，永遠是 90°。 */
    { id:'rectCorner', cat:'shape',
      make:function(){
        return retry(function(){
          var id = pick(['square', 'rect']);
          var corner = rand(4);
          var opts = degOpts(RIGHT_DEG, [45, 60, STRAIGHT_DEG, 30], []);
          if (!opts) return null;
          return { id:id, corner:corner, v:RIGHT_DEG, opts:opts, ans:opts.indexOf(RIGHT_DEG) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個<strong>' + t.shapeName[d.id] + '</strong>的' + t.cornerName[d.corner] + '是幾度？'
            : 'How many degrees is the ' + t.cornerName[d.corner] + ' of a <strong>' + t.shapeName[d.id] + '</strong>?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? t.shapeName[d.id] + '<strong>四個角都是直角</strong>，所以每一個角都是 <strong>90°</strong>，和它多長多寬沒有關係。'
            : 'All four angles of a ' + t.shapeName[d.id] + ' <strong>are right angles</strong>, so every one of them is <strong>90°</strong>, however long or wide it is.'
        };
      } },

    /* 7. 平行四邊形或菱形的對角。有圖，圖說裡一個數字都沒有。 */
    { id:'paraOpp', cat:'shape',
      make:function(){
        return retry(function(){
          var id = pick(['para', 'rhomb']);
          var a = pick([50, 55, 60, 65, 70, 75, 80, 100, 110, 115, 120, 125]);
          var corner = rand(4);
          var angles = shapeAngles(a);
          var v = angles[oppositeIndex(corner)];
          var nb = angles[(corner + 1) % 4];
          if (v !== angles[corner]) return null;      // 對角一定和它自己一樣大
          if (nb === v) return null;                   // a ＝ 90 的話兩組一樣大，就沒得問了
          /* ⚠️ 誘答刻意**不放**「旁邊那一個角」（180 － v）：那個數字只有
             「相鄰兩角合起來 180°」算得出來，而這一課明講不教那一條。 */
          var opts = degOpts(v, [RIGHT_DEG, v + 10, v - 10], [nb]);
          if (!opts) return null;
          if (opts.indexOf(nb) >= 0) return null;
          var w = (id === 'rhomb') ? 140 : 190, h = (id === 'rhomb') ? 140 : 120;
          return { id:id, a:a, corner:corner, v:v, nb:nb, w:w, h:h,
                   opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '這個<strong>' + t.shapeName[d.id] + '</strong>的' + t.cornerName[d.corner] + '量出來是 <strong>' + d.v + '°</strong>。<strong>斜對面</strong>那一個角是幾度？'
            : 'The ' + t.cornerName[d.corner] + ' of this <strong>' + t.shapeName[d.id] + '</strong> measures <strong>' + d.v + '°</strong>. How many degrees is the angle <strong>diagonally across</strong> from it?',
          fig: shapeFig(d.a, d.w, d.h),
          cap: t.capShape,
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '斜對面那一組叫做<strong>對角</strong>，對角一樣大，所以它也是 <strong>' + d.v + '°</strong>，不用再量。圖上同一個顏色的那兩個角就是這一組。'
            : 'The pair diagonally across are the <strong>opposite angles</strong>, and opposite angles match, so it is <strong>' + d.v + '°</strong> too, with no measuring needed. The two corners drawn in one colour are that pair.'
        };
      } },

    /* 8. 直角被切成兩塊。有圖，圖說裡一個數字都沒有。誘答一定要有「用 180° 去減」。 */
    { id:'splitRight', cat:'split',
      make:function(){
        return retry(function(){
          /* 10~80 的 5 的倍數，去掉 45（那時兩塊一樣大，正解會等於題幹的數字）。 */
          var cut = pick(CUT_POOL);
          var v = layDeg(RIGHT_DEG, cut);
          var wrong = layDeg(STRAIGHT_DEG, cut);
          var opts = degOpts(v, [wrong, v + 10, joinDeg(RIGHT_DEG, cut)], [cut]);
          if (!opts) return null;
          if (opts.indexOf(wrong) < 0) return null;
          return { cut:cut, v:v, wrong:wrong, opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '長方形的一個角被一條線切成兩塊，其中一塊量出來是 <strong>' + d.cut + '°</strong>。另一塊是幾度？'
            : 'One corner of a rectangle is cut into two by a line, and one piece measures <strong>' + d.cut + '°</strong>. How many degrees is the other?',
          fig: splitFig(d.cut),
          cap: t.capSplit,
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '長方形的角是 90°，兩塊加起來還是 90°，所以另一塊是 90° － ' + d.cut + '° ＝ <strong>' + d.v + '°</strong>。（答 ' + d.wrong + '° 是用 180° 去減，可是被切開的是一個直角，不是平角。）'
            : 'A rectangle’s corner is 90° and the two pieces still add up to 90°, so the other is 90° − ' + d.cut + '° = <strong>' + d.v + '°</strong>. (Answering ' + d.wrong + '° subtracts from 180°, but what was cut is a right angle, not a straight angle.)'
        };
      } },

    /* 9. 不是直角的那一個角被切成兩塊。誘答一定要有「用 90° 去減」。 */
    { id:'splitAny', cat:'split',
      make:function(){
        return retry(function(){
          /* 先算出合法的 (whole, cut) 池子：兩塊都是正的、兩塊不一樣大、
             而且「用 90° 去減」那個誘答也算得出來又不等於正解。 */
          var pair = pick(SPLIT_ANY_POOL);
          var whole = pair[0], cut = pair[1];
          var v = layDeg(whole, cut);
          var wrong = layDeg(RIGHT_DEG, cut);
          var opts = degOpts(v, [wrong, joinDeg(whole, cut), v + 10], [whole, cut]);
          if (!opts) return null;
          if (opts.indexOf(wrong) < 0) return null;
          return { whole:whole, cut:cut, v:v, wrong:wrong, opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一個 <strong>' + d.whole + '°</strong> 的角被一條線切成兩塊，其中一塊量出來是 <strong>' + d.cut + '°</strong>。另一塊是幾度？'
            : 'A <strong>' + d.whole + '°</strong> angle is cut into two by a line, and one piece measures <strong>' + d.cut + '°</strong>. How many degrees is the other?',
          opts: d.opts.map(function(v){ return v + '°'; }), ans:d.ans,
          why: lang === 'zh'
            ? '兩塊加起來還是原來那個角：' + d.whole + '° － ' + d.cut + '° ＝ <strong>' + d.v + '°</strong>。（答 ' + d.wrong + '° 是用 90° 去減，可是被切開的角是 ' + d.whole + '°。）'
            : 'The two pieces still add up to the angle you started with: ' + d.whole + '° − ' + d.cut + '° = <strong>' + d.v + '°</strong>. (Answering ' + d.wrong + '° subtracts from 90°, but the angle being cut is ' + d.whole + '°.)'
        };
      } },

    /* 10. 交錯題：量到的角是哪一種（「角度測量站」）。 */
    { id:'nameKind', cat:'angle',
      make:function(){
        return retry(function(){
          var deg = pick([1 + rand(89), RIGHT_DEG, RIGHT_DEG + 1 + rand(89), STRAIGHT_DEG]);
          var kind = kindOfDeg(deg);
          var keys = shuffle(['acute', 'right', 'obtuse', 'straight']);
          return { deg:deg, kind:kind, keys:keys, ans:keys.indexOf(kind) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '在圖形上量到一個角是 <strong>' + d.deg + '°</strong>。它是哪一種角？'
            : 'An angle measured on a shape is <strong>' + d.deg + '°</strong>. What kind of angle is it?',
          opts: d.keys.map(function(k){ return t.kindName[k]; }), ans:d.ans,
          why: lang === 'zh'
            ? '比 90° 小是銳角、剛好 90° 是直角、比 90° 大又比 180° 小是鈍角、剛好 180° 是平角。所以 ' + d.deg + '° 是<strong>' + t.kindName[d.kind] + '</strong>。'
            : 'Smaller than 90° is acute, exactly 90° is right, bigger than 90° but smaller than 180° is obtuse, and exactly 180° is straight. So ' + d.deg + '° is <strong>' + t.kindName[d.kind] + '</strong>.'
        };
      } },

    /* 11. 交錯題：量到最大的角，這是哪一種三角形（「三角形家族」）。
           ⚠️ 最大的角剛好 60° 的情形刻意不抽 —— 那時三個角一定都是 60°，
           要用內角和才說得清楚，而內角和是五年級的。 */
    { id:'triKind', cat:'triangle',
      make:function(){
        return retry(function(){
          /* ⚠️⚠️ 最大的角一定**大於 60°**：三個角裡最大的那一個如果只有 59°，
             三個角加起來連 180° 都不到 —— 那個三角形不存在，題目本身就壞了。
             （所以下界是 61，不是 35。剛好 60° 也不抽：那一種三角形只有一個
             —— 三個角都是 60° —— 而「一定都是 60°」這件事要用內角和才說得出來，
             那是五年級的。⚠️ 分類本身不需要內角和：最大的角是 60° 就每一個角都小於
             90°，所以是銳角三角形。這裡不抽它只是因為那是唯一的一種，不是因為分不出來。） */
          var deg = pick([61 + rand(29), RIGHT_DEG, RIGHT_DEG + 1 + rand(70)]);
          var kind = triKindOfMax(deg);
          var keys = shuffle(['acuteTri', 'rightTri', 'obtuseTri', 'unknown']);
          return { deg:deg, kind:kind, keys:keys, ans:keys.indexOf(kind) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個三角形三個角都量過了，<strong>最大</strong>的那一個是 <strong>' + d.deg + '°</strong>。依角分類，它是哪一種三角形？'
            : 'All three angles of a triangle have been measured and the <strong>largest</strong> is <strong>' + d.deg + '°</strong>. Sorted by its angles, which kind of triangle is it?',
          opts: d.keys.map(function(k){ return t.triKindName[k]; }), ans:d.ans,
          why: lang === 'zh'
            ? '依角分類只看<strong>最大</strong>的那一個角：比直角小是銳角三角形、剛好直角是直角三角形、比直角大是鈍角三角形。最大的角是 ' + d.deg + '°，所以它是<strong>' + t.triKindName[d.kind] + '</strong>。'
            : 'Sorting by angles looks only at the <strong>largest</strong> one: smaller than a right angle makes it acute, exactly a right angle makes it right, and bigger makes it obtuse. The largest is ' + d.deg + '°, so it is <strong>' + t.triKindName[d.kind] + '</strong>.'
        };
      } },

    /* 12. 最少要幾片三角板。一片、兩片、三片都抽得到。 */
    { id:'minPieces', cat:'rule',
      make:function(){
        return retry(function(){
          var target = pick(pieceAngleList().concat([15, 75, 105, 120, 135, 150, 180, 165]));
          var v = minPieces(target);
          if (v < PIECE_MIN || v > PIECE_MAX) return null;
          var opts = shuffle([1, 2, 3, 4]);
          return { target:target, v:v, opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var one = (d.v === 1), three = (d.v === 3);
        return {
          stem: lang === 'zh'
            ? '要做出一個 <strong>' + d.target + '°</strong> 的角，<strong>最少</strong>要接幾個三角板的角？'
            : 'What is the <strong>smallest</strong> number of set-square corners needed to build a <strong>' + d.target + '°</strong> angle?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? (one ? ('三角板上本來就有 ' + d.target + '° 這個角，<strong>一個角</strong>就夠了。')
                   : three ? ('兩片各出一個角怎麼拼怎麼疊都湊不到 ' + d.target + '°，要<strong>三個角</strong>：90° ＋ 45° ＋ 30°。')
                           : ('三角板上沒有 ' + d.target + '° 這個角，可是<strong>兩個角</strong>（一片出一個）拼或疊得出來。'))
            : (one ? ('A set square already carries a ' + d.target + '° angle, so <strong>one</strong> corner is enough.')
                   : three ? ('No join or lay of one corner from each piece reaches ' + d.target + '°, so it takes <strong>three</strong> corners: 90° + 45° + 30°.')
                           : ('No set square carries a ' + d.target + '° angle, but <strong>two</strong> corners, one from each piece, join or lay to make it.'))
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 拼角工作坊', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：拼角工作坊',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾幾題「角度測量站」「三角形家族」「四邊形家族」的題型。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　度數和角的名字回<a href="../angle/index.html">角度測量站</a>　·　對角回<a href="../quadrilateral/index.html">四邊形家族</a>　·　依角分類回<a href="../triangle/index.html">三角形家族</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Angle Workshop', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Angle Workshop',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>A few of them come from “The Angle Measuring Station”, “The Triangle Family” and “The Quadrilateral Family” too.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　degrees and angle names in <a href="../angle/index.html">The Angle Measuring Station</a>　·　opposite angles in <a href="../quadrilateral/index.html">The Quadrilateral Family</a>　·　sorting by angles in <a href="../triangle/index.html">The Triangle Family</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM。座標直接用 fig 裡**產生器算好的**那一份，
         不在這裡重算，不然畫出來的和檢查驗過的會是兩回事。 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var C_LINE = '#2B2A33', C_A = '#E8871E', C_B = '#3B7DD8',
      C_AF = 'rgba(232,135,30,.22)', C_BF = 'rgba(59,125,216,.20)';

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function drawFig(svg, fig){
    svg.textContent = '';
    fig.wedges.forEach(function(w){
      svg.appendChild(svgEl('path', {
        d:w.d, fill:(w.tone === 'a' ? C_AF : C_BF),
        stroke:(w.tone === 'a' ? C_A : C_B), 'stroke-width':2
      }));
    });
    fig.lines.forEach(function(l){
      svg.appendChild(svgEl('line', {
        x1:l.x1, y1:l.y1, x2:l.x2, y2:l.y2,
        stroke:C_LINE, 'stroke-width':l.w, 'stroke-linecap':'round'
      }));
    });
    fig.dots.forEach(function(p){
      svg.appendChild(svgEl('circle', { cx:p.x, cy:p.y, r:p.r, fill:C_LINE }));
    });
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make();
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'anglefig');
        svg.setAttribute('viewBox', '0 0 340 210');
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
        var cp = document.createElement('p');
        cp.className = 'figcap';
        cp.textContent = q.cap;
        box.appendChild(cp);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
