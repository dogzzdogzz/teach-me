<style>
  :root{

    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;

  .stem{margin:8px 0 12px;font-size:18px}
  .figwrap{margin:0 0 4px;text-align:center;overflow-x:auto}
  .cubefig{width:100%;max-width:460px;height:300px;display:block;margin:0 auto}
  .figcap{margin:0 0 12px;font-size:13px;color:var(--muted);text-align:center}
  .hmap{display:grid;gap:4px;justify-content:center;margin:0 auto 12px}
  .hmap span{

  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{

  }
  footer{
    margin-top:48px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }

<body>

    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>

  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾幾題「面積鋪磚廠」和二年級「立體形體」的題型。</div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖的座標也在這裡定案（singleFig／pairFig／whichFig 回傳每一塊方塊的三個面的畫布座標），
     由 fmt() 放進 fig 回傳，這樣檢查驗到的就是「頁面真的畫成什麼」。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* ⚠️ make() 一律不可以回 null。tools/simgen.js 每一批只呼叫 make() 一次、
     **不重試**，所以拒絕取樣的重試必須放在 make() 裡面。 */
  function retry(fn){
    for (var i = 0; i < 300; i++){
      var d = fn();
      if (d) return d;
    }
    return null;
  }

  /* --- 方塊與投影：定義和上課頁完全一致。 --- */
  var FIG_W = 460, FIG_H = 300;
  var U = 30, DEPTH = 0.5, RASTER = 4;
  var MAX_SIDE = 4, MAX_HEIGHT = 4, MAX_CUBES = 40;
  var PAIR_CX_A = 0.27, PAIR_CX_B = 0.73;
  var WHICH_U = 24;                                  // 「哪一堆」的四堆用小一點的格
  var WHICH_CX = [0.125, 0.375, 0.625, 0.875];        // 四個欄位的中心（占畫布寬的比例）
  var WHICH_TONES = ['c', 'd', 'e', 'a'];
  /* 這一課的數值範圍：塊數 1 ~ 40；面積題的邊長 3 ~ 9 公分。 */
  var LEN_MIN = 3, LEN_MAX = 9;   // 邊長 2 時「邊長 × 2」和面積都是 4，所以從 3 起
  function inCubes(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 0 && v <= MAX_CUBES; }
  function inCubesPos(v){ return inCubes(v) && v >= 1; }

  function rows(H){ return H.length; }
  function cols(H){ return H[0].length; }
  function maxH(H){ var m = 0; H.forEach(function(row){ row.forEach(function(x){ if (x > m) m = x; }); }); return m; }
  function volume(H){ var s = 0; H.forEach(function(row){ row.forEach(function(x){ s += x; }); }); return s; }
  function footprint(H){ var n = 0; H.forEach(function(row){ row.forEach(function(x){ if (x > 0) n++; }); }); return n; }
  function cellList(H){ var out = []; H.forEach(function(row){ row.forEach(function(x){ if (x > 0) out.push(x); }); }); return out; }
  function layerCounts(H){
    var out = [], L, n, m = maxH(H);
    for (L = 1; L <= m; L++){ n = 0; H.forEach(function(row){ row.forEach(function(x){ if (x >= L) n++; }); }); out.push(n); }
    return out;
  }
  function sum(arr){ var s = 0; arr.forEach(function(x){ s += x; }); return s; }
  function cubesOf(H){
    var out = [], R = rows(H);
    H.forEach(function(row, r){
      row.forEach(function(x, c){
        for (var h = 0; h < x; h++) out.push({ c:c, h:h, b:R - 1 - r, key:c + ',' + h + ',' + (R - 1 - r) });
      });
    });
    return out;
  }
  function drawOrder(cubes){
    return cubes.slice().sort(function(p, q){
      if (p.b !== q.b) return q.b - p.b;
      if (p.h !== q.h) return p.h - q.h;
      return p.c - q.c;
    });
  }
  function unitPt(x, y, b){ return { u:x + DEPTH * b, v:y + DEPTH * b }; }
  function facesOf(k){
    var c = k.c, h = k.h, b = k.b;
    return {
      top:   [unitPt(c, h + 1, b), unitPt(c + 1, h + 1, b), unitPt(c + 1, h + 1, b + 1), unitPt(c, h + 1, b + 1)],
      front: [unitPt(c, h, b), unitPt(c + 1, h, b), unitPt(c + 1, h + 1, b), unitPt(c, h + 1, b)],
      right: [unitPt(c + 1, h, b), unitPt(c + 1, h, b + 1), unitPt(c + 1, h + 1, b + 1), unitPt(c + 1, h + 1, b)]
    };
  }
  function inConvex(p, poly){
    var n = poly.length, sign = 0;
    for (var i = 0; i < n; i++){
      var a = poly[i], q = poly[(i + 1) % n];
      var cr = (q.u - a.u) * (p.v - a.v) - (q.v - a.v) * (p.u - a.u);
      if (cr === 0) return false;
      var s = cr > 0 ? 1 : -1;
      if (sign === 0) sign = s;
      else if (s !== sign) return false;
    }
    return true;
  }
  function extent(H){ return { w:cols(H) + DEPTH * rows(H), h:maxH(H) + DEPTH * rows(H) }; }
  function visibility(H){
    var cubes = drawOrder(cubesOf(H)), ex = extent(H);
    var nu = Math.ceil(ex.w * RASTER), nv = Math.ceil(ex.h * RASTER);
    var owner = new Array(nu * nv);
    var i, j, idx;
    cubes.forEach(function(k, ki){
      var f = facesOf(k);
      [f.top, f.front, f.right].forEach(function(poly){
        var minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
        poly.forEach(function(p){
          if (p.u < minU) minU = p.u; if (p.u > maxU) maxU = p.u;
          if (p.v < minV) minV = p.v; if (p.v > maxV) maxV = p.v;
        });
        for (i = Math.max(0, Math.floor(minU * RASTER)); i < Math.min(nu, Math.ceil(maxU * RASTER)); i++){
          for (j = Math.max(0, Math.floor(minV * RASTER)); j < Math.min(nv, Math.ceil(maxV * RASTER)); j++){
            var p = { u:(i + 0.5) / RASTER, v:(j + 0.25) / RASTER };
            if (inConvex(p, poly)) owner[j * nu + i] = ki;
          }
        }
      });
    });
    var seen = {};
    for (idx = 0; idx < owner.length; idx++) if (owner[idx] !== undefined) seen[cubes[owner[idx]].key] = true;
    var visible = 0;
    cubes.forEach(function(k){ k.visible = !!seen[k.key]; if (k.visible) visible++; });
    return { cubes:cubes, visible:visible, hidden:cubes.length - visible, total:cubes.length };
  }
  function validStack(H){
    if (!Array.isArray(H) || !H.length || H.length > MAX_SIDE) return false;
    var C = H[0].length;
    if (!C || C > MAX_SIDE) return false;
    for (var r = 0; r < H.length; r++){
      if (H[r].length !== C) return false;
      for (var c = 0; c < C; c++){
        var x = H[r][c];
        if (typeof x !== 'number' || x !== Math.floor(x) || x < 0 || x > MAX_HEIGHT) return false;
      }
    }
    return volume(H) >= 1 && volume(H) <= MAX_CUBES;
  }
  /* 每一格最上面那一塊都看得到嗎？圖裡的每一堆都要滿足這一條，孩子才有辦法從圖上看出
     有幾格、每一格疊幾層（一整格藏在後面的話，就算知道方塊不會浮在空中也數不出來）。 */
  function allTopsVisible(H){
    var vis = visibility(H), byKey = {};
    vis.cubes.forEach(function(k){ byKey[k.key] = k.visible; });
    var R = rows(H), ok = true;
    H.forEach(function(row, r){ row.forEach(function(x, c){ if (x > 0 && !byKey[c + ',' + (x - 1) + ',' + (R - 1 - r)]) ok = false; }); });
    return ok;
  }
  function toPx(p, X0, Y0, unit){ return { x:X0 + p.u * unit, y:Y0 - p.v * unit }; }
  function stackPlan(H, X0, Y0, unit){
    var vis = visibility(H);
    var cubes = vis.cubes.map(function(k){
      var f = facesOf(k);
      function px(poly){ return poly.map(function(p){ return toPx(p, X0, Y0, unit); }); }
      return { c:k.c, h:k.h, b:k.b, key:k.key, visible:k.visible, top:px(f.top), front:px(f.front), right:px(f.right) };
    });
    var ex = extent(H);
    return { cubes:cubes, visible:vis.visible, hidden:vis.hidden, total:vis.total,
             box:{ x:X0, y:Y0 - ex.h * unit, w:ex.w * unit, h:ex.h * unit } };
  }
  /* --- 展示清單：stacks 裡每一堆有高度圖、色調和畫布座標的方塊。 --- */
  function singleFig(H){
    var ex = extent(H);
    var plan = stackPlan(H, (FIG_W - ex.w * U) / 2, (FIG_H + ex.h * U) / 2, U);
    return { kind:'single', w:FIG_W, h:FIG_H, floorY:plan.box.y + plan.box.h + 0.5, stacks:[{ H:H, tone:'a', plan:plan }] };
  }
  function pairFig(HA, HB){
    var ea = extent(HA), eb = extent(HB), tall = Math.max(ea.h, eb.h);
    var Y0 = (FIG_H + tall * U) / 2;
    var A = stackPlan(HA, FIG_W * PAIR_CX_A - ea.w * U / 2, Y0, U);
    var B = stackPlan(HB, FIG_W * PAIR_CX_B - eb.w * U / 2, Y0, U);
    return { kind:'pair', w:FIG_W, h:FIG_H, floorY:Y0 + 0.5, stacks:[{ H:HA, tone:'a', plan:A }, { H:HB, tone:'b', plan:B }] };
  }
  /* 四堆一排（顏色當選項）。每一堆最多 2 × 2 格、最高 3 層，才放得進一欄。 */
  function whichFig(Hs){
    var tall = 0;
    Hs.forEach(function(H){ var e = extent(H); if (e.h > tall) tall = e.h; });
    var Y0 = (FIG_H + tall * WHICH_U) / 2;
    var stacks = Hs.map(function(H, i){
      var e = extent(H);
      return { H:H, tone:WHICH_TONES[i], plan:stackPlan(H, FIG_W * WHICH_CX[i] - e.w * WHICH_U / 2, Y0, WHICH_U) };
    });
    return { kind:'which', w:FIG_W, h:FIG_H, floorY:Y0 + 0.5, stacks:stacks };
  }
  function fitsWhich(H){ return rows(H) <= 2 && cols(H) <= 2 && maxH(H) <= 3; }

  /* --- 隨機一堆：R × C 格、每格 0 ~ hi 層，體積在 [lo, hiVol]。 --- */
  function randomStack(R, C, hiLayer, lo, hiVol){
    return retry(function(){
      var H = [], r, c;
      for (r = 0; r < R; r++){ H.push([]); for (c = 0; c < C; c++) H[r].push(rand(hiLayer + 1)); }
      if (!validStack(H)) return null;
      var v = volume(H);
      if (v < lo || v > hiVol) return null;
      if (footprint(H) < 2) return null;
      if (!allTopsVisible(H)) return null;     // 一整格藏在後面的話，圖上數不出來
      return H;
    });
  }
  function sameStack(A, B){ return JSON.stringify(A) === JSON.stringify(B); }

  /* --- 英文的單複數。只有 1 會出錯。 --- */
  function plEn(n, w){ return n === 1 ? w : w + 's'; }

  /* --- 整數選項：正解 ＋ 三個誘答，值去重、都要在範圍裡、不可以是題幹印出來的數字。 --- */
  function numOpts(correct, cands, forbid, okFn){
    if (!okFn(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!okFn(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1; out.push(v);
    });
    for (var k = 1; out.length < 4 && k <= 60; k++){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!okFn(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1; out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      vol:function(n){ return n + ' 立方公分'; },
      cubes:function(n){ return n + ' 塊'; },
      sqcm:function(n){ return n + ' 平方公分'; },
      cm:function(n){ return n + ' 公分'; },
      compareOpt:{ aBigger:'甲的體積比較大', bBigger:'乙的體積比較大', same:'一樣大', measure:'比不出來，要用尺量' },
      colorName:{ c:'綠色的', d:'紫色的', e:'紅色的', a:'橘色的' },
      unitOpt:{ cube1:'邊長 1 公分的正方體', square1:'邊長 1 公分的正方形', line1:'1 公分長的線段', cubeK:function(k){ return '邊長 ' + k + ' 公分的正方體'; } },
      solidPart:{ face:'面', edge:'邊', vertex:'頂點' },
      count:function(n){ return n + ' 個'; },
      capSingle:'📦 每一塊都是 1 立方公分；看不到的方塊也在',
      capPair:'📦 左邊橘色是甲，右邊藍色是乙',
      capWhich:'📦 四堆的顏色不一樣；每一塊都是 1 立方公分'
    },
    en: {
      vol:function(n){ return n + ' cubic ' + plEn(n, 'centimetre'); },
      cubes:function(n){ return n + ' ' + plEn(n, 'cube'); },
      sqcm:function(n){ return n + ' square ' + plEn(n, 'centimetre'); },
      cm:function(n){ return n + ' cm'; },
      compareOpt:{ aBigger:'A has the bigger volume', bBigger:'B has the bigger volume', same:'The same volume', measure:'Cannot tell without a ruler' },
      colorName:{ c:'the green one', d:'the purple one', e:'the red one', a:'the orange one' },
      unitOpt:{ cube1:'A cube with 1 cm edges', square1:'A square with 1 cm sides', line1:'A line 1 cm long', cubeK:function(k){ return 'A cube with ' + k + ' cm edges'; } },
      solidPart:{ face:'faces', edge:'edges', vertex:'vertices' },
      count:function(n){ return String(n); },
      capSingle:'📦 Every cube is 1 cubic centimetre; the hidden cubes are there too',
      capPair:'📦 Orange on the left is A, blue on the right is B',
      capWhich:'📦 The four piles are different colours; every cube is 1 cubic centimetre'
    }
  };

  var COMPARE_KEYS = ['aBigger', 'bBigger', 'same', 'measure'];
  var UNIT_KEYS = ['cube1', 'square1', 'line1', 'cubeK'];
  var SOLID_PARTS = { face:6, edge:12, vertex:8 };
  function whoBigger(a, b){ return a > b ? 'aBigger' : b > a ? 'bBigger' : 'same'; }

  var GENS = [
    /* 1. 這一堆一共幾塊（看不到的也要數）。有圖；一定至少藏一塊，誘答一定有「只數看得到的」。 */
    { id:'countStack', cat:'vol',
      make:function(){
        return retry(function(){
          var H = randomStack(2 + rand(2), 2 + rand(2), 3, 5, 20);
          if (!H) return null;
          var vis = visibility(H);
          if (vis.hidden < 1) return null;
          var opts = numOpts(vis.total, [vis.visible, footprint(H), vis.total + 1, vis.total - 1], [], inCubesPos);
          if (!opts || opts.indexOf(vis.visible) < 0) return null;
          return { H:H, total:vis.total, visible:vis.visible, hidden:vis.hidden, opts:opts, ans:opts.indexOf(vis.total) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {

      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　正方形的面積回<a href="../area/index.html">面積鋪磚廠</a>　·　正方體的面和邊回二年級<a href="../../../grade-2/math/solid/index.html">立體形體</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Cube Stocktake', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Cube Stocktake',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>A few of them come from “The Area Tiling Works” and grade 2’s “Solid Shapes” too.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　square area in <a href="../area/index.html">The Area Tiling Works</a>　·　faces and edges of a cube in grade 2’s <a href="../../../grade-2/math/solid/index.html">Solid Shapes</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM。座標直接用 fig 裡**產生器算好的**那一份，
         不在這裡重算，不然畫出來的和檢查驗過的會是兩回事。圖上只有 path 和 line，沒有文字。 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var TONES = {
    a:{ top:'#F6C58F', front:'#E8871E', right:'#B8681A', edge:'#7A4410' },
    b:{ top:'#B3CBEF', front:'#3B7DD8', right:'#2A5CA5', edge:'#1E3F70' },
    c:{ top:'#B6E2CB', front:'#2F9E69', right:'#22754D', edge:'#174F34' },
    d:{ top:'#D6C4F2', front:'#9C6ADE', right:'#7248B0', edge:'#4E2F7D' },
    e:{ top:'#F2B8B8', front:'#D64545', right:'#A33131', edge:'#6E1F1F' }
  };

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function facePath(poly){
    return poly.map(function(q, i){ return (i ? 'L ' : 'M ') + q.x + ' ' + q.y; }).join(' ') + ' Z';
  }
  function drawFace(svg, poly, fill, stroke){
    svg.appendChild(svgEl('path', { d:facePath(poly), fill:fill, stroke:stroke, 'stroke-width':1.5, 'stroke-linejoin':'round' }));
  }
  function drawFig(svg, fig){
    svg.textContent = '';
    svg.appendChild(svgEl('line', { x1:20, y1:fig.floorY, x2:fig.w - 20, y2:fig.floorY, stroke:'#E8E2D6', 'stroke-width':2 }));
    fig.stacks.forEach(function(s){
      var t = TONES[s.tone];
      s.plan.cubes.forEach(function(k){
        drawFace(svg, k.top, t.top, t.edge);
        drawFace(svg, k.front, t.front, t.edge);
        drawFace(svg, k.right, t.right, t.edge);
      });
    });
  }
  /* 高度圖（HTML）。 */
  function buildTable(host, H){
    var grid = document.createElement('div');
    grid.className = 'hmap';
    grid.style.gridTemplateColumns = 'repeat(' + cols(H) + ', 44px)';
    H.forEach(function(row){
      row.forEach(function(x){
        var cell = document.createElement('span');
        if (x > 0){ cell.className = 'on'; cell.textContent = x; }
        grid.appendChild(cell);
      });
    });
    host.appendChild(grid);
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make();
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'cubefig');
        svg.setAttribute('viewBox', '0 0 ' + FIG_W + ' ' + FIG_H);
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
        var cp = document.createElement('p');
        cp.className = 'figcap';
        cp.textContent = q.cap;
        box.appendChild(cp);
      }
      if (q.table) buildTable(box, q.table);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
