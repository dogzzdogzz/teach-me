  *{box-sizing:border-box;margin:0;padding:0}
  body{

  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);

  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:16px 20px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{

  .figwrap{margin:10px 0 12px;text-align:center;overflow-x:auto}
  .nlfig{width:100%;max-width:460px;height:70px;display:block;margin:0 auto}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);word-break:break-word;
  }

  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:20px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;
  }
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;
  }
  .result{margin-top:22px;background:var(--orange-soft);border-radius:18px;padding:18px;display:none}

  .result .line{font-size:18px;font-weight:700}

  .result .links a{color:var(--blue)}
  footer{margin-top:44px;text-align:center;color:var(--muted);font-size:15px}

<body>

  </header>
  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾幾題「分數變身工廠」和「小數放大鏡」的題型。</div>

  <div id="quiz" class="quiz"></div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     ⚠️ 畫圖用的 linePlan() 一定要放在 GENS **前面**：這樣 make()／fmt() 才能把
     **算好的座標**放進 fig，設定檔驗的就是「頁面真的畫成什麼」，
     而不是「設定檔自己會畫成什麼」。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null（也不可以丟例外）：tools/simgen.js 每一批只呼叫 make()
     一次、**不重試**，回 null 之後檢查會直接 dereference null 而當掉 —— 當掉不是「抓到」。
     每一次迴圈都重新抽一組參數，所以連續 400 次全被拒絕的機率極低，可是「極低」不是
     「不會」，所以每一支都給一組**手算過的**保底參數。 */
  function retry(fn, fallback){
    for (var i = 0; i < 400; i++){
      var d = fn();
      if (d) return d;
    }
    return fallback ? fallback() : null;
  }

  /* --- 這一課的數線模型：M 格（每一格代表 1）、一格平分成 d 份、點在第 k 段。
         一個點的值 ＝ k/d，全部用整數 (k, d) 表示，不換成小數。
         畫得出來的上界：M ≤ 3、d 在 DENS 裡、M × d ≤ 24（再多就擠成一片）。 --- */
  var DENS = [2, 3, 4, 5, 6, 10];
  var MAX_M = 3, MAX_SEGS = 24;
  function densFor(M){ return DENS.filter(function(d){ return M * d <= MAX_SEGS; }); }

  function gcd(a, b){ while (b){ var t = a % b; a = b; b = t; } return a; }
  function wholeOf(k, d){ return Math.floor(k / d); }
  function remOf(k, d){ return k % d; }
  function fracText(k, d){ return k + '/' + d; }
  function mixedText(k, d, lang){
    var w = wholeOf(k, d), r = remOf(k, d);
    if (r === 0) return String(w);
    if (w === 0) return r + '/' + d;
    return lang === 'zh' ? (w + ' 又 ' + r + '/' + d) : (w + ' ' + r + '/' + d);
  }
  /* 小數的寫法只有 d ＝ 10 才有（一小段就是 0.1）。 */
  function tenthText(k){
    var w = Math.floor(k / 10), r = k % 10;
    return r === 0 ? String(w) : (w + '.' + r);
  }

  /* --- 選項的「值」：把每一種寫法解析回**整數分子／分母**，兩兩交叉相乘比。
         字串比對抓不到 3/4 和 1 又 3/4 是同一個數，而那正是這一課最危險的等值形狀。 --- */
  function valOf(s){
    var t = String(s).replace(/\s+/g, ' ').trim();
    var m = /^(\d+) 又 (\d+)\/(\d+)$/.exec(t) || /^(\d+) (\d+)\/(\d+)$/.exec(t);
    if (m){
      var w = Number(m[1]), n = Number(m[2]), d = Number(m[3]);
      if (!d) return null;
      return { n:w * d + n, d:d };
    }
    m = /^(\d+)\/(\d+)$/.exec(t);
    if (m){ if (!Number(m[2])) return null; return { n:Number(m[1]), d:Number(m[2]) }; }
    m = /^(\d+)\.(\d+)$/.exec(t);
    if (m){
      var pow = Math.pow(10, m[2].length);
      return { n:Number(m[1]) * pow + Number(m[2]), d:pow };
    }
    m = /^(\d+)$/.exec(t);
    if (m) return { n:Number(m[1]), d:1 };
    return null;
  }
  function valKey(s){
    var v = valOf(s);
    if (!v) return 'raw:' + String(s).replace(/\s+/g, '');
    var g = gcd(v.n, v.d) || 1;
    return 'v:' + (v.n / g) + '/' + (v.d / g);
  }
  /* 四個**值**互不相同的字串選項。候選不夠就回 null，讓 make() 重抽。 */
  function strOpts(correct, cands){
    var out = [correct], keys = [valKey(correct)];
    cands.forEach(function(s){
      if (out.length >= 4 || !s) return;
      var k = valKey(s);
      if (keys.indexOf(k) >= 0) return;
      keys.push(k); out.push(s);
    });
    return out.length === 4 ? shuffle(out) : null;
  }
  /* 四個互不相同的**整數**選項（單位在 fmt 裡才接上去）。 */
  function numOpts(correct, cands){
    var out = [correct], seen = {};
    seen[String(correct)] = 1;
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (typeof v !== 'number' || !isFinite(v) || v !== Math.round(v) || v < 1 || v > 99) return;
      if (seen[String(v)]) return;
      seen[String(v)] = 1;
      out.push(v);
    });
    return out.length === 4 ? shuffle(out) : null;
  }

  /* --- 英文的單複數。只有 1 會錯，而且要放在語言無關的區塊
         （放進 en 字典會破 zh/en 的 key 對應）。 --- */
  function plEn(n, w){
    if (n === 1) return n + ' ' + w;
    return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's');
  }

  /* 「百分位的整數」印成小數：47 → 0.47、40 → 0.4、50 → 0.5。 */
  function centText(c){
    var w = Math.floor(c / 100), rest = c % 100;
    if (rest === 0) return String(w);
    if (rest % 10 === 0) return w + '.' + (rest / 10);
    return w + '.' + (rest < 10 ? '0' + rest : String(rest));
  }
  /* 補零之後的兩位小數寫法（比大小時看到的樣子）。 */
  function centPad(c){
    var w = Math.floor(c / 100), rest = c % 100;
    return w + '.' + (rest < 10 ? '0' + rest : String(rest));
  }

  /* --- 圖的座標（和 index.html 同一套版面常數）。純資料，畫圖那一段只照著畫。
         圖上只有**單一個字**的標籤（整數 0~3），分數的寫法一律在題幹與選項裡。 --- */
  var FIG_W = 460, FIG_H = 70;
  var SPAN = 360, X0 = (FIG_W - SPAN) / 2, LINE_Y = 30;
  var END_OVER = 14, TICK_BIG = 11, TICK_SMALL = 6;
  var LBL_FS = 19, LBL_DY = 28, DOT_R = 6;
  var LINE_W = 3, TICK_W = 2;

  function segPx(M, d){ return SPAN / (M * d); }
  function unitPx(M){ return SPAN / M; }
  function xAt(M, d, k){ return X0 + k * segPx(M, d); }

  function linePlan(M, d, mark){
    var sp = segPx(M, d), up = unitPx(M), i, j;
    var ticks = [], labels = [], dots = [];
    for (j = 0; j <= M * d; j++){
      var half = (j % d === 0) ? TICK_BIG : TICK_SMALL;
      ticks.push({ x:X0 + j * sp, y1:LINE_Y - half, y2:LINE_Y + half, big:(j % d === 0) });
    }
    for (i = 0; i <= M; i++) labels.push({ x:X0 + i * up, y:LINE_Y + LBL_DY, text:String(i), fs:LBL_FS });
    if (typeof mark === 'number') dots.push({ x:xAt(M, d, mark), y:LINE_Y, r:DOT_R, k:mark });
    return {
      w:FIG_W, h:FIG_H, M:M, d:d, segPx:sp, unitPx:up,
      axis:{ x1:X0 - END_OVER, x2:X0 + SPAN + END_OVER, y:LINE_Y },
      ticks:ticks, labels:labels, dots:dots
    };
  }

  var GENS = [
    /* 1. 一格平分成 d 份，一小段是多少？頭號迷思是把「份數」當成長度。 */
    { id:'unitPart', cat:'unit',
      make:function(used){
        return retry(function(){
          var d = pickUnused(DENS, used);
          var opts = strOpts('1/' + d, [String(d), '1/' + (d + 1), d + '/' + d, '1/' + (d - 1)]);
          if (!opts) return null;
          return { d:d, opts:opts, ans:opts.indexOf('1/' + d) };
        }, function(){
          var opts = strOpts('1/5', ['5', '1/6', '5/5', '1/4']);
          return { d:5, opts:opts, ans:opts.indexOf('1/5') };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一條數線的一格被<strong>平分成 ' + d.d + ' 份</strong>。<strong>一小段</strong>是多少？'
            : 'One step of a number line is cut into <strong>' + plEn(d.d, 'equal part') + '</strong>. How big is <strong>one small part</strong>?',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '一格平分成 ' + d.d + ' 份，其中的 1 份就是 1/' + d.d + '。' + d.d + ' 是段數，不是長度；' + d.d + '/' + d.d + ' 是數了 ' + d.d + ' 段、剛好走完一整格，那個點是 1。'
            : 'One step cut into ' + plEn(d.d, 'equal part') + ' makes one of them 1/' + d.d + '. The number ' + d.d + ' counts parts, it is not a length, and ' + d.d + '/' + d.d + ' means all ' + d.d + ' parts counted, which finishes a whole step and lands on 1.'
        };
      } },

    /* 2. 從 0 數 k 段的點是多少（不畫圖，只給文字）。誘答含「把格線數成分母」。 */
    { id:'countParts', cat:'mark',
      make:function(used){
        return retry(function(){
          var d = pickUnused(DENS, used);
          var k = pick(rangeList(2, d - 1));
          if (gcd(k, d) !== 1) return null;          /* 約分過的寫法會變成第二個正解 */
          var right = fracText(k, d);
          var opts = strOpts(right, [fracText(d, k), fracText(k, d + 1), fracText(k + 1, d), '1/' + d]);
          if (!opts) return null;
          return { d:d, k:k, opts:opts, ans:opts.indexOf(right) };
        }, function(){
          var opts = strOpts('3/4', ['4/3', '3/5', '4/4', '1/4']);
          return { d:4, k:3, opts:opts, ans:opts.indexOf('3/4') };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一條數線的一格被<strong>平分成 ' + d.d + ' 份</strong>。從 0 往右<strong>數 ' + d.k + ' 段</strong>的那個點是多少？'
            : 'One step of a number line is cut into <strong>' + plEn(d.d, 'equal part') + '</strong>. Which point do you reach by <strong>counting ' + plEn(d.k, 'part') + '</strong> to the right of 0?',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '分母就是一格被平分成的份數，也就是 ' + d.d + '；分子就是從 0 數過的段數，也就是 ' + d.k + '，所以是 ' + d.k + '/' + d.d + '。' + d.d + '/' + d.k + ' 把分子分母寫反了；' + d.k + '/' + (d.d + 1) + ' 把<strong>格線</strong>的條數當成分母（' + d.d + ' 段有 ' + (d.d + 1) + ' 條格線）。'
            : 'The denominator is how many parts a step is cut into (' + d.d + ') and the numerator is how many parts you counted (' + d.k + '), so it is ' + d.k + '/' + d.d + '. The option ' + d.d + '/' + d.k + ' has them the wrong way round, and ' + d.k + '/' + (d.d + 1) + ' uses the number of <strong>marks</strong> as the denominator (' + plEn(d.d, 'part') + ' have ' + (d.d + 1) + ' marks).'
        };
      } },

    /* 3. 看圖讀出一個真分數。 */
    { id:'readProper', cat:'read',
      make:function(used){
        return retry(function(){
          var d = pickUnused(densFor(1), used);
          var k = pick(rangeList(2, d - 1));
          if (gcd(k, d) !== 1) return null;
          var right = fracText(k, d);
          var opts = strOpts(right, [fracText(d, k), fracText(k, d + 1), fracText(k + 1, d), fracText(k - 1, d)]);
          if (!opts) return null;
          return { M:1, d:d, k:k, opts:opts, ans:opts.indexOf(right), fig:linePlan(1, d, k) };
        }, function(){
          var opts = strOpts('5/6', ['6/5', '5/7', '4/6', '1/6']);
          return { M:1, d:6, k:5, opts:opts, ans:opts.indexOf('5/6'), fig:linePlan(1, 6, 5) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '圖上這個點是多少？（一格被平分成 <strong>' + d.d + ' 份</strong>）'
            : 'What is the marked point? (a step is cut into <strong>' + plEn(d.d, 'equal part') + '</strong>)',
          opts: d.opts.slice(), ans:d.ans, fig:d.fig,
          why: lang === 'zh'
            ? '一格被平分成 ' + d.d + ' 段，這個點從 0 往右數了 ' + d.k + ' 段，所以是 ' + d.k + '/' + d.d + '。數的是<strong>段</strong>，不是格線。'
            : 'A step holds ' + plEn(d.d, 'part') + ' and the point is ' + plEn(d.k, 'part') + ' to the right of 0, so it is ' + d.k + '/' + d.d + '. Count the <strong>parts</strong>, not the marks.'
        };
      } },

    /* 4. 看圖讀出一個帶分數。題幹明講「用帶分數寫」，不然假分數也是對的。 */
    { id:'readMixed', cat:'read',
      make:function(used){
        return retry(function(){
          var M = pick([2, 3]);
          /* r 要滿足 1 ≤ r ≤ d － 2（誘答「多數一段」得留在同一格裡），所以 d 至少要 3 ——
             把 d ＝ 2 從抽樣池裡拿掉，不要靠「抽到了再拒絕」，那會讓定義域靜靜變窄。 */
          var d = pickUnused(densFor(M).filter(function(x){ return x >= 3; }), used);
          var w = pick(rangeList(1, M - 1));
          var r = pick(rangeList(1, d - 2));
          if (gcd(r, d) !== 1) return null;
          var k = w * d + r;
          var right = mixedText(k, d, 'zh');
          var opts = strOpts(right,
            [mixedText((w + 1) * d + r, d, 'zh'), mixedText(w * d + r + 1, d, 'zh'),
             fracText(r, d), mixedText(w * d + r - 1, d, 'zh')]);
          if (!opts) return null;
          return { M:M, d:d, w:w, r:r, k:k, opts:opts, ans:opts.indexOf(right), fig:linePlan(M, d, k) };
        }, function(){
          var right = '1 又 2/5';
          var opts = strOpts(right, ['2 又 2/5', '1 又 3/5', '2/5', '1 又 1/5']);
          return { M:2, d:5, w:1, r:2, k:7, opts:opts, ans:opts.indexOf(right), fig:linePlan(2, 5, 7) };
        });
      },
      fmt:function(d, lang){
        var en = d.opts.map(function(s){ return s.replace(' 又 ', ' '); });
        return {
          stem: lang === 'zh'

  function drawLine(svg, plan){
    svg.textContent = '';
    svg.appendChild(svgEl('line', {
      x1:plan.axis.x1, y1:plan.axis.y, x2:plan.axis.x2, y2:plan.axis.y,
      stroke:C_AXIS, 'stroke-width':LINE_W
    }));
    plan.ticks.forEach(function(t){
      svg.appendChild(svgEl('line', {
        x1:t.x, y1:t.y1, x2:t.x, y2:t.y2,
        stroke:t.big ? C_AXIS : C_TICK, 'stroke-width':TICK_W
      }));
    });
    plan.dots.forEach(function(p){
      svg.appendChild(svgEl('circle', { cx:p.x, cy:p.y, r:p.r, fill:C_DOT }));
    });
    plan.labels.forEach(function(lb){
      var t = svgEl('text', { x:lb.x, y:lb.y, 'font-size':lb.fs, 'text-anchor':'middle', fill:C_AXIS });
      t.textContent = lb.text;
      svg.appendChild(t);
    });
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = svgEl('svg', { 'class':'nlfig', viewBox:'0 0 ' + q.fig.w + ' ' + q.fig.h });
        drawLine(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
</body>
</html>
