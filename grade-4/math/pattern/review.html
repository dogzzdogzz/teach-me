<!DOCTYPE html>

<head>

<title>複習挑戰 — 規律偵探社</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:16px 20px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .figwrap{margin:0 0 12px;text-align:center;overflow-x:auto}
  .stickfig{width:100%;max-width:360px;height:140px;display:block;margin:0 auto}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;position:sticky;bottom:8px;
  }
  .result{
    margin-top:22px;background:var(--card);border:2px solid var(--green);border-radius:18px;
    padding:20px;display:none;
  }
  .result.on{display:block}
  .result .line{font-size:20px;font-weight:700;color:var(--green)}
  .result .links{margin-top:10px;font-size:16px}
  .result .links a{color:var(--blue)}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:14px;
  }
  footer{
    margin-top:48px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>

<body>
<div class="wrap">

  <header>
    <h1 data-i18n="h1">🔁 複習挑戰：規律偵探社</h1>
    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>

  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>隔一天再來一次，還答得出來，才是真的記住了。</div>

  <div id="quiz" class="quiz"></div>

    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b> <span data-i18n="qRightUnit">題</span></span>
  </div>

  <div class="result" id="result">
    <p class="line" id="resultLine"></p>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     火柴棒圖的座標也在這裡算好（stickPlan），由 fmt() 放進 fig 回傳，
     這樣檢查驗到的就是「頁面真的畫成什麼」，不是設定檔自己會畫成什麼。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null。`tools/simgen.js` 每一批只呼叫 make() 一次、
     **不重試**，所以回 null 就等於「這一支產生器壞了」——拒絕取樣的重試必須
     放在 make() 裡面。300 次都湊不出來才真的算壞掉。 */
  function retry(fn){
    for (var i = 0; i < 300; i++){
      var d = fn();
      if (d) return d;
    }
    return null;
  }

  /* --- 這一課的數字範圍：四年級的數量模式，選項一律 0 ~ 10000 的整數。
         **不用負數**（四年級還沒學），所以遞減的規律要保證問到的那一項還是正的。 --- */
  var VAL_MAX = 10000;
  function inRange(v){
    return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 0 && v <= VAL_MAX;
  }

  /* --- 規律核心。和課程頁同一套定義，全部是整數運算：
           { kind:'up',   first:a, gap:d }          第 n 個 ＝ a ＋ (n － 1) × d
           { kind:'down', first:a, gap:d }          第 n 個 ＝ a － (n － 1) × d
           { kind:'mul',  first:a, ratio:f }        第 n 個 ＝ a × f 的 (n － 1) 次
           { kind:'grow', first:a, gap:d, bump:b }  差自己每次加 b --- */
  function gapList(list){
    var out = [];
    for (var i = 0; i + 1 < list.length; i++) out.push(Math.abs(list[i + 1] - list[i]));
    return out;
  }
  function dirOf(list){
    var up = false, down = false;
    for (var i = 0; i + 1 < list.length; i++){
      if (list[i + 1] > list[i]) up = true;
      else if (list[i + 1] < list[i]) down = true;
    }
    if (up && down) return 'mixed';
    if (up) return 'up';
    if (down) return 'down';
    return 'flat';
  }
  function allSame(arr){
    if (!arr.length) return false;
    for (var i = 1; i < arr.length; i++) if (arr[i] !== arr[0]) return false;
    return true;
  }
  function ratioList(list){
    var out = [];
    for (var i = 0; i + 1 < list.length; i++){
      if (list[i] === 0 || list[i + 1] % list[i] !== 0) return null;
      out.push(list[i + 1] / list[i]);
    }
    return out;
  }
  function kindOf(list){
    if (list.length < 3) return 'other';
    var g = gapList(list), d = dirOf(list);
    if (allSame(g) && g[0] > 0 && d === 'up') return 'up';
    if (allSame(g) && g[0] > 0 && d === 'down') return 'down';
    if (d === 'up'){
      var r = ratioList(list);
      if (r && allSame(r) && r[0] > 1) return 'mul';
      var gg = gapList(g);
      if (gg.length && allSame(gg) && gg[0] > 0) return 'grow';
    }
    return 'other';
  }
  function termAt(p, n){
    if (!(n >= 1) || n !== Math.round(n)) return null;
    var k = n - 1;
    if (p.kind === 'up')   return p.first + k * p.gap;
    if (p.kind === 'down') return p.first - k * p.gap;
    if (p.kind === 'mul')  return p.first * Math.pow(p.ratio, k);
    if (p.kind === 'grow') return p.first + k * p.gap + p.bump * k * (k - 1) / 2;
    return null;
  }
  function firstTerms(p, n){
    var out = [];
    for (var i = 1; i <= n; i++) out.push(termAt(p, i));
    return out;
  }
  function stepsTo(n){ return n - 1; }
  function findIndex(p, v){
    if (p.kind !== 'up' && p.kind !== 'down') return { ok:false, why:'kind' };
    var diff = (p.kind === 'up') ? v - p.first : p.first - v;
    if (diff < 0) return { ok:false, why:(p.kind === 'up') ? 'below' : 'above', diff:diff };
    var quo = Math.floor(diff / p.gap), rem = diff - quo * p.gap;
    if (rem !== 0) return { ok:false, why:'notdiv', diff:diff, quo:quo, rem:rem };
    return { ok:true, index:quo + 1, diff:diff, quo:quo, rem:0 };
  }

  /* --- 英文的單複數與序數。只有 1 會錯，而且名詞改對了動詞還會錯。 --- */
  function plEn(n, w){ return n === 1 ? w : w + 's'; }
  function peopleEn(n){ return n === 1 ? 'person' : 'people'; }
  function ordEn(n){
    var v = n % 100;
    if (v >= 11 && v <= 13) return n + 'th';
    var last = n % 10;
    return n + (last === 1 ? 'st' : last === 2 ? 'nd' : last === 3 ? 'rd' : 'th');
  }

  /* --- 數值選項：正解 ＋ 三個誘答。
         誘答一律「值去重」、必須在範圍內，而且**不可以是題幹印出來的數字**
         （那是把題目抄回來，不是誘答）。候選不夠時保底往外找一個長得像答案的數，
         不生垃圾字串。 --- */
  function numOpts(correct, cands, forbid){
    if (!inRange(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1;
      out.push(v);
    });
    for (var k = 1; out.length < 4 && k <= 400; k++){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1;
        out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }

  /* --- 火柴棒三角形帶的座標。和課程頁同一套規格，只是畫布小一點。
         n 個三角形：點 n＋2 個（偶數在下排、奇數在上排），
         棒子 (i, i+1) 共 n＋1 根 ＋ (i, i+2) 共 n 根 ＝ 2n ＋ 1 根。 --- */
  var FIG_W = 360, FIG_H = 140, FIG_PAD = 16;
  var SQ3H = Math.sqrt(3) / 2;
  function stickPlan(n){
    var side = Math.min((FIG_W - 2 * FIG_PAD) * 2 / (n + 1), (FIG_H - 2 * FIG_PAD) / SQ3H);
    var w = (n + 1) * side / 2, h = side * SQ3H;
    var ox = (FIG_W - w) / 2, oy = (FIG_H - h) / 2;
    var pts = [];
    for (var i = 0; i <= n + 1; i++) pts.push([ox + i * side / 2, oy + (i % 2 === 0 ? h : 0)]);
    var bars = [];
    for (var a = 0; a <= n; a++) bars.push([a, a + 1]);
    for (var b = 0; b + 2 <= n + 1; b++) bars.push([b, b + 2]);
    return { side:side, pts:pts, bars:bars };
  }
  /* 產生器一律用這一支把圖的資料包好 —— 座標是**頁面算的**，
     檢查設定會拿它和獨立重寫的排版比對。 */
  function figOf(n){
    var plan = stickPlan(n);
    return { n:n, side:plan.side, pts:plan.pts, bars:plan.bars };
  }
  /* 火柴棒三角形的規律是被幾何釘死的：第 1 個 3 根，每多一個 2 根。 */
  var STICK = { kind:'up', first:3, gap:2 };

  /* --- 桌子情境。兩種桌形都真的算得出來：
         正方形每邊坐 1 人 → 一張 4 人，拼起來每個接縫少 2 個位子 → 每多一張多 2 人；
         正三角形每邊坐 1 人 → 一張 3 人，同理每多一張多 1 人。 --- */
  var DESKS = [
    { key:'square',   first:4, gap:2 },
    { key:'triangle', first:3, gap:1 }
  ];

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      kindName:{
        up:'每次加一樣多',
        down:'每次減一樣多',
        mul:'每次乘一樣多',
        grow:'加的數自己每次加一樣多'
      },
      listOf: function(l){ return l.join('、'); },
      nth: function(n){ return '第 ' + n + ' 個'; },
      deskName:{ square:'正方形', triangle:'正三角形' }
    },
    en: {
      kindName:{
        up:'it adds the same amount every time',
        down:'it subtracts the same amount every time',
        mul:'it multiplies by the same amount every time',
        grow:'the amount it adds grows by the same amount every time'
      },
      listOf: function(l){ return l.join(', '); },
      nth: function(n){ return 'the ' + ordEn(n) + ' one'; },
      deskName:{ square:'square', triangle:'equilateral triangle' }
    }
  };
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  var GENS = [
    /* 1. 給一串數（差都一樣），問每次加／減多少。 */
    { id:'gapOfRun', cat:'gap',
      make:function(used){
        return retry(function(){
          var kind = pickUnused(['up', 'down'], used);
          var gap = pick(rangeList(2, 25));
          var len = pick([4, 5]);
          var first = (kind === 'up') ? pick(rangeList(2, 60))
                                      : pick(rangeList((len - 1) * gap + 1, (len - 1) * gap + 300));
          var pat = { kind:kind, first:first, gap:gap };
          var list = firstTerms(pat, len);
          for (var i = 0; i < list.length; i++) if (!inRange(list[i])) return null;
          if (kindOf(list) !== kind) return null;
          var opts = numOpts(gap, [gap + 1, gap - 1, gap + 2, gap - 2, 2 * gap], list);
          if (!opts) return null;
          return { kind:kind, first:first, gap:gap, len:len, list:list,
                   opts:opts, ans:opts.indexOf(gap) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], g = gapList(d.list);
        function chain(joiner, minus, eq){
          return g.map(function(v, i){
            var big = Math.max(d.list[i], d.list[i + 1]), small = Math.min(d.list[i], d.list[i + 1]);
            return big + minus + small + eq + v;
          }).join(joiner);
        }
        return {
          stem: lang === 'zh'
            ? '一串數字是 <strong>' + t.listOf(d.list) + '</strong>。每一個差都一樣 —— ' +
              (d.kind === 'up' ? '每次<strong>加</strong>多少？' : '每次<strong>減</strong>多少？')
            : 'A run of numbers goes <strong>' + t.listOf(d.list) + '</strong>. Every gap is the same — how much does it ' +
              (d.kind === 'up' ? '<strong>add</strong>' : '<strong>subtract</strong>') + ' each time?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '相鄰兩個相減（大的減小的）：' + chain('、', ' － ', ' ＝ ') + '。每一個差都是 ' + d.gap +
              '，所以每次' + (d.kind === 'up' ? '加 ' : '減 ') + d.gap + '。'
            : 'Subtract each neighbouring pair (bigger minus smaller): ' + chain(', ', ' − ', ' = ') +
              '. Every gap is ' + d.gap + ', so it ' + (d.kind === 'up' ? 'adds ' : 'subtracts ') + d.gap + ' each time.'
        };
      } },

    /* 2. 給一串數，問是哪一種規律。四個選項就是這一課的四種說法。 */
    { id:'whichKind', cat:'kind',
      make:function(used){
        return retry(function(){
          var kind = pickUnused(['up', 'down', 'mul', 'grow'], used);
          var pat = null, list = null;
          for (var tries = 0; tries < 60; tries++){
            if (kind === 'up')   pat = { kind:'up', first:pick(rangeList(2, 40)), gap:pick(rangeList(3, 20)) };
            else if (kind === 'down'){
              var g1 = pick(rangeList(3, 18));
              pat = { kind:'down', first:pick(rangeList(4 * g1 + 1, 4 * g1 + 200)), gap:g1 };
            }
            else if (kind === 'mul')  pat = { kind:'mul', first:pick(rangeList(1, 5)), ratio:pick([2, 3]) };
            else pat = { kind:'grow', first:pick(rangeList(1, 12)), gap:pick(rangeList(2, 8)), bump:pick(rangeList(1, 4)) };
            var cand = firstTerms(pat, 5);
            var ok = true;
            for (var i = 0; i < cand.length; i++) if (!inRange(cand[i])) ok = false;
            if (ok && kindOf(cand) === kind){ list = cand; break; }
          }
          if (!list) return null;
          var order = shuffle(['up', 'down', 'mul', 'grow']);
          return { key:kind, pat:pat, list:list, opts:order, ans:order.indexOf(kind) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], g = gapList(d.list);
        var gg = gapList(g);
        /* 每一種規律都印出一條**算得出來的**算式，不是只講結論。 */
        var extra = lang === 'zh'
          ? (d.key === 'mul' ? '差不一樣，可是相鄰兩個相除都一樣：' + d.list[1] + ' ÷ ' + d.list[0] + ' ＝ ' + ratioList(d.list)[0] + '。'
             : d.key === 'grow' ? '差不一樣，可是差自己的差都一樣：' + g[1] + ' － ' + g[0] + ' ＝ ' + gg[0] + '。'
             : '每一個差都一樣：' + Math.max(d.list[1], d.list[0]) + ' － ' + Math.min(d.list[1], d.list[0]) + ' ＝ ' + g[0] + '。')
          : (d.key === 'mul' ? 'The gaps differ, but dividing always gives the same: ' + d.list[1] + ' ÷ ' + d.list[0] + ' = ' + ratioList(d.list)[0] + '. '
             : d.key === 'grow' ? 'The gaps differ, but the gaps between the gaps do not: ' + g[1] + ' − ' + g[0] + ' = ' + gg[0] + '. '
             : 'Every gap is the same: ' + Math.max(d.list[1], d.list[0]) + ' − ' + Math.min(d.list[1], d.list[0]) + ' = ' + g[0] + '. ');
        return {
          stem: lang === 'zh'
            ? '一串數字是 <strong>' + t.listOf(d.list) + '</strong>。它是<strong>哪一種規律</strong>？'
            : 'A run of numbers goes <strong>' + t.listOf(d.list) + '</strong>. <strong>Which kind of rule</strong> is it?',
          opts: d.opts.map(function(k){ return cap(t.kindName[k]); }), ans:d.ans,
          why: lang === 'zh'
            ? '先把每一個差算出來：' + t.listOf(g) + '。' + extra + '所以它是<strong>' + t.kindName[d.key] + '</strong>。'
            : 'Work out every gap first: ' + t.listOf(g) + '. ' + extra + 'So the rule is <strong>' + t.kindName[d.key] + '</strong>.'
        };
      } },

    /* 3. 給一串數，問下一個。四種規律都會出，所以孩子一定要先分類。 */
    { id:'nextTerm', cat:'kind',
      make:function(used){
        return retry(function(){
          var kind = pickUnused(['up', 'down', 'mul', 'grow'], used);
          var pat = null, list = null, nxt = null;
          for (var tries = 0; tries < 60; tries++){
            if (kind === 'up')   pat = { kind:'up', first:pick(rangeList(2, 40)), gap:pick(rangeList(3, 20)) };
            else if (kind === 'down'){
              var g1 = pick(rangeList(3, 18));
              pat = { kind:'down', first:pick(rangeList(5 * g1 + 1, 5 * g1 + 200)), gap:g1 };
            }
            else if (kind === 'mul')  pat = { kind:'mul', first:pick(rangeList(1, 5)), ratio:pick([2, 3]) };
            else pat = { kind:'grow', first:pick(rangeList(1, 12)), gap:pick(rangeList(2, 8)), bump:pick(rangeList(1, 4)) };
            var cand = firstTerms(pat, 4), c5 = termAt(pat, 5);
            var ok = inRange(c5);
            for (var i = 0; i < cand.length; i++) if (!inRange(cand[i])) ok = false;
            if (ok && kindOf(cand) === kind && kindOf(cand.concat([c5])) === kind){ list = cand; nxt = c5; break; }
          }
          if (!list) return null;
          var g = gapList(list);
          /* 誘答：照第一個差接下去（最常見的錯）、照最後一個差接下去、正解 ±1。 */
          var byFirst = (kind === 'down') ? list[3] - g[0] : list[3] + g[0];
          var byLast = (kind === 'down') ? list[3] - g[g.length - 1] : list[3] + g[g.length - 1];
          var opts = numOpts(nxt, [byFirst, byLast, nxt + 1, nxt - 1, nxt + g[0], nxt - g[0]], list);
          if (!opts) return null;
          return { key:kind, pat:pat, list:list, next:nxt, opts:opts, ans:opts.indexOf(nxt) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], g = gapList(d.list);
        var lastGap = g[g.length - 1];
        var reason = lang === 'zh'
          ? (d.key === 'mul' ? '相鄰兩個相除都是 ' + d.pat.ratio + '，所以下一個是 ' + d.list[3] + ' × ' + d.pat.ratio + ' ＝ ' + d.next + '。'
             : d.key === 'grow' ? '差是 ' + t.listOf(g) + '，差自己每次加 ' + d.pat.bump + '，所以下一個差是 ' +
                 (lastGap + d.pat.bump) + '：' + d.list[3] + ' ＋ ' + (lastGap + d.pat.bump) + ' ＝ ' + d.next + '。'
             : d.key === 'down' ? '每一個差都是 ' + d.pat.gap + '，所以下一個是 ' + d.list[3] + ' － ' + d.pat.gap + ' ＝ ' + d.next + '。'
             : '每一個差都是 ' + d.pat.gap + '，所以下一個是 ' + d.list[3] + ' ＋ ' + d.pat.gap + ' ＝ ' + d.next + '。')
          : (d.key === 'mul' ? 'Each number divided by the one before always gives ' + d.pat.ratio + ', so next comes ' + d.list[3] + ' × ' + d.pat.ratio + ' = ' + d.next + '.'
             : d.key === 'grow' ? 'The gaps are ' + t.listOf(g) + ' and each gap grows by ' + d.pat.bump + ', so the next gap is ' +
                 (lastGap + d.pat.bump) + ': ' + d.list[3] + ' + ' + (lastGap + d.pat.bump) + ' = ' + d.next + '.'
             : d.key === 'down' ? 'Every gap is ' + d.pat.gap + ', so next comes ' + d.list[3] + ' − ' + d.pat.gap + ' = ' + d.next + '.'
             : 'Every gap is ' + d.pat.gap + ', so next comes ' + d.list[3] + ' + ' + d.pat.gap + ' = ' + d.next + '.');
        return {
          stem: lang === 'zh'
            ? '一串數字是 <strong>' + t.listOf(d.list) + '</strong>。<strong>下一個</strong>是多少？'
            : 'A run of numbers goes <strong>' + t.listOf(d.list) + '</strong>. What comes <strong>next</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: (lang === 'zh' ? '先把每一個差算出來，不要只看第一個。' : 'Work out every gap first, not just the first one. ') + reason
        };
      } },

    /* 4. 給第 1 個與每次加的數，問第 n 個。頭號誘答是「乘 n 不乘 n － 1」。 */
    { id:'nthFromStart', cat:'nth',
      make:function(){
        return retry(function(){
          var first = pick(rangeList(2, 40));
          var gap = pick(rangeList(3, 20));
          var n = pick(rangeList(10, 30));
          var pat = { kind:'up', first:first, gap:gap };
          var val = termAt(pat, n);
          if (!inRange(val)) return null;
          var offByOne = first + n * gap;
          /* ⚠️ 題幹裡有一個字面的 1（「第 1 個是…」），所以 1 也算題幹的數字。 */
          var opts = numOpts(val, [offByOne, val - gap, n * gap, first * n], [1, first, gap, n]);
          if (!opts) return null;
          return { first:first, gap:gap, n:n, val:val, offByOne:offByOne,
                   opts:opts, ans:opts.indexOf(val) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.n);
        return {
          stem: lang === 'zh'
            ? '一個規律的<strong>第 1 個是 ' + d.first + '</strong>，<strong>每次加 ' + d.gap +
              '</strong>。<strong>' + t.nth(d.n) + '</strong>是多少？'
            : 'A pattern has <strong>' + d.first + ' as its 1st one</strong> and <strong>adds ' + d.gap +
              ' every time</strong>. What is <strong>' + t.nth(d.n) + '</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '從第 1 個走到' + t.nth(d.n) + '走了 ' + d.n + ' － 1 ＝ ' + steps + ' 步，不是 ' + d.n +
              ' 步。' + d.first + ' ＋ ' + steps + ' × ' + d.gap + ' ＝ ' + d.val +
              '。（算成 ' + d.first + ' ＋ ' + d.n + ' × ' + d.gap + ' ＝ ' + d.offByOne + ' 就多走了一步。）'
            : 'Going from the 1st one to ' + t.nth(d.n) + ' takes ' + d.n + ' − 1 = ' + steps + ' ' +
              plEn(steps, 'hop') + ', not ' + d.n + '. ' + d.first + ' + ' + steps + ' × ' + d.gap + ' = ' + d.val +
              '. (Working it out as ' + d.first + ' + ' + d.n + ' × ' + d.gap + ' = ' + d.offByOne + ' takes one hop too many.)'
        };
      } },

    /* 5. 只給前四個數，問第 n 個 —— 要先自己找出「每次加多少」。 */
    { id:'nthFromList', cat:'nth',
      make:function(){
        return retry(function(){
          var first = pick(rangeList(2, 30));
          var gap = pick(rangeList(3, 15));
          var n = pick(rangeList(8, 20));
          var pat = { kind:'up', first:first, gap:gap };
          var list = firstTerms(pat, 4), val = termAt(pat, n);
          if (!inRange(val)) return null;
          if (kindOf(list) !== 'up') return null;
          var offByOne = first + n * gap;
          var opts = numOpts(val, [offByOne, val - gap, val + gap, n * gap], list.concat([n]));
          if (!opts) return null;
          return { first:first, gap:gap, n:n, list:list, val:val, offByOne:offByOne,
                   opts:opts, ans:opts.indexOf(val) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.n);
        return {
          stem: lang === 'zh'
            ? '一個規律是 <strong>' + t.listOf(d.list) + '…</strong>。<strong>' + t.nth(d.n) + '</strong>是多少？'
            : 'A pattern goes <strong>' + t.listOf(d.list) + '…</strong>. What is <strong>' + t.nth(d.n) + '</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '每一個差都是 ' + d.gap + '，第 1 個是 ' + d.first + '。走到' + t.nth(d.n) + '要走 ' + d.n +
              ' － 1 ＝ ' + steps + ' 步：' + d.first + ' ＋ ' + steps + ' × ' + d.gap + ' ＝ ' + d.val +
              '。（走 ' + d.n + ' 步會算成 ' + d.first + ' ＋ ' + d.n + ' × ' + d.gap + ' ＝ ' + d.offByOne + '。）'
            : 'Every gap is ' + d.gap + ' and the 1st one is ' + d.first + '. Reaching ' + t.nth(d.n) + ' takes ' + d.n +
              ' − 1 = ' + steps + ' ' + plEn(steps, 'hop') + ': ' + d.first + ' + ' + steps + ' × ' + d.gap + ' = ' + d.val +
              '. (Taking ' + d.n + ' ' + plEn(d.n, 'hop') + ' would give ' + d.first + ' + ' + d.n + ' × ' + d.gap + ' = ' + d.offByOne + '.)'
        };
      } },

    /* 6. 反過來問：某個數是第幾個。頭號誘答是「忘記 ＋ 1」（也就是商本身）。 */
    { id:'whichIndex', cat:'index',
      make:function(){
        return retry(function(){
          var first = pick(rangeList(2, 30));
          var gap = pick(rangeList(3, 15));
          var idx = pick(rangeList(8, 25));
          var pat = { kind:'up', first:first, gap:gap };
          var list = firstTerms(pat, 4), v = termAt(pat, idx);
          if (!inRange(v)) return null;
          var f = findIndex(pat, v);
          if (!f.ok || f.index !== idx) return null;
          /* 「忘記 ＋ 1」那個誘答是這一題存在的理由 —— 它撞到題幹印出來的數字時，
             numOpts 會把它濾掉，於是那個誘答靜靜消失。寧可重抽。 */
          if (list.indexOf(f.quo) >= 0 || f.quo === v) return null;
          var opts = numOpts(idx, [f.quo, idx + 1, idx + 2, idx - 2], list.concat([v]));
          if (!opts) return null;
          return { first:first, gap:gap, idx:idx, v:v, quo:f.quo, diff:f.diff, list:list,
                   opts:opts, ans:opts.indexOf(idx) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個規律是 <strong>' + t.listOf(d.list) + '…</strong>。<strong>' + d.v + '</strong> 是第幾個？'
            : 'A pattern goes <strong>' + t.listOf(d.list) + '…</strong>. Which position does <strong>' + d.v + '</strong> sit in?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? d.v + ' 比第 1 個 ' + d.first + ' 多了 ' + d.diff + '；每一步走 ' + d.gap + '，' + d.diff +
              ' ÷ ' + d.gap + ' ＝ ' + d.quo + '，剛好除得盡，走了 ' + d.quo + ' 步。走了 ' + d.quo +
              ' 步就是第 ' + d.quo + ' ＋ 1 ＝ ' + d.idx + ' 個 —— 忘記 ＋ 1 就會答成 ' + d.quo + '。'
            : d.v + ' is ' + d.diff + ' above the 1st one (' + d.first + '); each hop covers ' + d.gap + ', and ' + d.diff +
              ' ÷ ' + d.gap + ' = ' + d.quo + ' divides exactly, so it took ' + d.quo + ' ' + plEn(d.quo, 'hop') +
              '. ' + d.quo + ' ' + plEn(d.quo, 'hop') + ' lands on position ' + d.quo + ' + 1 = ' + d.idx +
              ' — if you forget that + 1 you answer ' + d.quo + ' instead.'
        };
      } },

    /* 7. 四個數裡面，哪一個真的在這個規律裡。剩下三個都除不盡（或比第 1 個小）。 */
    { id:'inPattern', cat:'index',
      make:function(){
        return retry(function(){
          var first = pick(rangeList(2, 20));
          var gap = pick(rangeList(4, 9));
          var idx = pick(rangeList(9, 22));
          var pat = { kind:'up', first:first, gap:gap };
          var list = firstTerms(pat, 4);
          var hit = termAt(pat, idx);
          if (!inRange(hit)) return null;
          if (list.indexOf(hit) >= 0) return null;                 // 正解不可以是題幹印出來的那幾個
          /* 三個誘答：兩個「除不盡」（就在正解附近，所以不能用大小猜），
             一個「比第 1 個小」。 */
          var offs = shuffle(rangeList(1, gap - 1));
          var miss = [hit + offs[0], hit - offs[offs.length > 1 ? 1 : 0]];
          var below = first - pick(rangeList(1, first - 1));
          var all = [hit, miss[0], miss[1], below];
          var stemNums = list.concat([gap]);
          for (var i = 0; i < all.length; i++){
            if (!inRange(all[i])) return null;
            if (i > 0 && findIndex(pat, all[i]).ok) return null;   // 誘答絕不可以也在規律裡
            if (i > 0 && stemNums.indexOf(all[i]) >= 0) return null; // 也不可以是題幹印出來的數字
          }
          var uniq = {};
          for (var j = 0; j < all.length; j++){
            if (uniq[String(all[j])]) return null;
            uniq[String(all[j])] = 1;
          }
          var order = shuffle(all);
          return { first:first, gap:gap, idx:idx, hit:hit, list:list,
                   opts:order, ans:order.indexOf(hit) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.idx);
        return {
          stem: lang === 'zh'
            ? '一個規律是 <strong>' + t.listOf(d.list) + '…</strong>（每次加 ' + d.gap +
              '）。下面哪一個數<strong>在</strong>這個規律裡？'
            : 'A pattern goes <strong>' + t.listOf(d.list) + '…</strong> (adding ' + d.gap +
              ' every time). Which of these numbers <strong>is in</strong> it?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '每一個都先減掉第 1 個 ' + d.first + ' 再除以 ' + d.gap + '：只有 ' + d.hit + ' 除得盡（' +
              d.hit + ' － ' + d.first + ' ＝ ' + (d.hit - d.first) + '，' + (d.hit - d.first) + ' ÷ ' + d.gap +
              ' ＝ ' + steps + '），所以它是第 ' + d.idx + ' 個。其餘三個除不盡或比第 1 個還小，都不在。'
            : 'Subtract the 1st one (' + d.first + ') from each and divide by ' + d.gap + ': only ' + d.hit +
              ' divides exactly (' + d.hit + ' − ' + d.first + ' = ' + (d.hit - d.first) + ', and ' +
              (d.hit - d.first) + ' ÷ ' + d.gap + ' = ' + steps + '), so it sits at position ' + d.idx +
              '. The other three either leave a remainder or fall below the 1st one.'
        };
      } },

    /* 8. 純步數題：從第 a 個走到第 b 個走幾步。這一題只考「幾個和幾步差 1」。 */
    { id:'hopsBetween', cat:'steps',
      make:function(){
        return retry(function(){
          var a = pick(rangeList(1, 9));
          var b = a + pick(rangeList(3, 20));
          var steps = b - a;
          var opts = numOpts(steps, [steps + 1, steps - 1, steps + 2, steps - 2], [a, b]);
          if (!opts) return null;
          return { a:a, b:b, steps:steps, opts:opts, ans:opts.indexOf(steps) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個規律排成一列。從<strong>' + t.nth(d.a) + '</strong>走到<strong>' + t.nth(d.b) +
              '</strong>，一共走了幾步？'
            : 'A pattern is laid out in a row. How many hops does it take to get from <strong>' + t.nth(d.a) +
              '</strong> to <strong>' + t.nth(d.b) + '</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '兩個位置之間的步數是兩個序號相減：' + d.b + ' － ' + d.a + ' ＝ ' + d.steps +
              ' 步。<strong>站的個數和走的步數永遠差 1</strong> —— 這一段一共站了 ' + (d.steps + 1) + ' 個位置。'
            : 'The hops between two positions is one position number minus the other: ' + d.b + ' − ' + d.a + ' = ' +
              d.steps + ' ' + plEn(d.steps, 'hop') + '. <strong>The count of stops and the count of hops always differ by 1</strong> — this stretch covers ' +
              (d.steps + 1) + ' positions.'
        };
      } },

    /* 9. 火柴棒三角形（有圖）。圖上畫 nFig 個，問第 nAsk 個要幾根。
          ⚠️ 圖裡的棒子數量必須剛好等於 termAt(STICK, nFig) —— 設定檔會比。 */
    { id:'stickCount', cat:'figure',
      make:function(){
        return retry(function(){
          var nFig = pick(rangeList(1, 5));
          var nAsk = pick(rangeList(8, 30));
          var val = termAt(STICK, nAsk);
          if (!inRange(val)) return null;
          var figBars = termAt(STICK, nFig);
          /* 誘答：把「每個都分開排」算成 3 × nAsk（頭號迷思）、多走一步、少走一步。 */
          var opts = numOpts(val, [STICK.first * nAsk, val + STICK.gap, val - STICK.gap, val - 1],
            [1, nFig, nAsk, figBars, STICK.first, STICK.gap]);
          if (!opts) return null;
          return { nFig:nFig, nAsk:nAsk, val:val, figBars:figBars,
                   opts:opts, ans:opts.indexOf(val), fig:figOf(nFig) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.nAsk);
        return {
          stem: lang === 'zh'
            ? '火柴棒排三角形，一個接一個（圖上是 ' + d.nFig + ' 個，用了 ' + d.figBars +
              ' 根）。第 1 個要 3 根，之後每多一個只多 2 根。<strong>' + t.nth(d.nAsk) + '</strong>要幾根？'
            : 'Matchstick triangles joined one after another (the figure shows ' + d.nFig + ', built from ' + d.figBars +
              ' ' + plEn(d.figBars, 'stick') + '). The 1st one needs 3 sticks, and each extra one adds only 2. How many sticks does <strong>' +
              t.nth(d.nAsk) + '</strong> take?',
          opts: d.opts.map(String), ans:d.ans,
          fig: d.fig,
          why: lang === 'zh'
            ? '走到' + t.nth(d.nAsk) + '要走 ' + d.nAsk + ' － 1 ＝ ' + steps + ' 步，每步 2 根：3 ＋ ' +
              steps + ' × 2 ＝ ' + d.val + ' 根。（算成 3 × ' + d.nAsk + ' ＝ ' + (STICK.first * d.nAsk) +
              ' 是錯的 —— 相鄰的三角形共用一根。）'
            : 'Reaching ' + t.nth(d.nAsk) + ' takes ' + d.nAsk + ' − 1 = ' + steps + ' ' + plEn(steps, 'hop') +
              ' of 2 sticks each: 3 + ' + steps + ' × 2 = ' + d.val + ' ' + plEn(d.val, 'stick') +
              '. (Working it out as 3 × ' + d.nAsk + ' = ' + (STICK.first * d.nAsk) +
              ' is wrong — neighbouring triangles share a stick.)'
        };
      } },

    /* 10. 桌子拼成一長排，問 n 張坐幾人。頭號迷思是「一張的人數 × 張數」。 */
    { id:'seatCount', cat:'table',
      make:function(used){
        return retry(function(){
          var desk = DESKS[pickUnused([0, 1], used)];
          var n = pick(rangeList(8, 25));
          var pat = { kind:'up', first:desk.first, gap:desk.gap };
          var val = termAt(pat, n);
          if (!inRange(val)) return null;
          var opts = numOpts(val, [desk.first * n, val + desk.gap, val - desk.gap, val + 1],
            [1, n, desk.first, desk.gap]);
          if (!opts) return null;
          return { deskKey:desk.key, first:desk.first, gap:desk.gap, n:n, val:val,
                   opts:opts, ans:opts.indexOf(val) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.n);
        return {
          stem: lang === 'zh'
            ? t.deskName[d.deskKey] + '的小桌，每邊坐 1 個人。桌子拼成一長排，相接的那兩邊坐不了人：1 張坐 ' +
              d.first + ' 人，之後每多一張只多 ' + d.gap + ' 人。<strong>' + d.n + ' 張</strong>桌子可以坐幾人？'
            : 'Small ' + t.deskName[d.deskKey] + ' tables, one person on each side. Pushed into one long row the two touching sides cannot be used: 1 table seats ' +
              d.first + ', and each extra table adds only ' + d.gap + '. How many people do <strong>' + d.n +
              ' ' + plEn(d.n, 'table') + '</strong> seat?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '第 1 張坐 ' + d.first + ' 人，之後走了 ' + d.n + ' － 1 ＝ ' + steps + ' 步，每步 ' + d.gap +
              ' 人：' + d.first + ' ＋ ' + steps + ' × ' + d.gap + ' ＝ ' + d.val + ' 人。（算成 ' + d.first +
              ' × ' + d.n + ' ＝ ' + (d.first * d.n) + ' 是錯的 —— 那只有桌子分開擺才成立。）'
            : 'The 1st table seats ' + d.first + ', then ' + d.n + ' − 1 = ' + steps + ' ' + plEn(steps, 'hop') +
              ' of ' + d.gap + ' each: ' + d.first + ' + ' + steps + ' × ' + d.gap + ' = ' + d.val + ' ' + peopleEn(d.val) +
              '. (Working it out as ' + d.first + ' × ' + d.n + ' = ' + (d.first * d.n) +
              ' is wrong — that only holds when the tables stand apart.)'
        };
      } },

    /* 11. 遞減規律的第 n 個。反著造，保證答案還是 0 以上（四年級不用負數）。 */
    { id:'downNth', cat:'nth',
      make:function(){
        return retry(function(){
          var gap = pick(rangeList(3, 15));
          var n = pick(rangeList(6, 16));
          var val = pick(rangeList(1, 60));
          var first = val + (n - 1) * gap;
          if (!inRange(first)) return null;
          var pat = { kind:'down', first:first, gap:gap };
          var list = firstTerms(pat, 4);
          for (var i = 0; i < list.length; i++) if (!inRange(list[i])) return null;
          if (kindOf(list) !== 'down') return null;
          if (termAt(pat, n) !== val) return null;
          var offByOne = first - n * gap;       // 可能是負的 —— numOpts 會擋掉
          var opts = numOpts(val, [offByOne, val + gap, val - gap, val + 1],
            list.concat([n, gap]));
          if (!opts) return null;
          return { first:first, gap:gap, n:n, val:val, list:list,
                   opts:opts, ans:opts.indexOf(val) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.n);
        return {
          stem: lang === 'zh'
            ? '一個規律是 <strong>' + t.listOf(d.list) + '…</strong>，<strong>每次減 ' + d.gap +
              '</strong>。<strong>' + t.nth(d.n) + '</strong>是多少？'
            : 'A pattern goes <strong>' + t.listOf(d.list) + '…</strong> and <strong>subtracts ' + d.gap +
              ' every time</strong>. What is <strong>' + t.nth(d.n) + '</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '越走越小，所以用減。走到' + t.nth(d.n) + '要走 ' + d.n + ' － 1 ＝ ' + steps + ' 步：' +
              d.first + ' － ' + steps + ' × ' + d.gap + ' ＝ ' + d.first + ' － ' + (steps * d.gap) +
              ' ＝ ' + d.val + '。'
            : 'It falls, so subtract. Reaching ' + t.nth(d.n) + ' takes ' + d.n + ' − 1 = ' + steps + ' ' +
              plEn(steps, 'hop') + ': ' + d.first + ' − ' + steps + ' × ' + d.gap + ' = ' + d.first + ' − ' +
              (steps * d.gap) + ' = ' + d.val + '.'
        };
      } },

    /* 12. 給第 1 個和第 k 個，回頭求「每次加多少」。
           頭號誘答是「除以 k」而不是「除以 k － 1」。 */
    { id:'gapFromTwo', cat:'gap',
      make:function(){
        return retry(function(){
          var first = pick(rangeList(2, 30));
          var gap = pick(rangeList(3, 15));
          var k = pick(rangeList(4, 9));
          var last = first + (k - 1) * gap;
          if (!inRange(last)) return null;
          var total = last - first;
          var byK = Math.floor(total / k);       // 除以 k 的錯算法，永遠比 gap 小
          var remK = total - byK * k;
          var opts = numOpts(gap, [byK, gap + 1, gap - 1, gap + 2], [1, first, last, k, total]);
          if (!opts) return null;
          return { first:first, gap:gap, k:k, last:last, total:total, byK:byK, remK:remK,
                   opts:opts, ans:opts.indexOf(gap) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], steps = stepsTo(d.k);
        return {
          stem: lang === 'zh'
            ? '一個「每次加一樣多」的規律，<strong>第 1 個是 ' + d.first + '</strong>，<strong>' +
              t.nth(d.k) + '是 ' + d.last + '</strong>。每次加多少？'
            : 'A pattern adds the same amount every time. Its <strong>1st one is ' + d.first +
              '</strong> and <strong>' + t.nth(d.k) + ' is ' + d.last + '</strong>. How much does it add each time?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '第 1 個到' + t.nth(d.k) + '走了 ' + d.k + ' － 1 ＝ ' + steps + ' 步，一共多了 ' + d.last +
              ' － ' + d.first + ' ＝ ' + d.total + '。所以每一步是 ' + d.total + ' ÷ ' + steps + ' ＝ ' + d.gap +
              '。（除成 ' + d.total + ' ÷ ' + d.k + ' ＝ ' + d.byK + ' 餘 ' + d.remK + ' 是錯的，因為走的是 ' + steps + ' 步不是 ' + d.k + ' 步。）'
            : 'From the 1st one to ' + t.nth(d.k) + ' is ' + d.k + ' − 1 = ' + steps + ' ' + plEn(steps, 'hop') +
              ', covering ' + d.last + ' − ' + d.first + ' = ' + d.total + ' in total. So each hop is ' + d.total +
              ' ÷ ' + steps + ' = ' + d.gap + '. (Dividing ' + d.total + ' ÷ ' + d.k + ' = ' + d.byK + ' r ' + d.remK +
              ' is wrong, because there are ' + steps + ' ' + plEn(steps, 'hop') + ', not ' + d.k + '.)'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 規律偵探社', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：規律偵探社',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>隔一天再來一次，還答得出來，才是真的記住了。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Pattern Detectives', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Pattern Detectives',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>Come back a day later and still get them — that is real remembering.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM。座標直接用 fig 裡**產生器算好的**那一份，
         不在這裡重算，不然畫出來的和檢查驗過的會是兩回事。 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var C_STICK = '#E8871E', C_DOT = '#2F9E69';

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function drawFig(svg, fig){
    svg.textContent = '';
    fig.bars.forEach(function(b){
      var a = fig.pts[b[0]], c = fig.pts[b[1]];
      svg.appendChild(svgEl('line', {
        x1:a[0], y1:a[1], x2:c[0], y2:c[1],
        stroke:C_STICK, 'stroke-width':5, 'stroke-linecap':'round'
      }));
    });
    fig.pts.forEach(function(p){
      svg.appendChild(svgEl('circle', { cx:p[0], cy:p[1], r:3.5, fill:C_DOT }));
    });
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'stickfig');
        svg.setAttribute('viewBox', '0 0 360 140');
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
