<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖的座標也在這裡定案（distFig／widthFig／relFig／crossFig 回傳每一條線、每一個
     直角記號、每一個點的畫布座標），由 fmt() 放進 fig 回傳，
     這樣檢查驗到的就是「頁面真的畫成什麼」。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* ⚠️ make() 一律不可以回 null。tools/simgen.js 每一批只呼叫 make() 一次、
     **不重試**，所以拒絕取樣的重試必須放在 make() 裡面。 */
  /* ⚠️ make() 一律不可以回 null（也不可以丟例外）：tools/simgen.js 每一批只呼叫 make()
     一次、**不重試**，回 null 之後檢查會直接 dereference null 而當掉 —— 當掉不是「抓到」。
     每一次迴圈都重新抽一組參數，所以連續 400 次被拒絕的機率極低，可是「極低」不是「不會」，
     所以每一支有拒絕取樣的產生器都要給一組**寫死的合法參數**當保底。 */
  function retry(fn, fallback){
    for (var i = 0; i < 400; i++){
      var d = fn();
      if (d) return d;
    }
    return fallback ? fallback() : null;
  }

  /* --- 方格紙與座標：定義和上課頁完全一致。 --- */
  var FIG_W = 460, FIG_H = 300;
  var GW = 20, GH = 13, U = 22, OX = 10, OY = 293;
  var MARK_S = 0.55, DOT_R = 6, DOT_R_S = 5;
  /* 這一課的數值範圍：長度 1 ~ 40 公分；角度 1 ~ 180 度；平行的組數 0 ~ 4。 */
  var LEN_MAX = 40, DEG_MAX = 180;
  function inLen(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 1 && v <= LEN_MAX; }
  function inDeg(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 1 && v <= DEG_MAX; }
  function inPairs(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 0 && v <= 4; }

  function add(p, q){ return [p[0] + q[0], p[1] + q[1]]; }
  function sub(p, q){ return [p[0] - q[0], p[1] - q[1]]; }
  function scale(v, k){ return [v[0] * k, v[1] * k]; }
  function dot(u, v){ return u[0] * v[0] + u[1] * v[1]; }
  function norm(v){ return Math.sqrt(dot(v, v)); }
  function unit(v){ var L = norm(v); return [v[0] / L, v[1] / L]; }
  function perp(v){ return [-v[1], v[0]]; }
  function segLen(a, b){ return norm(sub(b, a)); }
  function P(g){ return { x:OX + g[0] * U, y:OY - g[1] * U }; }

  function clipLine(A, D){
    var lo = -Infinity, hi = Infinity, i, a, d, m, t0, t1, sw;
    for (i = 0; i < 2; i++){
      a = A[i]; d = D[i]; m = (i === 0) ? GW : GH;
      if (d === 0){
        if (a < 0 || a > m) return null;
        continue;
      }
      t0 = (0 - a) / d; t1 = (m - a) / d;
      if (t0 > t1){ sw = t0; t0 = t1; t1 = sw; }
      if (t0 > lo) lo = t0;
      if (t1 < hi) hi = t1;
    }
    if (!(lo < hi)) return null;
    return [add(A, scale(D, lo)), add(A, scale(D, hi))];
  }
  function rightMark(X, u, v){
    var a = add(X, scale(u, MARK_S));
    return [P(a), P(add(a, scale(v, MARK_S))), P(add(X, scale(v, MARK_S)))];
  }
  function emptyPlan(){ return { w:FIG_W, h:FIG_H, lines:[], marks:[], dots:[] }; }

  /* --- 畢氏三數 [垂直的距離, 往旁邊挪幾格, 斜的那一條有多長]。
         三個數都是整數，所以畫面上報出來的每一個長度孩子都對得出來。 --- */
  var TRIPLES_H = [[3, 4, 5], [4, 3, 5], [6, 8, 10], [8, 6, 10]];   // 橫的直線：往旁邊挪 ≤ 9 格
  var TRIPLES_V = [[4, 3, 5], [8, 6, 10]];                          // 直的直線：上下只有 13 格

  /* 一組「點到直線」的擺法：直線是橫的還是直的、點在哪一邊、三條線段的端點與長度。 */
  function distData(cs){
    var horiz = (cs.axis === 'h');
    var A = horiz ? [0, cs.at] : [cs.at, 0];
    var D = horiz ? [1, 0] : [0, 1];
    var d = horiz ? Math.abs(cs.pt[1] - cs.at) : Math.abs(cs.pt[0] - cs.at);
    var segs = cs.offs.map(function(o){
      var f = horiz ? [cs.pt[0] + o, cs.at] : [cs.at, cs.pt[1] + o];
      return { off:o, foot:f, len:segLen(cs.pt, f), isPerp:(o === 0) };
    });
    return { A:A, D:D, dist:d, segs:segs, perpIdx:cs.offs.indexOf(0), horiz:horiz };
  }
  function distFig(cs){
    var dd = distData(cs);
    var out = emptyPlan();
    var base = clipLine(dd.A, dd.D);
    if (!base) return null;
    out.lines.push({ a:P(base[0]), b:P(base[1]), kind:'base' });
    dd.segs.forEach(function(s){
      out.lines.push({ a:P(cs.pt), b:P(s.foot), kind:s.isPerp ? 'perp' : 'slant' });
    });
    var e = unit(dd.D);
    var n = unit(sub(cs.pt, dd.segs[dd.perpIdx].foot));
    out.marks.push(rightMark(dd.segs[dd.perpIdx].foot, e, n));
    out.marks.push(rightMark(dd.segs[dd.perpIdx].foot, scale(e, -1), n));
    dd.segs.forEach(function(s){ out.dots.push({ p:P(s.foot), kind:s.isPerp ? 'foot' : 'small' }); });
    out.dots.push({ p:P(cs.pt), kind:'point' });
    return out;
  }
  /* 抽一組「點到直線」的擺法。放不進方格紙就回 null（呼叫端用 retry 再抽）。 */
  function makeDistCase(){
    var horiz = rand(2) === 0;
    var tri = horiz ? pick(TRIPLES_H) : pick(TRIPLES_V);
    var d = tri[0], off = tri[1], slant = tri[2];
    var sign = rand(2) === 0 ? 1 : -1;
    var at, pt;
    if (horiz){
      at = (sign > 0) ? 1 + rand(GH - d - 1) : d + 1 + rand(GH - d - 1);
      pt = [off + rand(GW - 2 * off + 1), at + sign * d];
    } else {
      at = (sign > 0) ? 1 + rand(GW - d - 1) : d + 1 + rand(GW - d - 1);
      pt = [at + sign * d, off + rand(GH - 2 * off + 1)];
    }
    if (pt[0] < 0 || pt[0] > GW || pt[1] < 0 || pt[1] > GH) return null;
    if (at < 1 || (horiz ? at > GH - 1 : at > GW - 1)) return null;
    var cs = { axis:horiz ? 'h' : 'v', at:at, pt:pt, offs:[-off, 0, off] };
    var dd = distData(cs);
    /* 每一條線段的端點都要落在方格紙裡面，長度也要對得上畢氏三數。 */
    var inside = dd.segs.every(function(s){
      return s.foot[0] >= 0 && s.foot[0] <= GW && s.foot[1] >= 0 && s.foot[1] <= GH;
    });
    if (!inside || dd.dist !== d) return null;
    if (Math.abs(dd.segs[0].len - slant) > 1e-9 || Math.abs(dd.segs[2].len - slant) > 1e-9) return null;
    if (!distFig(cs)) return null;
    return { cs:cs, d:d, off:off, slant:slant };
  }

  /* --- 兩條平行線之間：兩次垂直量、一次斜著量（也是畢氏三數）。 --- */
  function widthData(cs){
    var horiz = (cs.axis === 'h');
    var gap = Math.abs(cs.b - cs.a);
    var segs = cs.perpAt.map(function(t){
      var p1 = horiz ? [t, cs.a] : [cs.a, t];
      var p2 = horiz ? [t, cs.b] : [cs.b, t];
      return { a:p1, b:p2, len:segLen(p1, p2), isPerp:true };
    });
    segs.push({ a:cs.slant[0], b:cs.slant[1], len:segLen(cs.slant[0], cs.slant[1]), isPerp:false });
    return { gap:gap, segs:segs, horiz:horiz };
  }
  function widthFig(cs){
    var wd = widthData(cs);
    var out = emptyPlan();
    var D = wd.horiz ? [1, 0] : [0, 1];
    var bad = false;
    [cs.a, cs.b].forEach(function(t){
      var A = wd.horiz ? [0, t] : [t, 0];
      var seg = clipLine(A, D);
      if (!seg){ bad = true; return; }
      out.lines.push({ a:P(seg[0]), b:P(seg[1]), kind:'base' });
    });
    if (bad) return null;
    wd.segs.forEach(function(s){
      out.lines.push({ a:P(s.a), b:P(s.b), kind:s.isPerp ? 'perp' : 'slant' });
    });
    var e = unit(D), n = unit(sub(wd.segs[0].b, wd.segs[0].a));
    wd.segs.forEach(function(s){
      if (!s.isPerp) return;
      out.marks.push(rightMark(s.a, e, n));
      out.marks.push(rightMark(s.b, e, scale(n, -1)));
    });
    wd.segs.forEach(function(s){
      out.dots.push({ p:P(s.a), kind:'small' });
      out.dots.push({ p:P(s.b), kind:'small' });
    });
    return out;
  }
  function makeWidthCase(){
    var horiz = rand(2) === 0;
    var tri = horiz ? pick(TRIPLES_H) : pick(TRIPLES_V);
    var gap = tri[0], run = tri[1], slant = tri[2];
    var span = horiz ? GH : GW, other = horiz ? GW : GH;
    if (span - gap - 1 < 1) return null;
    var a = 1 + rand(span - gap - 1);
    var b = a + gap;
    if (b > span - 1) return null;
    /* 兩次垂直量的位置中間至少隔 3 格；斜的那一段從第一個位置往前挪 run 格。 */
    var room = other - run - 1;
    if (room < 5) return null;
    var t1 = 1 + rand(room - 4);
    var t2 = t1 + 3 + rand(other - 1 - t1 - 3 + 1);
    if (t2 > other - 1 || t2 <= t1) return null;
    var s0 = horiz ? [t1, a] : [a, t1];
    var s1 = horiz ? [t1 + run, b] : [b, t1 + run];
    if (s1[0] > GW || s1[1] > GH) return null;
    var cs = { axis:horiz ? 'h' : 'v', a:a, b:b, perpAt:[t1, t2], slant:[s0, s1] };
    var wd = widthData(cs);
    if (wd.gap !== gap) return null;
    if (Math.abs(wd.segs[2].len - slant) > 1e-9) return null;
    if (Math.abs(wd.segs[0].len - gap) > 1e-9 || Math.abs(wd.segs[1].len - gap) > 1e-9) return null;
    if (!widthFig(cs)) return null;
    return { cs:cs, gap:gap, run:run, slant:slant };
  }

  /* --- 甲、乙 對 丙 的垂直關係（整數方向 → 內積剛好是 0）。 --- */
  var REL_DIRS = [[2, 1], [3, 1], [1, 2], [3, 2], [1, 3]];
  function relData(cs){
    var aPerp = dot(cs.aDir, cs.cDir) === 0;
    var bPerp = dot(cs.bDir, cs.cDir) === 0;
    var cross = cs.aDir[0] * cs.bDir[1] - cs.aDir[1] * cs.bDir[0];
    var abPerp = dot(cs.aDir, cs.bDir) === 0;
    return { aPerp:aPerp, bPerp:bPerp, parallel:(cross === 0), abPerp:abPerp, bothPerp:(aPerp && bPerp) };
  }
  function relFig(cs){
    var rd = relData(cs);
    var out = emptyPlan();
    var base = clipLine(cs.cAt, cs.cDir);
    var la = clipLine(cs.aAt, cs.aDir), lb = clipLine(cs.bAt, cs.bDir);
    if (!base || !la || !lb) return null;
    out.lines.push({ a:P(base[0]), b:P(base[1]), kind:'base' });
    out.lines.push({ a:P(la[0]), b:P(la[1]), kind:'drawn' });
    out.lines.push({ a:P(lb[0]), b:P(lb[1]), kind:'perp' });
    var e = unit(cs.cDir);
    if (rd.aPerp) out.marks.push(rightMark(cs.aAt, e, unit(cs.aDir)));
    if (rd.bPerp) out.marks.push(rightMark(cs.bAt, e, unit(cs.bDir)));
    out.dots.push({ p:P(cs.aAt), kind:'small' });
    out.dots.push({ p:P(cs.bAt), kind:'small' });
    return out;
  }
  function makeRelCase(both){
    var cDir = pick(REL_DIRS);
    var cAt = [1 + rand(3), 1 + rand(3)];
    var k1 = 1 + rand(3), k2 = k1 + 2 + rand(3);
    var aAt = add(cAt, scale(cDir, k1)), bAt = add(cAt, scale(cDir, k2));
    if (aAt[0] > GW - 1 || aAt[1] > GH - 1 || bAt[0] > GW - 1 || bAt[1] > GH - 1) return null;
    var aDir = perp(cDir);
    var bDir = both ? perp(cDir) : [aDir[0] - cDir[0], aDir[1] - cDir[1]];
    var cs = { cAt:cAt, cDir:cDir, aAt:aAt, aDir:aDir, bAt:bAt, bDir:bDir };
    var rd = relData(cs);
    if (both !== rd.bothPerp) return null;
    if (both !== rd.parallel) return null;      // 兩條都垂直 ⇔ 互相平行
    if (rd.abPerp) return null;                 // 「甲和乙互相垂直」那個誘答一定要是假的
    if (!relFig(cs)) return null;
    return { cs:cs, both:both, rd:rd };
  }

  /* --- 方格紙上兩條直線：垂直、平行、還是都不是。 --- */
  function crossFig(cs){
    var out = emptyPlan();
    var la = clipLine(cs.aAt, cs.aDir), lb = clipLine(cs.bAt, cs.bDir);
    if (!la || !lb) return null;
    out.lines.push({ a:P(la[0]), b:P(la[1]), kind:'drawn' });
    out.lines.push({ a:P(lb[0]), b:P(lb[1]), kind:'perp' });
    return out;
  }
  function makeCrossCase(kind){
    var aDir = pick(REL_DIRS);
    var bDir;
    if (kind === 'perp') bDir = perp(aDir);
    else if (kind === 'para') bDir = aDir;
    else bDir = pick(REL_DIRS);
    var aAt = [2 + rand(6), 2 + rand(5)];
    var bAt = (kind === 'para') ? add(aAt, scale(perp(aDir), 1 + rand(2))) : [aAt[0] + 1 + rand(4), aAt[1] + 1 + rand(4)];
    if (bAt[0] < 0 || bAt[0] > GW || bAt[1] < 0 || bAt[1] > GH) return null;
    var isPerp = dot(aDir, bDir) === 0;
    var isPara = (aDir[0] * bDir[1] - aDir[1] * bDir[0]) === 0;
    if (kind === 'perp' && !(isPerp && !isPara)) return null;
    if (kind === 'para' && !(isPara && !isPerp)) return null;
    if (kind === 'none' && (isPerp || isPara)) return null;
    /* ⚠️ 會相交的那兩種（垂直、都不是），交點一定要落在方格紙**裡面**：
       交點在畫面外的話，「交叉的地方是不是直角」和「它們會相交」孩子都看不出來，
       而解釋卻在講那件事。 */
    if (!isPara){
      var den = aDir[0] * bDir[1] - aDir[1] * bDir[0];
      var tt = ((bAt[0] - aAt[0]) * bDir[1] - (bAt[1] - aAt[1]) * bDir[0]) / den;
      var X = [aAt[0] + tt * aDir[0], aAt[1] + tt * aDir[1]];
      if (X[0] < 1 || X[0] > GW - 1 || X[1] < 1 || X[1] > GH - 1) return null;
    }
    var cs = { aAt:aAt, aDir:aDir, bAt:bAt, bDir:bDir };
    if (!crossFig(cs)) return null;
    return { cs:cs, kind:kind, isPerp:isPerp, isPara:isPara };
  }

  /* --- 選項：整數去重、範圍檢查，打散之後正解落在哪一個位置由 ans 記著。 --- */
  function numOpts(correct, cands, okFn){
    var out = [correct], seen = {};
    seen[correct] = true;
    function addOpt(v){
      if (out.length >= 4 || seen[v] || !okFn(v)) return;
      seen[v] = true; out.push(v);
    }
    cands.forEach(addOpt);
    for (var k = 1; out.length < 4 && k <= 40; k++){ addOpt(correct + k); addOpt(correct - k); }
    return out.length === 4 ? shuffle(out) : null;
  }
  function keyOpts(correct, keys){
    if (keys.indexOf(correct) < 0 || keys.length !== 4) return null;
    var seen = {}, i;
    for (i = 0; i < keys.length; i++){
      if (seen[keys[i]]) return null;
      seen[keys[i]] = true;
    }
    return shuffle(keys);
  }

  /* 10~80 度，去掉 45（那會讓正解和誘答撞在一起）。 */
  var SPLIT_POOL = (function(){ var out = [], v; for (v = 10; v <= 80; v++) if (v !== 45) out.push(v); return out; })();
  /* 三條平行線：先把「相加和相減都算得出、而且互不相同」的 (a, b) 組合列出來。 */
  var THREE_POOL = (function(){
    var out = [], a, b;
    for (a = 6; a <= 14; a++) for (b = 2; b < a; b++){
      if (a - b === a || a - b === b || a + b === a || a + b === b) continue;

      out.push([a, b]);
    }
    return out;
  })();

          var opts = numOpts(correct, [other, a, b], inLen);

          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
</body>
</html>
