<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖形只回傳「三個邊長平方 ＋ 轉幾度」，真正畫圖的程式在 GENS 後面。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }

  /* --- 分類核心。和課程頁同一套規則：三角形用**三個邊長的平方**表示，
         全部是整數，所以兩件事都判得完全精確：
           哪幾邊一樣長 ⟺ 平方相等；
           最大的角是銳角／直角／鈍角 ⟺ 兩個小的平方和 － 最大的平方 的正負號。
         （正三角形和等腰直角三角形的邊長都帶根號，所以不能用整數座標當標準寫法。） --- */
  function sortSq(t){ return t.slice().sort(function(a, b){ return a - b; }); }
  function triValid(t){
    if (!t || t.length !== 3) return false;
    for (var i = 0; i < 3; i++) if (!(t[i] > 0) || !isFinite(t[i])) return false;
    var p = t[0], q = t[1], r = t[2];
    return 2 * (p * q + q * r + r * p) - (p * p + q * q + r * r) > 0;
  }
  function sideClass(t){
    var s = sortSq(t);
    if (s[0] === s[1] && s[1] === s[2]) return 'equi';
    if (s[0] === s[1] || s[1] === s[2]) return 'iso';
    return 'scalene';
  }
  function angleClass(t){
    var s = sortSq(t), d = s[0] + s[1] - s[2];
    return d > 0 ? 'acute' : (d === 0 ? 'right' : 'obtuse');
  }
  /* 依邊的家族：正三角形也是等腰三角形。反過來不成立。
     bothNames 靠它把「依邊換成比較鬆的名字」那一格擋在誘答之外 —— 那一格也是對的。 */
  var SIDE_PARENTS = { equi:['iso'], iso:[], scalene:[] };
  function sideAlso(k){ return (SIDE_PARENTS[k] || []).slice(); }
  /* 一個三角形裡有幾個銳角：直角和鈍角合起來最多只有一個。 */
  function acuteCount(t){ return angleClass(t) === 'acute' ? 3 : 2; }
  /* 幾條邊一樣長（0 表示三條都不一樣）。 */
  function equalSides(t){
    var s = sortSq(t);
    if (s[0] === s[1] && s[1] === s[2]) return 3;
    if (s[0] === s[1] || s[1] === s[2]) return 2;
    return 0;
  }
  /* 邊長（公分）轉成平方。給「題幹報邊長」的那幾支產生器用。 */
  function sqOf(cm){ return cm.map(function(v){ return v * v; }); }

  /* 九宮格：哪些「依角 × 依邊」組合畫得出來。
     兩個畫不出來的都在正三角形那一欄，理由同一個：
     正三角形三個角一樣大，而直角和鈍角合起來最多只有一個。 */
  var ANGLE_KEYS = ['acute', 'right', 'obtuse'];
  var SIDE_KEYS = ['scalene', 'iso', 'equi'];
  function cellPossible(ak, sk){ return !(sk === 'equi' && ak !== 'acute'); }
  var CELLS_OK = [], CELLS_NO = [];
  ANGLE_KEYS.forEach(function(ak){
    SIDE_KEYS.forEach(function(sk){
      (cellPossible(ak, sk) ? CELLS_OK : CELLS_NO).push(ak + '-' + sk);
    });
  });

  /* --- 排版：純資料，所以放在 GENS 前面 —— simgen 切得到，檢查才驗得到
         「頁面真的畫成什麼」，而不是「設定檔自己會畫成什麼」。
         pts[2] 永遠是最大角所在的頂點；邊的順序是 pts0→pts1 最長、
         pts1→pts2 最短、pts2→pts0 中間。 --- */
  var FW = 360, FH = 170, FPAD = 20, MK = 11, TK = 8, ARC = 24, T_TICK = 0.5;
  function layout(sq, rot){
    var s = sortSq(sq), p = s[0], q = s[1], r = s[2];
    var c = Math.sqrt(r);
    var x = (q + r - p) / (2 * c);
    /* y 取負號，頂點朝上（和課程頁同一套）。 */
    var y = Math.sqrt(Math.max(q - x * x, 0));
    var pts = [[0, 0], [c, 0], [x, -y]];
    var gx = (pts[0][0] + pts[1][0] + pts[2][0]) / 3;
    var gy = (pts[0][1] + pts[1][1] + pts[2][1]) / 3;
    var a = (rot || 0) * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    pts = pts.map(function(v){
      var dx = v[0] - gx, dy = v[1] - gy;
      return [dx * ca - dy * sa, dx * sa + dy * ca];
    });
    var xs = pts.map(function(v){ return v[0]; }), ys = pts.map(function(v){ return v[1]; });
    var bw = Math.max.apply(null, xs) - Math.min.apply(null, xs);
    var bh = Math.max.apply(null, ys) - Math.min.apply(null, ys);
    var k = Math.min((FW - 2 * FPAD) / bw, (FH - 2 * FPAD) / bh);
    pts = pts.map(function(v){ return [v[0] * k, v[1] * k]; });
    xs = pts.map(function(v){ return v[0]; }); ys = pts.map(function(v){ return v[1]; });
    var ox = (FW - (Math.max.apply(null, xs) - Math.min.apply(null, xs))) / 2 - Math.min.apply(null, xs);
    var oy = (FH - (Math.max.apply(null, ys) - Math.min.apply(null, ys))) / 2 - Math.min.apply(null, ys);
    return pts.map(function(v){ return [v[0] + ox, v[1] + oy]; });
  }
  function tickPlan(sq){
    var s = sortSq(sq);
    var edgeSq = [s[2], s[0], s[1]];
    var groups = [], out = [0, 0, 0];
    edgeSq.forEach(function(v){ if (groups.indexOf(v) < 0) groups.push(v); });
    groups.sort(function(a, b){ return a - b; });
    groups.forEach(function(v, gi){
      if (edgeSq.filter(function(e){ return e === v; }).length < 2) return;
      edgeSq.forEach(function(e, ei){ if (e === v) out[ei] = gi + 1; });
    });
    return out;
  }
  /* 產生器一律用這一支把圖的資料包好 —— 座標是**頁面算的**，
     檢查設定會拿它和獨立重寫的排版比對。 */
  function figOf(sq, rot){
    return { sq:sq, rot:rot, pts:layout(sq, rot), ticks:tickPlan(sq) };
  }

  /* --- 圖形樣本：七種組合各一個代表（和課程頁同一份）。 --- */
  var FIG_SQ = {
    'acute-scalene':  [16, 25, 36],
    'acute-iso':      [25, 25, 36],
    'acute-equi':     [36, 36, 36],
    'right-scalene':  [9, 16, 25],
    'right-iso':      [16, 16, 32],
    'obtuse-scalene': [16, 25, 64],
    'obtuse-iso':     [25, 25, 64]
  };
  var ROTS = [0, 12, 25, 38, 52, 67, 84, 100, 130, 165, 205, 250, 295, 330];

  /* --- 度數樣本。三個角都是整數，而且加起來 180 —— 可是這一課
         **不教**「加起來 180」，只拿它們來比誰最大。 --- */
  function makeAngles(kind){
    var a, b, c;
    if (kind === 'right'){
      a = pick(rangeList(20, 70));
      return [90, a, 90 - a];
    }
    if (kind === 'obtuse'){
      a = pick([95, 100, 105, 110, 115, 120, 125, 130, 135, 140]);
      b = pick(rangeList(15, 180 - a - 15));
      return [a, b, 180 - a - b];
    }
    /* 銳角：三個角都要嚴格小於 90，而且不小於 45 才好讀。 */
    a = pick(rangeList(45, 85));
    b = pick(rangeList(Math.max(45, 95 - a), Math.min(85, 135 - a)));
    c = 180 - a - b;
    return [a, b, c];
  }
  function angleClassOfDegs(d){
    var mx = Math.max(d[0], d[1], d[2]);
    return mx > 90 ? 'obtuse' : (mx === 90 ? 'right' : 'acute');
  }

  /* --- 邊長樣本（整公分）。要圍得成三角形，而且**不可以是直角**——
         因為「直角三角形」是這幾支的固定誘答，它必須真的是錯的。 --- */
  function makeCm(kind){
    var a, b, c, t;
    for (var i = 0; i < 200; i++){
      if (kind === 'equi'){
        a = pick(rangeList(4, 14));
        t = [a, a, a];
      } else if (kind === 'iso'){
        a = pick(rangeList(4, 14));
        b = pick(rangeList(2, Math.min(15, 2 * a - 2)));
        if (b === a) continue;
        t = [a, a, b];
      } else {
        a = pick(rangeList(3, 12));
        b = pick(rangeList(a + 1, 15));
        c = pick(rangeList(b + 1, Math.min(16, a + b - 1)));
        if (c <= b) continue;
        t = [a, b, c];
      }
      var sq = sqOf(t);
      if (!triValid(sq)) continue;
      if (sideClass(sq) !== kind) continue;
      if (angleClass(sq) === 'right') continue;   // 誘答「直角三角形」必須是錯的
      return t;
    }
    return null;
  }

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      ang:{ acute:'銳角三角形', right:'直角三角形', obtuse:'鈍角三角形' },
      side:{ equi:'正三角形', iso:'等腰三角形', scalene:'不等邊三角形' },
      angWord:{ acute:'銳角', right:'直角', obtuse:'鈍角' },
      noIdea:'沒辦法判斷，要知道邊長才行',
      deg: function(n){ return n + ' 度'; },
      degList: function(l){ return l.map(function(n){ return n + ' 度'; }).join('、'); },
      cmList: function(l){ return l.map(function(n){ return n + ' 公分'; }).join('、'); },
      pair: function(a, s){ return '依角是' + a + '，依邊是' + s; },
      cell: function(a, s){ return a.replace('三角形', '') + '的' + s; },
      sure:'一定是', maybe:'不一定', never:'一定不是', nosuch:'沒有這種三角形',
      still: function(n){ return '還是' + n; },
      changed:'不是了，角的大小變了',
      dependsTurn:'要看轉幾度',
      onlyRight:'只有轉 90 度的倍數才還是',
      cnt: function(n){ return n + ' 個'; }
    },
    en: {
      ang:{ acute:'an acute triangle', right:'a right triangle', obtuse:'an obtuse triangle' },
      side:{ equi:'an equilateral triangle', iso:'an isosceles triangle', scalene:'a scalene triangle' },
      angWord:{ acute:'acute', right:'a right angle', obtuse:'obtuse' },
      noIdea:'No way to tell — you would need the side lengths',
      deg: function(n){ return n + ' degrees'; },
      degList: function(l){ return l.join(' degrees, ') + ' degrees'; },
      cmList: function(l){ return l.join(' cm, ') + ' cm'; },
      pair: function(a, s){ return 'by angles ' + a + ', by sides ' + s; },
      cell: function(a, s){ return a.replace(/^an? /, '') + ' and ' + s.replace(/^an? /, ''); },
      sure:'Yes, always', maybe:'Not necessarily', never:'No, never', nosuch:'There is no such triangle',
      still: function(n){ return 'Yes, still ' + n; },
      changed:'No — the angles changed size',
      dependsTurn:'It depends how far you turn it',
      onlyRight:'Only if you turn it by a multiple of 90 degrees',
      cnt: function(n){ return String(n); }
    }
  };
  /* 句首大寫：只把第一個字母變大寫，不可以把 'an acute' 整個換成 'A acute'。 */
  function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  var GENS = [
    /* 1. 給三個角的度數，依角分類。誘答「沒辦法判斷」永遠是錯的 —— 角決定了名字。 */
    { id:'byDegrees', cat:'angle',
      make:function(used){
        var kind = pickUnused(ANGLE_KEYS.slice(), used);
        var degs = makeAngles(kind);
        if (!degs || angleClassOfDegs(degs) !== kind) return null;
        for (var i = 0; i < 3; i++) if (!(degs[i] > 0)) return null;
        var order = shuffle(['acute', 'right', 'obtuse', 'noIdea']);
        return { degs:degs, key:kind, opts:order, ans:order.indexOf(kind) };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var mx = Math.max(d.degs[0], d.degs[1], d.degs[2]);
        return {
          stem: lang === 'zh'
            ? '一個三角形的三個角是 ' + t.degList(d.degs) + '。<strong>依角</strong>分類，它叫什麼？'
            : 'A triangle’s three angles are ' + t.degList(d.degs) + '. <strong>By angles</strong>, what is it called?',
          opts: d.opts.map(function(k){ return k === 'noIdea' ? t.noIdea : cap(t.ang[k]); }),
          ans: d.ans,
          why: lang === 'zh'
            ? '名字只看<strong>最大的那一個角</strong>：這裡最大的是 ' + mx + ' 度，' +
              (d.key === 'acute' ? '比直角小，而且三個角都比直角小，所以是銳角三角形。'
               : d.key === 'right' ? '剛好是直角，所以是直角三角形。'
               : '比直角大，所以是鈍角三角形。') +
              '這一題把三個角都給你了，所以不必再看邊長。'
            : 'The name depends only on <strong>the biggest angle</strong>: here it is ' + mx + ' degrees, ' +
              (d.key === 'acute' ? 'smaller than a right angle — and so are the other two, so it is an acute triangle. '
               : d.key === 'right' ? 'exactly a right angle, so it is a right triangle. '
               : 'bigger than a right angle, so it is an obtuse triangle. ') +
              'This question already gives you all three angles, so there is no need to look at the sides.'
        };
      } },

    /* 2. 只給最大的角，一樣分得出來。 */
    { id:'biggestOnly', cat:'angle',
      make:function(){
        var kind = pick(ANGLE_KEYS);
        var deg = kind === 'right' ? 90
                : kind === 'acute' ? pick(rangeList(62, 89))
                : pick(rangeList(91, 155));
        var order = shuffle(['acute', 'right', 'obtuse', 'noIdea']);
        return { deg:deg, key:kind, opts:order, ans:order.indexOf(kind) };
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh'
            ? '一個三角形<strong>最大的角</strong>是 ' + t.deg(d.deg) + '。<strong>依角</strong>分類，它叫什麼？'
            : 'The <strong>biggest angle</strong> of a triangle is ' + t.deg(d.deg) + '. <strong>By angles</strong>, what is it called?',
          opts: d.opts.map(function(k){ return k === 'noIdea' ? t.noIdea : cap(t.ang[k]); }),
          ans: d.ans,
          why: lang === 'zh'
            ? d.deg + ' 度' + (d.key === 'acute' ? '比 90 度小 —— 最大的角都比直角小了，另外兩個當然也是，三個角都是銳角。'
                              : d.key === 'right' ? '剛好是直角。'

    /* 3. 給三條邊長，依邊分類。誘答「直角三角形」是**依角**的名字，

    { id:'sidesName', cat:'side',

               : d.key === 'iso' ? '，剛好兩條，所以是等腰三角形。三條沒有都一樣長，所以不是正三角形。'

    { id:'figAngle', cat:'angle',
      make:function(){

    /* 7. 正三角形依角是什麼。這一課的核心結論，單獨考一次。 */
    { id:'equiAngle', cat:'family',
      make:function(){

      } },

    /* 8. 家族：哪一句話是對的。四個選項都是句子，只有一句成立。

    { id:'alsoIs', cat:'family',

                : 'Isosceles only requires <strong>at least two</strong> equal sides, and the third may differ, so it <strong>need not</strong> be equilateral. It could be acute, right or obtuse, and it is never scalene (scalene means no two sides equal).')
        };

        };
      } }
  ];

      h1:'🔁 複習挑戰：三角形家族',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>隔一天再來一次，還答得出來，才是真的記住了。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Triangle Family', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Triangle Family',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>Come back a day later and still get them — that is real remembering.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM，GENS 只回傳「三個平方邊長 ＋ 轉幾度」 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var C_FILL = '#E3F4EB', C_EDGE = '#2F9E69', C_MARK = '#E8871E';

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function unit(u){
    var n = Math.sqrt(u[0] * u[0] + u[1] * u[1]);
    return n === 0 ? [0, 0] : [u[0] / n, u[1] / n];
  }
  /* ⚠️ 座標和短撇都直接用 fig 裡**產生器算好的**那一份 —— 不在這裡重算，
     不然畫出來的和檢查驗過的會是兩回事。 */
  function drawFig(svg, fig){
    svg.textContent = '';
    var pts = fig.pts;
    svg.appendChild(svgEl('polygon', {
      points:pts.map(function(p){ return p[0] + ',' + p[1]; }).join(' '),
      fill:C_FILL, stroke:C_EDGE, 'stroke-width':3, 'stroke-linejoin':'round'
    }));
    fig.ticks.forEach(function(g, ei){
      if (!g) return;
      var a = pts[ei], b = pts[(ei + 1) % 3];
      var ux = b[0] - a[0], uy = b[1] - a[1], u = unit([ux, uy]);
      var cx = a[0] + ux * T_TICK, cy = a[1] + uy * T_TICK;
      var px = -u[1] * (TK / 2), py = u[0] * (TK / 2);
      for (var i = 0; i < g; i++){
        var off = (i - (g - 1) / 2) * 5;
        svg.appendChild(svgEl('line', {
          x1:cx + u[0] * off - px, y1:cy + u[1] * off - py,
          x2:cx + u[0] * off + px, y2:cy + u[1] * off + py,
          stroke:C_MARK, 'stroke-width':2
        }));
      }
    });
    var v = pts[2];
    var a1 = unit([pts[0][0] - v[0], pts[0][1] - v[1]]);
    var a2 = unit([pts[1][0] - v[0], pts[1][1] - v[1]]);
    if (angleClass(fig.sq) === 'right'){
      svg.appendChild(svgEl('path', {
        d:'M ' + (v[0] + a1[0] * MK) + ' ' + (v[1] + a1[1] * MK) +
          ' L ' + (v[0] + a1[0] * MK + a2[0] * MK) + ' ' + (v[1] + a1[1] * MK + a2[1] * MK) +
          ' L ' + (v[0] + a2[0] * MK) + ' ' + (v[1] + a2[1] * MK),
        fill:'none', stroke:C_MARK, 'stroke-width':2.5
      }));
    } else {
      var cr = a1[0] * a2[1] - a1[1] * a2[0];
      svg.appendChild(svgEl('path', {
        d:'M ' + (v[0] + a1[0] * ARC) + ' ' + (v[1] + a1[1] * ARC) +
          ' A ' + ARC + ' ' + ARC + ' 0 0 ' + (cr > 0 ? 1 : 0) + ' ' +
          (v[0] + a2[0] * ARC) + ' ' + (v[1] + a2[1] * ARC),
        fill:'none', stroke:C_MARK, 'stroke-width':2.5
      }));
    }
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 40; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'shapefig');
        svg.setAttribute('viewBox', '0 0 360 170');
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
