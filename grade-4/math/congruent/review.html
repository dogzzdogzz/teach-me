<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:16px 20px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .figwrap{margin:0 0 4px;text-align:center;overflow-x:auto}
  .gridfig{width:100%;max-width:460px;height:300px;display:block;margin:0 auto}
  .figcap{margin:0 0 12px;font-size:13px;color:var(--muted);text-align:center}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;position:sticky;bottom:8px;
  }
  .result{
    margin-top:22px;background:var(--card);border:2px solid var(--green);border-radius:18px;
    padding:20px;display:none;
  }
  .result.on{display:block}
  .result .line{font-size:20px;font-weight:700;color:var(--green)}
  .result .links{margin-top:10px;font-size:16px}
  .result .links a{color:var(--blue)}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:14px;
  }
  footer{
    margin-top:48px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>

<body>
<div class="wrap">

  </header>

  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾幾題「面積鋪磚廠」「四邊形家族」「三角形家族」的題型。</div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖的座標也在這裡定案（pairFig／corrFig／whichFig 回傳一張**展示清單**），
     由 fmt() 放進 fig 回傳，這樣檢查驗到的就是「頁面真的畫成什麼」。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* ⚠️ make() 一律不可以回 null。tools/simgen.js 每一批只呼叫 make() 一次、
     **不重試**，所以拒絕取樣的重試必須放在 make() 裡面。 */
  function retry(fn){
    for (var i = 0; i < 300; i++){
      var d = fn();
      if (d) return d;
    }
    return null;
  }

  /* --- 這一課的數值範圍：邊長 1 ~ 40 公分、角度 1 ~ 179、面積與周長不超過 200。 --- */
  var LEN_MIN = 1, LEN_MAX = 40, DEG_MIN = 1, DEG_MAX = 179, BIG_MAX = 200;
  function inLen(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= LEN_MIN && v <= LEN_MAX; }
  function inDeg(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= DEG_MIN && v <= DEG_MAX; }
  function inBig(v){ return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 1 && v <= BIG_MAX; }

  /* --- 方格紙與八種擺法：定義和上課頁完全一致。 --- */
  var FIG_W = 460, FIG_H = 300;
  var CELL = 28, COLS = 16, ROWS = 10;
  var GX0 = (FIG_W - COLS * CELL) / 2, GY0 = (FIG_H - ROWS * CELL) / 2;
  var LABEL_R = 15, LABEL_FONT = 14, DOT_R = 3.5, LINE_W = 2.5;
  var PAIR_LEFT_X = 1, PAIR_Y = 2, PAIR_RIGHT_END = 15;
  var SCALE_K = 2;
  function px(gx){ return GX0 + gx * CELL; }
  function py(gy){ return GY0 + (ROWS - gy) * CELL; }

  var MATS = [
    { id:'r0',   m:[1, 0, 0, 1],   kind:'same' },
    { id:'r90',  m:[0, -1, 1, 0],  kind:'turn' },
    { id:'r180', m:[-1, 0, 0, -1], kind:'turn' },
    { id:'r270', m:[0, 1, -1, 0],  kind:'turn' },
    { id:'fx',   m:[-1, 0, 0, 1],  kind:'flip' },
    { id:'fy',   m:[1, 0, 0, -1],  kind:'flip' },
    { id:'fd',   m:[0, 1, 1, 0],   kind:'flip' },
    { id:'fa',   m:[0, -1, -1, 0], kind:'flip' }
  ];
  function applyMat(m, p){ return [m[0] * p[0] + m[1] * p[1], m[2] * p[0] + m[3] * p[1]]; }
  function mapPts(P, m){ return P.map(function(p){ return applyMat(m, p); }); }
  function translate(P, dx, dy){ return P.map(function(p){ return [p[0] + dx, p[1] + dy]; }); }
  function bbox(P){
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    P.forEach(function(p){
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
    });
    return { minX:minX, maxX:maxX, minY:minY, maxY:maxY, w:maxX - minX, h:maxY - minY };
  }
  function anchor(P){ var b = bbox(P); return translate(P, -b.minX, -b.minY); }
  function samePt(p, q){ return p[0] === q[0] && p[1] === q[1]; }
  function sameCycle(A, B){
    var n = A.length, s, i, okF, okR;
    if (B.length !== n) return false;
    for (s = 0; s < n; s++){
      okF = true; okR = true;
      for (i = 0; i < n; i++){
        if (!samePt(A[i], B[(s + i) % n])) okF = false;
        if (!samePt(A[i], B[((s - i) % n + n) % n])) okR = false;
        if (!okF && !okR) break;
      }
      if (okF || okR) return true;
    }
    return false;
  }
  function findMoves(A, B){
    var out = [], AB = anchor(B);
    MATS.forEach(function(t, i){ if (sameCycle(anchor(mapPts(A, t.m)), AB)) out.push(i); });
    return out;
  }
  function relation(A, B){
    var ms = findMoves(A, B);
    if (!ms.length) return 'none';
    if (ms.indexOf(0) >= 0) return 'same';
    if (ms.some(function(i){ return MATS[i].kind === 'turn'; })) return 'turn';
    return 'flip';
  }
  function isCongruent(A, B){ return relation(A, B) !== 'none'; }
  function scaleP(P, k){ return P.map(function(p){ return [p[0] * k, p[1] * k]; }); }
  function scaleFactor(A, B){
    for (var k = 2; k <= 3; k++) if (findMoves(scaleP(A, k), B).length) return k;
    return null;
  }
  function shoelace2(P){
    var s = 0, n = P.length;
    for (var i = 0; i < n; i++){ var p = P[i], q = P[(i + 1) % n]; s += p[0] * q[1] - q[0] * p[1]; }
    return s;
  }
  function areaCells(P){ return Math.abs(shoelace2(P)) / 2; }
  function edgeLen(P, i, j){
    var p = P[i], q = P[j];
    if (p[0] === q[0]) return Math.abs(q[1] - p[1]);
    if (p[1] === q[1]) return Math.abs(q[0] - p[0]);
    return null;
  }
  function cornerVecs(P, i){
    var n = P.length, v = P[i], a = P[(i + n - 1) % n], b = P[(i + 1) % n];
    return { u:[a[0] - v[0], a[1] - v[1]], w:[b[0] - v[0], b[1] - v[1]] };
  }
  function isRight(P, i){
    var c = cornerVecs(P, i);
    return c.u[0] * c.w[0] + c.u[1] * c.w[1] === 0;
  }
  function isReflex(P, i){
    var c = cornerVecs(P, i);
    var left = -(c.u[0] * c.w[1] - c.u[1] * c.w[0]);
    return shoelace2(P) > 0 ? left < 0 : left > 0;
  }

  /* --- 圖形庫：和上課頁同一份。出題用的圖形都沒有對稱（設定檔會驗）。 --- */
  var SHAPES = [
    { id:'L4',   pts:[[0, 0], [2, 0], [2, 1], [1, 1], [1, 3], [0, 3]],
                 alt:[[0, 0], [3, 0], [3, 1], [2, 1], [2, 2], [1, 2], [1, 1], [0, 1]] },
    { id:'P5',   pts:[[0, 0], [2, 0], [2, 2], [1, 2], [1, 3], [0, 3]],
                 alt:[[0, 0], [2, 0], [2, 1], [1, 1], [1, 4], [0, 4]] },
    { id:'T34',  pts:[[0, 0], [4, 0], [0, 3]],
                 alt:[[0, 0], [6, 0], [0, 2]] },
    { id:'TRAP', pts:[[0, 0], [3, 0], [2, 2], [0, 2]],
                 alt:[[0, 0], [4, 0], [1, 2], [0, 2]] },
    { id:'Q2',   pts:[[0, 0], [4, 0], [3, 1], [0, 2]],
                 alt:[[0, 0], [4, 0], [4, 1], [0, 2]] },
    { id:'DART', pts:[[0, 0], [4, 0], [4, 3], [2, 1]],
                 alt:[[0, 0], [4, 0], [4, 3], [3, 1]] }
  ];
  function shapeById(id){
    for (var i = 0; i < SHAPES.length; i++) if (SHAPES[i].id === id) return SHAPES[i];
    return null;
  }
  /* 四個頂點的圖形（對應題用字母 A~D／E~H，剛好四個）。 */
  var QUAD_IDS = ['TRAP', 'Q2', 'DART'];
  function rect(w, h){ return [[0, 0], [w, 0], [w, h], [0, h]]; }

  /* --- 字母：從最上面（一樣高就最左邊）那一個頂點開始，畫面上順時針。 --- */
  var LABELS_A = ['A', 'B', 'C', 'D'], LABELS_B = ['E', 'F', 'G', 'H'];
  function labelOrder(P){
    var n = P.length, start = 0, i, out = [];
    for (i = 1; i < n; i++){
      if (P[i][1] > P[start][1] || (P[i][1] === P[start][1] && P[i][0] < P[start][0])) start = i;
    }
    var ccw = shoelace2(P) > 0;
    for (i = 0; i < n; i++) out.push(ccw ? ((start - i) % n + n) % n : (start + i) % n);
    return out;
  }
  function labelOf(P, labels, i){ return labels[labelOrder(P).indexOf(i)]; }
  function edgeName(P, labels, i, j){
    var order = labelOrder(P), oi = order.indexOf(i), oj = order.indexOf(j), n = P.length;
    if (Math.min(oi, oj) === 0 && Math.max(oi, oj) === n - 1) return labels[0] + labels[n - 1];
    return labels[Math.min(oi, oj)] + labels[Math.max(oi, oj)];
  }
  function labelPos(P, i){
    var c = cornerVecs(P, i);
    var lu = Math.sqrt(c.u[0] * c.u[0] + c.u[1] * c.u[1]), lw = Math.sqrt(c.w[0] * c.w[0] + c.w[1] * c.w[1]);
    var bx = c.u[0] / lu + c.w[0] / lw, by = c.u[1] / lu + c.w[1] / lw;
    var sgn = isReflex(P, i) ? 1 : -1;
    var lb = Math.sqrt(bx * bx + by * by);
    return { x:px(P[i][0]) + LABEL_R * sgn * bx / lb, y:py(P[i][1]) - LABEL_R * sgn * by / lb };
  }

  /* --- 展示清單：polys（每一個是畫布座標的多邊形＋色調）、labels、dots。
         色調：a ＝ 橘、b ＝ 藍、c ＝ 綠、d ＝ 紫、e ＝ 紅。 --- */
  function toPx(P){ return P.map(function(p){ return { x:px(p[0]), y:py(p[1]) }; }); }
  function pairLayout(A, B){
    var bB = bbox(B);
    return { A:translate(anchor(A), PAIR_LEFT_X, PAIR_Y), B:translate(anchor(B), PAIR_RIGHT_END - bB.w, PAIR_Y) };
  }
  function pairFig(A, B){
    var lay = pairLayout(A, B);
    return { kind:'pair', w:FIG_W, h:FIG_H, gridA:lay.A, gridB:lay.B,
             polys:[{ pts:toPx(lay.A), tone:'a' }, { pts:toPx(lay.B), tone:'b' }], labels:[], dots:[] };
  }
  /* 對應題的圖：右邊是左邊用 mat 那一種擺法搬過去的，頂點 i 對應頂點 i。 */
  function corrLayout(shape, mat){
    var base = anchor(shapeById(shape).pts);
    var A = translate(base, PAIR_LEFT_X, PAIR_Y);
    var img = anchor(mapPts(base, MATS[mat].m));
    var B = translate(img, PAIR_RIGHT_END - bbox(img).w, PAIR_Y);
    return { A:A, B:B };
  }
  function corrFig(shape, mat){
    var lay = corrLayout(shape, mat), labels = [], dots = [];
    lay.A.forEach(function(p, i){
      var la = labelPos(lay.A, i), lb = labelPos(lay.B, i);
      labels.push({ x:la.x, y:la.y, t:labelOf(lay.A, LABELS_A, i) });
      labels.push({ x:lb.x, y:lb.y, t:labelOf(lay.B, LABELS_B, i) });
      dots.push({ x:px(p[0]), y:py(p[1]), r:DOT_R });
      dots.push({ x:px(lay.B[i][0]), y:py(lay.B[i][1]), r:DOT_R });
    });
    return { kind:'corr', w:FIG_W, h:FIG_H, gridA:lay.A, gridB:lay.B,
             polys:[{ pts:toPx(lay.A), tone:'a' }, { pts:toPx(lay.B), tone:'b' }], labels:labels, dots:dots };
  }
  /* 「哪一個全等」的圖：目標（藍）在左邊 6 格寬的區域，四個候選各占右邊的一個 5 × 5 象限，
     依序是左上、右上、左下、右下，色調 c／d／e／a。候選的外框最多 4 × 4 才放得進去。 */
  var WHICH_TONES = ['c', 'd', 'e', 'a'];
  var WHICH_CELLS = [[6, 5], [11, 5], [6, 0], [11, 0]];    // 每一個象限的左下角
  var WHICH_Q = 5, WHICH_TARGET_W = 6;
  function fitsQuadrant(P){ var b = bbox(P); return b.w <= WHICH_Q - 1 && b.h <= WHICH_Q - 1; }
  function whichFig(target, cands){
    var T = anchor(target), bT = bbox(T);
    var tPts = translate(T, Math.floor((WHICH_TARGET_W - bT.w) / 2), Math.floor((ROWS - bT.h) / 2));
    var polys = [{ pts:toPx(tPts), tone:'b' }], grids = [tPts];
    cands.forEach(function(C, i){
      var Q = anchor(C), b = bbox(Q), at = WHICH_CELLS[i];
      var pts = translate(Q, at[0] + Math.floor((WHICH_Q - b.w) / 2), at[1] + Math.floor((WHICH_Q - b.h) / 2));
      polys.push({ pts:toPx(pts), tone:WHICH_TONES[i] });
      grids.push(pts);
    });
    return { kind:'which', w:FIG_W, h:FIG_H, grids:grids, polys:polys, labels:[], dots:[] };
  }

  /* --- 英文的單複數。只有 1 會出錯。 --- */
  function plEn(n, w){ return n === 1 ? w : w + 's'; }

  /* --- 整數選項：正解 ＋ 三個誘答，值去重、都要在範圍裡、不可以是題幹印出來的數字。 --- */
  function numOpts(correct, cands, forbid, okFn){
    if (!okFn(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!okFn(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1; out.push(v);
    });
    for (var k = 1; out.length < 4 && k <= 60; k++){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!okFn(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1; out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      pairKindOpt:{ congSlide:'全等 —— 只要平移就完全重合', congTurnFlip:'全等 —— 要轉或翻才會完全重合',
                    notScale:'不全等 —— 形狀一樣，可是放大了', notShape:'不全等 —— 形狀不一樣' },
      moveOpt:{ slide:'只要平移（直直搬過去）', turn:'要旋轉（轉方向再搬過去）', flip:'要翻轉（翻過來再搬過去）', scale:'放大（變大了）' },
      colorName:{ c:'綠色的', d:'紫色的', e:'紅色的', a:'橘色的' },
      rectStatement:{ areaSameNotCong:'面積一樣，可是不全等', areaSameSoCong:'面積一樣，所以全等',
                      areaDiffNotCong:'面積不一樣，所以不全等', congBothRect:'全等，因為都是長方形' },
      changeOpt:{ congKeep:'全等 —— 形狀和大小都沒變', notScale:'不全等 —— 形狀一樣，可是大小變了',
                  notShape:'不全等 —— 形狀變了', notPlace:'不全等 —— 位置變了就不全等' },
      actionText:{
        slide:function(k){ return '往右平移 ' + k + ' 格'; },
        turn:function(deg){ return '旋轉 ' + deg + '°'; },
        flip:function(){ return '翻過來（左右翻轉）'; },
        scale:function(k){ return '放大 ' + k + ' 倍（每一條邊都變成 ' + k + ' 倍長，形狀不變）'; }
      },
      cm:function(n){ return n + ' 公分'; },
      sqcm:function(n){ return n + ' 平方公分'; },
      deg:function(n){ return n + '°'; },
      sidesPerim:function(n, p){ return n + ' 條邊、' + p + ' 公分'; },
      capPair:'📐 左邊橘色、右邊藍色，都畫在同一張方格紙上',
      capCorr:'📐 兩個圖形全等；字母是頂點的名字',
      capWhich:'📐 左邊藍色是目標；右邊四個候選的顏色不一樣'
    },
    en: {
      pairKindOpt:{ congSlide:'Congruent — a slide alone makes them fit exactly', congTurnFlip:'Congruent — it takes a turn or a flip to fit exactly',
                    notScale:'Not congruent — the same shape, but enlarged', notShape:'Not congruent — a different shape' },
      moveOpt:{ slide:'a slide only (moved straight across)', turn:'a turn (rotated, then moved)', flip:'a flip (turned over, then moved)', scale:'an enlargement (made bigger)' },
      colorName:{ c:'the green one', d:'the purple one', e:'the red one', a:'the orange one' },
      rectStatement:{ areaSameNotCong:'The same area, but not congruent', areaSameSoCong:'The same area, so congruent',
                      areaDiffNotCong:'Different areas, so not congruent', congBothRect:'Congruent, because both are rectangles' },
      changeOpt:{ congKeep:'Congruent — neither shape nor size changed', notScale:'Not congruent — the same shape, but the size changed',
                  notShape:'Not congruent — the shape changed', notPlace:'Not congruent — a new place means not congruent' },
      actionText:{
        slide:function(k){ return 'slide it ' + k + ' ' + plEn(k, 'square') + ' to the right'; },
        turn:function(deg){ return 'turn it ' + deg + '°'; },
        flip:function(){ return 'flip it over (left-right)'; },
        scale:function(k){ return 'enlarge it ' + k + ' times (every side ' + k + ' times as long, the shape unchanged)'; }
      },
      cm:function(n){ return n + ' cm'; },
      sqcm:function(n){ return n + ' square ' + plEn(n, 'centimetre'); },
      deg:function(n){ return n + '°'; },
      sidesPerim:function(n, p){ return n + ' ' + plEn(n, 'side') + ', ' + p + ' cm'; },
      capPair:'📐 Orange on the left, blue on the right, both on the same squared paper',
      capCorr:'📐 The two shapes are congruent; the letters name the vertices',
      capWhich:'📐 The blue shape on the left is the target; the four candidates on the right are in different colours'
    }
  };

  var PAIR_KEYS = ['congSlide', 'congTurnFlip', 'notScale', 'notShape'];
  var MOVE_KEYS = ['slide', 'turn', 'flip', 'scale'];
  var RECT_KEYS = ['areaSameNotCong', 'areaSameSoCong', 'areaDiffNotCong', 'congBothRect'];
  var CHANGE_KEYS = ['congKeep', 'notScale', 'notShape', 'notPlace'];
  /* 同面積、不同長寬的長方形（長 ≥ 寬）。 */
  var RECT_PAIRS = [
    [[6, 2], [4, 3]], [[8, 2], [4, 4]], [[9, 2], [6, 3]], [[10, 2], [5, 4]],
    [[8, 3], [6, 4]], [[12, 2], [8, 3]], [[12, 2], [6, 4]], [[10, 3], [6, 5]],
    [[9, 4], [6, 6]], [[12, 3], [9, 4]], [[7, 2], [14, 1]], [[5, 3], [15, 1]]
  ];
  var GENS = [
    /* 1. 這兩個全等嗎（四種結論各一個選項）。有圖。 */
    { id:'pairKind', cat:'cong',
      make:function(){
        return retry(function(){
          var s = pick(SHAPES), kind = pick(['same', 'turn', 'flip', 'scale', 'shape']);
          var A = s.pts, B, mat = 0;
          if (kind === 'same') B = A;
          else if (kind === 'turn'){ mat = 1 + rand(3); B = mapPts(A, MATS[mat].m); }
          else if (kind === 'flip'){ mat = 4 + rand(4); B = mapPts(A, MATS[mat].m); }
          else if (kind === 'scale') B = scaleP(A, SCALE_K);
          else B = s.alt;
          var rel = relation(A, B);
          var key = rel === 'same' ? 'congSlide' : (rel === 'turn' || rel === 'flip') ? 'congTurnFlip'
                  : scaleFactor(A, B) ? 'notScale' : 'notShape';
          var keys = shuffle(PAIR_KEYS);
          return { sid:s.id, kind:kind, mat:mat, A:A, B:B, key:key, keys:keys, ans:keys.indexOf(key) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], k = d.key;
        return {
          stem: lang === 'zh' ? '右邊的藍色圖形和左邊的橘色圖形<strong>全等</strong>嗎？'
                              : 'Is the blue shape on the right <strong>congruent</strong> to the orange shape on the left?',
          fig: pairFig(d.A, d.B), cap: t.capPair,
          opts: d.keys.map(function(x){ return t.pairKindOpt[x]; }), ans:d.ans,
          why: lang === 'zh'
            ? (k === 'congSlide' ? '藍色直直搬過去就和橘色<strong>完全重合</strong>，所以全等。'
             : k === 'congTurnFlip' ? '藍色要先轉個方向（或翻過來）再搬過去才會<strong>完全重合</strong>。轉和翻都不改變形狀和大小，所以全等。'
             : k === 'notScale' ? '藍色的每一條邊都是橘色的 ' + SCALE_K + ' 倍長：形狀一樣，大小不一樣，疊上去會露出一大塊 —— 不全等。'
             : '兩個圖形的形狀不一樣，怎麼搬疊上去都會有露出來的地方 —— 不全等。')
            : (k === 'congSlide' ? 'Slide the blue shape straight across and it <strong>fits exactly</strong> on the orange one, so they are congruent.'
             : k === 'congTurnFlip' ? 'The blue shape has to be turned (or flipped) before it <strong>fits exactly</strong>. Turns and flips change neither shape nor size, so they are congruent.'
             : k === 'notScale' ? 'Every side of the blue shape is ' + SCALE_K + ' times as long as the orange one: the same shape, a different size, so a big part sticks out — not congruent.'
             : 'The two shapes have different shapes; whatever move you try, part sticks out — not congruent.')
        };
      } },

    /* 2. 右邊是左邊怎麼搬過來的。有圖；圖形沒有對稱，所以答案唯一。 */
    { id:'moveName', cat:'move',
      make:function(){
        return retry(function(){
          var s = pick(SHAPES), mat = rand(8);
          var B = mapPts(s.pts, MATS[mat].m);
          var rel = relation(s.pts, B);
          var key = rel === 'same' ? 'slide' : rel;
          var keys = shuffle(MOVE_KEYS);
          return { sid:s.id, mat:mat, A:s.pts, B:B, key:key, keys:keys, ans:keys.indexOf(key) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], k = d.key;
        return {
          stem: lang === 'zh' ? '右邊的藍色圖形是左邊的橘色圖形<strong>怎麼搬</strong>過來的？'
                              : '<strong>Which move</strong> carried the orange shape on the left to where the blue one is?',
          fig: pairFig(d.A, d.B), cap: t.capPair,
          opts: d.keys.map(function(x){ return t.moveOpt[x]; }), ans:d.ans,
          why: lang === 'zh'
            ? ('每一條邊都一樣長，所以不是放大。' +
               (k === 'slide' ? '方向也一樣，直直搬過去就重合 —— 是<strong>平移</strong>。'
              : k === 'turn' ? '方向轉了，可是沒有變成鏡子裡的樣子，轉一下就重合 —— 是<strong>旋轉</strong>。'
              : '它是鏡子裡的樣子（左右相反），要翻過來才會重合 —— 是<strong>翻轉</strong>。'))
            : ('Every side is the same length, so it is not an enlargement. ' +
               (k === 'slide' ? 'It faces the same way too, so a straight slide makes it fit — <strong>a slide</strong>.'
              : k === 'turn' ? 'It faces a different way but is not a mirror image, so a turn makes it fit — <strong>a turn</strong>.'
              : 'It is a mirror image (left and right swapped), so it has to be flipped to fit — <strong>a flip</strong>.'))
        };
      } },

    /* 3. 頂點 X 對應哪一個頂點。有圖（字母）。 */
    { id:'corrVertex', cat:'corr',
      make:function(){
        return retry(function(){
          var sid = pick(QUAD_IDS), mat = 1 + rand(7), vi = rand(4);
          var lay = corrLayout(sid, mat);
          var la = labelOf(lay.A, LABELS_A, vi), lb = labelOf(lay.B, LABELS_B, vi);
          var keys = shuffle(LABELS_B);
          return { sid:sid, mat:mat, vi:vi, la:la, lb:lb, keys:keys, ans:keys.indexOf(lb),
                   right:isRight(lay.A, vi), reflex:isReflex(lay.A, vi) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '兩個圖形全等。左邊的頂點 <strong>' + d.la + '</strong> 對應右邊的哪一個頂點？'
                              : 'The two shapes are congruent. Which vertex of the right shape matches vertex <strong>' + d.la + '</strong> of the left one?',
          fig: corrFig(d.sid, d.mat), cap: t.capCorr,
          opts: d.keys.slice(), ans:d.ans,
          why: lang === 'zh'
            ? ('想像把左邊的圖形搬到右邊上面（要的話先轉或翻），' + d.la + ' 會碰到 <strong>' + d.lb + '</strong>。' +
               (d.right ? '兩個都是直角，' : d.reflex ? '兩個都是凹進去的那一個角，' : '') + '從 ' + d.la + ' 出去的兩條邊，和從 ' + d.lb + ' 出去的兩條邊分別一樣長。')
            : ('Imagine moving the left shape onto the right one (turning or flipping it first if need be): ' + d.la + ' lands on <strong>' + d.lb + '</strong>. ' +
               (d.right ? 'Both are right angles, and ' : d.reflex ? 'Both are the angle that bends inwards, and ' : '') + 'each side leaving ' + d.la + ' is the same length as the matching side leaving ' + d.lb + '.')
        };
      } },

    /* 4. 邊 XY 對應哪一條邊。有圖（字母）。 */
    { id:'corrSide', cat:'corr',
      make:function(){
        return retry(function(){
          var sid = pick(QUAD_IDS), mat = 1 + rand(7), ei = rand(4);
          var lay = corrLayout(sid, mat), j = (ei + 1) % 4;
          var nameA = edgeName(lay.A, LABELS_A, ei, j), nameB = edgeName(lay.B, LABELS_B, ei, j);
          var order = labelOrder(lay.B), keys = [];
          for (var k = 0; k < 4; k++) keys.push(edgeName(lay.B, LABELS_B, order[k], order[(k + 1) % 4]));
          keys = shuffle(keys);
          return { sid:sid, mat:mat, ei:ei, nameA:nameA, nameB:nameB, len:edgeLen(lay.A, ei, j),
                   la1:labelOf(lay.A, LABELS_A, ei), la2:labelOf(lay.A, LABELS_A, j),
                   lb1:labelOf(lay.B, LABELS_B, ei), lb2:labelOf(lay.B, LABELS_B, j),
                   keys:keys, ans:keys.indexOf(nameB) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '兩個圖形全等。左邊的邊 <strong>' + d.nameA + '</strong> 對應右邊的哪一條邊？'
                              : 'The two shapes are congruent. Which side of the right shape matches side <strong>' + d.nameA + '</strong> of the left one?',
          fig: corrFig(d.sid, d.mat), cap: t.capCorr,
          opts: d.keys.slice(), ans:d.ans,
          why: lang === 'zh'
            ? ('邊 ' + d.nameA + ' 的兩端是頂點 ' + d.la1 + ' 和 ' + d.la2 + '，疊起來會分別碰到 ' + d.lb1 + ' 和 ' + d.lb2 + '，所以對應的邊是 <strong>' + d.nameB + '</strong>' +
               (d.len === null ? '（兩條斜邊一樣長）。' : '（兩條邊都是 ' + d.len + ' 格）。'))
            : ('Side ' + d.nameA + ' runs between vertices ' + d.la1 + ' and ' + d.la2 + ', which land on ' + d.lb1 + ' and ' + d.lb2 + ', so the matching side is <strong>' + d.nameB + '</strong>' +
               (d.len === null ? ' (both slanted sides are the same length).' : ' (both sides are ' + d.len + ' ' + plEn(d.len, 'square') + ' long).'))
        };
      } },

    /* 5. 四個候選哪一個和目標全等。有圖（顏色當選項）。 */
    { id:'whichCong', cat:'cong',
      make:function(){
        return retry(function(){
          var s = pick(SHAPES);
          var good = mapPts(s.pts, MATS[rand(8)].m);
          var pool = [];
          SHAPES.forEach(function(o){
            if (o.id !== s.id && fitsQuadrant(o.pts)) pool.push(o.pts);
            if (fitsQuadrant(o.alt)) pool.push(o.alt);
          });
          pool = shuffle(pool).filter(function(P){ return !isCongruent(P, s.pts); });
          if (pool.length < 3) return null;
          var bad = pool.slice(0, 3).map(function(P){ return mapPts(P, MATS[rand(8)].m); });
          /* 三個誘答彼此也不可以全等（不然顏色就是唯一的差別，可是圖看起來一樣）。 */
          for (var i = 0; i < 3; i++) for (var j = i + 1; j < 3; j++) if (isCongruent(bad[i], bad[j])) return null;
          var cands = shuffle([good].concat(bad));
          var hits = [];
          cands.forEach(function(C, i){ if (isCongruent(C, s.pts)) hits.push(i); });
          if (hits.length !== 1) return null;
          if (!fitsQuadrant(good)) return null;
          return { sid:s.id, target:s.pts, cands:cands, ans:hits[0], tone:WHICH_TONES[hits[0]] };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '左邊的藍色圖形是目標。右邊四個圖形，哪一個和它<strong>全等</strong>？'
                              : 'The blue shape on the left is the target. Which of the four shapes on the right is <strong>congruent</strong> to it?',
          fig: whichFig(d.target, d.cands), cap: t.capWhich,
          opts: WHICH_TONES.map(function(k){ return t.colorName[k]; }), ans:d.ans,
          why: lang === 'zh'
            ? ('把每一個候選搬到藍色上面想一想：只有<strong>' + t.colorName[d.tone] + '</strong>能完全重合（可能要轉或翻）。其他三個形狀不一樣，疊上去會露出來。')
            : ('Imagine moving each candidate onto the blue shape: only <strong>' + t.colorName[d.tone] + '</strong> fits exactly (perhaps after a turn or a flip). The other three have different shapes and would stick out.')
        };
      } },

    /* 6. 對應邊的長度（文字）。 */
    { id:'corrLen', cat:'corr',
      make:function(){
        return retry(function(){
          var n = 3 + rand(18);
          var opts = numOpts(n, [n + 2, n - 2, 2 * n], [], inLen);
          if (!opts) return null;
          return { n:n, opts:opts, ans:opts.indexOf(n) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '甲、乙兩個圖形<strong>全等</strong>。甲的邊 AB 是 <strong>' + d.n + ' 公分</strong>，它對應乙的邊 EF。邊 EF 是幾公分？'
                              : 'Shapes P and Q are <strong>congruent</strong>. Side AB of P is <strong>' + d.n + ' cm</strong> long and matches side EF of Q. How long is side EF?',
          opts: d.opts.map(function(v){ return t.cm(v); }), ans:d.ans,
          why: lang === 'zh' ? '全等的圖形<strong>對應邊一樣長</strong>，所以邊 EF 也是 <strong>' + d.n + ' 公分</strong>，不用量。'
                             : 'In congruent shapes <strong>matching sides are the same length</strong>, so side EF is <strong>' + d.n + ' cm</strong> too, no measuring needed.'
        };
      } },

    /* 7. 對應角的大小（文字）。誘答一定有 180 － x（拿一直線去減）。 */
    { id:'corrAngle', cat:'corr',
      make:function(){
        return retry(function(){
          var x = pick([30, 40, 45, 50, 60, 70, 75, 80, 100, 110, 120, 130, 140, 150]);
          var opts = numOpts(x, [180 - x, x + 10, x - 10, 90 - x], [], inDeg);
          if (!opts) return null;
          if (opts.indexOf(180 - x) < 0) return null;
          return { x:x, opts:opts, ans:opts.indexOf(x) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '甲、乙兩個圖形<strong>全等</strong>。甲有一個角是 <strong>' + d.x + '°</strong>，乙上面對應的那一個角是幾度？'
                              : 'Shapes P and Q are <strong>congruent</strong>. One angle of P is <strong>' + d.x + '°</strong>. How many degrees is the matching angle of Q?',
          opts: d.opts.map(function(v){ return t.deg(v); }), ans:d.ans,
          why: lang === 'zh' ? '全等的圖形<strong>對應角一樣大</strong>，所以那個角也是 <strong>' + d.x + '°</strong>。（答 ' + (180 - d.x) + '° 是拿一直線去減，可是沒有人叫你算旁邊的角。）'
                             : 'In congruent shapes <strong>matching angles are the same size</strong>, so that angle is <strong>' + d.x + '°</strong> too. (Answering ' + (180 - d.x) + '° subtracts from a straight line, but nobody asked about the angle next to it.)'
        };
      } },

    /* 8. 全等長方形的周長（交錯：三年級「周長」）。 */
    { id:'perimCong', cat:'measure',
      make:function(){
        return retry(function(){
          var a = 3 + rand(10), b = 2 + rand(a - 2);
          var p = 2 * (a + b), area = a * b;
          var opts = numOpts(p, [area, a + b, 2 * a + b], [a, b], inBig);
          if (!opts) return null;
          return { a:a, b:b, p:p, area:area, opts:opts, ans:opts.indexOf(p) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];

          stem: lang === 'zh' ? '甲是長 <strong>' + d.a + ' 公分</strong>、寬 <strong>' + d.b + ' 公分</strong>的長方形，乙和甲<strong>全等</strong>。乙的周長是幾公分？'
                              : 'P is a rectangle <strong>' + d.a + ' cm</strong> long and <strong>' + d.b + ' cm</strong> wide, and Q is <strong>congruent</strong> to P. What is the perimeter of Q?',
          opts: d.opts.map(function(v){ return t.cm(v); }), ans:d.ans,
          why: lang === 'zh' ? '乙和甲全等，所以乙的長也是 ' + d.a + ' 公分、寬也是 ' + d.b + ' 公分（對應邊一樣長）。周長是 (' + d.a + ' ＋ ' + d.b + ') × 2 ＝ <strong>' + d.p + '</strong> 公分。'
                             : 'Q is congruent to P, so Q is also ' + d.a + ' cm long and ' + d.b + ' cm wide (matching sides are the same length). Perimeter: (' + d.a + ' + ' + d.b + ') × 2 = <strong>' + d.p + '</strong> cm.'
        };
      } },

    /* 9. 全等長方形的面積（交錯：四年級「面積鋪磚廠」）。 */
    { id:'areaCong', cat:'measure',
      make:function(){
        return retry(function(){
          var a = 3 + rand(10), b = 2 + rand(a - 2);
          var area = a * b, p = 2 * (a + b);
          var opts = numOpts(area, [p, a + b, 2 * area], [a, b], inBig);
          if (!opts) return null;
          return { a:a, b:b, area:area, p:p, opts:opts, ans:opts.indexOf(area) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '甲是長 <strong>' + d.a + ' 公分</strong>、寬 <strong>' + d.b + ' 公分</strong>的長方形，乙和甲<strong>全等</strong>。乙的面積是多少平方公分？'
                              : 'P is a rectangle <strong>' + d.a + ' cm</strong> long and <strong>' + d.b + ' cm</strong> wide, and Q is <strong>congruent</strong> to P. What is the area of Q in square centimetres?',
          opts: d.opts.map(function(v){ return t.sqcm(v); }), ans:d.ans,
          why: lang === 'zh' ? '全等的圖形<strong>面積一定一樣</strong>：乙的長和寬也是 ' + d.a + ' 公分和 ' + d.b + ' 公分，面積是 ' + d.a + ' × ' + d.b + ' ＝ <strong>' + d.area + '</strong> 平方公分。'
                             : 'Congruent shapes <strong>always have the same area</strong>: Q is also ' + d.a + ' cm by ' + d.b + ' cm, so its area is ' + d.a + ' × ' + d.b + ' = <strong>' + d.area + '</strong> square centimetres.'
        };
      } },

    /* 10. 面積一樣的兩個長方形，哪一句話是對的（文字）。 */
    { id:'rectPair', cat:'cong',
      make:function(){
        return retry(function(){
          var pr = pick(RECT_PAIRS);
          var A = rect(pr[0][0], pr[0][1]), B = rect(pr[1][0], pr[1][1]);
          var areaEq = areaCells(A) === areaCells(B), cong = isCongruent(A, B);
          var key = cong ? 'congBothRect' : areaEq ? 'areaSameNotCong' : 'areaDiffNotCong';
          var keys = shuffle(RECT_KEYS);
          return { a:pr[0][0], b:pr[0][1], c:pr[1][0], d2:pr[1][1], area:areaCells(A), areaEq:areaEq, cong:cong,
                   key:key, keys:keys, ans:keys.indexOf(key) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '一個長 <strong>' + d.a + ' 公分</strong>、寬 <strong>' + d.b + ' 公分</strong>的長方形，和一個長 <strong>' + d.c + ' 公分</strong>、寬 <strong>' + d.d2 + ' 公分</strong>的長方形。下面哪一句話是對的？'
                              : 'One rectangle is <strong>' + d.a + ' cm</strong> long and <strong>' + d.b + ' cm</strong> wide; another is <strong>' + d.c + ' cm</strong> long and <strong>' + d.d2 + ' cm</strong> wide. Which statement is true?',
          opts: d.keys.map(function(x){ return t.rectStatement[x]; }), ans:d.ans,
          why: lang === 'zh' ? '面積：' + d.a + ' × ' + d.b + ' ＝ ' + d.area + '，' + d.c + ' × ' + d.d2 + ' ＝ ' + d.area + ' —— 一樣。可是長和寬不一樣，疊起來不會完全重合，所以<strong>面積一樣，可是不全等</strong>。'
                             : 'Areas: ' + d.a + ' × ' + d.b + ' = ' + d.area + ' and ' + d.c + ' × ' + d.d2 + ' = ' + d.area + ' — the same. But the lengths and widths differ, so one would not fit exactly on the other: <strong>the same area, but not congruent</strong>.'
        };
      } },

    /* 11. 全等的圖形邊數一樣多、周長一樣（文字）。兩個屬性一起問，誘答各改一個。 */
    { id:'sidesPerim', cat:'measure',
      make:function(){
        return retry(function(){
          var n = pick([3, 4, 5, 6]), p = 8 + rand(33);
          var correct = [n, p];
          var cands = shuffle([[n, 2 * p], [n + 1, p], [n, p + 2], [n - 1, p], [n, p - 2]]);
          var opts = [correct], seen = {};
          seen[correct.join()] = 1;
          cands.forEach(function(c){
            if (opts.length >= 4) return;
            if (c[0] < 3 || c[0] > 8 || c[1] < 1 || c[1] > BIG_MAX || seen[c.join()]) return;
            seen[c.join()] = 1; opts.push(c);
          });
          if (opts.length < 4) return null;
          opts = shuffle(opts);
          var ans = -1;
          opts.forEach(function(o, k){ if (o[0] === n && o[1] === p) ans = k; });
          return { n:n, p:p, opts:opts, ans:ans };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        return {
          stem: lang === 'zh' ? '甲、乙兩個圖形<strong>全等</strong>。甲有 <strong>' + d.n + ' 條邊</strong>，周長是 <strong>' + d.p + ' 公分</strong>。乙有幾條邊、周長是幾公分？'
                              : 'Shapes P and Q are <strong>congruent</strong>. P has <strong>' + d.n + ' sides</strong> and a perimeter of <strong>' + d.p + ' cm</strong>. How many sides does Q have, and what is its perimeter?',
          opts: d.opts.map(function(o){ return t.sidesPerim(o[0], o[1]); }), ans:d.ans,
          why: lang === 'zh' ? '全等的圖形疊起來<strong>完全重合</strong>：邊一樣多、每一條對應邊一樣長，所以周長也一樣 —— <strong>' + d.n + ' 條邊、' + d.p + ' 公分</strong>。'
                             : 'Congruent shapes <strong>fit exactly when one is placed on top of the other</strong>: the same number of sides, each matching side the same length, so the same perimeter — <strong>' + d.n + ' sides, ' + d.p + ' cm</strong>.'
        };
      } },

    /* 12. 做了一個變化之後還全等嗎（文字）。 */
    { id:'changeKind', cat:'move',
      make:function(){
        return retry(function(){
          var act = pick(['slide', 'turn', 'flip', 'scale']);
          var k = act === 'slide' ? 1 + rand(9) : act === 'turn' ? pick([90, 180]) : act === 'scale' ? 2 + rand(2) : 0;
          var key = act === 'scale' ? 'notScale' : 'congKeep';
          var keys = shuffle(CHANGE_KEYS);
          return { act:act, k:k, key:key, keys:keys, ans:keys.indexOf(key) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang];
        var action = t.actionText[d.act](d.k);
        return {
          stem: lang === 'zh' ? '把一個圖形<strong>' + action + '</strong>。新的圖形和原來的<strong>全等</strong>嗎？'
                              : 'Take a shape and <strong>' + action + '</strong>. Is the new shape <strong>congruent</strong> to the original?',
          opts: d.keys.map(function(x){ return t.changeOpt[x]; }), ans:d.ans,
          why: lang === 'zh'
            ? (d.act === 'scale' ? '每一條邊都變長了：形狀一樣，可是<strong>大小變了</strong>，疊上去會露出來 —— 不全等。放大縮小不是搬法。'
                                 : '平移、旋轉、翻轉都是<strong>搬法</strong>，不改變形狀和大小，搬完的圖形和原來的一定全等。位置或方向變了不算。')
            : (d.act === 'scale' ? 'Every side got longer: the same shape but <strong>a different size</strong>, so it would stick out when laid on the original — not congruent. Enlarging is not a move.'
                                 : 'Slides, turns and flips are <strong>moves</strong>: they change neither shape nor size, so the moved shape is always congruent to the original. A new place or direction does not count.')
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 全等搬家公司', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：全等搬家公司',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>裡面也會夾幾題「面積鋪磚廠」「四邊形家族」「三角形家族」的題型。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　長方形的面積回<a href="../area/index.html">面積鋪磚廠</a>　·　四邊形的名字回<a href="../quadrilateral/index.html">四邊形家族</a>　·　三角形回<a href="../triangle/index.html">三角形家族</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Congruence Movers', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Congruence Movers',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>A few of them come from “The Area Tiling Works”, “The Quadrilateral Family” and “The Triangle Family” too.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　rectangle area in <a href="../area/index.html">The Area Tiling Works</a>　·　quadrilateral names in <a href="../quadrilateral/index.html">The Quadrilateral Family</a>　·　triangles in <a href="../triangle/index.html">The Triangle Family</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM。座標直接用 fig 裡**產生器算好的**那一份，
         不在這裡重算，不然畫出來的和檢查驗過的會是兩回事。
         圖上只有 line／path／circle，加上對應題的單一個字母。 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var C_LINE = '#2B2A33', C_GRID = '#E8E2D6';
  var TONE = {
    a:{ stroke:'#E8871E', fill:'rgba(232,135,30,.30)' },
    b:{ stroke:'#3B7DD8', fill:'rgba(59,125,216,.28)' },
    c:{ stroke:'#2F9E69', fill:'rgba(47,158,105,.30)' },
    d:{ stroke:'#9C6ADE', fill:'rgba(156,106,222,.30)' },
    e:{ stroke:'#D64545', fill:'rgba(214,69,69,.28)' }
  };

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function drawFig(svg, fig){
    var i;
    svg.textContent = '';
    for (i = 0; i <= COLS; i++)
      svg.appendChild(svgEl('line', { x1:px(i), y1:py(0), x2:px(i), y2:py(ROWS), stroke:C_GRID, 'stroke-width':1 }));
    for (i = 0; i <= ROWS; i++)
      svg.appendChild(svgEl('line', { x1:px(0), y1:py(i), x2:px(COLS), y2:py(i), stroke:C_GRID, 'stroke-width':1 }));
    if (fig.kind === 'which'){
      /* 目標區和候選區之間一條分隔線。 */
      svg.appendChild(svgEl('line', { x1:px(WHICH_TARGET_W), y1:py(0), x2:px(WHICH_TARGET_W), y2:py(ROWS), stroke:C_LINE, 'stroke-width':1.5, 'stroke-dasharray':'4 4' }));
    }
    fig.polys.forEach(function(p){
      var tone = TONE[p.tone];
      svg.appendChild(svgEl('path', {
        d:p.pts.map(function(q, k){ return (k ? 'L ' : 'M ') + q.x + ' ' + q.y; }).join(' ') + ' Z',
        fill:tone.fill, stroke:tone.stroke, 'stroke-width':LINE_W, 'stroke-linejoin':'round'
      }));
    });
    fig.dots.forEach(function(p){
      svg.appendChild(svgEl('circle', { cx:p.x, cy:p.y, r:p.r, fill:C_LINE }));
    });
    fig.labels.forEach(function(lb){
      var t = svgEl('text', { x:lb.x, y:lb.y, 'text-anchor':'middle', 'dominant-baseline':'central',
                              'font-size':LABEL_FONT, 'font-weight':'700', fill:C_LINE });
      t.textContent = lb.t;
      svg.appendChild(t);
    });
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make();
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'gridfig');
        svg.setAttribute('viewBox', '0 0 ' + FIG_W + ' ' + FIG_H);
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
        var cp = document.createElement('p');
        cp.className = 'figcap';
        cp.textContent = q.cap;
        box.appendChild(cp);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
