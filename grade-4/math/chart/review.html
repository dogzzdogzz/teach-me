<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>複習挑戰 — 統計圖工作室</title>
<style>
  :root{
    --bg:#FAF7F0; --card:#FFFFFF; --ink:#2B2A33; --muted:#6B6875;
    --green:#2F9E69; --green-soft:#E3F4EB; --orange:#E8871E; --orange-soft:#FDF0E0;
    --red:#D64545; --red-soft:#FBE9E9; --blue:#3B7DD8; --blue-soft:#E8F0FB;
    --line:#E8E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    line-height:1.7;font-size:17px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:32px 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .langbtn{
    border:2px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:999px;padding:4px 16px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .langbtn:hover{border-color:var(--green);color:var(--green)}
  a.home{color:var(--blue);font-size:15px}
  .coursenav{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:15px}
  .coursenav a{color:var(--blue)}
  .coursenav span{color:var(--muted)}
  header{text-align:center;padding:32px 0 8px}
  header h1{font-size:clamp(25px,5vw,36px);letter-spacing:1px}
  header .sub{color:var(--muted);margin-top:8px;font-size:17px}
  .intro{
    background:var(--green-soft);border:2px solid var(--green);border-radius:18px;
    padding:16px 20px;margin:22px 0;font-size:16px;text-align:center;
  }
  .quiz{display:grid;gap:18px;margin-top:20px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .qn{
    display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:13px;
    font-weight:700;border-radius:999px;padding:1px 12px;
  }
  .stem{margin:8px 0 12px;font-size:18px}
  .figwrap{margin:0 0 4px;text-align:center;overflow-x:auto}
  .chartfig{width:100%;max-width:400px;height:230px;display:block;margin:0 auto}
  .figcap{margin:0 0 12px;font-size:13px;color:var(--muted);text-align:center}
  .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
  .opt{
    border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;
    font-size:16px;cursor:pointer;color:var(--ink);
  }
  .opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green);font-weight:700}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
  .opt:disabled{cursor:default;opacity:.85}
  .fb{margin-top:10px;font-size:15px;color:var(--muted);min-height:22px}
  .scoreboard{
    display:flex;gap:24px;flex-wrap:wrap;margin-top:18px;background:var(--blue-soft);
    border-radius:14px;padding:12px 20px;font-size:16px;position:sticky;bottom:8px;
  }
  .result{
    margin-top:22px;background:var(--card);border:2px solid var(--green);border-radius:18px;
    padding:20px;display:none;
  }
  .result.on{display:block}
  .result .line{font-size:20px;font-weight:700;color:var(--green)}
  .result .links{margin-top:10px;font-size:16px}
  .result .links a{color:var(--blue)}
  .btn{
    border:none;border-radius:12px;background:var(--green);color:#fff;font-size:17px;
    font-weight:700;padding:10px 22px;cursor:pointer;margin-top:14px;
  }
  footer{
    margin-top:48px;text-align:center;background:var(--orange-soft);
    border-radius:20px;padding:22px;font-size:17px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <p><a class="home" href="../../../index.html" data-i18n="home">← 回 teach-me 首頁</a></p>
    <button class="langbtn" id="langBtn" type="button" data-i18n-aria="langAria" aria-label="Switch language">EN</button>
  </div>
  <nav class="coursenav">
    <a href="index.html" data-i18n="nav1">📖 上課</a>
    <a href="reference.html" data-i18n="nav2">🗂️ 速查卡（重點整理）</a>
    <span data-i18n="nav3">🔁 複習挑戰（本頁）</span>
    <a href="parents.html" data-i18n="nav4">👨‍👩‍👧 給家長（陪讀指引）</a>
  </nav>

  <header>
    <h1 data-i18n="h1">🔁 複習挑戰：統計圖工作室</h1>
    <p class="sub" data-i18n="sub">每次重新整理，12 題都不一樣</p>
  </header>

  <div class="intro" data-i18n="intro">這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>隔一天再來一次，還答得出來，才是真的記住了。</div>

  <div id="quiz" class="quiz"></div>

  <div class="scoreboard">
    <span><span data-i18n="qDoneLabel">已作答</span> <b id="qDone">0</b> / <span id="qTotal">12</span></span>
    <span><span data-i18n="qRightLabel">答對</span> <b id="qRight">0</b> <span data-i18n="qRightUnit">題</span></span>
  </div>

  <div class="result" id="result">
    <p class="line" id="resultLine"></p>
    <p class="links" id="resultLinks"></p>
    <button class="btn" id="retryBtn" type="button" data-i18n="retryBtn">🔄 再來一輪新題</button>
  </div>

  <footer data-i18n="foot">記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。</footer>
</div>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     圖的座標與標籤也在這裡定案（figOf），由 fmt() 放進 fig 回傳，
     這樣檢查驗到的就是「頁面真的畫成什麼」，不是設定檔自己會畫成什麼。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  /* 同一輪裡不要一直抽到同一個情境 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null。`tools/simgen.js` 每一批只呼叫 make() 一次、
     **不重試**，所以回 null 就等於「這一支產生器壞了」——拒絕取樣的重試必須
     放在 make() 裡面。300 次都湊不出來才真的算壞掉。 */
  function retry(fn){
    for (var i = 0; i < 300; i++){
      var d = fn();
      if (d) return d;
    }
    return null;
  }

  /* --- 這一課的數值範圍。每一項 0 ~ 9 個（畫得下、也看得清楚），
         所以合計最多 5 × 9 ＝ 45，選項一律 0 ~ 99 的整數。
         **一格永遠代表 1 個**，所以「幾格」和「幾個」是同一個整數。 --- */
  var VAL_MAX = 9;
  var OPT_MAX = 99;
  function inRange(v){
    return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 0 && v <= OPT_MAX;
  }

  /* --- 統計的核心。全部是整數運算，沒有刻度換算、沒有容差。 --- */
  function maxOf(vals){
    var m = vals[0];
    for (var i = 1; i < vals.length; i++) if (vals[i] > m) m = vals[i];
    return m;
  }
  function minOf(vals){
    var m = vals[0];
    for (var i = 1; i < vals.length; i++) if (vals[i] < m) m = vals[i];
    return m;
  }
  function sumOf(vals){
    var s = 0;
    for (var i = 0; i < vals.length; i++) s += vals[i];
    return s;
  }
  /* 格子最少要幾格 ＝ 最多的那一項是幾個（全部是 0 的時候仍然要 1 格）。 */
  function gridRows(vals){ return Math.max(1, maxOf(vals)); }
  /* 唯一的最多／最少；並列的時候回 －1。 */
  function soleMaxIndex(vals){
    var m = maxOf(vals), at = -1, n = 0;
    for (var i = 0; i < vals.length; i++) if (vals[i] === m){ at = i; n++; }
    return n === 1 ? at : -1;
  }
  function soleMinIndex(vals){
    var m = minOf(vals), at = -1, n = 0;
    for (var i = 0; i < vals.length; i++) if (vals[i] === m){ at = i; n++; }
    return n === 1 ? at : -1;
  }
  function segDir(a, b){ return b > a ? 'up' : b < a ? 'down' : 'flat'; }
  function segDelta(a, b){ return Math.abs(b - a); }
  /* 「比 k 多」是嚴格大於 —— 剛好 k 不算。 */
  function countOver(vals, k){
    var n = 0;
    for (var i = 0; i < vals.length; i++) if (vals[i] > k) n++;
    return n;
  }
  function countDir(vals, want){
    var n = 0;
    for (var i = 0; i + 1 < vals.length; i++) if (segDir(vals[i], vals[i + 1]) === want) n++;
    return n;
  }

  /* --- 英文的單複數。只有 1 會錯。 --- */
  function plEn(n, w){ return n === 1 ? w : w + 's'; }

  /* --- 版面常數。和課程頁同一套規格，只是畫布小一點。
         每一條長條的頂端一定剛好落在第 v 條格線上 —— 那正是
         「一格代表 1 個，有幾格就是幾個」在圖上成立的理由。 --- */
  var FIG_W = 400, FIG_H = 230;
  var PAD_L = 38, PAD_R = 14, PAD_T = 14, PAD_B = 38;
  var GAP_RATIO = 0.34;
  var AXIS_NUM_DX = 8, AXIS_NUM_FS = 11, ITEM_FS = 13, ITEM_DY = 18, DOT_R = 4;

  function chartPlan(vals, rows){
    var b = { x0:PAD_L, x1:FIG_W - PAD_R, y0:PAD_T, y1:FIG_H - PAD_B };
    var cellH = (b.y1 - b.y0) / rows;
    var slot = (b.x1 - b.x0) / vals.length;
    var barW = slot * (1 - GAP_RATIO);
    var bars = [];
    for (var i = 0; i < vals.length; i++){
      var cx = b.x0 + slot * (i + 0.5);
      bars.push({ i:i, v:vals[i], cx:cx, x:cx - barW / 2, w:barW,
                  y:b.y1 - vals[i] * cellH, h:vals[i] * cellH });
    }
    var grid = [];
    for (var r = 0; r <= rows; r++) grid.push({ r:r, y:b.y1 - r * cellH });
    var items = [];
    for (var k = 0; k < vals.length; k++)
      items.push({ i:k, cx:b.x0 + slot * (k + 0.5), y:b.y1 + ITEM_DY });
    return { box:b, rows:rows, cellH:cellH, slot:slot, barW:barW,
             bars:bars, grid:grid, items:items };
  }
  function linePlan(vals, rows){
    var p = chartPlan(vals, rows);
    p.pts = p.bars.map(function(bar){ return { i:bar.i, v:bar.v, cx:bar.cx, cy:bar.y }; });
    p.segs = [];
    for (var i = 0; i + 1 < p.pts.length; i++){
      p.segs.push({ i:i, x1:p.pts[i].cx, y1:p.pts[i].cy, x2:p.pts[i + 1].cx, y2:p.pts[i + 1].cy,
                    va:vals[i], vb:vals[i + 1],
                    dir:segDir(vals[i], vals[i + 1]), delta:segDelta(vals[i], vals[i + 1]) });
    }
    return p;
  }
  /* 產生器一律用這一支把圖包好 —— 座標是**頁面算的**，
     檢查設定會拿它和獨立重寫的排版比對。names 也在這裡定案，
     這樣碰 DOM 的那一段完全不用查字典。 */
  function figOf(kind, vals, names){
    var plan = (kind === 'line') ? linePlan(vals, gridRows(vals)) : chartPlan(vals, gridRows(vals));
    plan.kind = kind;
    plan.vals = vals.slice();
    plan.names = names.slice();
    return plan;
  }

  /* --- 情境。項目彼此**沒有先後**的用長條圖；
         有先後（一天接一天、一月接一月）的才可以畫折線圖。 --- */
  var BAR_SCENES = [
    { id:'fruit', keys:['apple', 'banana', 'grape', 'melon'] },
    { id:'pet',   keys:['dog', 'cat', 'fish', 'bird'] },
    { id:'book',  keys:['story', 'science', 'comic', 'poem'] },
    { id:'drink', keys:['juice', 'milk', 'soda', 'tea'] },
    { id:'craft', keys:['red', 'blue', 'green', 'yellow'] },
    { id:'sport', keys:['run', 'jump', 'swim', 'ball'] }
  ];
  var LINE_SCENES = [
    { id:'week',  keys:['mon', 'tue', 'wed', 'thu', 'fri'] },
    { id:'month', keys:['m1', 'm2', 'm3', 'm4'] }
  ];
  var BAR_IDS = ['fruit', 'pet', 'book', 'drink', 'craft', 'sport'];
  var LINE_IDS = ['week', 'month'];
  function sceneById(list, id){
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /* 抽一組數值：lo~hi 之間的整數，長度跟情境的項目數一樣。 */
  function drawVals(n, lo, hi){
    var out = [];
    for (var i = 0; i < n; i++) out.push(lo + rand(hi - lo + 1));
    return out;
  }

  /* --- 數值選項：正解 ＋ 三個誘答。
         誘答一律「值去重」、必須在範圍內，而且**不可以是圖上讀得到的其他真值**
         （孩子讀對別的長條也會被判錯）。候選不夠時保底往外找一個長得像答案的數，
         不生垃圾字串。 --- */
  function numOpts(correct, cands, forbid){
    if (!inRange(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1;
      out.push(v);
    });
    for (var k = 1; out.length < 4 && k <= 200; k++){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1;
        out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      item:{
        apple:'蘋果', banana:'香蕉', grape:'葡萄', melon:'西瓜',
        dog:'狗', cat:'貓', fish:'魚', bird:'鳥',
        story:'故事', science:'科學', comic:'漫畫', poem:'詩集',
        juice:'果汁', milk:'牛奶', soda:'汽水', tea:'紅茶',
        red:'紅', blue:'藍', green:'綠', yellow:'黃',
        run:'跑步', jump:'跳繩', swim:'游泳', ball:'球類',
        mon:'週一', tue:'週二', wed:'週三', thu:'週四', fri:'週五',
        m1:'一月', m2:'二月', m3:'三月', m4:'四月'
      },
      scene:{
        fruit:'水果店今天賣出的水果', pet:'班上同學養的寵物',
        book:'圖書館今天借出的書', drink:'福利社今天賣出的飲料',
        craft:'美勞課用掉的色紙', sport:'班上同學最喜歡的運動',
        week:'圖書館這一週每天借出的書', month:'小安每個月去圖書館的次數'
      },
      unit:{
        fruit:'個', pet:'隻', book:'本', drink:'杯',
        craft:'張', sport:'人', week:'本', month:'次'
      },
      cap:function(name, unit){ return '📊 ' + name + '　一格代表 1 ' + unit; },
      capLine:function(name, unit){ return '📈 ' + name + '　一格代表 1 ' + unit; },
      listOf:function(a){ return a.join('、'); },
      tableOf:function(names, vals, unit){
        return names.map(function(n, i){ return n + ' ' + vals[i] + ' ' + unit; }).join('、');
      },
      dirName:{ up:'往上', down:'往下', flat:'一樣高' },
      segOpt:function(dir, delta, unit){
        return dir === 'up' ? '往上，多了 ' + delta + ' ' + unit
             : dir === 'down' ? '往下，少了 ' + delta + ' ' + unit
             : '一樣高，沒有變';
      }
    },
    en: {
      item:{
        apple:'Apple', banana:'Banana', grape:'Grape', melon:'Melon',
        dog:'Dog', cat:'Cat', fish:'Fish', bird:'Bird',
        story:'Story', science:'Science', comic:'Comic', poem:'Poem',
        juice:'Juice', milk:'Milk', soda:'Soda', tea:'Tea',
        red:'Red', blue:'Blue', green:'Green', yellow:'Yellow',
        run:'Running', jump:'Skipping', swim:'Swimming', ball:'Ball',
        mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri',
        m1:'Jan', m2:'Feb', m3:'Mar', m4:'Apr'
      },
      scene:{
        fruit:'Fruit sold at the shop today', pet:'Pets our class keeps',
        book:'Books borrowed from the library today', drink:'Drinks sold at the tuck shop today',
        craft:'Craft paper used in art class', sport:'Favourite sports in our class',
        week:'Books borrowed each day this week', month:'Library visits each month'
      },
      unit:{
        fruit:'piece', pet:'pet', book:'book', drink:'cup',
        craft:'sheet', sport:'child', week:'book', month:'visit'
      },
      cap:function(name, unit){ return '📊 ' + name + '　One cell means 1 ' + unit; },
      capLine:function(name, unit){ return '📈 ' + name + '　One cell means 1 ' + unit; },
      listOf:function(a){ return a.join(', '); },
      tableOf:function(names, vals, unit){
        /* ⚠️ 要走 unitPl()，不是 plEn() —— child 的複數是 children，
           plEn 會印出「6 childs」（整句題幹逐字比對才抓到的）。 */
        return names.map(function(n, i){ return n + ' ' + vals[i] + ' ' + unitPl(vals[i], unit, 'en'); }).join(', ');
      },
      dirName:{ up:'up', down:'down', flat:'level' },
      segOpt:function(dir, delta, unit){
        return dir === 'up' ? 'Up, ' + delta + ' more ' + plEn(delta, unit)
             : dir === 'down' ? 'Down, ' + delta + ' fewer ' + plEn(delta, unit)
             : 'Level, no change';
      }
    }
  };
  function namesOf(keys, lang){
    return keys.map(function(k){ return TXT[lang].item[k]; });
  }
  /* 英文的 child 是不規則複數，plEn() 的通則抓不到它。 */
  function unitPl(n, unit, lang){
    if (lang === 'zh') return unit;
    if (unit === 'child') return n === 1 ? 'child' : 'children';
    return plEn(n, unit);
  }

  var GENS = [
    /* 1. 讀長條圖：某一項有幾個。 */
    { id:'readBar', cat:'read',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 1, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var at = rand(vals.length), v = vals[at];
          /* 圖上其他長條的高度不可以拿來當誘答 —— 那也是圖上讀得到的真值，
             孩子讀對別條也會被判錯。 */
          var others = vals.filter(function(x, i){ return i !== at; });
          var opts = numOpts(v, [v + 1, v - 1, v + 2], others);
          if (!opts) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, at:at, v:v,
                   opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '看這張長條圖：<strong>' + names[d.at] + '</strong> 有幾' + unit + '？'
            : 'On this bar chart, how many does <strong>' + names[d.at] + '</strong> have?',
          fig: figOf('bar', d.vals, names),
          cap: t.cap(t.scene[d.sceneId], unit),
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? names[d.at] + ' 的長條疊到第 ' + d.v + ' 條格線，也就是 ' + d.v + ' 格。一格代表 1 ' + unit + '，所以 ' + d.v + ' × 1 ＝ ' + d.v + ' ' + unit + '。'
            : 'The ' + names[d.at] + ' bar reaches grid line ' + d.v + ', which is ' + d.v + ' ' + plEn(d.v, 'cell') + '. One cell is 1 ' + unit + ', so ' + d.v + ' × 1 = ' + d.v + ' ' + unitPl(d.v, unit, lang) + '.'
        };
      } },

    /* 2. 哪一項最多。選項是項目名，所以最多的那一項必須唯一，
          而且要比第二高的高，圖上才分得出來。 */
    { id:'mostBar', cat:'compare',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 1, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var hi = soleMaxIndex(vals);
          if (hi < 0) return null;
          var order = shuffle(scene.keys.slice());

                   opts:order, ans:order.indexOf(scene.keys[hi]) };

            : 'Every bar starts at 0 and every cell is the same height, so comparing heights is enough. The tallest is ' + t.item[d.keys[d.hi]] + ' at ' + d.vals[d.hi] + ' ' + plEn(d.vals[d.hi], 'cell') + ' = ' + d.vals[d.hi] + ' ' + unitPl(d.vals[d.hi], unit, lang) + '.'
        };
      } },

    /* 3. 哪一項最少。刻意讓最少的那一項有時候是 0。 */

          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var lo = soleMinIndex(vals);
          if (lo < 0) return null;
          var order = shuffle(scene.keys.slice());
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, lo:lo,

      },
      fmt:function(d, lang){

        };

    /* 4. 最多的比最少的多幾個（兩步驟）。 */
    { id:'diffBars', cat:'twostep',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var hi = soleMaxIndex(vals), lo = soleMinIndex(vals);
          if (hi < 0 || lo < 0) return null;
          var diff = vals[hi] - vals[lo];
          if (diff < 2) return null;
          /* ⚠️ 最少的那一項是 0 的時候，「把兩個加起來」剛好等於正解 —— 那個誘答
             就消失了，而 indexOf 會比中**正解**、照樣放行。可是「最少的是 0」正是
             這一課要練的情形，不可以整批丟掉：改成**換一個誘答**，並記下這一批
             有沒有提供相加的誘答，讓不變條件只在該有的時候要求它。 */
          var addTrap = vals[hi] + vals[lo];
          var hasAddTrap = (addTrap !== diff);
          /* 誘答：相加（最常見的錯）、少 1、多 1。圖上讀得到的數字不可以當誘答。 */
          var opts = numOpts(diff, hasAddTrap ? [addTrap, diff + 1, diff - 1]
                                              : [diff + 1, diff - 1, diff + 2], vals);
          if (!opts) return null;
          if (hasAddTrap && opts.indexOf(addTrap) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, hi:hi, lo:lo, diff:diff,
                   hasAddTrap:hasAddTrap, opts:opts, ans:opts.indexOf(diff) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '看這張長條圖：<strong>最多的比最少的多幾' + unit + '</strong>？'
            : 'On this bar chart, <strong>how many more ' + unitPl(2, unit, lang) + ' does the item with the most have than the item with the fewest</strong>?',
          fig: figOf('bar', d.vals, names),
          cap: t.cap(t.scene[d.sceneId], unit),
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '第一步讀圖：最多的是 ' + names[d.hi] + ' ' + d.vals[d.hi] + ' ' + unit + '，最少的是 ' + names[d.lo] + ' ' + d.vals[d.lo] + ' ' + unit + '。第二步相減：' + d.vals[d.hi] + ' － ' + d.vals[d.lo] + ' ＝ ' + d.diff + '。' + (d.hasAddTrap ? '（把兩個加起來會得到 ' + (d.vals[d.hi] + d.vals[d.lo]) + '，那回答的是這兩項<strong>一共</strong>有幾' + unit + '。）' : '（這一題<strong>加起來也會得到 ' + d.diff + '</strong>，因為最少的那一項是 0 —— 那只是剛好一樣，「多幾' + unit + '」要用<strong>減的</strong>。）')
            : 'Step one, read the chart: the most is ' + names[d.hi] + ' with ' + d.vals[d.hi] + ' and the least is ' + names[d.lo] + ' with ' + d.vals[d.lo] + '. Step two, subtract: ' + d.vals[d.hi] + ' − ' + d.vals[d.lo] + ' = ' + d.diff + '.' + (d.hasAddTrap ? ' (Adding them gives ' + (d.vals[d.hi] + d.vals[d.lo]) + ', which is how many those two have altogether.)' : ' (Adding gives ' + d.diff + ' here too, because the item with the fewest has 0 — that is only a coincidence: “how many more” is always found by subtracting.)')
        };
      } },

    /* 5. 一共幾個（兩步驟）。誘答一定要包含「只看最高的那一條」。 */
    { id:'totalBars', cat:'twostep',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var total = sumOf(vals);
          if (total < 6) return null;
          var hi = soleMaxIndex(vals);
          if (hi < 0) return null;
          var missOne = total - vals[vals.length - 1];
          if (missOne === total) return null;
          /* ⚠️ 其餘每一條都是 0 的時候，「只看最高的那一條」剛好等於正解 ——
             那個誘答就消失了，這一題也就不再考到那個迷思。 */
          if (vals[hi] === total) return null;
          var opts = numOpts(total, [vals[hi], missOne, total + 1], []);
          if (!opts) return null;
          if (opts.indexOf(vals[hi]) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, total:total, hi:hi,
                   opts:opts, ans:opts.indexOf(total) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '看這張長條圖：<strong>一共</strong>幾' + unit + '？'
            : 'On this bar chart, how many ' + unitPl(2, unit, lang) + ' are there <strong>altogether</strong>?',
          fig: figOf('bar', d.vals, names),
          cap: t.cap(t.scene[d.sceneId], unit),
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '「一共」要把每一條都加起來，不是只看最高的那一條：' + d.vals.join(' ＋ ') + ' ＝ ' + d.total + '。（只看最高的會答 ' + d.vals[d.hi] + '，那回答的是<strong>最多的那一項</strong>是幾' + unit + '。）'
            : '“Altogether” means adding every bar, not just looking at the tallest one: ' + d.vals.join(' + ') + ' = ' + d.total + '. (Looking only at the tallest gives ' + d.vals[d.hi] + ', which is how many the biggest item has.)'
        };
      } },

    /* 6. 給統計表，問格子最少要幾格（繪製）。
          ⚠️ 一定要問「**最少**」—— 只問「要幾格」的話，比最大值更多的格數也對，
          那就變成兩個選項都講得通。 */
    { id:'gridRowsQ', cat:'draw',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          var need = gridRows(vals);
          if (need < 3) return null;
          if (soleMaxIndex(vals) < 0) return null;
          /* 誘答：少 1（畫不下）、多 1（畫得下但不是最少），再往外補。
             ⚠️ 表上讀得到的每一個數字都不可以當誘答 —— 孩子讀對別一欄也會被判錯。 */
          var opts = numOpts(need, [need - 1, need + 1, need + 2, need - 2], vals.concat([vals.length, 1]));
          if (!opts) return null;
          if (opts.indexOf(need - 1) < 0 || opts.indexOf(need + 1) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, need:need,
                   opts:opts, ans:opts.indexOf(need) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        var hi = soleMaxIndex(d.vals);
        return {
          stem: lang === 'zh'
            ? '統計表是：' + t.tableOf(names, d.vals, unit) + '。要把它畫成一格代表 1 ' + unit + ' 的長條圖，格子<strong>最少</strong>要幾格？'
            : 'A table reads: ' + t.tableOf(names, d.vals, unit) + '. To draw it as a bar chart where one cell means 1 ' + unit + ', how many cells does the grid need <strong>at least</strong>?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '格子最少要和最多的那一項一樣多。最多的是 ' + names[hi] + ' ' + d.vals[hi] + ' ' + unit + '，所以最少要 ' + d.need + ' 格：' + (d.need - 1) + ' 格畫不下，' + (d.need + 1) + ' 格畫得下但不是最少。'
            : 'The grid needs at least as many cells as the largest item, which is ' + names[hi] + ' with ' + d.vals[hi] + ', so at least ' + d.need + ' ' + plEn(d.need, 'cell') + ': ' + (d.need - 1) + ' ' + plEn(d.need - 1, 'cell') + ' will not fit, and ' + (d.need + 1) + ' ' + plEn(d.need + 1, 'cell') + ' fit but are not the fewest.'
        };
      } },

    /* 7. 給統計表，問某一項的長條要疊幾格（表 → 圖的方向）。 */
    { id:'barCells', cat:'draw',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 1, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var at = rand(vals.length), v = vals[at];
          if (v < 2) return null;
          /* 誘答：格線數（v ＋ 1，課程明講的迷思）再往外補。
             ⚠️ 表上其他欄的數字都不可以當誘答 —— 孩子讀對別一欄也會被判錯，
                所以 v ＋ 1 剛好等於別一欄的時候整組重抽。 */
          var opts = numOpts(v, [v + 1, v + 2, v + 3, v + 4], vals.filter(function(x){ return x !== v; }).concat([1]));
          if (!opts) return null;
          if (opts.indexOf(v + 1) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, at:at, v:v,
                   opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '統計表是：' + t.tableOf(names, d.vals, unit) + '。畫成一格代表 1 ' + unit + ' 的長條圖，<strong>' + names[d.at] + '</strong> 那一條要疊幾格？'
            : 'A table reads: ' + t.tableOf(names, d.vals, unit) + '. Drawing it so that one cell means 1 ' + unit + ', how many cells tall is the <strong>' + names[d.at] + '</strong> bar?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '一格代表 1 ' + unit + '，所以有幾' + unit + ' 就疊幾格：' + d.v + ' ' + unit + ' ＝ ' + d.v + ' 格。（答 ' + (d.v + 1) + ' 是把格線數成格子 —— 格線永遠比格子多 1 條。）'
            : 'One cell is 1 ' + unit + ', so stack as many cells as there are things: ' + d.v + ' = ' + d.v + ' ' + plEn(d.v, 'cell') + '. (Answering ' + (d.v + 1) + ' counts grid lines instead of cells — there is always one more line than cells.)'
        };
      } },

    /* 8. 有一項是 0：哪一句話對？選項是整句話。 */
    { id:'zeroItem', cat:'zero',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 1, VAL_MAX);
          var at = rand(vals.length);
          vals[at] = 0;
          if (soleMinIndex(vals) !== at) return null;
          if (gridRows(vals) < 3) return null;
          var order = shuffle(['zero', 'forgot', 'one', 'drop']);
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, at:at,
                   opts:order, ans:order.indexOf('zero') };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        var name = names[d.at];
        var say = lang === 'zh' ? {
          zero:  name + '是 0 ' + unit + '，長條的高度就是 0 格',
          forgot:name + '一定是忘了畫，應該把它補上去',
          one:   name + '其實是 1 ' + unit + '，只是格子太小看不到',
          drop:  name + '應該整項從圖上拿掉'
        } : {
          zero:  name + ' is 0, so its bar is 0 cells tall',
          forgot:name + ' must have been forgotten and should be added',
          one:   name + ' is really 1, the cell is just too small to see',
          drop:  name + ' should be taken off the chart altogether'
        };
        return {
          stem: lang === 'zh'
            ? '看這張長條圖：<strong>' + name + '</strong> 一格都沒有。下面哪一句話<strong>對</strong>？'
            : 'On this bar chart <strong>' + name + '</strong> has no cells at all. Which sentence is <strong>right</strong>?',
          fig: figOf('bar', d.vals, names),
          cap: t.cap(t.scene[d.sceneId], unit),
          opts: d.opts.map(function(k){ return say[k]; }), ans:d.ans,
          why: lang === 'zh'
            ? '長條的高度是 0 格，就是 0 ' + unit + ' —— 一個都沒有，不是忘了畫。名字要留在下面，讀圖的人才知道<strong>有這一項，只是 0</strong>；整項拿掉的話，看圖的人會以為根本沒有這一項。'
            : 'A bar 0 cells tall means 0 — none at all, not a forgotten bar. The name stays underneath so a reader knows the item was counted and came out as 0; removing it makes it look as if the item does not exist.'
        };
      } },

    /* 9. 折線圖：某一段是怎麼變的。 */
    { id:'lineDir', cat:'line',
      make:function(used){
        return retry(function(){
          var scene = sceneById(LINE_SCENES, pickUnused(LINE_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var at = rand(vals.length - 1);
          var dir = segDir(vals[at], vals[at + 1]), delta = segDelta(vals[at], vals[at + 1]);
          /* 四個選項：正解 ＋ 反方向同樣多 ＋ 同方向差 1 ＋ 一樣高。
             ⚠️ delta ＝ 0 的時候「一樣高」就是正解，所以那一支要另外配三個誘答。 */
          var cand;
          if (dir === 'flat') cand = ['flat:0', 'up:1', 'down:1', 'up:2'];
          else {
            var other = (dir === 'up') ? 'down' : 'up';
            var near = (delta > 1) ? delta - 1 : delta + 1;
            cand = [dir + ':' + delta, other + ':' + delta, dir + ':' + near, 'flat:0'];
          }
          var uniq = {};
          for (var i = 0; i < cand.length; i++){
            if (uniq[cand[i]]) return null;
            uniq[cand[i]] = 1;
          }
          var order = shuffle(cand);
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, at:at, dir:dir, delta:delta,
                   opts:order, ans:order.indexOf(dir + ':' + delta) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '看這張折線圖：從 <strong>' + names[d.at] + '</strong> 到 <strong>' + names[d.at + 1] + '</strong> 這一段線，是怎麼變的？'
            : 'On this line graph, from <strong>' + names[d.at] + '</strong> to <strong>' + names[d.at + 1] + '</strong>, how did the line change?',
          fig: figOf('line', d.vals, names),
          cap: t.capLine(t.scene[d.sceneId], unit),
          opts: d.opts.map(function(k){
            var p = k.split(':');
            return t.segOpt(p[0], Number(p[1]), unit);
          }), ans:d.ans,
          why: lang === 'zh'
            ? '從左邊的點（' + d.vals[d.at] + '）看到右邊的點（' + d.vals[d.at + 1] + '）：這一段線是' + t.dirName[d.dir] + '的。' +
              (d.dir === 'flat' ? '兩個點一樣高（' + d.vals[d.at] + ' ＝ ' + d.vals[d.at + 1] + '），所以沒有變。'
               : (d.dir === 'up' ? d.vals[d.at + 1] + ' － ' + d.vals[d.at] : d.vals[d.at] + ' － ' + d.vals[d.at + 1]) + ' ＝ ' + d.delta + '。')
            : 'From the left dot (' + d.vals[d.at] + ') to the right dot (' + d.vals[d.at + 1] + ') the line goes ' + t.dirName[d.dir] + '. ' +
              (d.dir === 'flat' ? 'Both dots are the same height (' + d.vals[d.at] + ' = ' + d.vals[d.at + 1] + '), so nothing changed.'
               : (d.dir === 'up' ? d.vals[d.at + 1] + ' − ' + d.vals[d.at] : d.vals[d.at] + ' − ' + d.vals[d.at + 1]) + ' = ' + d.delta + '.')
        };
      } },

    /* 10. 折線圖：某一個點是多少（點的讀法和長條一樣）。 */
    { id:'linePoint', cat:'line',
      make:function(used){
        return retry(function(){
          var scene = sceneById(LINE_SCENES, pickUnused(LINE_IDS, used));
          var vals = drawVals(scene.keys.length, 1, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var at = rand(vals.length), v = vals[at];
          var others = vals.filter(function(x, i){ return i !== at; });
          var opts = numOpts(v, [v + 1, v - 1, v + 2], others);
          if (!opts) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, at:at, v:v,
                   opts:opts, ans:opts.indexOf(v) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        return {
          stem: lang === 'zh'
            ? '看這張折線圖：<strong>' + names[d.at] + '</strong> 那一個點是幾' + unit + '？'
            : 'On this line graph, how many does the <strong>' + names[d.at] + '</strong> dot show?',
          fig: figOf('line', d.vals, names),
          cap: t.capLine(t.scene[d.sceneId], unit),
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '點的高度讀法和長條完全一樣（它就是長條的頂端）：' + names[d.at] + ' 那個點落在第 ' + d.v + ' 條格線上，也就是 ' + d.v + ' 格。一格代表 1 ' + unit + '，所以 ' + d.v + ' × 1 ＝ ' + d.v + ' ' + unit + '。'
            : 'A dot reads exactly like a bar, because it is the top of the bar: the ' + names[d.at] + ' dot sits on grid line ' + d.v + ', which is ' + d.v + ' ' + plEn(d.v, 'cell') + '. One cell is 1 ' + unit + ', so ' + d.v + ' × 1 = ' + d.v + ' ' + unitPl(d.v, unit, lang) + '.'
        };
      } },

    /* 11. 有幾項比 k 多（兩步驟，而且「剛好 k」不算）。 */
    { id:'countOverQ', cat:'twostep',
      make:function(used){
        return retry(function(){
          var scene = sceneById(BAR_SCENES, pickUnused(BAR_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var k = 1 + rand(VAL_MAX - 2);
          var n = countOver(vals, k);
          var withEq = vals.filter(function(v){ return v >= k; }).length;
          /* 這一題的重點就是「剛好 k 不算」，所以一定要真的有一項剛好是 k
             （withEq > n），而且正解不可以是全部或零項。 */
          if (withEq === n) return null;
          if (n < 1 || n >= vals.length) return null;
          /* ⚠️ 門檻 k 印在題幹上，不可以拿來當誘答。 */
          var opts = numOpts(n, [withEq, n + 1, n - 1, vals.length], [k]);
          if (!opts) return null;
          if (opts.indexOf(withEq) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, k:k, n:n, withEq:withEq,
                   opts:opts, ans:opts.indexOf(n) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        var hits = [], eq = [];
        d.vals.forEach(function(v, i){
          if (v > d.k) hits.push(names[i]);
          else if (v === d.k) eq.push(names[i]);
        });
        return {
          stem: lang === 'zh'
            ? '看這張長條圖：有幾項<strong>比 ' + d.k + ' ' + unit + '多</strong>？'
            : 'On this bar chart, how many items are <strong>more than ' + d.k + ' ' + unitPl(d.k, unit, lang) + '</strong>?',
          fig: figOf('bar', d.vals, names),
          cap: t.cap(t.scene[d.sceneId], unit),
          opts: d.opts.map(function(v){ return lang === 'zh' ? v + ' 項' : v + ' ' + plEn(v, 'item'); }), ans:d.ans,
          why: lang === 'zh'
            ? '「比 ' + d.k + ' ' + unit + '多」是超過 ' + d.k + '，剛好 ' + d.k + ' 的（' + t.listOf(eq) + '）不算。比 ' + d.k + ' 多的是 ' + t.listOf(hits) + '，一共 ' + d.n + ' 項。（把剛好 ' + d.k + ' 的也算進去會變成 ' + d.withEq + ' 項。）'
            : '“More than ' + d.k + '” means above ' + d.k + ', so anything exactly ' + d.k + ' (' + t.listOf(eq) + ') does not count. Above ' + d.k + ' are ' + t.listOf(hits) + ', so ' + d.n + ' ' + plEn(d.n, 'item') + '. (Counting the ones exactly ' + d.k + ' as well would give ' + d.withEq + '.)'
        };
      } },

    /* 12. 折線圖有幾段往上／往下（兩步驟，而且持平不算）。 */
    { id:'countSeg', cat:'line',
      make:function(used){
        return retry(function(){
          var scene = sceneById(LINE_SCENES, pickUnused(LINE_IDS, used));
          var vals = drawVals(scene.keys.length, 0, VAL_MAX);
          if (gridRows(vals) < 3) return null;
          var want = pick(['up', 'down']);
          var n = countDir(vals, want), flat = countDir(vals, 'flat');
          /* 這一題的重點是「持平不算」，所以一定要真的有一段是持平的。 */
          if (flat < 1 || n < 1) return null;
          var segs = vals.length - 1;
          var opts = numOpts(n, [n + flat, n + 1, n - 1, segs], []);
          if (!opts) return null;
          if (opts.indexOf(n + flat) < 0) return null;
          return { sceneId:scene.id, keys:scene.keys.slice(), vals:vals, want:want,
                   n:n, flat:flat, segs:segs, opts:opts, ans:opts.indexOf(n) };
        });
      },
      fmt:function(d, lang){
        var t = TXT[lang], names = namesOf(d.keys, lang), unit = t.unit[d.sceneId];
        var chain = [];
        for (var i = 0; i + 1 < d.vals.length; i++){
          var dir = segDir(d.vals[i], d.vals[i + 1]);
          chain.push(d.vals[i] + ' → ' + d.vals[i + 1] + ' ' + t.dirName[dir]);
        }
        return {
          stem: lang === 'zh'
            ? '看這張折線圖：有幾段線是<strong>' + t.dirName[d.want] + '</strong>的？'
            : 'On this line graph, how many stretches of the line go <strong>' + t.dirName[d.want] + '</strong>?',
          fig: figOf('line', d.vals, names),
          cap: t.capLine(t.scene[d.sceneId], unit),
          opts: d.opts.map(function(v){ return lang === 'zh' ? v + ' 段' : v + ' ' + plEn(v, 'stretch').replace('stretchs', 'stretches'); }), ans:d.ans,
          why: lang === 'zh'
            ? '一段一段看：' + t.listOf(chain) + '。' + t.dirName[d.want] + '的有 ' + d.n + ' 段。一樣高的那 ' + d.flat + ' 段不算，把它們也算進去會變成 ' + (d.n + d.flat) + ' 段。'
            : 'Take the stretches one at a time: ' + t.listOf(chain) + '. ' + d.n + ' of them go ' + t.dirName[d.want] + '. The ' + d.flat + ' level ' + (d.flat === 1 ? 'stretch does' : 'stretches do') + ' not count; including them would give ' + (d.n + d.flat) + '.'
        };
      } }
  ];

  /* ---------- 出一批 12 題：12 種題型各一題 ---------- */
  var QCOUNT = 12;

  /* ---------- 以下開始碰 DOM ---------- */
  var lang = 'zh';
  try { if (localStorage.getItem('teachme-lang') === 'en') lang = 'en'; } catch(e){}

  var I18N = {
    zh: {
      langAria:'切換語言', htmlLang:'zh-Hant', title:'複習挑戰 — 統計圖工作室', btn:'EN',
      home:'← 回 teach-me 首頁',
      nav1:'📖 上課', nav2:'🗂️ 速查卡（重點整理）', nav3:'🔁 複習挑戰（本頁）', nav4:'👨‍👩‍👧 給家長（陪讀指引）',
      h1:'🔁 複習挑戰：統計圖工作室',
      sub:'每次重新整理，12 題都不一樣',
      intro:'這裡的題目是<strong>每次現出</strong>的，不是背得起來的固定題。<br>隔一天再來一次，還答得出來，才是真的記住了。',
      qDoneLabel:'已作答', qRightLabel:'答對', qRightUnit:'題',
      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Chart Studio', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Chart Studio',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>Come back a day later and still get them — that is real remembering.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  /* --- 畫圖：只有這一段碰 DOM。座標與標籤直接用 fig 裡**產生器算好的**那一份，
         不在這裡重算，不然畫出來的和檢查驗過的會是兩回事。 --- */
  var NS = 'http://www.w3.org/2000/svg';
  var C_BAR = '#3B7DD8', C_GRID = '#E8E2D6', C_AXIS = '#6B6875', C_LINE = '#2F9E69', C_FADE = '#EDE7DA';

  function svgEl(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for (var k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  function drawFig(svg, fig){
    svg.textContent = '';
    fig.grid.forEach(function(g){
      svg.appendChild(svgEl('line', {
        x1:fig.box.x0, y1:g.y, x2:fig.box.x1, y2:g.y,
        stroke:(g.r === 0 ? C_AXIS : C_GRID), 'stroke-width':(g.r === 0 ? 2 : 1)
      }));
      var t = svgEl('text', {
        x:fig.box.x0 - AXIS_NUM_DX, y:g.y + 4, 'text-anchor':'end',
        'font-size':AXIS_NUM_FS, fill:C_AXIS
      });
      t.textContent = String(g.r);
      svg.appendChild(t);
    });
    svg.appendChild(svgEl('line', {
      x1:fig.box.x0, y1:fig.box.y0, x2:fig.box.x0, y2:fig.box.y1,
      stroke:C_AXIS, 'stroke-width':2
    }));
    fig.bars.forEach(function(bar){
      if (bar.v <= 0) return;
      svg.appendChild(svgEl('rect', {
        x:bar.x, y:bar.y, width:bar.w, height:bar.h,
        fill:(fig.kind === 'line' ? C_FADE : C_BAR), rx:3
      }));
    });
    if (fig.kind === 'line'){
      fig.segs.forEach(function(s){
        svg.appendChild(svgEl('line', {
          x1:s.x1, y1:s.y1, x2:s.x2, y2:s.y2,
          stroke:C_LINE, 'stroke-width':3, 'stroke-linecap':'round'
        }));
      });
      fig.pts.forEach(function(p){
        svg.appendChild(svgEl('circle', { cx:p.cx, cy:p.cy, r:DOT_R, fill:C_LINE }));
      });
    }
    fig.items.forEach(function(it){
      var t = svgEl('text', {
        x:it.cx, y:it.y, 'text-anchor':'middle', 'font-size':ITEM_FS, fill:C_AXIS
      });
      t.textContent = fig.names[it.i];
      svg.appendChild(t);
    });
  }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      if (q.fig){
        var fw = document.createElement('div');
        fw.className = 'figwrap';
        var svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'chartfig');
        svg.setAttribute('viewBox', '0 0 400 230');
        drawFig(svg, q.fig);
        fw.appendChild(svg);
        box.appendChild(fw);
        var cp = document.createElement('p');
        cp.className = 'figcap';
        cp.textContent = q.cap;
        box.appendChild(cp);
      }

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length) finish();
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function finish(){
    var t = L();
    resultLine.textContent = (right === batch.length) ? t.resAll(batch.length)
      : (right >= Math.ceil(batch.length * 2 / 3)) ? t.resGood(right, batch.length)
      : t.resTry(right, batch.length);
    resultLinks.innerHTML = t.links;
    resultEl.classList.add('on');
    resultEl.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function newRound(){ batch = buildBatch(); render(); }

  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    newRound();
  });
  retryBtn.addEventListener('click', newRound);

  applyStatic();
  newRound();
})();
</script>
</body>
