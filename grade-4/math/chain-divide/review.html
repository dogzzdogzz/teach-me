<body>

<script>
(function(){
  "use strict";

  /* ---------- 工具 ---------- */
  /* 這一段到 GENS 結束都是**純資料 + 純函式**，不碰 DOM ——
     tools/simgen.js 會把這一段切出來，在 Node 裡跑幾萬批檢查出題品質。
     這一課沒有圖，所有題目都是算式與文字題，所以碰不到「SVG 被裁掉」那一類缺陷。 */

  function rand(n){ return Math.floor(Math.random() * n); }
  function pick(arr){ return arr[rand(arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = rand(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function rangeList(a, b){
    var out = [];
    for (var i = a; i <= b; i++) out.push(i);
    return out;
  }
  /* 同一輪裡不要一直抽到同一個值 */
  function pickUnused(pool, used){
    var avail = pool.filter(function(v){ return used.indexOf(v) < 0; });
    var v = avail.length ? pick(avail) : pick(pool);
    used.push(v);
    return v;
  }
  /* ⚠️ make() 一律不可以回 null（也不可以丟例外）：tools/simgen.js 每一批只呼叫 make()
     一次、**不重試**，回 null 之後檢查會直接 dereference null 而當掉 —— 當掉不是「抓到」。
     每一次迴圈都重新抽一組參數，所以連續 400 次全被拒絕的機率極低，可是「極低」不是
     「不會」，所以每一支都給一組**手算過的**保底參數。 */
  function retry(fn, fallback){
    for (var i = 0; i < 400; i++){
      var d = fn();
      if (d) return d;
    }
    return fallback ? fallback() : null;
  }

  /* --- 這一課的數字範圍：總數 ≤ 999（四年級的大數在別課），選項一律 0 ~ 10000 的整數。
         **不用負數、不用小數**，而且每一步除法都要除得剛剛好 —— 有餘數的時候還要處理
         「剩下的怎麼算」，那不在這一課的範圍。 --- */
  var VAL_MAX = 10000, TOTAL_MAX = 999;
  function inRange(v){
    return typeof v === 'number' && isFinite(v) && v === Math.round(v) && v >= 0 && v <= VAL_MAX;
  }
  function exact(x, y){ return y !== 0 && x % y === 0; }

  /* --- 數值選項：正解 ＋ 三個誘答。誘答一律**值去重**、必須在範圍內，而且
         **不可以是題幹印出來的數字**（那是把題目抄回來，不是誘答）。
         候選不夠時保底往外找一個長得像答案的數，不生垃圾字串。 --- */
  function numOpts(correct, cands, forbid){
    if (!inRange(correct)) return null;
    var out = [correct], seen = {}, bad = {};
    seen[String(correct)] = 1;
    (forbid || []).forEach(function(v){ bad[String(v)] = 1; });
    cands.forEach(function(v){
      if (out.length >= 4) return;
      if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
      seen[String(v)] = 1;
      out.push(v);
    });
    for (var k = 1; out.length < 4 && k <= 400; k++){
      [correct + k, correct - k].forEach(function(v){
        if (out.length >= 4) return;
        if (!inRange(v) || seen[String(v)] || bad[String(v)]) return;
        seen[String(v)] = 1;
        out.push(v);
      });
    }
    return out.length === 4 ? shuffle(out) : null;
  }
  /* --- 算式字串的選項：四個**不同的算式**。去重比的是字串（算式本身就是答案），
         而且每一個都必須是「數字 ＋ 運算符號 ＋ 括號」組出來的，不生垃圾字串。 --- */
  function exprOpts(correct, cands){
    var out = [correct], seen = {};
    seen[correct] = 1;
    cands.forEach(function(s){
      if (out.length >= 4 || !s || seen[s]) return;
      seen[s] = 1;
      out.push(s);
    });
    return out.length === 4 ? shuffle(out) : null;
  }

  /* --- 英文的單複數。只有 1 會錯，而且 box／class 這種字尾要加 es 不是 s。 --- */
  function plEn(n, w){
    if (n === 1) return n + ' ' + w;
    return n + ' ' + w + (/(s|x|z|ch|sh)$/.test(w) ? 'es' : 's');
  }

  /* --- 文字題的情境。每一個情境有**三層**：一件貨、大容器、小容器。
         這一課的模型是實體的三層（一批貨 → 大箱 → 小袋），情境只換名字，不換結構。 --- */
  var SCENES = [
    { id:'egg',   zh:{ unit:'顆', name:'蛋', big:'箱', small:'盒' }, en:{ name:'egg',    big:'crate',  small:'tray'   } },
    { id:'pen',   zh:{ unit:'支', name:'筆', big:'箱', small:'盒' }, en:{ name:'pen',    big:'carton', small:'box'    } },
    { id:'candy', zh:{ unit:'顆', name:'糖', big:'袋', small:'包' }, en:{ name:'sweet',  big:'sack',   small:'packet' } },
    { id:'apple', zh:{ unit:'顆', name:'蘋果', big:'箱', small:'袋' }, en:{ name:'apple', big:'crate',  small:'bag'    } }
  ];

  /* ---------- 文字 ---------- */
  var TXT = {
    zh: {
      /* 中文的「幾件貨」：量詞和名字一起印，數字和中文之間一定要有空格。 */
      items:function(n, sc){ return n + ' ' + sc.zh.unit + sc.zh.name; },
      bigs:function(n, sc){ return n + ' ' + sc.zh.big; },
      smalls:function(n, sc){ return n + ' ' + sc.zh.small; },
      perBig:function(sc){ return '每' + sc.zh.big; },
      perSmall:function(sc){ return '每' + sc.zh.small; },
      oneSmall:function(sc){ return '一' + sc.zh.small; },
      oneBig:function(sc){ return '一' + sc.zh.big; }
    },
    en: {
      items:function(n, sc){ return plEn(n, sc.en.name); },
      bigs:function(n, sc){ return plEn(n, sc.en.big); },
      smalls:function(n, sc){ return plEn(n, sc.en.small); },
      perBig:function(sc){ return 'each ' + sc.en.big; },
      perSmall:function(sc){ return 'each ' + sc.en.small; },
      oneSmall:function(sc){ return 'one ' + sc.en.small; },
      oneBig:function(sc){ return 'one ' + sc.en.big; }
    }
  };
  function eq(lang){ return lang === 'zh' ? ' ＝ ' : ' = '; }
  function plus(lang){ return lang === 'zh' ? ' ＋ ' : ' + '; }

  var GENS = [
    /* 1. 一共分成幾份：a 個大箱 × 每箱 b 個小袋。頭號迷思是「加起來」。 */
    { id:'totalParts', cat:'total',
      make:function(used){
        return retry(function(){
          var a = pickUnused(rangeList(2, 9), used);
          var b = pick(rangeList(2, 8));
          if (a + b === a * b) return null;      /* 加起來剛好等於乘起來 → 誘答會等於正解 */
          var opts = numOpts(a * b, [a + b, a * a, b * b, a * b + a, a * b - b], [a, b]);
          if (!opts) return null;
          return { a:a, b:b, total:a * b, opts:opts, ans:opts.indexOf(a * b) };
        }, function(){
          var opts = numOpts(24, [10, 36, 16, 30, 20], [6, 4]);
          return { a:6, b:4, total:24, opts:opts, ans:opts.indexOf(24) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '一批貨裝成 <strong>' + d.a + ' 個大箱</strong>，每個大箱再分成 <strong>' + d.b + ' 個小袋</strong>。一共有幾個小袋？'
            : 'A load goes into <strong>' + plEn(d.a, 'big box') + '</strong>, and each big box is split into <strong>' + plEn(d.b, 'small bag') + '</strong>. How many small bags are there altogether?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '每一個大箱都有 ' + d.b + ' 個小袋，' + d.a + ' 個大箱就是 ' + d.a + ' × ' + d.b + ' ＝ ' + d.total + ' 個小袋。袋數是<strong>乘</strong>出來的，不是加出來的（加起來是 ' + d.a + ' ＋ ' + d.b + ' ＝ ' + (d.a + d.b) + '）。'
            : 'Every big box holds ' + plEn(d.b, 'small bag') + ', so ' + plEn(d.a, 'big box') + ' hold ' + d.a + ' × ' + d.b + ' = ' + d.total + ' small bags. The number of bags is <strong>multiplied</strong>, never added (adding gives ' + d.a + ' + ' + d.b + ' = ' + (d.a + d.b) + ').'
        };
      } },

    /* 2. 連除的值：t ÷ a ÷ b。誘答是「只做第一步」「第二個除號看成乘號」「除錯一個數」。 */
    { id:'chainValue', cat:'chain',
      make:function(used){
        return retry(function(){
          var a = pickUnused(rangeList(2, 9), used);
          var b = pick(rangeList(2, 9));
          var c = pick(rangeList(2, 9));
          var t = a * b * c;
          if (t > TOTAL_MAX) return null;
          if (a + b === a * b) return null;
          var opts = numOpts(c, [b * c, c * b * b, a * c, c * a * a], [t, a, b]);
          if (!opts) return null;
          return { t:t, a:a, b:b, c:c, opts:opts, ans:opts.indexOf(c) };
        }, function(){
          var opts = numOpts(5, [20, 80, 15, 10], [120, 4, 6]);
          return { t:120, a:4, b:6, c:5, opts:opts, ans:opts.indexOf(5) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: '<strong>' + d.t + ' ÷ ' + d.a + ' ÷ ' + d.b + '</strong>' + eq(lang) + '?',
          opts: d.opts.map(String), ans:d.ans,
          why: lang === 'zh'
            ? '從左往右：' + d.t + ' ÷ ' + d.a + ' ＝ ' + (d.t / d.a) + '，' + (d.t / d.a) + ' ÷ ' + d.b + ' ＝ ' + d.c + '。也可以一次算完：除以 ' + d.a + ' × ' + d.b + ' ＝ ' + (d.a * d.b) + '，' + d.t + ' ÷ ' + (d.a * d.b) + ' ＝ ' + d.c + '。'
            : 'Left to right: ' + d.t + ' ÷ ' + d.a + ' = ' + (d.t / d.a) + ', then ' + (d.t / d.a) + ' ÷ ' + d.b + ' = ' + d.c + '. Or in one go: divide by ' + d.a + ' × ' + d.b + ' = ' + (d.a * d.b) + ', and ' + d.t + ' ÷ ' + (d.a * d.b) + ' = ' + d.c + '.'
        };
      } },

    /* 3. 哪一個算式和 t ÷ a ÷ b 一樣。四個選項是四個**不同的算式**。 */
    { id:'sameExpr', cat:'expr',
      make:function(used){
        return retry(function(){
          var a = pickUnused(rangeList(2, 9), used);
          var b = pick(rangeList(2, 9));
          var c = pick(rangeList(2, 9));
          var t = a * b * c;
          if (t > TOTAL_MAX) return null;
          if (a + b === a * b) return null;      /* 「加起來」那個誘答會變成正解 */
          /* ⚠️ 誘答**印出來的每一個除法也要除得剛剛好**：這一課明講沒有餘數、不用小數，
             所以不可以端出一個孩子算不完的 t ÷ (a ＋ b)。（codex 第一輪） */
          if (!exact(t, a + b)) return null;
          var right = t + ' ÷ (' + a + ' × ' + b + ')';
          var opts = exprOpts(right, [
            t + ' ÷ (' + a + ' ＋ ' + b + ')',
            t + ' ÷ ' + a + ' × ' + b,
            t + ' × ' + a + ' ÷ ' + b
          ]);
          if (!opts) return null;
          return { t:t, a:a, b:b, c:c, opts:opts, ans:opts.indexOf(right) };
        }, function(){
          var right = '120 ÷ (4 × 6)';
          var opts = exprOpts(right, ['120 ÷ (4 ＋ 6)', '120 ÷ 4 × 6', '120 × 4 ÷ 6']);
          return { t:120, a:4, b:6, c:5, opts:opts, ans:opts.indexOf(right) };
        });
      },
      fmt:function(d, lang){
        var en = d.opts.map(function(s){ return s.replace(' ＋ ', ' + '); });
        return {
          stem: lang === 'zh'
            ? '哪一個算式和 <strong>' + d.t + ' ÷ ' + d.a + ' ÷ ' + d.b + '</strong> 一樣？'
            : 'Which expression is the same as <strong>' + d.t + ' ÷ ' + d.a + ' ÷ ' + d.b + '</strong>?',
          opts: lang === 'zh' ? d.opts.slice() : en, ans:d.ans,
          why: lang === 'zh'
            ? '連續除以 ' + d.a + ' 再除以 ' + d.b + '，就是除以 ' + d.a + ' × ' + d.b + ' ＝ ' + (d.a * d.b) + '，兩個算式都算出 ' + d.c + '。除數要用<strong>乘</strong>起來的 ' + (d.a * d.b) + '，不是加起來的 ' + (d.a + d.b) + '；沒有括號的 ' + d.t + ' ÷ ' + d.a + ' × ' + d.b + ' 會先除再乘：' + d.t + ' ÷ ' + d.a + ' × ' + d.b + ' ＝ ' + (d.t / d.a * d.b) + '。'
            : 'Dividing by ' + d.a + ' and then by ' + d.b + ' is dividing by ' + d.a + ' × ' + d.b + ' = ' + (d.a * d.b) + ', and both expressions come to ' + d.c + '. The divisor is the <strong>product</strong> ' + (d.a * d.b) + ', not the sum ' + (d.a + d.b) + '; without brackets it divides then multiplies: ' + d.t + ' ÷ ' + d.a + ' × ' + d.b + ' = ' + (d.t / d.a * d.b) + '.'
        };
      } },

    /* 4. 括號裡面的先算：t ÷ (a × b) 的第一步是什麼。 */
    { id:'bracketFirst', cat:'expr',
      make:function(used){
        return retry(function(){
          var a = pickUnused(rangeList(2, 9), used);
          var b = pick(rangeList(2, 9));
          var c = pick(rangeList(2, 9));
          var t = a * b * c;
          if (t > TOTAL_MAX) return null;
          if (a === b) return null;              /* t ÷ a 和 t ÷ b 會變成同一個選項 */
          if (c === a || c === b) return null;   /* t ÷ a 或 t ÷ b 會和 a × b 同值 */
          var right = a + ' × ' + b;
          var opts = exprOpts(right, [t + ' ÷ ' + a, t + ' ÷ ' + b, t + ' × ' + a]);
          if (!opts) return null;
          return { t:t, a:a, b:b, c:c, opts:opts, ans:opts.indexOf(right) };
        }, function(){
          var right = '4 × 6';
          var opts = exprOpts(right, ['120 ÷ 4', '120 ÷ 6', '120 × 4']);
          return { t:120, a:4, b:6, c:5, opts:opts, ans:opts.indexOf(right) };
        });
      },
      fmt:function(d, lang){
        return {
          stem: lang === 'zh'
            ? '<strong>' + d.t + ' ÷ (' + d.a + ' × ' + d.b + ')</strong> 這個算式，要<strong>先算</strong>哪一步？'
            : 'In <strong>' + d.t + ' ÷ (' + d.a + ' × ' + d.b + ')</strong>, which step comes <strong>first</strong>?',
          opts: d.opts.slice(), ans:d.ans,
          why: lang === 'zh'
            ? '括號裡面的先算，所以先算 ' + d.a + ' × ' + d.b + ' ＝ ' + (d.a * d.b) + '，再算 ' + d.t + ' ÷ ' + (d.a * d.b) + ' ＝ ' + d.c + '。括號就是為了讓那一段乘法先算才寫的。'
            : 'What is inside the brackets goes first, so ' + d.a + ' × ' + d.b + ' = ' + (d.a * d.b) + ' and then ' + d.t + ' ÷ ' + (d.a * d.b) + ' = ' + d.c + '. The brackets are written for exactly that reason.'
        };
      } },

    /* 5. 沒有括號就從左往右：t ÷ a × b 的值。頭號迷思是先算 a × b。 */
    { id:'leftToRight', cat:'order',
      make:function(used){
        return retry(function(){

             可是每一步都除得開。要求 p、r、k 兩兩不同，四個算式才不會撞在一起。

          if (p === r || k === p || k === r) return null;
          var right = t + ' ÷ ' + p + ' ÷ ' + r;

      qn:function(i){ return '第 ' + i + ' 題'; },
      fbRight:'<b>答對了。</b> ',
      fbWrong:function(a){ return '<b>正確答案是「' + a + '」。</b> '; },
      resAll:function(n){ return '全部 ' + n + ' 題都對！這一課你已經很穩了 🏆'; },
      resGood:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 很不錯，錯的那幾題看一下說明。'; },
      resTry:function(r, n){ return n + ' 題對 ' + r + ' 題 —— 先回速查卡看一眼，再來一輪。'; },
      links:'👉 <a href="reference.html">看速查卡</a>　·　<a href="index.html">回課程重看範例</a>　·　直式與試商回<a href="../multiply-divide/index.html">乘除升級站</a>　·　先乘除後加減回三年級<a href="../../../grade-3/math/two-step/index.html">兩步驟解題王</a>',
      retryBtn:'🔄 再來一輪新題',
      foot:'記不起來很正常 —— 回<a class="home" href="reference.html">速查卡</a>看一眼，再回來做一次。'
    },
    en: {
      langAria:'Switch language', htmlLang:'en', title:'Review Challenge — The Packing Line', btn:'中',
      home:'← Back to teach-me home',
      nav1:'📖 Lesson (interactive)', nav2:'🗂️ Cheat sheet (key points)', nav3:'🔁 Review challenge (this page)', nav4:'👨‍👩‍👧 For parents (how to help)',
      h1:'🔁 Review Challenge: The Packing Line',
      sub:'Reload the page and all 12 questions are different',
      intro:'These questions are <strong>generated fresh every time</strong>, so there is nothing to memorise.<br>A few of them come from the grade-4 multiplication and division lesson and the grade-3 two-step lesson too.',
      qDoneLabel:'Answered', qRightLabel:'Correct:', qRightUnit:'',
      qn:function(i){ return 'Question ' + i; },
      fbRight:'<b>Correct!</b> ',
      fbWrong:function(a){ return '<b>The correct answer is “' + a + '”.</b> '; },
      resAll:function(n){ return 'All ' + n + ' correct! You have this one solid 🏆'; },
      resGood:function(r, n){ return r + ' out of ' + n + ' — nicely done. Read the explanations for the ones you missed.'; },
      resTry:function(r, n){ return r + ' out of ' + n + ' — take a look at the cheat sheet, then try another round.'; },
      links:'👉 <a href="reference.html">Open the cheat sheet</a>　·　<a href="index.html">Back to the lesson examples</a>　·　column form and guessing a quotient digit in <a href="../multiply-divide/index.html">the multiplication and division lesson</a>　·　× and ÷ before + and − in the grade-3 <a href="../../../grade-3/math/two-step/index.html">two-step lesson</a>',
      retryBtn:'🔄 Another round of fresh questions',
      foot:'Forgetting is normal — glance at the <a class="home" href="reference.html">cheat sheet</a> and come back for another round.'
    }
  };
  function L(){ return I18N[lang]; }

  var quizEl = document.getElementById('quiz');
  var qDone = document.getElementById('qDone');
  var qRight = document.getElementById('qRight');
  var qTotal = document.getElementById('qTotal');
  var resultEl = document.getElementById('result');
  var resultLine = document.getElementById('resultLine');
  var resultLinks = document.getElementById('resultLinks');
  var retryBtn = document.getElementById('retryBtn');
  var langBtn = document.getElementById('langBtn');
  var done = 0, right = 0, batch = [];

  /* 一輪 12 題，每個產生器各出一題，順序打散。 */
  function buildBatch(){
    var used = [], out = [];
    shuffle(GENS).forEach(function(g){
      for (var tries = 0; tries < 60; tries++){
        var d = g.make(used);
        if (d){ out.push({ g:g, d:d }); return; }
      }
      throw new Error('generator ' + g.id + ' could not produce a question');
    });
    return out.slice(0, QCOUNT);
  }

  function applyStatic(){
    var d = L();
    document.documentElement.lang = d.htmlLang;
    document.title = d.title;
    langBtn.textContent = d.btn;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++){
      var key = nodes[i].getAttribute('data-i18n');
      if (typeof d[key] === 'string') nodes[i].innerHTML = d[key];
    }
    var arias = document.querySelectorAll('[data-i18n-aria]');
    for (var j = 0; j < arias.length; j++){
      var akey = arias[j].getAttribute('data-i18n-aria');
      if (typeof d[akey] === 'string') arias[j].setAttribute('aria-label', d[akey]);
    }
  }

  function render(){
    var t = L();
    quizEl.textContent = '';
    done = 0; right = 0;
    qDone.textContent = '0'; qRight.textContent = '0';
    qTotal.textContent = batch.length;
    resultEl.classList.remove('on');

    batch.forEach(function(item, qi){
      var q = item.g.fmt(item.d, lang);
      var box = document.createElement('div');
      box.className = 'q';
      var n = document.createElement('span');
      n.className = 'qn'; n.textContent = t.qn(qi + 1);
      var stem = document.createElement('p');
      stem.className = 'stem'; stem.innerHTML = q.stem;
      box.appendChild(n); box.appendChild(stem);

      var opts = document.createElement('div');
      opts.className = 'opts';
      var fb = document.createElement('p');
      fb.className = 'fb';
      var answered = false;
      q.opts.forEach(function(text, oi){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'opt'; b.textContent = text;
        b.addEventListener('click', function(){
          if (answered) return;
          answered = true;
          var good = (oi === q.ans);
          var all = opts.querySelectorAll('.opt');
          for (var i = 0; i < all.length; i++){
            all[i].disabled = true;
            if (i === q.ans) all[i].classList.add('right');
          }
          if (!good) b.classList.add('wrong');
          fb.innerHTML = (good ? t.fbRight : t.fbWrong(q.opts[q.ans])) + q.why;
          done++; if (good) right++;
          qDone.textContent = done; qRight.textContent = right;
          if (done === batch.length){
            resultLine.textContent = right === batch.length ? t.resAll(batch.length)
              : right >= Math.ceil(batch.length * 2 / 3) ? t.resGood(right, batch.length)
              : t.resTry(right, batch.length);
            resultLinks.innerHTML = t.links;
            resultEl.classList.add('on');
          }
        });
        opts.appendChild(b);
      });
      box.appendChild(opts); box.appendChild(fb);
      quizEl.appendChild(box);
    });
  }

  function newRound(){
    batch = buildBatch();
    applyStatic();
    render();
  }

  retryBtn.addEventListener('click', newRound);
  /* 語言切換保留同一批題目（framework §六之一：切語言不重抽）。 */
  langBtn.addEventListener('click', function(){
    lang = (lang === 'zh') ? 'en' : 'zh';
    try { localStorage.setItem('teachme-lang', lang); } catch(e){}
    applyStatic();
    render();
  });

  newRound();
})();
</script>
